name: ${COMPOSE_PROJECT_NAME:-sforum}

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sforum}
      POSTGRES_USER: ${POSTGRES_USER:-sforum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sforum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sforum} -d ${POSTGRES_DB:-sforum}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.10-alpine
    # 启用 AOF 持久化与密码认证。默认开发密码与 .env.production.example 保持一致，
    # 外部无密码 Redis 时需将 REDIS_PASSWORD 置空并同步移除 --requirepass。
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sforum-dev-redis}
    volumes:
      - redis_data:/data
    healthcheck:
      # $$ 转义让密码在容器内解析，而非被 compose 提前插值。
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 可选全文搜索引擎：默认不启动，节省内存。
  # 启用：docker compose --profile search up -d meilisearch
  # 并安装/扫描独立仓库中的 sforum-search-meilisearch（非内置）。
  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    profiles: ["search"]
    environment:
      MEILI_ENV: ${APP_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-sforum-dev-meili-key}
    volumes:
      - meili_data:/meili_data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
      # Source-built production images must declare their release line; the
      # runtime image has no git, so the build identity cannot be derived.
      # Falls back to the Dockerfile default so development builds are
      # unchanged. Release images bypass this build entry entirely
      # (compose.release.yaml resets it) and inject the version in CI.
      args:
        SFORUM_VERSION: ${SFORUM_VERSION:-dev}
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://127.0.0.1:3000}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      HTTP_BODY_LIMIT: ${HTTP_BODY_LIMIT:-67108864}
      DATABASE_URL: ${DATABASE_URL:-postgres://sforum:sforum@postgres:5432/sforum?sslmode=disable}
      MIGRATE_ON_STARTUP: ${MIGRATE_ON_STARTUP:-true}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-}
      JOB_QUEUE_CRITICAL_WORKERS: ${JOB_QUEUE_CRITICAL_WORKERS:-}
      JOB_QUEUE_DEFAULT_WORKERS: ${JOB_QUEUE_DEFAULT_WORKERS:-}
      JOB_QUEUE_SEARCH_WORKERS: ${JOB_QUEUE_SEARCH_WORKERS:-}
      JOB_QUEUE_MAIL_WORKERS: ${JOB_QUEUE_MAIL_WORKERS:-}
      JOB_QUEUE_NOTIFICATIONS_WORKERS: ${JOB_QUEUE_NOTIFICATIONS_WORKERS:-}
      JOB_QUEUE_MAINTENANCE_WORKERS: ${JOB_QUEUE_MAINTENANCE_WORKERS:-}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sforum-dev-redis}
      SESSION_HASH_SECRET: ${SESSION_HASH_SECRET:-sforum-dev-session-hash-secret}
      IDENTITY_SUBJECT_HMAC_SECRET: ${IDENTITY_SUBJECT_HMAC_SECRET:-sforum-dev-identity-subject-hmac-secret}
      APP_OPTION_ENC_KEY: ${APP_OPTION_ENC_KEY:-}
      HUMAN_VERIFICATION_PROVIDER: ${HUMAN_VERIFICATION_PROVIDER:-disabled}
      ALTCHA_SECRET: ${ALTCHA_SECRET:-sforum-dev-altcha-secret}
      ALTCHA_CHALLENGE_TTL: ${ALTCHA_CHALLENGE_TTL:-10m}
      ALTCHA_COST: ${ALTCHA_COST:-1000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # 真实客户端 IP。普通请求的 TCP 对端一定是同 compose 网络里的 web（Nuxt）
      # 容器，所以「信任私网对端」的边界正好是宿主机与 compose 网络：api 只在
      # 127.0.0.1:${API_PORT:-18080} 上发布，容器之间不跨宿主。
      # TRUST_PROXY 是总开关，false 时任何转发头都不读，只记录 TCP 对端。
      # 若把 API 直接暴露到公网，公网对端不可信，转发头一律忽略——此时关掉
      # TRUST_PROXY，不要指望 TRUSTED_PROXIES 补救。
      # TRUSTED_PROXIES 只用于 CDN 或额外代理的出口段，不要填 0.0.0.0/0。
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TRUST_PROXY_PRIVATE: ${TRUST_PROXY_PRIVATE:-true}
      TRUST_PROXY_LOOPBACK: ${TRUST_PROXY_LOOPBACK:-false}
      # 带外恢复开关：扩展导致启动失败时，设为 true 后重启 API 可跳过插件启动。
      SFORUM_SAFE_MODE: ${SFORUM_SAFE_MODE:-}
      EXTENSION_ROOT: ${EXTENSION_ROOT:-/var/lib/sforum/extensions}
      BUILTIN_EXTENSION_ROOT: /app/extensions/builtin
      # Compose 中必须使用容器内路径；同时在 override 中添加对应的只读 volume。
      EXTERNAL_EXTENSION_ROOTS: ${EXTERNAL_EXTENSION_ROOTS:-}
      # 关闭它会同时关闭公开 L2（组件与内容区样式）；生产 Compose 默认 true。
      SFORUM_V3_TRUST_CHALLENGES: ${SFORUM_V3_TRUST_CHALLENGES:-false}
      SFORUM_V3_TRUST_CHALLENGE_TTL: ${SFORUM_V3_TRUST_CHALLENGE_TTL:-5m}
    volumes:
      - attachment_uploads:/app/storage/app/attachments
      - extension_packages:/var/lib/sforum/extensions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://127.0.0.1:3000}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      NUXT_PUBLIC_I18N_BASE_URL: ${APP_URL:-http://127.0.0.1:3000}
      NUXT_PUBLIC_SITE_URL: ${APP_URL:-http://127.0.0.1:3000}
      NUXT_SITE_URL: ${APP_URL:-http://127.0.0.1:3000}
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-/api/v1}
      NUXT_API_INTERNAL_BASE_URL: ${NUXT_API_INTERNAL_BASE_URL:-http://api:8080/api/v1}
      # 客户端 IP 由入口代理（Caddy）写入 X-Real-IP，web 只做单值化转发，不再解析
      # TCP 对端：Nitro 的请求管线（dev 与 bun preset 生产相同）拿不到 socket。
      # 因此这里不需要 TRUSTED_PROXIES；web 端口必须只发布到 loopback。

volumes:
  postgres_data:
  redis_data:
  meili_data:
  attachment_uploads:
  extension_packages:
