services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
      # 源码构建的生产 migrate 镜像同样需要版本声明：这个服务没有继承
      # compose.yaml 的 api build args，APP_ENV 默认 production，缺了会被
      # 生产闸门直接拒。发布路径走 compose.release.yaml 的镜像，不受影响。
      args:
        SFORUM_VERSION: ${SFORUM_VERSION:-dev}
    profiles:
      - tools
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-production}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # migrate 也会走 config.Load：生产态要求 EXTENSION_ROOT 是绝对路径，
      # 缺省会 panic 在启动前（发布冒烟的 migrate 步骤就是这么挂的）。
      EXTENSION_ROOT: ${EXTENSION_ROOT:-/var/lib/sforum/extensions}
      DATABASE_URL: ${DATABASE_URL:-postgres://sforum:change-me@postgres:5432/sforum?sslmode=disable}
      SESSION_HASH_SECRET: ${SESSION_HASH_SECRET:?SESSION_HASH_SECRET is required in production}
      IDENTITY_SUBJECT_HMAC_SECRET: ${IDENTITY_SUBJECT_HMAC_SECRET:?IDENTITY_SUBJECT_HMAC_SECRET is required in production}
      APP_OPTION_ENC_KEY: ${APP_OPTION_ENC_KEY:?APP_OPTION_ENC_KEY is required in production}
      ALTCHA_SECRET: ${ALTCHA_SECRET:?ALTCHA_SECRET is required in production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      target: api
    environment:
      APP_URL: ${APP_URL:-https://forum.example.com}
      SFORUM_V3_TRUST_CHALLENGES: ${SFORUM_V3_TRUST_CHALLENGES:-true}
    restart: unless-stopped
    ports:
      # Host reverse proxies use this loopback-only ingress for WebSocket
      # Upgrade requests. General HTTP remains same-origin through Nuxt.
      - "127.0.0.1:${API_PORT:-18080}:8080"

  web:
    build:
      target: prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-https://forum.example.com}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      NUXT_PUBLIC_I18N_BASE_URL: ${APP_URL:-https://forum.example.com}
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-/api/v1}
      NUXT_API_INTERNAL_BASE_URL: ${NUXT_API_INTERNAL_BASE_URL:-http://api:8080/api/v1}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  # 仅 --profile search 时存在；可选搜索插件依赖。
  meilisearch:
    restart: unless-stopped
