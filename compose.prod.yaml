services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
      # 源码构建的生产 migrate 镜像同样需要版本声明：这个服务没有继承
      # compose.yaml 的 api build args，APP_ENV 默认 production，缺了会被
      # 生产闸门直接拒。发布路径走 compose.release.yaml 的镜像，不受影响。
      args:
        SFORUM_VERSION: ${SFORUM_VERSION:-dev}
    profiles:
      - tools
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-production}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # migrate 也会走 config.Load：生产态要求 EXTENSION_ROOT 是绝对路径，
      # 缺省会 panic 在启动前（发布冒烟的 migrate 步骤就是这么挂的）。
      EXTENSION_ROOT: ${EXTENSION_ROOT:-/var/lib/sforum/extensions}
      DATABASE_URL: ${DATABASE_URL:-postgres://sforum:change-me@postgres:5432/sforum?sslmode=disable}
      SESSION_HASH_SECRET: ${SESSION_HASH_SECRET:?SESSION_HASH_SECRET is required in production}
      IDENTITY_SUBJECT_HMAC_SECRET: ${IDENTITY_SUBJECT_HMAC_SECRET:?IDENTITY_SUBJECT_HMAC_SECRET is required in production}
      APP_OPTION_ENC_KEY: ${APP_OPTION_ENC_KEY:?APP_OPTION_ENC_KEY is required in production}
      ALTCHA_SECRET: ${ALTCHA_SECRET:?ALTCHA_SECRET is required in production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      target: api
    environment:
      # api 段必须自己钉 production：compose.yaml 的 api 默认是 development，
      # 只写 web/migrate 会让生产 API 以开发态启动，validateProductionSecrets
      # 整段被跳过（占位密钥、相对 EXTENSION_ROOT 都会静默放行）。
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-https://forum.example.com}
      SFORUM_V3_TRUST_CHALLENGES: ${SFORUM_V3_TRUST_CHALLENGES:-true}
      # 进入 production 后 config.Load 会拒绝 compose.yaml 的开发默认密钥。
      # 与 migrate 一致用 `:?` 前置失败：缺哪一项就报哪一项，而不是把
      # sforum-dev-* 带进容器里再 panic。
      SESSION_HASH_SECRET: ${SESSION_HASH_SECRET:?SESSION_HASH_SECRET is required in production}
      IDENTITY_SUBJECT_HMAC_SECRET: ${IDENTITY_SUBJECT_HMAC_SECRET:?IDENTITY_SUBJECT_HMAC_SECRET is required in production}
      APP_OPTION_ENC_KEY: ${APP_OPTION_ENC_KEY:?APP_OPTION_ENC_KEY is required in production}
      ALTCHA_SECRET: ${ALTCHA_SECRET:?ALTCHA_SECRET is required in production}
      # api 连接 Redis 用的是同一个口令：这里不钉，容器仍会从 compose.yaml
      # 继承 sforum-dev-redis，而 redis 服务段已经改成必填 —— 两边口令不一致
      # 时 api 连不上缓存/会话，症状是「redis 起了但 API 一直 503」。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
    restart: unless-stopped
    ports:
      # Host reverse proxies use this loopback-only ingress for WebSocket
      # Upgrade requests. General HTTP remains same-origin through Nuxt.
      - "127.0.0.1:${API_PORT:-18080}:8080"

  web:
    build:
      target: prod
    restart: unless-stopped
    depends_on:
      api:
        # RV-41：api 现在自带 healthcheck；生产拓扑的 web→api 依赖只由这一处定义，
        # 退回 service_started 会让 web 在 API 尚未就绪时就开始接流量。
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-https://forum.example.com}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      NUXT_PUBLIC_I18N_BASE_URL: ${APP_URL:-https://forum.example.com}
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-/api/v1}
      NUXT_API_INTERNAL_BASE_URL: ${NUXT_API_INTERNAL_BASE_URL:-http://api:8080/api/v1}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  # 数据服务的口令与应用密钥同理：compose.yaml 的默认值都在开发侧
  # （sforum / sforum-dev-redis / sforum-dev-meili-key），生产段只覆盖 restart
  # 时，`docker compose up -d` 会带着弱口令静默跑起来。这里用 `:?` 前置失败，
  # 缺哪一项就报哪一项，而不是把开发默认值带进生产容器。
  #
  # environment 在 override 里是按键合并，所以只写口令，POSTGRES_DB/USER 等
  # 仍继承 compose.yaml。
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}

  redis:
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}

  # 仅 --profile search 时存在；可选搜索插件依赖。
  #
  # MEILI_MASTER_KEY 已接线（P3-18 收尾）：向导为新安装生成该键、
  # .env.production.example 是正式示例行，deploy.sh / upgrade.sh 在任何 compose
  # 调用之前会给存量安装 backfill 缺失的键（只补空/缺失，不覆盖已有值）。
  # 因此这里可以按 postgres/redis 的写法加 `:?`：缺值即 fail-fast，compose.yaml
  # 的开发默认值 sforum-dev-meili-key 不再可能进入生产容器。
  meilisearch:
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required in production}
