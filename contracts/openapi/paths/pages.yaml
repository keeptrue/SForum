pagesCatalog:
  get:
    summary: Public page catalog
    operationId: getPagesCatalog
    tags: [Pages]
    description: Lists core public page definitions (stable ids and path patterns).
    responses:
      '200':
        description: Page catalog list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageCatalog"

pagesResolve:
  get:
    summary: Resolve page provider
    operationId: resolvePage
    tags: [Pages]
    description: |
      Resolves a core catalog page id. The optional browser path must match that
      exact catalog page before route parameters enter a Host ViewModel. The
      nested page query is bounded and used only as untrusted domain-service
      filters. After access checks, the route may invoke the host loader gateway
      for plugin dataSource (loopback only; no Cookie/Authorization).
    parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
          example: forum.home
      - name: path
        in: query
        required: false
        description: Actual browser path; production clients send this for exact route-parameter binding.
        schema:
          type: string
          example: /c/support
      - name: query
        in: query
        required: false
        description: URL-encoded query string of the public page, limited to 4096 bytes and bounded keys/values.
        schema:
          type: string
          maxLength: 4096
          example: page=2&sort=latest
    responses:
      '200':
        description: Resolved page provider (core or extension).
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageResolve"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"

pagesResolvePath:
  get:
    summary: Resolve added page by path
    operationId: resolvePageByPath
    tags: [Pages]
    description: |
      Deterministic match of Page Registry action=add contributions.
      Static routes beat params; params beat catch-all. Access is fail-closed.
    parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
          example: /demo-docs/hello
      - name: locale
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Matched add contribution with optional loader data.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageResolve"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Guest-only page accessed while authenticated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"

siteActiveThemeSkin:
  get:
    summary: Active theme L0 skin asset URLs
    operationId: getSiteActiveThemeSkin
    tags: [Pages]
    responses:
      '200':
        description: CSS and token URLs for the active theme skin.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponseActiveThemeSkin"

sitePageRegions:
  get:
    summary: Standard page region contributions
    operationId: getSitePageRegions
    tags: [Pages]
    description: |
      Resolves forum.page.regions contributions for one catalog page into
      host-owned descriptors (link card, action card, or L2 widget reference).
      Placement is validated against the RegionCatalog whitelist (fail closed);
      widget mounting remains authoritatively admitted by the public L2 runtime.
      Safe mode or no contributions yields an empty regions array.
    parameters:
      - name: page
        in: query
        required: true
        schema:
          type: string
        description: Catalog page id (e.g. forum.home). Pages without regions return 404.
    responses:
      '200':
        description: Ordered region content for the page.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageRegions"
      '404':
        description: Unknown page or page without standard regions.
      '422':
        description: Missing page parameter.

adminPages:
  get:
    summary: Admin page provider list
    operationId: listAdminPages
    tags: [Pages]
    responses:
      '200':
        description: Core pages with active provider and candidates.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponseAdminPageList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"

adminThemeActivationPreview:
  get:
    summary: Preview an exact theme activation
    operationId: previewAdminThemeActivation
    tags: [Pages]
    description: |
      Returns the exact target and current active-theme tuples plus every add or
      replace impact and conflict. Theme managers may activate presentation-only
      contributions. Core replacements require a separately explicit
      super_admin approval in the exact activation request.
    parameters:
      - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Exact activation preview and approval eligibility.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponseThemeActivationPreview"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"

adminPageApprove:
  post:
    summary: Approve core page replace
    operationId: approveAdminPageReplace
    tags: [Pages]
    description: super_admin only. Binds extension contribution as provider for a replaceable core page.
    parameters:
      - "$ref": "../components/parameters.yaml#/PageID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/pages.yaml#/PageApproveRequest"
    responses:
      '200':
        description: Approval recorded.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageProviderMutation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminPageRestoreCore:
  post:
    summary: Restore core page provider
    operationId: restoreAdminPageCore
    tags: [Pages]
    parameters:
      - "$ref": "../components/parameters.yaml#/PageID"
    responses:
      '200':
        description: Provider restored to core.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponsePageProviderMutation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"

siteThemeAsset:
  get:
    summary: Serve one asset from the active theme package
    operationId: getSiteThemeAsset
    tags: [Pages]
    description: |
      Serves one file from the **active** theme package. The requested
      extension id must be the active theme, and that extension must be of type
      `theme`; the relative path is resolved inside the package root with
      symlink containment. Only CSS, fonts, and bitmap images are served:
      JavaScript, HTML, and SVG are rejected with 403
      `pages.asset_type_forbidden`, so a theme asset can never become script
      authority. CSS is parsed before it is served (422 `pages.css_invalid`).

      Passing the active package digest as `v` (or `digest`) pins the exact
      artifact: a mismatch returns 404 `pages.asset_digest_mismatch`. A pinned
      response is cacheable for a year as immutable; an unpinned one for five
      minutes.
    parameters:
      - name: extensionId
        in: path
        required: true
        schema: { type: string }
        description: Stable theme extension id; must equal the active theme.
      - name: assetPath
        in: path
        required: true
        allowReserved: true
        description: Slash-preserving package-relative asset path.
        schema: { type: string, minLength: 1, maxLength: 512 }
      - name: v
        in: query
        required: false
        schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        description: Exact active package digest, enabling immutable caching.
      - name: digest
        in: query
        required: false
        schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        description: Alias of `v`.
    responses:
      '200':
        description: Theme asset bytes.
        headers:
          Cache-Control:
            schema: { type: string }
          ETag:
            schema: { type: string }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
          Content-Security-Policy:
            schema: { type: string }
          X-Frame-Options:
            schema: { type: string, enum: [DENY] }
        content:
          text/css:
            schema: { type: string, format: binary }
          font/woff:
            schema: { type: string, format: binary }
          font/woff2:
            schema: { type: string, format: binary }
          font/ttf:
            schema: { type: string, format: binary }
          font/otf:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/gif:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          image/x-icon:
            schema: { type: string, format: binary }
      '403':
        description: Asset extension is not servable (reason `pages.asset_type_forbidden`).
      '404':
        description: >-
          Unknown path, non-active theme, non-theme extension, or digest
          mismatch (reason `pages.asset_not_found` / `pages.asset_digest_mismatch`).
      '422':
        description: CSS failed validation (reason `pages.css_invalid`).

adminPagesAdded:
  get:
    summary: List pages contributed by installed themes
    operationId: listAdminAddedPages
    tags: [Pages]
    x-sforum-route-id: core.route.pages.admin_added
    description: Requires `extension.view`, `extension.theme.manage`, or `extension.manage` (any one).
    responses:
      '200':
        description: Every theme-contributed added page, empty when nothing is registered.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponseAdminAddedPages"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"

adminPageDetail:
  get:
    summary: Resolve one page with its current provider
    operationId: getAdminPageDetail
    tags: [Pages]
    x-sforum-route-id: core.route.pages.admin_get
    description: Requires `extension.view`, `extension.theme.manage`, or `extension.manage` (any one).
    parameters:
      - "$ref": "../components/parameters.yaml#/PageID"
    responses:
      '200':
        description: Resolved catalog page plus the active provider tuple.
        content:
          application/json:
            schema:
              "$ref": "../schemas/pages.yaml#/ApiResponseAdminResolvedPage"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        description: Unknown page id (reason `pages.not_found`).
