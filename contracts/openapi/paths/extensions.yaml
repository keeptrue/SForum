siteActiveThemeSettings:
  get:
    summary: Public settings for the active theme
    operationId: getSiteActiveThemeSettings
    tags: [Extensions]
    description: >-
      Returns non-secret settings for the currently active theme (merged with
      manifest defaults). Used by public theme layers for operator-configurable
      UI such as homepage notice copy and right-rail toggles. Secrets are never
      included.
    responses:
      '200':
        description: Active theme public settings map.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponsePublicActiveThemeSettings"

publicExtensionEntityCatalog:
  get:
    summary: Project the active Entity Registry into an inspectable catalog
    operationId: getPublicExtensionEntityCatalog
    tags: [Extensions]
    description: >-
      Returns `sforum.entity-catalog@1` with entity types, field/taxonomy
      projections, and Host-derived index/importExport/deletion plan summaries.
      Empty entities are valid when no Entity Registry publications exist.
      Cache-Control is no-store. Safe Mode returns core entities only.
    responses:
      '200':
        description: Entity catalog projection. Cache-Control is no-store.
        headers:
          Cache-Control:
            schema: { type: string, enum: [no-store] }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
          X-SForum-Entity-Catalog-Digest:
            schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [schemaVersion, revision, digest, entities]
                  properties:
                    schemaVersion:
                      type: string
                      enum: [sforum.entity-catalog@1]
                    revision:
                      type: integer
                      minimum: 0
                    digest:
                      type: string
                    safeMode:
                      type: boolean
                    entities:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminExtensionEntityImportExportDryRun:
  get:
    summary: Dry-run entity import/export plan and permission decision
    operationId: getAdminExtensionEntityImportExportDryRun
    tags: [Extensions]
    description: >-
      Returns `sforum.entity-import-export-dry-run@1` for one entity type.
      Requires authentication and `extension.view` (or compatible
      `extension.manage`). Evaluates Host import/export policy and the actor's
      declared entity permission keys without executing any durable store
      import or export. Missing extension.view returns 403. Entity-level
      permission or policy denials return HTTP 200 with
      `decision.allowed=false` and a machine-readable reason so admin UI can
      explain the gate. `executes` is always false.
    security:
      - cookieAuth: []
    parameters:
      - name: entityId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: action
        in: query
        required: false
        description: import or export (default export)
        schema: { type: string, enum: [import, export], default: export }
    responses:
      '200':
        description: Dry-run plan and decision. Cache-Control is no-store.
        headers:
          Cache-Control:
            schema: { type: string, enum: [no-store] }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [schemaVersion, dryRun, executes, action, plan, decision]
                  properties:
                    schemaVersion:
                      type: string
                      enum: [sforum.entity-import-export-dry-run@1]
                    dryRun: { type: boolean, enum: [true] }
                    executes: { type: boolean, enum: [false] }
                    action: { type: string, enum: [import, export] }
                    plan:
                      type: object
                      additionalProperties: true
                    decision:
                      type: object
                      required: [allowed, action, targetId]
                      properties:
                        allowed: { type: boolean }
                        action: { type: string }
                        targetId: { type: string }
                        permissionKey: { type: string }
                        policy: { type: string }
                        reason: { type: string }
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

publicExtensionContentCatalog:
  get:
    summary: Project the active Content Registry into an inspectable catalog
    operationId: getPublicExtensionContentCatalog
    tags: [Extensions]
    description: >-
      Returns `sforum.content-catalog@1` with block/shortcode/embed/node/mark/
      render_filter/sanitizer declaration projections. Empty content is valid
      when no Content Registry publications exist. Cache-Control is no-store.
      Safe Mode returns core contributions only. No execution bindings or
      secrets are exposed.
    responses:
      '200':
        description: Content catalog projection. Cache-Control is no-store.
        headers:
          Cache-Control:
            schema: { type: string, enum: [no-store] }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
          X-SForum-Content-Catalog-Digest:
            schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [schemaVersion, revision, digest, content]
                  properties:
                    schemaVersion:
                      type: string
                      enum: [sforum.content-catalog@1]
                    revision:
                      type: integer
                      minimum: 0
                    digest:
                      type: string
                    safeMode:
                      type: boolean
                    content:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

publicExtensionMediaCatalog:
  get:
    summary: Project the active Media Registry into an inspectable catalog
    operationId: getPublicExtensionMediaCatalog
    tags: [Extensions]
    description: >-
      Returns `sforum.media-catalog@1` with MIME policy, processor, and variant
      declaration projections. Empty lists are valid when no Media Registry
      publications exist. Cache-Control is no-store. Safe Mode returns core
      contributions only. No plan/execute receipts, media bytes, or storage
      credentials are exposed.
    responses:
      '200':
        description: Media catalog projection. Cache-Control is no-store.
        headers:
          Cache-Control:
            schema: { type: string, enum: [no-store] }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
          X-SForum-Media-Catalog-Digest:
            schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [schemaVersion, revision, digest, policies, processors, variants]
                  properties:
                    schemaVersion:
                      type: string
                      enum: [sforum.media-catalog@1]
                    revision:
                      type: integer
                      minimum: 0
                    digest:
                      type: string
                    safeMode:
                      type: boolean
                    policies:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    processors:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    variants:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

publicExtensionEditorCatalog:
  get:
    summary: Project the active Editor Registry into a trusted L2 load catalog
    operationId: getPublicExtensionEditorCatalog
    tags: [Extensions]
    description: >-
      Returns `sforum.editor-catalog@1` for SFEditor trusted L2 admission.
      Modules are package-digest and L2-digest bound. Empty modules are valid
      (no trusted editor plugins, or registry unavailable). Cache-Control is
      no-store. Safe Mode returns core modules only.
    responses:
      '200':
        description: Editor catalog projection. Cache-Control is no-store.
        headers:
          Cache-Control:
            schema: { type: string, enum: [no-store] }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
          X-SForum-Editor-Catalog-Digest:
            schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [schemaVersion, revision, digest, modules, toolbars]
                  properties:
                    schemaVersion:
                      type: string
                      enum: [sforum.editor-catalog@1]
                    revision:
                      type: integer
                      minimum: 0
                    digest:
                      type: string
                    safeMode:
                      type: boolean
                    modules:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    toolbars:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

publicExtensionPagePolicy:
  get:
    summary: Aggregate Host document CSP for public L2 components on one page
    operationId: getPublicExtensionPagePolicy
    tags: [Extensions]
    description: >-
      Resolves page-local public L2 soft refs (`extensionId/componentId`) against
      the live exact-artifact Asset Registry, then returns the Host-owned
      restrictive document Content-Security-Policy. Empty `component` lists are
      valid and return the Host baseline when public L2 gates pass. Nuxt SSR must
      apply `documentPolicy.headerValue` as the `Content-Security-Policy`
      response header before mounting any public L2 module. Missing, revoked,
      stale, Safe Mode, or disabled public L2 all collapse to the same 404 so
      callers fail closed without distinguishing trust state.
    parameters:
    - name: component
      in: query
      required: false
      description: >-
        Repeatable soft ref `extensionId/componentId`. Duplicates are ignored.
        At most 256 unique refs.
      schema:
        type: array
        maxItems: 256
        items:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,120}/[a-z0-9][a-z0-9._-]{1,120}$'
      style: form
      explode: true
    responses:
      '200':
        description: Host-owned public page CSP policy. Cache-Control is no-store.
        headers:
          Cache-Control:
            schema: { type: string, enum: [no-store] }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
          X-SForum-Document-Policy-Digest:
            schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponsePublicFrontendPolicy"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

publicExtensionContentStyles:
  get:
    summary: Resolve trusted plugin styles for the forum content surface
    operationId: getPublicExtensionContentStyles
    tags: [Extensions]
    description: >-
      Returns a no-store catalog of exact-artifact, blocking CSS assets whose
      manifest scope is `core.surface.forum-content`. The Host validates every
      live owner and dependency, permits only same-origin style CSP, and emits
      immutable package URLs. Shortcode-specific selectors and visual rules
      remain in the owning plugin package rather than Core. Safe Mode, revoked
      trust, stale bytes, executable dependencies, and invalid CSP fail closed.
    responses:
      '200':
        description: Trusted exact-artifact forum content styles.
        headers:
          Cache-Control:
            schema: { type: string, enum: [no-store] }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponsePublicContentStyleCatalog"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

publicExtensionComponent:
  get:
    summary: Resolve one trusted prebuilt public component
    operationId: getPublicExtensionComponent
    tags: [Extensions]
    description: >-
      Returns a no-store descriptor only while the exact extension artifact is
      enabled, its package bytes still match, its executable super_admin grant
      is live, public L2 is enabled, and Safe Mode is off. The descriptor states
      that the module is fully trusted browser code and binds every package-local
      script/style URL to package, trust-impact, and file digests. Missing,
      disabled, revoked, stale, changed, or undeclared components all return the
      same 404 response. Primary content remains in the surrounding SSR/L1 output.
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: componentID
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{1,120}$'
    responses:
      '200':
        description: Exact public component descriptor. Cache-Control is no-store so revocation is observed before a new mount.
        headers:
          Cache-Control:
            schema: { type: string, enum: [no-store] }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponsePublicFrontendComponent"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

publicExtensionAsset:
  get:
    summary: Load one exact trusted public extension asset
    operationId: getPublicExtensionAsset
    tags: [Extensions]
    description: >-
      Serves only package-local ESM, JavaScript, or CSS declared in the immutable
      Asset Registry after rechecking enabled state, live exact-artifact trust,
      package identity, handle ownership, and file SHA-256. It accepts no raw
      package path or remote URL. The browser verifies the response digest before
      import; immutable bytes may remain cached after revocation, but the no-store
      descriptor and Host mount boundary prevent a revoked artifact from mounting
      again.
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: packageDigest
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    - name: digest
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    - name: handle
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,120}$' }
    responses:
      '200':
        description: Exact immutable JavaScript module/script or CSS bytes.
        headers:
          Cache-Control:
            schema: { type: string }
          ETag:
            schema: { type: string }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
          Cross-Origin-Resource-Policy:
            schema: { type: string, enum: [same-origin] }
          X-SForum-Asset-Digest:
            schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          X-SForum-Asset-Integrity:
            schema: { type: string, pattern: '^sha256-[A-Za-z0-9+/]{43}=$' }
        content:
          application/javascript:
            schema: { type: string, format: binary }
          text/css:
            schema: { type: string, format: binary }
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

publicExtensionPackageAsset:
  get:
    summary: Load one exact package-local public extension resource
    operationId: getPublicExtensionPackageAsset
    tags: [Extensions]
    description: >-
      Serves a manifest-declared resource from its original immutable package
      directory after rechecking enabled state, live exact-artifact trust,
      package identity, file kind, and SHA-256. Keeping the original path lets
      native ESM relative imports, import.meta.url, CSS url(), and package-local
      @import resolve without source rewriting. Only JavaScript modules, CSS,
      safe bitmap formats, and WOFF/WOFF2 fonts are served; HTML, SVG, symbolic
      links, undeclared paths, and stale package digests return the same 404.
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: packageDigest
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    - name: packagePath
      in: path
      required: true
      allowReserved: true
      description: Slash-preserving package-relative path declared by packageFiles.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    responses:
      '200':
        description: Exact immutable package-local JavaScript, CSS, bitmap, or font bytes.
        headers:
          Cache-Control:
            schema: { type: string }
          ETag:
            schema: { type: string }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
          Cross-Origin-Resource-Policy:
            schema: { type: string, enum: [same-origin] }
          X-Frame-Options:
            schema: { type: string, enum: [DENY] }
          X-SForum-Asset-Digest:
            schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          X-SForum-Asset-Integrity:
            schema: { type: string, pattern: '^sha256-[A-Za-z0-9+/]{43}=$' }
        content:
          application/javascript:
            schema: { type: string, format: binary }
          text/css:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/gif:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          image/avif:
            schema: { type: string, format: binary }
          image/x-icon:
            schema: { type: string, format: binary }
          font/woff:
            schema: { type: string, format: binary }
          font/woff2:
            schema: { type: string, format: binary }
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminSurfaces:
  get:
    summary: List visible exact-runtime Admin Surface contracts
    operationId: listAdminSurfaces
    description: >-
      Requires admin.access. Returns only contracts whose exact runtime is
      active and accepting calls, filtered by each declaration's Host-owned
      permission. A composed contribution is omitted when its target is not
      visible to the actor. Artifact digests, runtime instance ids, handler
      names, and permission internals are never returned.
    parameters:
    - name: kind
      in: query
      required: false
      schema:
        "$ref": "../schemas/extension-admin-surfaces.yaml#/AdminSurfaceKind"
    - name: placementId
      in: query
      required: false
      description: Exact stable Core admin page identity for the current consumer.
      schema:
        type: string
    responses:
      '200':
        description: Permission-filtered Admin Surface catalog.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extension-admin-surfaces.yaml#/ApiResponseAdminSurfaceCatalog"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        description: Invalid Admin Surface kind.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Admin Surface runtime catalog is unavailable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"

adminSurfaceInvoke:
  post:
    summary: Invoke one visible typed Admin Surface handler
    operationId: invokeAdminSurface
    description: >-
      Requires admin.access and the exact Host-owned permission declared by the
      selected surface. The surface id and contract version bind the call to one
      immutable runtime contract. The Host records an exact-artifact audit
      attempt before execution and validates the typed input and result. When
      Query surfaces accept an optional Idempotency-Key. Command surfaces
      require it, and receive short-lived actor-bound Host Command delegations.
    parameters:
    - name: surfaceID
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extension-admin-surfaces.yaml#/AdminSurfaceInvocationInput"
    responses:
      '200':
        description: Validated Admin Surface result with a redacted contract view.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extension-admin-surfaces.yaml#/ApiResponseAdminSurfaceInvocation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        description: Missing admin.access or the surface declaration permission.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '404':
        description: Surface or the requested handler resource does not exist.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '409':
        description: Contract/runtime identity or handler state is stale.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid input document, Idempotency-Key, or a surface without a typed handler.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '500':
        description: Unexpected Host failure while invoking the Admin Surface.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Audit, exact plugin runtime, handler, or Host Command delegation service is unavailable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '504':
        description: Exact plugin runtime invocation exceeded its deadline.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"

adminExtensions:
  get:
    summary: List installed extensions and themes
    operationId: listAdminExtensions
    description: >-
      Returns the installed extension catalog. When id is provided, the Host
      performs an exact lookup and returns zero or one item without loading and
      decorating the full catalog; the authorization policy is unchanged.
    parameters:
    - name: id
      in: query
      required: false
      description: Exact stable extension id used by detail and settings pages.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    responses:
      '200':
        description: Installed extension list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Upload and install or stage an extension ZIP archive
    description: >-
      Uploads a ZIP archive containing sforum.extension.json. Same extension id
      stores an immutable upgrade candidate without changing the active package,
      runtime, status, provider selection, or active trust grants. Candidate code,
      migrations, and admin components remain inert until a separate trusted
      upgrade transaction activates that exact artifact. Theme ZIPs contain
      theme.json plus static assets and never trigger a Nuxt build. Themes cannot
      declare plugin runtime capabilities. New installs are not automatically
      enabled or activated. Plugin archives require extension.plugin.manage;
      theme archives require extension.theme.manage. The Host authorizes either
      permission before bounded static parsing, then rechecks the parsed manifest
      type before storing any package bytes.
    operationId: installAdminExtension
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '201':
        description: >-
          Extension archive installed or saved as an upgrade candidate. data is
          InstallResult (extension plus activationPending metadata).
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionInstallResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        description: Built-in/system extension cannot be overwritten (extension.not_deletable).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: >-
          Invalid archive or manifest. Invalid theme manifests keep the normal
          error envelope and use reason extension.manifest_invalid. A plugin
          archive whose declared backend entry is an executable built for
          another platform is rejected before any package bytes are stored with
          reason extension.platform_incompatible; data.fields reports the
          detected target platform (required), the host platform (host), and the
          offending manifest entry (entry).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionInstallFromURL:
  post:
    summary: Download and install or stage an extension ZIP from a URL
    description: >-
      Downloads a ZIP archive from a public HTTPS URL and stores it through the
      same inert install path as a multipart upload. The Host rejects non-HTTPS
      targets, userinfo, private/loopback/link-local/cloud-metadata addresses,
      redirects to such addresses, responses that are not a ZIP archive, and
      bodies above 50 MB. The outbound request uses a 90-second timeout and never
      follows more than three redirects. An optional sha256 pins the exact ZIP
      bytes; a mismatch aborts before the package is stored. Installation does
      not enable, activate, or execute the extension. Plugin archives require
      extension.plugin.manage; theme archives require extension.theme.manage.
    operationId: installAdminExtensionFromURL
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/ExtensionRemoteInstallInput"
    responses:
      '201':
        description: >-
          Extension archive installed or saved as an upgrade candidate. data is
          InstallResult (extension plus activationPending metadata).
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionInstallResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        description: Built-in/system extension cannot be overwritten (extension.not_deletable).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '413':
        description: The downloaded ZIP exceeds the 50 MB archive ceiling.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: >-
          Invalid URL, malformed sha256, invalid declared expectations, digest
          mismatch, non-ZIP response, archive/manifest rejection, or a package
          whose manifest identity does not match the declared expectations.
          Reasons include extension.remote_url_invalid,
          extension.remote_digest_mismatch, extension.archive_invalid,
          extension.manifest_invalid, extension.expected_mismatch (which
          also reports the manifest id/type/version in data.fields), and
          extension.platform_incompatible (a plugin backend executable built
          for another platform; data.fields reports required/host/entry).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '502':
        description: The target could not be downloaded or did not return HTTP 200.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: URL installation is not wired in this deployment.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminMissingArtifactUninstall:
  post:
    summary: Uninstall extensions whose exact artifact files are missing
    operationId: uninstallMissingArtifactExtensions
    description: >-
      Super-admin-only atomic catalog cleanup for uploaded, deletable, disabled
      plugins and themes whose stored exact package path no longer exists. The
      Host rechecks every extension and exact version/digest/path tuple before
      committing, then removes the catalog identity without executing missing
      extension code. Lifecycle history and plugin-owned business data remain.
      Re-uploading the same extension id restores its catalog identity.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/MissingArtifactCleanupInput"
    responses:
      '200':
        description: All requested missing-artifact extensions were removed from the active catalog.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseMissingArtifactCleanup"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        description: >-
          The batch is stale or invalid, an artifact is available, an extension
          is enabled, or an extension is protected from deletion. No item is
          removed when any item fails validation.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Malformed request body.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminVersionGCCandidates:
  get:
    summary: List extension version garbage-collection candidates
    operationId: listVersionGCCandidates
    description: >-
      Super-admin-only read of every historical extension version row with its
      retain/block verdict under the active policy. Reclaimable rows are
      neither active nor staged, are not targeted by an open lifecycle
      operation, are not referenced by the append-only runtime publication
      ledger, sit beyond the retention window, and still exist on disk. This
      endpoint is a pure preview with zero side effects and never mints a
      confirmation token; the service layer enforces super_admin on top of the
      extensions read guard.
    parameters:
    - name: retain
      in: query
      required: false
      description: Historical versions retained per extension besides the active one; defaults to 1.
      schema:
        type: integer
        minimum: 0
    - name: retainDays
      in: query
      required: false
      description: Also retain versions installed within the last N days; 0 disables the time window.
      schema:
        type: integer
        minimum: 0
    - name: extensionId
      in: query
      required: false
      description: Limit the plan to one exact extension id.
      schema:
        type: string
        maxLength: 128
    responses:
      '200':
        description: Candidate inventory with per-row verdicts.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseVersionGCCandidates"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        description: Malformed query parameters.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminVersionGCCreateConfirmation:
  post:
    summary: Mint a one-time version GC execution confirmation
    operationId: createVersionGCConfirmation
    description: >-
      Super-admin-only dry-run equivalent of the CLI. Mints a one-time
      confirmation token bound to the SHA-256 digest of the exact plan (options
      plus the current reclaimable candidate set). The Host stores only the
      token hash; the plaintext token is returned once and expires after
      fifteen minutes. Any criteria, candidate, or option drift between this
      call and the execute call invalidates the token.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/VersionGCConfirmationInput"
    responses:
      '200':
        description: Confirmation token and plan summary.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseVersionGCConfirmation"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        description: Malformed request body.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminVersionGCExecute:
  post:
    summary: Execute an extension version garbage-collection sweep
    operationId: executeVersionGCSweep
    description: >-
      Super-admin-only execution of the plan-bound confirmation token. Each
      candidate is removed disk-first (atomic staging rename), then the ledger
      row is deleted inside one transaction that re-checks every criterion
      under the row lock and appends an extension.version_gc audit event plus a
      durable removal anchor. A failed candidate keeps both its ledger row and
      its directory and is reported in the result; the response is 200 with the
      full per-item outcome even when some items failed. Versions referenced by
      the append-only runtime publication ledger are permanently pinned and can
      never be reclaimed.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/VersionGCExecuteInput"
    responses:
      '200':
        description: Full sweep outcome (removed, skipped, failed, warnings, bytes freed).
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseVersionGCSweepResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        description: The confirmation token is missing, expired, replayed, or does not match the current plan (extension.version_gc_confirmation_invalid).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Malformed request body.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionUninstall:
  delete:
    summary: Uninstall a deletable extension
    description: >-
      Protocol V2 plugins run digest-bound uninstall hooks while their exact
      package, runtime recovery material, and last successful authority remain
      available. The safe default preserves plugin data. Physical identity and
      package deletion occurs only after terminal success through a durable
      tombstone and exact purge receipt. Legacy extensions retain the V1
      retainSettings/retainPackage compatibility behavior.
    operationId: uninstallAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              removalMode:
                type: string
                enum: [preserve, export_then_remove, complete_removal]
                default: preserve
                description: V2 data disposition. Omission selects the safe preserve default.
              retainSettings:
                type: boolean
                description: V1 compatibility only; settings still CASCADE with the extension row.
              retainPackage:
                type: boolean
                description: V1 compatibility only; keep the package snapshot directory on disk.
    responses:
      '200':
        description: Extension uninstalled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionUninstall"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: >-
          Not deletable, a lifecycle conflict, or an explicit recovery is
          required. V1 extensions may still require disable first.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid removal mode or missing/invalid V2 Idempotency-Key.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: >-
          The uninstall reached terminal success, but Host physical cleanup did
          not finish. The error data carries structured details (operationId,
          failedStep, retriable); every cleanup step is idempotent, so retrying
          with the original Idempotency-Key or the keyless finalize-cleanup
          endpoint resumes from the failed step.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseUninstallCleanupFailed"
adminExtensionFinalizeUninstallCleanup:
  post:
    summary: Finish pending uninstall host cleanup without the original idempotency key
    description: >-
      Keyless recovery entry point for the two-phase V2 uninstall. When an
      uninstall reached durable terminal success but Host physical cleanup did
      not finish (503 extension.lifecycle_cleanup_failed on the DELETE), a
      super_admin can converge every pending uninstall tombstone of this
      extension from the failed step onward. Idempotent: with no pending
      tombstone the call succeeds with uninstalled=false and no side effects.
      Physical purge still requires the exact purge receipt; this endpoint
      never skips Host safety gates.
    operationId: finalizeUninstallCleanup
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: >-
          Cleanup converged for this extension, or there was nothing pending
          (uninstalled=false).
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionUninstall"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        description: Invalid extension id (reason extension.lifecycle_invalid).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: >-
          A pending cleanup step failed again. Structured details identify the
          failed step; the background sweep keeps retrying retriable failures.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseUninstallCleanupFailed"
adminExtensionLifecycleOperations:
  get:
    summary: List durable extension lifecycle operations
    description: >-
      Requires extension.view (or the extension.manage compatibility parent).
      Returns newest-first durable operation summaries for this extension. The
      response is a strict allowlist and never exposes authority snapshots,
      idempotency keys, request fingerprints, checkpoints, progress documents,
      trusted-runtime inputs/results, lease credentials, or opaque metadata.
    operationId: listAdminExtensionLifecycleOperations
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: limit
      in: query
      required: false
      description: Maximum number of newest operations. Empty, repeated, signed, non-canonical, or out-of-range values are rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    responses:
      '200':
        description: Allowlisted lifecycle operation history.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseLifecycleOperationList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        description: Invalid extension id or limit (reason validation.invalid).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Lifecycle inspection is not initialized (reason extension.lifecycle_unavailable).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionLifecycleOperation:
  get:
    summary: Inspect one durable extension lifecycle operation
    description: >-
      Requires extension.view (or the extension.manage compatibility parent).
      The operation is scoped by both extensionID and operationID. Returns the
      allowlisted operation and step history without authority, checkpoint,
      input, result, lease, or opaque metadata fields.
    operationId: getAdminExtensionLifecycleOperation
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: operationID
      in: path
      required: true
      description: Canonical positive base-10 lifecycle operation id.
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '200':
        description: Allowlisted lifecycle operation detail and step attempts.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseLifecycleOperationDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        description: No operation with this id belongs to the extension (reason extension.lifecycle_operation_not_found).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid extension id or operation id (reason validation.invalid).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Lifecycle inspection is not initialized (reason extension.lifecycle_unavailable).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionLifecycleRecovery:
  post:
    summary: Recover one failed durable lifecycle operation
    description: >-
      Requires plugin management permission and targets the exact extensionID
      plus operationID. Retry and skip-step preserve the original artifact,
      authority snapshot, idempotency key, request fingerprint, and initial
      audit identity. Each decision receives a new durable recovery audit id.
      Forced uninstall escalation additionally requires an active super_admin
      and an explicit residual-risk reason. Successful operations cannot be
      recovered.
    operationId: recoverAdminExtensionLifecycleOperation
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: operationID
      in: path
      required: true
      description: Canonical positive base-10 lifecycle operation id.
      schema:
        type: integer
        format: int64
        minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/LifecycleRecoveryInput"
    responses:
      '200':
        description: Updated operation detail with recovery decision history.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseLifecycleOperationDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        description: Missing plugin management permission, or forced escalation by a non-super-admin.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '404':
        description: No operation with this id belongs to the extension.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '409':
        description: Operation is not recoverable or its durable state changed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid operation id, decision, reason, or forced recovery request.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Lifecycle coordinator, audit writer, or cleanup finalizer unavailable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionMigrations:
  get:
    summary: List recorded extension migration ledger entries
    description: >-
      Returns the host migration ledger for declared manifest.migrations paths
      (F2.4). v1 records checksums only and does not execute plugin SQL.
    operationId: listAdminExtensionMigrations
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Migration ledger rows.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionMigrationList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
adminExtensionMigrationsApply:
  post:
    summary: Record declared extension migrations
    description: >-
      Idempotently records manifest.migrations paths into the ledger with file
      checksums. Does not run arbitrary SQL against the host database (F2.4 v1).
    operationId: applyAdminExtensionMigrations
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Full ledger after recording new paths.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionMigrationList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Safe Mode blocks extension migration actions (extension.safe_mode_active).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Migration recording failed (extension.migration_failed).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionNavigation:
  get:
    summary: List extension admin navigation items
    description: Returns explicit extension admin menu pages declared with menu true by enabled plugins and the active theme. All pages stay under the fixed Extensions namespace.
    operationId: listAdminExtensionNavigation
    responses:
      '200':
        description: Extension admin navigation items.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionNavigationList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionContributionPoints:
  get:
    summary: List host-defined extension contribution points
    description: Requires extension.manage. Returns the core-owned typed contribution point catalog; plugins may only declare contributions to known points.
    operationId: listAdminExtensionContributionPoints
    responses:
      '200':
        description: Known contribution points.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseContributionPointDefinitionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionContributions:
  get:
    summary: List active extension contributions
    description: Requires extension.manage. Returns effective contributions from enabled plugins only; disabled plugins and inactive themes do not affect runtime behavior.
    operationId: listAdminExtensionContributions
    responses:
      '200':
        description: Active contribution descriptors sorted by order, extension id, and contribution id.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseEffectiveContributionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionPageBootstrap:
  get:
    summary: Bootstrap one extension admin page
    description: >-
      Resolves an arbitrary manifest-declared admin page and, only when that
      exact declaration uses the settings view, returns its localized masked
      Settings Document in the same response. Unknown page paths return the
      extension with null page and settings fields so the Host can render its
      normal not-found state. The path text itself never implies a settings
      view, and no extension runtime code is started.
    operationId: getAdminExtensionPageBootstrap
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: path
      in: query
      required: true
      description: Normalized in-admin page path such as /settings or any declared custom path.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^/'
    responses:
      '200':
        description: Exact extension plus the resolved page and optional settings model.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionPageBootstrap"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
adminExtensionSettings:
  get:
    summary: Read extension settings
    description: >-
      Returns the localized host-renderer page model for either a plugin or a
      theme. Installed/disabled plugins and inactive themes remain readable and
      configurable without starting extension runtime code. Legacy array-shaped
      settings normalize to schema/form. Versioned Settings Documents may opt
      into an explicitly trusted prebuilt component while retaining Schema fallback.
    operationId: getAdminExtensionSettings
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Manifest-declared settings with stored values resolved over defaults.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
  put:
    summary: Update extension settings
    description: >-
      Persists only manifest-declared keys. Stored secrets remain encrypted and
      blank/omitted secret values preserve the current secret. Disabled plugins
      and inactive themes can be configured; only an already-enabled backend
      plugin is restarted after persistence.
    operationId: updateAdminExtensionSettings
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/ExtensionSettingsInput"
    responses:
      '200':
        description: Updated settings.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Settings revision conflict; refresh the current document before retrying.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Unknown setting key or invalid settings payload.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: >-
          Safe restart preflight failed before persistence, or settings were
          persisted but the enabled plugin failed to restart. Stable reasons
          distinguish extension.settings_restart_unavailable from
          extension.settings_restart_failed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionSettingsReset:
  post:
    summary: Reset extension settings to manifest defaults
    operationId: resetAdminExtensionSettings
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Settings after default resolution.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Settings revision conflict; refresh the current document before retrying.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: >-
          Safe restart preflight failed before persistence, or defaults were
          persisted but the enabled plugin failed to restart. Stable reasons
          distinguish extension.settings_restart_unavailable from
          extension.settings_restart_failed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionSettingsAction:
  post:
    summary: Execute a declared extension settings action
    operationId: executeAdminExtensionSettingsAction
    description: >-
      Executes only an action declared by the installed settings document. The
      host validates permission, field allowlists, explicit secret
      preserve/replace semantics, lifecycle, timeout, audit, and response
      bounds. Provider probes use a restricted short-lived runtime that does
      not register normal routes, events, jobs, schedules, or providers, so a
      disabled plugin can be tested before enablement. Results are structured
      host data and never plugin-provided HTML.
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: actionID
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/ExtensionSettingsActionInput"
    responses:
      '200':
        description: Structured action result; success may be false for provider-level failures.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionSettingsActionResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        description: Unknown action/field, implicit secret handling, or oversized input.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        description: Action runtime unavailable or timed out.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionEnable:
  post:
    summary: Enable an installed plugin
    description: >-
      Enables a plugin after preflight. With SFORUM_V3_TRUST_CHALLENGES enabled,
      a newly executable uploaded artifact requires the actor-bound one-use
      confirmationToken returned by the challenge endpoint. An already trusted
      exact digest may restart without another token. With the migration gate
      disabled, confirmCapabilities remains the v1 compatibility field.
      Idempotency-Key is required for protocol V2 plus manifest.lifecycle and
      remains optional for legacy plugins.
    operationId: enableAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              confirmCapabilities:
                type: boolean
                deprecated: true
                description: V1 compatibility confirmation used only while the V3 trust challenge gate is disabled.
              confirmationToken:
                type: string
                pattern: '^[0-9a-f]{64}$'
                description: Actor-bound, one-use, maximum-five-minute token for the exact canonical impact document.
    responses:
      '200':
        description: Plugin enabled after preflight checks.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: >-
          Themes must use activation, or capability confirmation is required
          (reason extension.capability_confirmation_required), or Safe Mode
          blocks executable activation (extension.safe_mode_active), or the
          artifact's backend executable was built for another platform
          (extension.platform_incompatible, which reports required/host/entry in
          data.fields).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid or missing V2 lifecycle Idempotency-Key.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionRestart:
  post:
    summary: Restart a plugin through the Host lifecycle
    description: >-
      Requires plugin management permission and a stable Idempotency-Key.
      The Host fully disables the current runtime before starting its exact
      replacement. If an enabled legacy artifact has an immutable staged
      candidate, restart safely bridges it by disabling the legacy runtime,
      promoting the staged candidate with exact CAS while it remains inert,
      and enabling the target. A normal Lifecycle V2 staged update continues
      to use the native upgrade ledger. Failures after disable remain
      recoverably disabled; retrying with the same Idempotency-Key resumes the
      exact target instead of selecting a newer artifact.
    operationId: restartAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              confirmCapabilities:
                type: boolean
                deprecated: true
                description: >-
                  Compatibility capability confirmation used when exact
                  executable trust challenges are disabled, or when a
                  non-trust-required staged target adds Host capabilities.
              confirmationToken:
                type: string
                pattern: '^[0-9a-f]{64}$'
                description: Actor-bound one-use token for an uploaded staged target that does not already have an exact live grant.
    responses:
      '200':
        description: Exact target runtime is enabled after restart or staged migration.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: >-
          Another lifecycle operation is open, exact staged CAS changed, trust
          is missing, Safe Mode blocks restart, or the exact target's backend
          executable was built for another platform
          (extension.platform_incompatible, which reports required/host/entry in
          data.fields).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Missing or invalid Idempotency-Key, unsupported extension state, or invalid lifecycle target.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionTrust:
  get:
    summary: Preview exact executable extension impact and trust state
    description: >-
      Returns the canonical impact document without executing package code.
      Delegated extension managers may inspect this preview. The document binds
      package/binary/frontend/migration digests, routes, guards, hooks, providers,
      components, capabilities, permissions, requested authority, and contracts.
    operationId: getAdminExtensionTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/ExecutableTrustTarget"
    responses:
      '200':
        description: Current exact-artifact trust status and impact preview.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExecutableTrustStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: The artifact requires uploaded executable trust while the V3 trust challenge migration gate is disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid trust review target.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
  delete:
    summary: Revoke executable trust for an extension
    description: Super-admin only. Revokes every live exact-artifact grant and outstanding challenge for the extension.
    operationId: revokeAdminExtensionTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Executable trust revoked immediately.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExecutableTrustStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: V3 trust challenge migration gate is disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionTrustChallenge:
  post:
    summary: Issue an exact-artifact executable trust challenge
    description: >-
      Super-admin only. Returns a one-use token bound to the current actor,
      extension version, package and executable digests, canonical impact digest,
      requested authority, and Host/Frontend contracts. Expires within five minutes.
    operationId: createAdminExtensionTrustChallenge
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/ExecutableTrustTarget"
    responses:
      '200':
        description: Short-lived one-use challenge issued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExecutableTrustChallenge"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Trust is not required for this artifact or the migration gate is disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid trust review target.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminExtensionDisable:
  post:
    summary: Disable an installed plugin
    description: >-
      Runs the durable lifecycle transaction for protocol V2 plus
      manifest.lifecycle; those plugins require Idempotency-Key. Legacy plugins
      continue to use the compatibility disable path.
    operationId: disableAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    responses:
      '200':
        description: Plugin disabled.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Themes must use the activation endpoint instead of plugin disable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid or missing V2 lifecycle Idempotency-Key.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminDevTrustSessions:
  get:
    summary: List development trust sessions
    description: >-
      Development-only. Lists dev trust sessions (active plus optionally
      revoked) for the extension admin surface. Returns 503 with reason
      `extension.dev_trust_disabled` when APP_ENV is not development.
    operationId: listAdminDevTrustSessions
    parameters:
    - name: extensionId
      in: query
      required: false
      schema:
        type: string
      description: Filter sessions by extension id.
    - name: includeRevoked
      in: query
      required: false
      schema:
        type: string
        enum: ["true", "false"]
        default: "false"
      description: Include revoked and expired sessions.
    responses:
      '200':
        description: Dev trust session list (newest first, bounded to 200).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
  post:
    summary: Create a development trust session for one package
    description: >-
      Super-admin only, development-only. The request body must carry
      `confirm: "true"`; this single confirmation covers every digest built by
      the same CLI watch loop session (each grant is still per-digest,
      audited, and revocable). Requires the package root to live under
      extensions/dev.
    operationId: createAdminDevTrustSession
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [extensionId, packageSlug, rootPath, confirm]
            properties:
              extensionId:
                type: string
              packageSlug:
                type: string
              rootPath:
                type: string
              confirm:
                type: string
                enum: ["true"]
    responses:
      '200':
        description: Session created.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: An active session already exists for this package.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Validation failed (missing confirm flag or invalid body).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminDevTrustSession:
  delete:
    summary: Revoke a development trust session
    description: Super-admin only. Revokes the session; subsequent digests fall back to manual exact-artifact confirmation.
    operationId: revokeAdminDevTrustSession
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: Dev trust session id.
    responses:
      '200':
        description: Session revoked.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminExtensionDevTrustRefresh:
  post:
    summary: Auto-grant exact trust for a freshly built dev digest
    description: >-
      Super-admin only, development-only. Called by `sforum extension dev
      --auto-trust` after each successful build. When the development
      assembly injected the external-source syncer, it first re-runs
      `SyncExternalSources` over `EXTERNAL_EXTENSION_ROOTS` so the freshly
      rebuilt digest is staged into the running API without a restart; then
      writes an idempotent exact live grant when an active dev trust session
      exists for the caller and package. Otherwise fails closed with
      `extension.trust_challenge_required`, identical to the manual path.
    operationId: refreshAdminExtensionDevTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              packageDigest:
                type: string
    responses:
      '200':
        description: Digest trusted (or already trusted).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: No active dev trust session; manual confirmation required.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminExtensionUpgrade:

  post:
    summary: Activate the exact staged plugin version
    description: >-
      Runs the protocol V2 upgrade transaction for the immutable staged
      candidate. Idempotency-Key is required when the selected plugin declares
      backend protocolVersion 2 plus manifest.lifecycle. Candidate code remains
      inert until static preflight and exact-artifact trust both pass.
    operationId: upgradeAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              confirmationToken:
                type: string
                pattern: '^[0-9a-f]{64}$'
    responses:
      '200':
        description: The exact staged artifact is active.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: >-
          No staged candidate, trust conflict, another lifecycle operation is
          open, or the exact staged artifact's backend executable was built for
          another platform (extension.platform_incompatible, which reports
          required/host/entry in data.fields).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid or missing V2 lifecycle idempotency identity.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionRollback:
  post:
    summary: Roll back to an exact historical plugin version
    description: >-
      Runs the protocol V2 rollback transaction for the exact version and
      digest. The Host reuses that artifact's last successful immutable
      authority snapshot even if its live grant was later revoked; current
      operator permission and audit identity remain authoritative.
    operationId: rollbackAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [targetVersion, targetPackageDigest]
            properties:
              targetVersion:
                type: string
                minLength: 1
              targetPackageDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
    responses:
      '200':
        description: The exact historical artifact is active.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        description: Extension or exact historical version not found.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '409':
        description: >-
          No successful frozen authority, another lifecycle operation is open,
          or the exact historical artifact's backend executable was built for
          another platform (extension.platform_incompatible, which reports
          required/host/entry in data.fields).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: Invalid rollback target or missing V2 lifecycle idempotency identity.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionVerify:
  post:
    summary: Verify an installed plugin or theme package without applying it
    description: >-
      Plugins run preflight checks. Themes validate their buildless theme.json,
      page templates, and static asset paths without applying the package.
    operationId: verifyAdminExtension
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Extension preflight or theme package verification completed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Safe Mode blocks executable preflight (extension.safe_mode_active).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionActivate:
  post:
    summary: Activate a theme
    operationId: activateAdminExtensionTheme
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/ThemeActivationRequest"
    responses:
      '200':
        description: Theme synchronously activated through the public Page Registry.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtension"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: >-
          Safe Mode blocks activation, the exact preview artifact is stale, or
          the theme's backend executable was built for another platform
          (extension.platform_incompatible, which reports required/host/entry in
          data.fields).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionEvents:
  get:
    summary: List extension lifecycle events
    operationId: listAdminExtensionEvents
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Recent extension lifecycle events.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionEventDefinitions:
  get:
    summary: List host-defined extension event points
    operationId: listAdminExtensionEventDefinitions
    responses:
      '200':
        description: Known extension event definitions and their listener semantics.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventDefinitionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionEventDeliveries:
  get:
    summary: List plugin event delivery attempts
    operationId: listAdminExtensionEventDeliveries
    parameters:
    - name: extensionId
      in: query
      schema:
        type: string
    - name: eventName
      in: query
      schema:
        type: string
    - name: status
      in: query
      schema:
        type: string
        enum:
        - queued
        - running
        - succeeded
        - failed
        - skipped
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Recent plugin event listener delivery attempts.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseExtensionEventDeliveryList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminExtensionFrontend:
  get:
    summary: Inspect an extension's prebuilt admin components
    description: Requires extension management permission. Returns the exact admin frontend digest, all settings/page component declarations, and trust state without executing extension code.
    operationId: getAdminExtensionFrontend
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Trusted frontend status.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseFrontendStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminExtensionFrontendAsset:
  get:
    summary: Load a trusted immutable prebuilt admin asset
    description: >-
      Authenticated same-origin endpoint. It serves only the current settings
      component entry or CSS declared by the installed package, after exact
      digest grant/source-trust verification. Arbitrary package paths are never
      accepted. Responses use immutable private caching and nosniff.
    operationId: getAdminExtensionFrontendAsset
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: digest
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    - name: asset
      in: path
      required: true
      schema:
        type: string
        enum: [entry, style]
    responses:
      '200':
        description: Immutable JavaScript module or CSS bytes from the extension package.
        headers:
          Cache-Control:
            schema: { type: string }
          ETag:
            schema: { type: string }
          X-Content-Type-Options:
            schema: { type: string, enum: [nosniff] }
          Cross-Origin-Resource-Policy:
            schema: { type: string, enum: [same-origin] }
        content:
          application/javascript:
            schema: { type: string, format: binary }
          text/css:
            schema: { type: string, format: binary }
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
adminExtensionFrontendComponentAsset:
  get:
    summary: Load one trusted immutable prebuilt admin component asset
    description: >-
      Authenticated same-origin endpoint for a manifest-declared settings or
      admin page component. The Host verifies page access, enabled state where
      applicable, exact package trust, adminFrontendDigest, component identity,
      and immutable bytes before serving entry or CSS.
    operationId: getAdminExtensionFrontendComponentAsset
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    - name: digest
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    - name: component
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,80}$' }
    - name: asset
      in: path
      required: true
      schema: { type: string, enum: [entry, style] }
    responses:
      '200':
        description: Immutable JavaScript module or CSS bytes from the exact component.
        headers:
          Cache-Control: { schema: { type: string } }
          ETag: { schema: { type: string } }
          X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
          Cross-Origin-Resource-Policy: { schema: { type: string, enum: [same-origin] } }
        content:
          application/javascript: { schema: { type: string, format: binary } }
          text/css: { schema: { type: string, format: binary } }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
adminExtensionFrontendConfirmation:
  post:
    summary: Create a one-use prebuilt component trust confirmation
    description: >-
      Active super_admin only. The five-minute challenge is bound to actor,
      extension id, version, API version, component id, and
      adminFrontendDigest, and is consumed by the first grant attempt. It
      confirms intentional authorization; the durable technical boundary is
      still the exact digest grant.
    operationId: createAdminExtensionFrontendConfirmation
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: One-use confirmation challenge.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseFrontendTrustChallenge"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
adminExtensionFrontendTrust:
  post:
    summary: Grant exact trusted admin frontend access
    description: >-
      Requires an active super administrator. Trust is bound to extension id,
      version, API version, component identity, and exact adminFrontendDigest.
      Prebuilt components additionally require an explicit confirmation object
      and load directly from the immutable digest endpoint after authorization.
    operationId: grantAdminExtensionFrontendTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/extensions.yaml#/GrantFrontendTrustInput"
    responses:
      '200':
        description: Trust granted immediately.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseFrontendStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        description: The admin frontend digest is not 64 lowercase hexadecimal characters.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
  delete:
    summary: Revoke exact trusted admin frontend access
    description: Requires an active super administrator. Revocation finalizes immediately and prevents further asset loads for the digest grant.
    operationId: revokeAdminExtensionFrontendTrust
    parameters:
    - "$ref": "../components/parameters.yaml#/ExtensionID"
    responses:
      '200':
        description: Trust revoked immediately.
        content:
          application/json:
            schema:
              "$ref": "../schemas/extensions.yaml#/ApiResponseFrontendStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
adminExtensionRouteProviderConflicts:
  get:
    summary: Inspect replace-provider conflicts and durable desired selections
    operationId: listAdminExtensionRouteProviderConflicts
    description: Requires extension.view or the legacy extension.manage permission. Stale desired bindings remain visible with their revision for explicit CAS reset.
    responses:
      '200':
        description: Replace-provider conflicts from the current immutable Route Registry snapshot.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-route-providers.yaml#/ApiResponseRouteProviderConflictList" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionProviderSlots:
  get:
    summary: Inspect the immutable plugin-defined Provider Slot Registry
    operationId: inspectAdminExtensionProviderSlots
    description: Requires extension.view or the legacy extension.manage permission. Returns exact contract and candidate artifacts, durable selection status, deterministic priority conflicts, fallback policy, and current runtime admission availability. This read-only endpoint does not probe providers or change selection.
    responses:
      '200':
        description: Provider slots from one immutable Registry revision.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-provider-slots.yaml#/ApiResponseProviderSlotInspection" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionProviderSlotEvents:
  get:
    summary: List durable provider-slot selection events
    operationId: listAdminExtensionProviderSlotEvents
    description: Requires extension.view or the legacy extension.manage permission. Events are append-only audit evidence for one contract.
    parameters:
    - { name: contractId, in: query, required: true, schema: { type: string } }
    - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    responses:
      '200':
        description: Newest selection events first.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-provider-slots.yaml#/ApiResponseProviderSlotSelectionEvents" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionProviderSlotSelection:
  post:
    summary: Select an exact provider-slot candidate
    operationId: selectAdminExtensionProviderSlot
    description: Active super_admin only. The Host appends an attributable audit event before validating the current immutable registry snapshot and persisting through revision CAS.
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/extension-provider-slots.yaml#/ProviderSlotSelectRequest" }
    responses:
      '200':
        description: Durable exact-artifact selection.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-provider-slots.yaml#/ApiResponseProviderSlotSelection" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionProviderSlotReset:
  post:
    summary: Restore deterministic provider priority defaults
    operationId: resetAdminExtensionProviderSlot
    description: Active super_admin only. Deletes the durable desired choice through revision CAS; provider-owned settings and secrets are preserved.
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/extension-provider-slots.yaml#/ProviderSlotResetRequest" }
    responses:
      '200':
        description: Default ordering restored.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-provider-slots.yaml#/ApiResponseProviderSlotReset" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionProviderSlotProbe:
  post:
    summary: Probe one exact active provider candidate
    operationId: probeAdminExtensionProviderSlot
    description: Active super_admin only. Uses the provider's side-effect-free ProviderProbe RPC under runtime admission and the contract timeout; it never sends a business invocation payload.
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/extension-provider-slots.yaml#/ProviderSlotProbeRequest" }
    responses:
      '200':
        description: Bounded provider probe result.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-provider-slots.yaml#/ApiResponseProviderSlotProbe" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionRouteProviderSelection:
  get:
    summary: Inspect the durable desired route-provider selection
    operationId: getAdminExtensionRouteProviderSelection
    description: Returns the stored binding and revision even when its target contract or exact provider is stale. Runtime dispatch never uses this management-only desired read.
    parameters:
    - { name: targetRouteId, in: query, required: true, schema: { type: string } }
    - { name: targetContractVersion, in: query, required: true, schema: { type: string } }
    - { name: method, in: query, required: true, schema: { type: string } }
    - { name: pathSignature, in: query, required: true, schema: { type: string } }
    responses:
      '200':
        description: Durable desired selection.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-route-providers.yaml#/ApiResponseRouteProviderSelection" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
  post:
    summary: Select an exact replace provider
    operationId: selectAdminExtensionRouteProvider
    description: Active super_admin only. The Host appends an attributable audit event before exact-snapshot validation and revision-CAS persistence. Priority never selects a replacement.
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/extension-route-providers.yaml#/RouteProviderSelectInput" }
    responses:
      '200':
        description: Exact desired provider selected.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-route-providers.yaml#/ApiResponseRouteProviderSelection" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionRouteProviderEvents:
  get:
    summary: List append-only route-provider selection events
    operationId: listAdminExtensionRouteProviderEvents
    parameters:
    - { name: targetRouteId, in: query, required: true, schema: { type: string } }
    - { name: targetContractVersion, in: query, required: true, schema: { type: string } }
    - { name: method, in: query, required: true, schema: { type: string } }
    - { name: pathSignature, in: query, required: true, schema: { type: string } }
    - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    responses:
      '200':
        description: Select, reset, and lifecycle invalidation evidence.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-route-providers.yaml#/ApiResponseRouteProviderSelectionEventList" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminExtensionRouteProviderReset:
  post:
    summary: Reset a durable desired route-provider selection
    operationId: resetAdminExtensionRouteProvider
    description: Active super_admin only. Uses the stored key and revision returned by the management inspection API, including for stale bindings.
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/extension-route-providers.yaml#/RouteProviderResetInput" }
    responses:
      '200':
        description: Desired selection reset; runtime resolution remains fail closed until a new provider is selected.
        content:
          application/json:
            schema: { "$ref": "../schemas/extension-route-providers.yaml#/ApiResponseRouteProviderReset" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
extensionPluginRoute:
  parameters:
  - "$ref": "../components/parameters.yaml#/ExtensionID"
  - "$ref": "../components/parameters.yaml#/ExtensionPluginPath"
  - name: X-SForum-Public-Extension-ID
    in: header
    description: Optional exact public-frontend bridge identity. Supplying any bridge header requires the complete five-header set.
    schema: { type: string }
  - name: X-SForum-Public-Extension-Version
    in: header
    schema: { type: string }
  - name: X-SForum-Public-Package-Digest
    in: header
    schema: { type: string, pattern: '^[0-9a-f]{64}$' }
  - name: X-SForum-Public-Impact-Digest
    in: header
    schema: { type: string, pattern: '^[0-9a-f]{64}$' }
  - name: X-SForum-Public-Component-ID
    in: header
    schema: { type: string }
  get:
    summary: Invoke a declared plugin route
    description: Proxies a plugin-declared GET route under /api/v1/extensions/{extensionID}/* after host-side manifest matching and access checks. Plugins cannot override core API routes.
    responses:
      '200':
        description: Plugin-defined response.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '405':
        description: Plugin route exists but does not declare this HTTP method.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '412':
        description: The optional public-frontend bridge identity is incomplete, revoked, upgraded, or no longer matches the admitted runtime.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
  post:
    summary: Invoke a declared plugin route
    description: Proxies a plugin-declared unsafe route only after the host verifies the current actor and any manifest-declared permission.
    responses:
      '200':
        description: Plugin-defined response.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '405':
        description: Plugin route exists but does not declare this HTTP method.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '412':
        description: The optional public-frontend bridge identity is incomplete, revoked, upgraded, or no longer matches the admitted runtime.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
