attachments:
  post:
    summary: Upload an attachment
    operationId: uploadAttachment
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '201':
        description: Attachment uploaded through the API server.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAttachment"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '413':
        "$ref": "../components/responses.yaml#/PayloadTooLarge"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
attachmentUploadPolicy:
  get:
    summary: Get the current user's effective attachment upload policy
    operationId: getAttachmentUploadPolicy
    responses:
      '200':
        description: Effective permission plus site, identity, and transport size limits.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentUploadPolicy" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
attachmentByPublicID:
  get:
    summary: Get attachment metadata
    operationId: getAttachment
    parameters:
    - "$ref": "../components/parameters.yaml#/AttachmentPublicID"
    responses:
      '200':
        description: >
          Attachment metadata allowed for the current actor. Forum references
          are authorized against the current topic/comment status, category
          visibility, author, and moderation permissions. Only explicit
          site-public assets (avatars, SEO/brand/favicon images) may expose a
          permanent provider URL; forum and unreferenced media use the API
          proxy. Eligible JPEG and PNG metadata points to the display-variant
          proxy, which transparently falls back to the immutable original.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAttachment"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
attachmentContent:
  get:
    summary: Download or render attachment content
    operationId: getAttachmentContent
    parameters:
    - "$ref": "../components/parameters.yaml#/AttachmentPublicID"
    responses:
      '200':
        description: >
          Attachment bytes streamed from the configured provider after the
          same access policy as getAttachment is rechecked. The browser-facing
          Host media route may opt into an internal signed-redirect delivery
          mode; this public API operation keeps its byte-stream response.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
attachmentVariantContent:
  get:
    summary: Render an attachment display variant with original fallback
    operationId: getAttachmentVariantContent
    parameters:
    - "$ref": "../components/parameters.yaml#/AttachmentPublicID"
    - name: variant
      in: path
      required: true
      schema:
        type: string
        enum: [display]
    responses:
      '200':
        description: >
          Streams the ready variant after applying the original attachment
          access policy. Missing, stale, or unavailable variants transparently
          fall back to the immutable original. The browser-facing Host media
          route may internally request signed-redirect delivery.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminAttachmentSettings:
  get:
    summary: Get attachment runtime settings
    operationId: getAttachmentSettings
    responses:
      '200':
        description: Attachment storage and upload settings. Secret values are masked.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  put:
    summary: Update attachment runtime settings
    operationId: updateAttachmentSettings
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/attachments.yaml#/AttachmentSettings"
    responses:
      '200':
        description: Attachment settings updated. Blank secret fields keep existing secrets.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentSettings"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
adminAttachmentSettingsTest:
  post:
    summary: Test the active attachment storage provider
    operationId: testAttachmentSettings
    responses:
      '200':
        description: Provider probe result.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentProbe"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminAttachmentUploadPolicyRoles:
  get:
    summary: List attachment upload permission and size policy for every role
    operationId: listAttachmentUploadRolePolicies
    description: Requires attachment.upload_policy.manage.
    responses:
      '200':
        description: Role upload permission state and inherited or configured size limits.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentUploadRolePolicies" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
adminAttachmentUploadPolicyRole:
  parameters:
  - name: roleKey
    in: path
    required: true
    schema: { type: string }
  put:
    summary: Set a role attachment upload size limit
    operationId: setAttachmentUploadRolePolicy
    description: The attachment.upload permission remains owned by the existing RBAC role API.
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/attachments.yaml#/AttachmentUploadLimitInput" }
    responses:
      '200':
        description: Updated role policy.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentUploadRolePolicy" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
  delete:
    summary: Restore a role attachment upload size limit to site inheritance
    operationId: deleteAttachmentUploadRolePolicy
    responses:
      '200':
        description: Role policy restored to inheritance.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentUploadRolePolicy" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
adminAttachmentUploadPolicyUser:
  parameters:
  - name: userID
    in: path
    required: true
    schema: { type: integer, format: int64, minimum: 1 }
  get:
    summary: Get one user's effective attachment upload policy
    operationId: getAttachmentUploadUserPolicy
    description: Requires attachment.upload_policy.manage and user.view.
    responses:
      '200':
        description: User-specific policy plus the resolved effective result.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentUploadUserPolicy" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
  put:
    summary: Set a user-specific attachment upload size limit
    operationId: setAttachmentUploadUserPolicy
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/attachments.yaml#/AttachmentUploadLimitInput" }
    responses:
      '200':
        description: Updated user policy.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentUploadUserPolicy" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
  delete:
    summary: Restore a user's upload size limit to role inheritance
    operationId: deleteAttachmentUploadUserPolicy
    responses:
      '200':
        description: User policy restored to role or site inheritance.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentUploadUserPolicy" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
adminAttachmentCompressionSettings:
  get:
    summary: Get regular attachment image compression settings
    operationId: getAttachmentCompressionSettings
    responses:
      '200':
        description: Current Host-owned image compression policy.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentCompressionSettings" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
  put:
    summary: Update regular attachment image compression settings
    operationId: updateAttachmentCompressionSettings
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/attachments.yaml#/AttachmentCompressionSettingsInput" }
    responses:
      '200':
        description: Compression policy saved for future tasks.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentCompressionSettings" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
adminAttachmentStorageInstances:
  get:
    summary: List Host-owned attachment storage instances
    operationId: listAttachmentStorageInstances
    responses:
      '200':
        description: Storage instances with provider-defined schemas and historical attachment counts.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentStorageInstances"
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
  post:
    summary: Create an attachment storage instance
    operationId: createAttachmentStorageInstance
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/attachments.yaml#/AttachmentStorageInstanceInput" }
    responses:
      '201':
        description: Instance created in an unverified state.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentStorageInstance" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
adminAttachmentStorageInstancesProbe:
  post:
    summary: Probe draft storage instance configuration without activating it
    operationId: probeAttachmentStorageInstance
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/attachments.yaml#/AttachmentStorageInstanceProbeInput" }
    responses:
      '200':
        description: Draft probe result.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentProbe" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
adminAttachmentStorageLocalActivate:
  post:
    summary: Make Core local storage the writer for new attachments
    operationId: activateLocalAttachmentStorage
    responses:
      '200': { description: Local storage activated. }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
adminAttachmentStorageInstance:
  parameters:
  - name: storageInstanceID
    in: path
    required: true
    schema: { type: string, format: uuid }
  put:
    summary: Update an attachment storage instance using its configuration revision
    operationId: updateAttachmentStorageInstance
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/attachments.yaml#/AttachmentStorageInstanceInput" }
    responses:
      '200':
        description: Instance updated.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentStorageInstance" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
  delete:
    summary: Delete an unreferenced standby storage instance
    operationId: deleteAttachmentStorageInstance
    responses:
      '200':
        description: Instance deleted.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentDelete" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
adminAttachmentStorageInstanceActivate:
  post:
    summary: Probe and make an instance the writer for new attachments
    operationId: activateAttachmentStorageInstance
    parameters:
    - name: storageInstanceID
      in: path
      required: true
      schema: { type: string, format: uuid }
    responses:
      '200':
        description: Instance activated after a successful real probe.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentStorageInstance" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
adminAttachments:
  get:
    summary: List attachments for administration
    operationId: listAdminAttachments
    parameters:
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: query
      in: query
      schema:
        type: string
    - name: provider
      in: query
      schema:
        "$ref": "../schemas/attachments.yaml#/AttachmentProvider"
    - name: status
      in: query
      schema:
        "$ref": "../schemas/attachments.yaml#/AttachmentStatus"
    - name: contentType
      in: query
      schema:
        type: string
    - name: ownerUserId
      in: query
      schema:
        type: integer
        format: int64
    - name: referenceStatus
      in: query
      schema:
        type: string
        enum:
        - referenced
        - orphan
    - name: createdFrom
      in: query
      schema:
        type: string
        format: date-time
    - name: createdTo
      in: query
      schema:
        type: string
        format: date-time
    responses:
      '200':
        description: Paged attachment list for governance.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAdminAttachmentList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminAttachmentCleanup:
  post:
    summary: Clean up deleted orphan attachments
    operationId: cleanupAdminAttachments
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              limit:
                type: integer
                minimum: 1
                maximum: 500
    responses:
      '200':
        description: Cleanup result.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentCleanup"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminAttachmentReconcile:
  post:
    summary: Reconcile stored attachment reference counts against reference rows
    description: >
      Compares every attachment's stored `reference_count` with its actual
      `attachment_references` rows. A dry run only reports drift; an apply run
      corrects only the drifting rows and is idempotent. Defaults to a dry run
      when `dryRun` is omitted.
    operationId: reconcileAdminAttachmentReferences
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              dryRun:
                type: boolean
                default: true
                description: >
                  True reports drift without writing. Omitted is treated as true.
    responses:
      '200':
        description: Reference count reconciliation result.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAdminAttachmentRecount"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminAttachmentCompressionStats:
  get:
    summary: Get attachment image compression queue and savings statistics
    operationId: getAttachmentCompressionStats
    responses:
      '200':
        description: Current task counts and ready display-variant byte savings.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentCompressionStats" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
adminAttachmentCompressionBackfill:
  post:
    summary: Schedule existing eligible JPEG and PNG attachments for compression
    operationId: backfillAttachmentCompression
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              limit: { type: integer, minimum: 1, maximum: 10000, default: 5000 }
    responses:
      '200':
        description: Number of durable tasks newly scheduled.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentCompressionBackfill" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
adminAttachmentByID:
  get:
    summary: Get attachment detail for administration
    operationId: getAdminAttachment
    parameters:
    - "$ref": "../components/parameters.yaml#/AttachmentID"
    responses:
      '200':
        description: Attachment detail including object key, checksum, and references.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAdminAttachmentDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
  patch:
    summary: Update attachment status
    operationId: updateAdminAttachment
    parameters:
    - "$ref": "../components/parameters.yaml#/AttachmentID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            properties:
              status:
                type: string
                enum:
                - active
                - disabled
    responses:
      '200':
        description: Attachment status updated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAdminAttachment"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
  delete:
    summary: Soft-delete an unreferenced attachment
    operationId: deleteAdminAttachment
    parameters:
    - "$ref": "../components/parameters.yaml#/AttachmentID"
    responses:
      '200':
        description: Attachment marked as deleted. Physical cleanup is handled by the orphan cleanup path.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAdminAttachment"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
