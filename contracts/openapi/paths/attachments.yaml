attachments:
  post:
    summary: Upload an attachment
    operationId: uploadAttachment
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '201':
        description: Attachment uploaded through the API server.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAttachment"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '413':
        "$ref": "../components/responses.yaml#/PayloadTooLarge"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
attachmentUploadPolicy:
  get:
    summary: Get the current user's effective attachment upload policy
    operationId: getAttachmentUploadPolicy
    responses:
      '200':
        description: Effective permission plus site, identity, and transport size limits.
        content:
          application/json:
            schema: { "$ref": "../schemas/attachments.yaml#/ApiResponseAttachmentUploadPolicy" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
attachmentByPublicID:
  get:
    summary: Get attachment metadata
    operationId: getAttachment
    parameters:
    - "$ref": "../components/parameters.yaml#/AttachmentPublicID"
    responses:
      '200':
        description: >
          Attachment metadata allowed for the current actor. Forum references
          are authorized against the current topic/comment status, category
          visibility, author, and moderation permissions. Only explicit
          site-public assets (avatars, SEO/brand/favicon images) may expose a
          permanent provider URL; forum and unreferenced media use the API
          proxy. Eligible JPEG and PNG metadata points to the display-variant
          proxy, which transparently falls back to the immutable original.
        content:
          application/json:
            schema:
              "$ref": "../schemas/attachments.yaml#/ApiResponseAttachment"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

attachmentContent:
  get:
    summary: Download or render attachment content
    operationId: getAttachmentContent
    parameters:
    - "$ref": "../components/parameters.yaml#/AttachmentPublicID"
    - "$ref": "../components/parameters.yaml#/MediaDeliveryHeader"
    responses:
      '200':
        description: >
          Attachment bytes streamed from the configured provider after the
          same access policy as getAttachment is rechecked. This is the
          default delivery mode and also the fallback when the storage
          provider cannot produce a signed URL. Callers that set the
          `X-SForum-Media-Delivery` header parameter (see this operation's
          parameters) to `redirect-v1` get a 302 to the provider-signed
          address instead, as declared below.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '302':
        description: >
          Direct delivery mode: the `X-SForum-Media-Delivery` header parameter
          (declared on this operation, enum `redirect-v1`) was set to
          `redirect-v1` and the storage provider produced a signed URL, so the
          API answers 302 instead of streaming the bytes
          (sendAttachmentDelivery → StatusFound). The location is
          capability-bearing, therefore cacheable only privately — the
          response is always sent with `Cache-Control: private, no-store`.
          Providers without signed-URL support, and requests without that
          header parameter, fall back to the 200 stream.
        headers:
          Location:
            description: Provider-signed URL that serves the bytes for this attachment.
            schema:
              type: string
              format: uri
          Cache-Control:
            description: Always `private, no-store`; the signed location must never be shared-cached.
            schema:
              type: string
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
attachmentVariantContent:
  get:
    summary: Render an attachment display variant with original fallback
    operationId: getAttachmentVariantContent
    parameters:
    - "$ref": "../components/parameters.yaml#/AttachmentPublicID"
    - name: variant
      in: path
      required: true
      schema:
        type: string
        enum: [display]
    - "$ref": "../components/parameters.yaml#/MediaDeliveryHeader"
    responses:
      '200':
        description: >
          Streams the ready variant after applying the original attachment
          access policy. Missing, stale, or unavailable variants transparently
          fall back to the immutable original. With the
          `X-SForum-Media-Delivery` header parameter (see this operation's
          parameters) set to `redirect-v1`, the same sendAttachmentDelivery
          branch answers 302 to the provider-signed address instead of
          streaming, as declared below.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      '302':
        description: >
          Direct delivery mode for the variant: the `X-SForum-Media-Delivery`
          header parameter (declared on this operation, enum `redirect-v1`) was
          set to `redirect-v1` plus a provider-signed URL, yielding 302
          (StatusFound) to the signed address, with `Cache-Control: private,
          no-store`. Without signed-URL support, or without that header
          parameter, the variant falls back to the 200 stream.
        headers:
          Location:
            description: Provider-signed URL that serves the variant bytes.
            schema:
              type: string
              format: uri
          Cache-Control:
            description: Always `private, no-store`; the signed location must never be shared-cached.
            schema:
              type: string
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '503': { "$ref": "../components/responses.yaml#/ServiceUnavailable" }
