notifications:
  get:
    summary: List the current user's notifications
    operationId: listNotifications
    security: [{cookieAuth: []}]
    parameters:
    - {in: query, name: limit, schema: {type: integer, default: 20, maximum: 100}}
    - {in: query, name: beforeId, schema: {type: integer, format: int64}}
    - {in: query, name: category, schema: {type: string}}
    - {in: query, name: type, schema: {type: string}}
    - {in: query, name: unread, schema: {type: boolean}}
    responses:
      '200': {description: Notification page, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseNotificationPage"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
notificationDetail:
  get:
    summary: Get one current-user notification with an authorized target preview
    description: The notification is selected by both id and the authenticated recipient. Foreign, missing, or invalid ids return the same 404 response. Target previews are omitted when the current content is unavailable or no longer visible.
    operationId: getNotificationDetail
    security: [{cookieAuth: []}]
    parameters:
    - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    responses:
      '200': {description: Recipient-owned notification detail, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseNotificationDetail"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '404': {$ref: "../components/responses.yaml#/NotFound"}
notificationUnreadCount:
  get:
    summary: Get the current user's unread notification count
    operationId: notificationUnreadCount
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Unread count, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseUnreadCount"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
notificationRead:
  patch:
    summary: Mark one current-user notification as read
    operationId: markNotificationRead
    security: [{cookieAuth: []}]
    parameters:
    - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    responses:
      '200': {description: Marked read}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '404': {$ref: "../components/responses.yaml#/NotFound"}
notificationsReadAll:
  post:
    summary: Mark all current-user notifications as read
    operationId: markAllNotificationsRead
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Updated count}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
notificationPreferences:
  get:
    summary: Get the current user's resolved notification preferences
    operationId: listNotificationPreferences
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Preference catalog, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponsePreferenceCatalog"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
  put:
    summary: Replace the current user's notification overrides
    operationId: replaceNotificationPreferences
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/PreferenceUpdateRequest"}}}
    responses:
      '200': {description: Updated preference catalog, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponsePreferenceCatalog"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '409': {description: The submitted preference revision is stale}
      '422': {description: Invalid or non-configurable preference}
notificationPreferencesRestore:
  post:
    summary: Delete the current user's notification overrides
    operationId: restoreNotificationPreferences
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/PreferenceRevisionRequest"}}}
    responses:
      '200': {description: Restored preference catalog, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponsePreferenceCatalog"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '409': {description: The submitted preference revision is stale}
      '422': {description: Invalid preference revision}
notificationStream:
  get:
    summary: Stream current-recipient notification revision signals
    description: Host-owned, non-replaceable SSE. Durable revisions remain authoritative and no notification payload is sent.
    operationId: streamNotificationRevisions
    security: [{cookieAuth: []}]
    parameters:
    - {in: header, name: Last-Event-ID, schema: {type: integer, format: int64, minimum: 0}}
    - {in: query, name: revision, schema: {type: integer, format: int64, minimum: 0}}
    responses:
      '200':
        description: SSE revision and heartbeat stream.
        headers:
          Cache-Control: {schema: {type: string}, description: Always no-store, no-transform.}
        content:
          text/event-stream: {schema: {type: string}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '429': {description: Recipient or process SSE connection limit reached.}
notificationCelebrations:
  get:
    summary: List the current recipient's pending badge celebrations
    description: |
      Celebration presentation layer over notifications the recipient already has: a badge
      grant still writes a `badge_granted` row, and this endpoint only decides which of those
      rows deserve a celebration card. Which types qualify is the type descriptor's
      `presentation.celebration` flag (Core declares its own, extensions declare theirs), so
      `type` is not a closed set. Reads the same rows as the inbox, so turning off the in-app
      channel removes the celebrations too.

      First visit returns `initialized: false` with an empty `items` and a seed `cursorId`
      (the recipient's current max notification id); acknowledge that cursor before pulling,
      otherwise an existing account would replay months of badges. Afterwards `items` is a
      subset of `total`: entries whose target is no longer visible are dropped whole, so an
      empty `items` means "render nothing" even when `total` is non-zero. Items are ordered by
      id ascending and capped at 3. Only celebrations from the last 7 days qualify.

      Response is `Cache-Control: private, no-store` — it says what this account received.
    operationId: listCelebrations
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Celebration feed, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseCelebrationFeed"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '503':
        description: Celebration store is not wired (`data.reason` is `notification.channel_unavailable`). A missing capability answers 503 instead of an empty feed, so "feature disabled" and "query failed" stay distinguishable.
        content: {application/json: {schema: {$ref: "../schemas/common.yaml#/ApiErrorResponse"}}}
notificationCelebrationsSeen:
  post:
    summary: Advance the current recipient's celebration cursor
    description: |
      Monotonic cursor acknowledgement, not a read/unread flag: the stored value is
      `GREATEST(stored, submitted)`, so out-of-order acknowledgements never replay a card the
      recipient already saw. Negative values are clamped to 0 rather than rejected — the value
      is client-local state, and clamping to 0 is equivalent to "nothing seen yet".

      Body that is not valid JSON, or whose `cursorId` is not an integer, is `422` reason
      `notification.celebration_invalid`. Response is `Cache-Control: private, no-store`.
    operationId: acknowledgeCelebrations
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/CelebrationAckRequest"}}}
    responses:
      '200': {description: Stored cursor, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseCelebrationAck"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '422':
        description: Body is not valid JSON or `cursorId` is not an integer (`data.reason` is `notification.celebration_invalid`).
        content: {application/json: {schema: {$ref: "../schemas/common.yaml#/ApiErrorResponse"}}}
      '503':
        description: Celebration store is not wired (`data.reason` is `notification.channel_unavailable`).
        content: {application/json: {schema: {$ref: "../schemas/common.yaml#/ApiErrorResponse"}}}
adminNotificationPolicyV2:
  get:
    summary: Read the versioned notification type/channel policy catalog
    description: Requires settings.notifications.manage (or settings.manage compatibility inheritance).
    operationId: listAdminNotificationPolicy
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Policy catalog, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseAdminPolicyCatalog"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
  put:
    summary: Replace configurable notification policy rows using CAS
    operationId: replaceAdminNotificationPolicy
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/AdminPolicyUpdateRequest"}}}
    responses:
      '200': {description: Updated policy catalog, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseAdminPolicyCatalog"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '409': {description: The submitted policy revision is stale.}
      '422': {description: Invalid, required, inactive, or unavailable policy row.}
adminNotificationPolicyRestoreV2:
  post:
    summary: Restore Host notification recommendations while preserving provider secrets
    operationId: restoreAdminNotificationPolicy
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/PreferenceRevisionRequest"}}}
    responses:
      '200': {description: Restored policy catalog, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseAdminPolicyCatalog"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '409': {description: The submitted policy revision is stale.}
      '422': {description: Invalid policy revision.}
adminNotificationTest:
  post:
    summary: Create an in-app test notification for the current administrator
    operationId: createAdminTestNotification
    description: Requires settings.notifications.manage. The recipient is always the current actor and no email projection is created.
    security: [{cookieAuth: []}]
    responses:
      '201': {description: Test notification created, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseNotification"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
adminNotificationChannels:
  get:
    summary: Inspect notification channel candidates, selection, and health
    operationId: listAdminNotificationChannels
    description: Requires settings.notifications.manage. Provider secrets are never returned.
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Redacted channel provider catalog}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
adminNotificationChannelSelection:
  put:
    summary: Select an exact notification channel provider
    operationId: selectAdminNotificationChannel
    security: [{cookieAuth: []}]
    parameters:
    - {in: path, name: channel, required: true, schema: {type: string, enum: [web_push]}}
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ChannelSelectionRequest"}}}
    responses:
      '200': {description: Exact-artifact provider selection}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '409': {description: Selection revision or exact artifact changed}
      '422': {description: Invalid channel selection}
adminNotificationChannelReset:
  post:
    summary: Reset a notification channel provider selection
    operationId: resetAdminNotificationChannel
    security: [{cookieAuth: []}]
    parameters:
    - {in: path, name: channel, required: true, schema: {type: string, enum: [web_push]}}
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ChannelResetRequest"}}}
    responses:
      '200': {description: Selection reset; provider secrets preserved}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '409': {description: Selection revision changed}
      '422': {description: Invalid reset request}
adminNotificationChannelTest:
  post:
    summary: Queue a channel test for the current administrator
    operationId: testAdminNotificationChannel
    description: The recipient is always the authenticated administrator; no target user id is accepted.
    security: [{cookieAuth: []}]
    parameters:
    - {in: path, name: channel, required: true, schema: {type: string, enum: [web_push]}}
    responses:
      '202': {description: Generic channel delivery queued}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
adminNotificationDeliveries:
  get:
    summary: List redacted generic notification channel delivery health
    operationId: listAdminNotificationDeliveries
    security: [{cookieAuth: []}]
    parameters:
    - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    responses:
      '200': {description: Delivery health, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseChannelDeliveries"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
webPushConfig:
  get:
    summary: Get current Web Push availability and public VAPID material
    operationId: getWebPushConfig
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Host worker scope and public provider configuration, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseWebPushConfig"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
webPushSubscriptions:
  get:
    summary: List the current user's active browser subscriptions
    operationId: listWebPushSubscriptions
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Own active redacted subscriptions, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponseWebPushSubscriptions"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
  post:
    summary: Associate an authenticated browser subscription with the current user
    operationId: createWebPushSubscription
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/WebPushSubscriptionRequest"}}}
    responses:
      '201': {description: Own redacted subscription}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '422': {description: Invalid or already-owned-by-another-recipient subscription}
webPushSubscriptionByID:
  delete:
    summary: Revoke one current-user browser subscription
    operationId: revokeWebPushSubscription
    security: [{cookieAuth: []}]
    parameters:
    - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    responses:
      '200': {description: Subscription revoked}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '404': {$ref: "../components/responses.yaml#/NotFound"}

pushDevices:
  get:
    summary: List the current user's registered native push devices
    operationId: listPushDevices
    description: |
      原生推送设备注册（App / 桌面端）。Core 只拥有「设备令牌 ↔ 用户 ↔ App 实例」的
      归属与生命周期，实际投递（FCM/APNs）由通知通道 provider 插件完成。
      令牌永不进入响应；`includeRevoked=true` 时包含已撤销设备。
    security: [{cookieAuth: []}, {bearerAuth: []}]
    parameters:
    - name: includeRevoked
      in: query
      required: false
      schema: {type: boolean}
      description: Include revoked devices for the current account.
    responses:
      '200': {description: Own redacted devices, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponsePushDevices"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
  post:
    summary: Register or refresh a native push device token
    operationId: registerPushDevice
    description: |
      幂等注册：同一 (platform, token) 只保留一条记录，重复注册会刷新 last_seen 并把归属
      改绑到当前账号（换账号登录、令牌轮换、卸载重装都走这条路径）；同一 deviceId 的旧
      令牌行会被自动撤销。409 不存在：并发注册以最后一次为准。
    security: [{cookieAuth: []}, {bearerAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/PushDeviceRegisterRequest"}}}
    responses:
      '200': {description: Registered device (redacted), content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponsePushDevice"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '422': {description: "Invalid payload or unsupported platform (notification.push_device_invalid / notification.push_device_platform_unsupported / notification.push_device_token_too_long)"}
pushDeviceByDeviceID:
  delete:
    summary: Revoke one native push device of the current user
    operationId: revokePushDevice
    description: |
      按客户端已知的稳定 `deviceId` 撤销。不存在或不属于当前账号统一返回 404，
      避免暴露设备归属。
    security: [{cookieAuth: []}, {bearerAuth: []}]
    parameters:
    - name: deviceId
      in: path
      required: true
      schema: {type: string}
      description: Client-generated stable install id used at registration.
    responses:
      '200': {description: Device revoked, content: {application/json: {schema: {$ref: "../schemas/notifications.yaml#/ApiResponsePushDeviceRevoked"}}}}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '404': {description: "Unknown device or another account's device (notification.push_device_not_found)"}
