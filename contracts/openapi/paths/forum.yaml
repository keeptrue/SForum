      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }
commentRevisionRedact:
  post:
    summary: Permanently redact a non-current comment revision payload
    operationId: redactCommentRevision
    description: Requires `super_admin`. Redaction is irreversible and leaves only the revision header and tombstone state.
    security:
    - cookieAuth: []
    - bearerAuth: []
    parameters:
    - "$ref": "../components/parameters.yaml#/CommentID"
    - name: revisionNo
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/forum.yaml#/RedactRevisionRequest" }
    responses:
      '200':
        description: Revision payload redacted.
        content:
          application/json:
            schema: { "$ref": "../schemas/forum.yaml#/RevisionRedactionResult" }
      '401': { "$ref": "../components/responses.yaml#/Unauthorized" }
      '403': { "$ref": "../components/responses.yaml#/Forbidden" }
      '404': { "$ref": "../components/responses.yaml#/NotFound" }
      '409': { "$ref": "../components/responses.yaml#/Conflict" }
      '422': { "$ref": "../components/responses.yaml#/UnprocessableEntity" }

commentByID:
