        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        description: Search provider admin is unavailable.
adminForumSearchProviderReset:
  post:
    summary: Clear search.provider pin and restore site search default
    description: |
      清除显式 pin，解析回落受保护内置站内搜索。需 search.manage 权限。
    operationId: adminResetSearchProvider
    responses:
      '200':
        description: Provider pin cleared.
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '503':
        description: Search provider admin is unavailable.
adminForumSearchReindex:
  post:
    summary: Trigger a full search index rebuild
    description: |
      扫描所有可公开索引的主题，批量入队 search.index_topic job 重建搜索引擎索引。
      同一时刻只允许一个 running run，并发触发返回 409。需 search.manage 权限。
    operationId: adminReindexSearch
    responses:
      '200':
        description: 重建已触发，返回本次 run 记录。
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseReindexRun"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        description: 已有重建正在进行。
      '503':
        description: 搜索服务不可用。
  get:
    summary: Get current rebuild status
    description: 返回最近一次重建的实时进度（含已处理/剩余/百分比）。需 search.manage 权限。
    operationId: adminReindexSearchStatus
    responses:
      '200':
        description: 当前重建进度。
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseReindexStatus"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        description: 尚无重建记录。
      '503':
        description: 搜索服务不可用。
adminForumSearchReindexRuns:
  get:
    summary: List rebuild run history
    description: 返回最近的重建运行记录（默认 20 条）。需 search.manage 权限。
    operationId: adminListReindexRuns
    responses:
      '200':
