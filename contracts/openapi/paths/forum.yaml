    description: |
      Public read model for topic body contributors (author create/edit/restore
      actors). Same guest-read policy as getTopic. Returns newest-first header
      events only: actor, operation, origin, changedFields, committedAt.
      Never includes raw source, preview, diffs, or edit reason. Staff editors
      are fully exposed by default (privacy toggle deferred).
