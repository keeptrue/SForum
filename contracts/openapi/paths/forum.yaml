topicComments:
  get:
    summary: List topic comments
    operationId: listTopicComments
    description: |
      view=tree pages roots and loads at most forum.comments.tree_descendants_per_root
      descendants per root (default 50). Truncated roots set hasMoreChildren; load more
      via listCommentReplies. Public list responses may be short-TTL Redis cached.

      **排序：** view=flat 是时间流，按 `created_at ASC, id ASC` 返回；新评论恒在列表末尾
      （最底楼），既有评论的位置不因他人回复而改变，回复关系由每行的 `replyTo` 引用表达。
      view=tree 仍按 `path_key` 返回父子结构。

      **分页（M5）：** view=flat 支持 keyset `after`（created_at + id）。
      **优先级：非空 `after` 优先于 `page`。** 响应含 `hasMore` / `nextCursor`。
      view=tree 根分页仍可用 page；cursor 主要用于 flat 深翻。
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    - name: view
      in: query
      schema:
        type: string
        enum:
        - tree
        - flat
        default: tree
    - name: page
      in: query
      description: |
        Page number (OFFSET). Deep pages beyond the maximum are clamped.
        Ignored when `after` is non-empty (cursor precedence).
      schema:
        type: integer
        minimum: 1
        maximum: 200
    - name: after
      in: query
      description: |
        Forward keyset cursor for view=flat (opaque; created_at + id of the last row).
        Prefer for deep scroll. Invalid cursor → 400 forum.cursor_invalid.
      schema:
        type: string
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Topic comments as a desktop tree or mobile-friendly flat list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseCommentList"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
  post:
    summary: Create a topic comment
    operationId: createTopicComment
    description: |
      评论正文附件同样为多值型：附件不可用返回 422 `forum.attachment_unavailable`
      （`data.fields.content` 携带 reason）；引用写入唯一约束冲突返回 409
      `forum.attachment_conflict`。
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/forum.yaml#/CreateCommentRequest"
    responses:
      '201':
        description: Comment created with shared post content.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseComment"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '429':
        "$ref": "../components/responses.yaml#/TooManyRequests"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
topicCommentPage:
  get:
    summary: Resolve the comment page for an anchor link
    operationId: resolveTopicCommentPage
    description: |
      返回 commentID 在 flat 视图分页下所属的页码与每页大小。
      供帖子详情页带 #comment-{id} 锚点进入时，SSR 阶段确定应加载哪一页，
      实现跨页评论精确定位（零闪屏：首屏 HTML 直接渲染目标页）。

      仅 active 评论可解析。软删/非 active、不属于该 topic、或主题隐藏/删除时
      统一返回 404，不泄漏评论存在性与状态。
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    - "$ref": "../components/parameters.yaml#/CommentID"
    responses:
      '200':
        description: 目标评论所在的分页页码与每页大小。
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseCommentPage"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
commentReplies:
  get:
    summary: List direct replies for a comment
    operationId: listCommentReplies
    parameters:
    - "$ref": "../components/parameters.yaml#/CommentID"
    responses:
      '200':
        description: Direct active replies.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseCommentArray"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
commentCitations:
  get:
    summary: List an AI reply's activity (citations and tool calls)
    operationId: listCommentCitations
    description: |
      返回一条评论作为 AI 产物时留下的活动记录：引用的站内楼层（`items`）与调用
      过的工具（`toolCalls`）。两者都由 AI 回复生成器在**发布成功之后**写入，
      因此只有 AI 产出的评论会有非空结果。

      路径名保留 `citations`（已发布的契约），载荷因此是「依据 + 工具调用」两个
      分区：它们在读者眼里是同一个问题（这条回答依据了什么、做了什么），而且
      合并成一个请求，避免一页评论发出两倍请求。

      可见性与评论回复列表完全一致：评论存在且其所属主题对访客公开可见。
      不可见时返回 404，且不区分「不存在」与「不可见」——否则 commentID 枚举
      会成为探测隐藏主题的手段。

      **零结果返回空数组而不是 404**：一条普通评论没有任何依据、也没有调用过
      工具，是正常结论。

      每条引用的 `excerpt` 取自被引用楼层的正文（不是模型生成的引文）。
      `toolCalls` 只包含**公开可投影**的调用：四种「模型撞到配置」的结局
      （`unknown_tool` / `not_allowed` / `step_exhausted` /
      `result_budget_exhausted`）已被服务端过滤，工具返回给模型的正文片段
      （`resultDigest`）**不对外暴露**。零工具调用时该字段整体省略。
    parameters:
    - "$ref": "../components/parameters.yaml#/CommentID"
    responses:
      '200':
        description: 该评论的 AI 活动记录，两个分区各自保持生成时的顺序。
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseCommentCitationList"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
commentRevisions:
  get:
    summary: List comment revision summaries
    operationId: listCommentRevisions
    description: |
      Requires `post.revision.view_any`. Returns newest-first comment revision
      summaries for authorized staff only. The list payload never includes raw
      source. Unauthorized callers are rejected before the store lookup.
    security:
    - cookieAuth: []
    - bearerAuth: []
    parameters:
    - "$ref": "../components/parameters.yaml#/CommentID"
    - name: after
      in: query
      schema:
        type: string
      description: Opaque revision cursor from `nextCursor`.
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: Keyset-paged comment revision summaries without raw source.
        content:
