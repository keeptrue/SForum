commentEditSource:
  get:
    summary: Get the current editable comment source
    operationId: getCommentEditSource
    description: |
      Returns canonical source only after authoritative post.edit_own/post.edit_any,
      owning-resource state, and author edit-window checks. Permission denials and
      hidden or deleted resources return a non-enumerating 404. This response is
      never served from public comment caches.
    security:
    - cookieAuth: []
    - bearerAuth: []
    parameters:
    - "$ref": "../components/parameters.yaml#/CommentID"
    responses:
      '200':
        description: Authorized current comment source and revision token.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseEditableContentSource"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
authorContentReview:
  get:
    summary: List the current author's pending and rejected content
    operationId: listAuthorContentReview
    security:
    - cookieAuth: []
    responses:
