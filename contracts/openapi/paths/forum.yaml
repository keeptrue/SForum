composerToolbar:
  get:
    summary: List composer toolbar extension actions
    description: >
      Requires authentication. Returns host-rendered toolbar descriptors from
      enabled plugins declaring forum.composer.toolbar (F4.3). Execution still
      goes through the extension route proxy.
    operationId: listComposerToolbarActions
    security:
    - cookieAuth: []
    - bearerAuth: []
    responses:
      '200':
        description: Composer toolbar actions.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseComposerToolbarActionList"
      '401':
        description: Authentication required.
composerReferences:
  get:
    summary: Search public-safe reference options for the composer
    description: >
      Requires an active authenticated user. Returns only a bounded public-safe
      label projection. Users must be active; topics and comments must belong to
      active or locked topics in public category groups; categories and their
      groups must be public. This endpoint does not expose plugin Query Registry
      projections or delegation credentials.
    operationId: listComposerReferenceOptions
    security:
    - cookieAuth: []
    - bearerAuth: []
    parameters:
    - name: kind
      in: query
      required: true
      schema:
        type: string
        enum: [user, topic, comment, category]
    - name: query
      in: query
      schema:
        type: string
        maxLength: 80
    - name: selectedId
      in: query
      description: Optional currently selected public resource to prioritize when re-editing.
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 12
    responses:
      '200':
        description: Bounded public-safe reference options.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseReferenceOptionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
search:
  get:
    summary: Search topics by keyword (search.provider engine)
    description: |
      主题全文检索（search.provider；默认受保护站内搜索 PostgreSQL FTS + CJK n-gram + pg_trgm），
      支持中文分词、标题/摘要模糊匹配以及 categorySlug/tagSlug 过滤。
      仅返回 active/locked 公开主题。关键词检索已从 GET /topics 迁移至此端点，
      以避免 PostgreSQL ILIKE 在千万级数据下的全表扫描。可选 Meilisearch 等外部引擎需安装插件并切换槽位。
    operationId: searchTopics
    parameters:
    - name: query
      in: query
      required: true
      description: 搜索关键词。默认站内引擎支持中英文全文检索、中文 n-gram 分词和轻微错字容忍。
      schema:
        type: string
    - name: page
      in: query
      description: 页码，最大 200。
      schema:
        type: integer
        minimum: 1
        maximum: 200
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: categorySlug
      in: query
      schema:
        type: string
    - "$ref": "../components/parameters.yaml#/TagSlug"
    responses:
      '200':
        description: 关键词检索结果。
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseSearchOutput"
      '503':
        description: 搜索服务不可用（选中的外部引擎不可达等）。默认站内引擎通常可用。
topics:
  get:
    summary: List public topics
    operationId: listTopics
    description: |
      公开主题列表（分页）。`total` 遵循 D1：分类/标签用冗余计数（可短暂陈旧）；
      首页与多过滤为近似值，见 TopicList.total / totalApproximate。
      关键词请用 GET /api/v1/search；非空 `query` 返回 400 forum.use_search_endpoint。
      默认排序 active 在分类过滤下可走 topics_category_activity_idx；列表不 join 完整正文。

      **分页（M5）：** 支持浅层 `page`（1–200，OFFSET）与 keyset `after`（opaque cursor）。
      **优先级：非空 `after` 优先于 `page`（page 被忽略）。** 深翻页 / infinite scroll 应使用
      `after` + 响应 `hasMore` / `nextCursor`，避免大 OFFSET。置顶参与 keyset 第一排序维
      （`is_pinned DESC`，再 sort 列，再 id），算法稳定可测。
    parameters:
    - name: page
      in: query
      description: |
        页码，最大 200（OFFSET 模式）。超过上限 clamp 到 200。
        当 `after` 非空时忽略本参数（cursor 优先）。
      schema:
        type: integer
        minimum: 1
        maximum: 200
    - name: after
      in: query
      description: |
        向前 keyset 游标（opaque）。非空时进入 cursor 模式并忽略 `page`。
        取自上一页响应的 `nextCursor`。非法游标返回 400 forum.cursor_invalid。
      schema:
        type: string
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: categorySlug
      in: query
      schema:
        type: string
    - "$ref": "../components/parameters.yaml#/TagSlug"
    - name: query
      in: query
      description: 已废弃。关键词检索请改用 GET /api/v1/search；topics 列表不再支持关键词过滤。
      schema:
        type: string
    - name: sort
      in: query
      description: |
        latest | active | hot；空则站点默认。
        hot 使用 topics.hot_score 列（comment_count*5+view_count，写路径/刷盘维护）与 hot 索引。
        游标与 sort 绑定：换 sort 后不得复用旧 nextCursor。
      schema:
        type: string
        enum: [latest, active, hot]
    responses:
      '200':
        description: |
          Paged public topic list. `data.total` may be denormalized/stale (category/tag)
          or approximate (home / multi-filter); see `data.totalApproximate`.
          Public feeds always include `hasMore`; when true, `nextCursor` continues via `after`.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseTopicList"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
  post:
    summary: Create a topic
    operationId: createTopic
    description: |
      正文附件引用为多值型（一条内容可绑定多张图）。提交的 `attachmentIds` 中任一附件
      不可用（已删除/已禁用/已转私有/非本人上传且未被该内容引用）返回 422
      `forum.attachment_unavailable`，`data.fields.content` 携带 reason；附件引用写入
      撞上唯一约束返回 409 `forum.attachment_conflict`（schema 漂移兜底，正常不应出现）。
    parameters:
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/forum.yaml#/CreateTopicRequest"
    responses:
      '201':
        description: Topic created with shared post content.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseTopicDetail"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '429':
        "$ref": "../components/responses.yaml#/TooManyRequests"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
