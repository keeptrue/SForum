    operationId: updateComment
    description: |
      与评论创建一致：更新后的正文附件不可用返回 422 `forum.attachment_unavailable`
      （`data.fields.content` 携带 reason）；引用写入唯一约束冲突返回 409
      `forum.attachment_conflict`。
