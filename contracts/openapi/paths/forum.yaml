        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseReindexRunList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
topicByID:
  get:
    summary: Get public topic detail
    operationId: getTopic
    description: |
      公开主题详情。成功响应后服务端按 D3 记录一次浏览：匿名/登录均计；
      同一访客键（登录用户 id / 会话 sid / IP+UA 哈希）对同一主题 30 分钟内去重；
      Redis INCR 增量 + 周期 River 刷盘，**禁止**每请求 `UPDATE topics.view_count`。
      Redis 不可用时跳过计数，仍返回 200。列表/搜索/sitemap/管理端不计。
      无公开 `POST /view`；客户端一次导航应只请求一次详情。
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    responses:
      '200':
        description: Public topic detail with shared post content. viewCount may lag flush.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseTopicDetail"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
  patch:
    summary: Update a topic's title, category, tags, or content
    operationId: updateTopic
    description: |
      与创建一致：更新后的正文附件不可用返回 422 `forum.attachment_unavailable`
      （`data.fields.content` 携带 reason）；引用写入唯一约束冲突返回 409
      `forum.attachment_conflict`。
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/forum.yaml#/UpdateTopicRequest"
    responses:
      '200':
        description: Topic updated. Prior content is stored in post_revisions.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseTopicDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
  delete:
    summary: Soft-delete a topic
    operationId: deleteTopic
    parameters:
    - "$ref": "../components/parameters.yaml#/TopicID"
    responses:
      '200':
        description: Topic soft-deleted.
        content:
          application/json:
            schema:
              "$ref": "../schemas/forum.yaml#/ApiResponseTopicDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
topicEditSource:
  get:
    summary: Get the current editable topic source
    operationId: getTopicEditSource
    description: |
      Returns canonical source only after authoritative topic.edit_own/topic.edit_any,
