    summary: Bookmark a comment as the authenticated member
    description: >
      Same semantics as `PUT /topics/{topicID}/bookmark`: idempotent, optional
      visibility and reminder time, `403 forum.bookmarks_disabled` when the
      feature flag is off, `404 forum.bookmark_target_invalid` when the comment
      or its topic is not publicly visible.
    operationId: bookmarkComment
    parameters:
