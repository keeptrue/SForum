    summary: Restore a comment revision as a new accepted version
    operationId: restoreCommentRevision
    description: Requires both `post.revision.view_any` and `post.edit_any`. Restore appends a new revision and preserves comment lifecycle state.
    security:
    - cookieAuth: []
    - bearerAuth: []
    parameters:
    - "$ref": "../components/parameters.yaml#/CommentID"
    - name: revisionNo
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    requestBody:
      required: true
      content:
        application/json:
          schema: { "$ref": "../schemas/forum.yaml#/RestoreRevisionRequest" }
    responses:
