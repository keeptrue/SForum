profileByUsername:
  get:
    summary: Read a public member profile
    operationId: getPublicProfile
    parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
      description: Member username.
    responses:
      '200':
        description: Public profile with stats and recent topics.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponsePublicProfile"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
profileActivitiesByUsername:
  get:
    summary: List public profile activities
    operationId: listPublicProfileActivities
    description: |
      Paginated public topic or comment activity for a member profile page.
      Uses shallow `page` / `perPage` OFFSET pagination. Kind filters the
      timeline tab: `topic` (default) or `comment`.
    parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
      description: Member username.
    - name: kind
      in: query
      required: false
      schema:
        type: string
        enum: [topic, comment]
        default: topic
      description: Activity kind for the profile tab.
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 1
    - name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    responses:
      '200':
        description: Paginated public activities.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponseActivityPage"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
profileBookmarksByUsername:
  get:
    summary: List a member's bookmarks
    operationId: listProfileBookmarks
    description: |
      Paginated bookmark list for a member profile page, using shallow `page` /
      `perPage` OFFSET pagination. Other viewers only receive `visibility:
      public` rows; the member's own request (authenticated viewer matching the
      profile) also receives private rows. Responses for the owner are
      `Cache-Control: private, no-store`; public views are short-cached and
      `Vary: Cookie`.
    parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
      description: Member username.
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 1
    - name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    responses:
      '200':
        description: Paginated bookmark list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponseProfileBookmarkPage"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
myBookmarks:
  get:
    summary: List the current user's bookmarks
    operationId: listMyBookmarks
    description: |
      The authenticated member's own bookmark list, including private rows.
      Always `Cache-Control: private, no-store`. Answers `403
      forum.bookmarks_disabled` when the site feature flag `features.bookmarks`
      is off.
    parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 1
    - name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    responses:
      '200':
        description: Paginated bookmark list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponseProfileBookmarkPage"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
myProfile:
  get:
    summary: Read the current user's editable profile
    operationId: getMyProfile
    responses:
      '200':
        description: Current user profile.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponsePublicProfile"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
  put:
    summary: Update the current user's editable profile
    operationId: updateMyProfile
    description: |
      Omitted fields are left unchanged. `displayName` is the nickname: an
      empty string falls back to the username. A successful update returns the
      same `PublicProfile` shape as `GET /profile`, including the recomputed
      `nickname` state.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/profile.yaml#/UpdateProfileRequest"
    responses:
      '200':
        description: Updated profile.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponsePublicProfile"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
profileNicknameAvailability:
  get:
    summary: Preview a nickname change
    operationId: getNicknameAvailability
    description: |
      Read-only preflight for the current user. Nicknames are not unique, so
      `duplicates` is a warning rather than a rejection; `conflict` is the only
      reason the value cannot be saved. Cooldown and the site switch are
      enforced on write, not here.
    parameters:
    - name: value
      in: query
      required: false
      schema:
        type: string
      description: Nickname draft to check. Empty means "show my username".
    responses:
      '200':
        description: Preflight result.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponseNicknameAvailability"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
myProfileAvatar:
  post:
    summary: Upload and set the current user's avatar
    operationId: uploadMyProfileAvatar
    description: Requires authentication, attachment.upload permission, and avatar.allow_upload enabled.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '200':
        description: Profile after the uploaded public avatar is attached.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponseProfile"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
  delete:
    summary: Remove the current user's uploaded avatar
    operationId: deleteMyProfileAvatar
    description: Clears the profile avatar attachment and falls back to the configured default provider.
    responses:
      '200':
        description: Profile after avatar removal.
        content:
          application/json:
            schema:
              "$ref": "../schemas/profile.yaml#/ApiResponseProfile"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
