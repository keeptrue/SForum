trustLevels:
  get:
    summary: List trust level definitions and viewer progress
    operationId: listTrustLevels
    description: |
      公开等级目录：**TL0 + 当前启用的每个档位**（`level` = rank、`levelSlug` = 稳定身份 id、
      `displayName`/`icon` 为运营可改的展示字段）与每档 `requirements`（snake_case 指标名），
      外加 `newUserDays`（「最多当多久新成员」的上限闸）。

      **不包含 `limits`**：限流参数（冷却秒数、日限额）只在后台读面出现。公开它等于
      把「系统怎么限制你」交给想绕过它的人——与不公开给赞/收藏数是同一类判断。

      `viewer` 字段**只对本人**返回（等级 + 下一档 + 瓶颈指标）。他人视角只有
      `level` / `levelSlug`：`like_given_count` 与 `bookmark_count` 是刻意不公开的
      计数，不得出现在任何他人视角的响应里。

      `features.trust_levels` 关闭时本端点返回 **404**（本刀之前它不存在）。
    responses:
      '200':
        description: Trust level catalog.
        content:
          application/json:
            schema:
              "$ref": "../schemas/trust_levels.yaml#/ApiResponseTrustLevelCatalog"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
adminTrustLevels:
  get:
    summary: Read the trust level configuration
    operationId: getAdminTrustLevels
    description: |
      后台读面：整份 `trust.levels` 配置（`config` 是 JSON 字符串）、解析后的等级目录、
      可勾选的权限白名单（`eligiblePermissions`）与推荐默认值（`recommendedConfig`）。

      读权限复用 `admin.access`（刻意不造 `trust.view`：可达性依赖 `admin.access`
      的读权限是死权限）。`features.trust_levels` 关闭时返回 404。
    responses:
      '200':
        description: Trust level configuration.
        content:
          application/json:
            schema:
              "$ref": "../schemas/trust_levels.yaml#/ApiResponseTrustLevelAdmin"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
  put:
    summary: Update the trust level configuration
    operationId: updateAdminTrustLevels
    description: |
      请求体的 `config` 就是 `trust.levels` 的 **Config 形状**（v2：`schemaVersion` + `tiers[]`；
      v1 的 `levels[]` 形状仍被接受并在内存里升级），与存储格式完全相同：未知字段被 `DisallowUnknownFields` 拒绝，
      不存在「PUT 的 DTO 比 Config 宽松」的第二个形状。

      `tiers[].limits` 与 `tiers[].earnable` **必须显式出现**（可写 `null` = 全继承 /
      `[]` = 空集，但不能省略）：省略即 422。这条由 `DecodeConfig` 的原始 JSON 判定强制——
      字段类型是 `json.RawMessage`，省略时 `len(raw) == 0` 直接返回 `ErrInvalidConfig`，
      `null` 则被解释成「全继承 / 空集」；不是靠指针 nil 区分。
      写权限 `trust.manage`。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/trust_levels.yaml#/TrustLevelConfigInput"
    responses:
      '200':
        description: Updated configuration (same shape as the admin read).
        content:
          application/json:
            schema:
              "$ref": "../schemas/trust_levels.yaml#/ApiResponseTrustLevelAdmin"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        description: |
          配置不合法。`data.reason` 恒为 `trust_levels.invalid_config`（机器码稳定，
          前端按它分流，不随档位变化），`data.details.errors` 给出字段级明细
          （最多 8 条）：哪一档（`rank`/`tierId`）、哪个字段（`field`）、为什么（`reason`）。
        content:
          application/json:
            schema:
              "$ref": "../schemas/trust_levels.yaml#/TrustLevelConfigValidationError"
adminTrustLevelsRestoreDefaults:
  post:
    summary: Restore recommended trust level defaults
    operationId: restoreAdminTrustLevelDefaults
    description: |
      写回内置推荐值（阈值、分档限额全继承、earnable 空集）。**不影响用户已获得的
      内容**，也不改变任何用户的当前等级——等级是派生值，下一次请求即按新阈值计算。
      本端点只写配置项：默认安装下 TL0 的基线扣除是装载期代码常量，不属于可恢复配置，
      不受本端点影响。

      **删除墓碑（`deletedTierIds`）会保留**：恢复默认是整份覆盖，但被删掉的
      `tier_<n>` id 会带进新配置，因此 `nextTierSeq` 不会回落、id 永不复用
      （内置四档 id 不必留墓碑：`nextTierSeq` 的基准已覆盖它们）。
      写权限 `trust.manage`；`features.trust_levels` 关闭时返回 404。
    responses:
      '200':
        description: Restored configuration (same shape as the admin read).
        content:
          application/json:
            schema:
              "$ref": "../schemas/trust_levels.yaml#/ApiResponseTrustLevelAdmin"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"

adminTrustLevelConditions:
  get:
    summary: List the conditions available to trust level rules
    operationId: listAdminTrustLevelConditions
    description: |
      规则编辑器的条件目录：**信任等级可用**的条件子集、插件事实候选与对象候选。

      子集 = 共享条件目录（徽章与等级同一份实现、同 key、同 SQL 口径）排除内容质量
      两条 `content.pinned` / `content.hidden`：它们量的是「内容被管理员怎么处理过」，
      属审核信号。把它当等级门槛等于「被置顶过才配升级」，负向使用
      （`not hidden`）更会把一次审核变成长期身份差异。

      **本端点不写库、不入队、不发事件**，读权限是 `admin.access`（与本域其它读面
      一致；不造 `trust.view`）。`features.trust_levels` 关闭时返回 404。

      `refCandidates` 恒为五组、固定顺序 `badge → category → tag → role → provider`；
      取不到候选时该组 `unavailable: true`（与「候选为空」是两件事）。
    responses:
      '200':
        description: Condition catalog for the rule editor.
        content:
          application/json:
            schema:
              "$ref": "../schemas/trust_levels.yaml#/ApiResponseTrustLevelConditionCatalog"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"

adminTrustLevelRuleImpact:
  post:
    summary: Estimate how many users a draft tier rule would affect
    operationId: estimateAdminTrustLevelRuleImpact
    description: |
      保存前的**影响面估算**（D8）。请求带**草稿**档位（含尚未保存的新档），响应逐档给
      `estimated` / `method` / `partial` / `unsupportedConditions`。

      口径（与徽章同一实现）：数值快筛折成 `activity.count`（累计 `gte`）叶子，与规则树
      **AND** 后一起估算；AND 取最严叶子、OR 取和、NOT 取补。叶子之间通常相关，所以
      这些数都是**上界**——`method` 存在的唯一目的就是让前端能如实说「≈ N 人」。

      `estimated: null` 与 `partial: true` 是两件事：前者是**算不出来**（OR/NOT 里含不可估
      条件，或草稿规则解不开），后者是算出来了但只用了部分条件。

      **聚合 SQL，不逐用户跑引擎**：估算发生在运营点开弹窗的那一刻，逐用户求值会把一个
      只读接口变成全表扫描。本端点不写库、不入队。

      写权限是 `trust.manage`（不是 `admin.access`）：能读策略不等于需要知道「改这一档会
      影响全站多少人」。`features.trust_levels` 关闭时返回 404。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/trust_levels.yaml#/TrustLevelRuleImpactRequest"
    responses:
      '200':
        description: Per-tier estimate.
        content:
          application/json:
            schema:
              "$ref": "../schemas/trust_levels.yaml#/ApiResponseTrustLevelRuleImpactResponse"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
