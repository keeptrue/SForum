# Badge and user-activity contract.
#
# Every operation in this file is gated by the `features.badges` feature flag.
# When the flag is off, all of them fail with `403` and reason
# `forum.badges_disabled` — including the read paths, because the whole badge
# product surface is hidden (the user-activity counters are NOT part of this
# flag; they keep collecting and keep rendering on the profile page).
#
# Permission keys: `badge.view` for reads, `badge.manage` for every write.
# Both are enforced in the domain layer (`AdminService` takes an
# `identity.Actor` on every method), not only by the route guard.
# A `badge.view` holder that calls a write endpoint gets `403` with reason
# `permission.denied`, not `forum.badges_disabled`; the two cases are
# distinguished by `data.reason`.
profileBadgesByUsername:
  get:
    summary: List a member's badges grouped by badge group
    operationId: publicProfileBadges
    description: |
      Public badge tab for a member profile. Anonymous access is allowed: the
      response is identical for every viewer because badges are actor-agnostic
      (no `grantedByMe`-style fields).

      Groups are ordered by `position` ascending, then inside a group by tier
      weight `gold > silver > bronze`, then by badge `position` ascending, then
      by `grantedAt` descending.

      Entries are flat (`slug` / `name` / `tier` / `icon` / `position` /
      `earned`) with conditional keys: an earned entry carries `grantedAt` and
      no progress keys; an unearned automatic entry carries `current` and
      `threshold` and no `grantedAt`; an unearned manual entry carries neither.
      `current: 0` is emitted, not omitted.

      Fails with `403` reason `forum.badges_disabled` when `features.badges` is
      off, and `404` reason `forum.badge_not_found` when the username does not
      resolve to an active member.
    parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
      description: Member username.
    responses:
      '200':
        description: Badge groups with earned and in-progress entries.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseProfileBadges"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminBadges:
  get:
    summary: List badge definitions for admin management
    operationId: adminListBadges
    description: |
      Requires `badge.view`. Returns disabled badges too, so operators can
      re-enable or delete them; the public surface filters on `enabled`.

      Each row carries its rule (`grantMode` / `metric` / `threshold`) and the
      number of users currently holding it. Fails with `403` reason
      `forum.badges_disabled` when `features.badges` is off.
    responses:
      '200':
        description: Badge definitions with group and grant counts.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Create a badge definition
    operationId: adminCreateBadge
    description: |
      Requires `badge.manage`. Rule validation is authoritative on the server:

      - `grantMode: automatic` requires `metric` and `threshold > 0`.
      - `grantMode: manual` requires both `metric` and `threshold` to be absent.
      - `tier` must exist in the badge tier table and be enabled. The three
        built-in keys are `gold` / `silver` / `bronze`, but operators can add
        their own — never validate this against a client-side enum.
      - `icon` must start with `i-lucide-` or `i-tabler-`.

      Violations return `422` with one of two reasons, and the distinction is
      deliberate: `forum.badge_rule_mode_conflict` means `grantMode` and `rule`
      contradict each other (`grantMode: manual` with a non-null `rule`), while
      `forum.badge_rule_invalid` means the rule itself is unusable (missing,
      malformed, unknown condition). Fixing the first means changing the grant
      mode or clearing the rule; fixing the second means editing the rule.
      A duplicate slug returns `409` reason `forum.badge_slug_taken`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/badges.yaml#/BadgeCreateInput"
    responses:
      '201':
        description: Badge created.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadge"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
adminBadgeByID:
  patch:
    summary: Update a badge definition
    operationId: adminUpdateBadge
    description: |
      Requires `badge.manage`. Partial update: omitted fields keep their current
      value. Sending a rule change re-validates the whole rule, and a threshold
      change does **not** retroactively grant badges to users already above the
      new threshold — that requires an explicit recompute.

      Disabling a badge keeps existing grants but triggers a `top_badge_id`
      recompute for affected users, so the badge stops rendering next to posts.

      Sending a `rule` together with `grantMode: manual` is a state conflict and
      returns `422` reason `forum.badge_rule_mode_conflict` (not
      `forum.badge_rule_invalid`: the rule may be perfectly valid, the
      combination is not). Declaring `grantMode: automatic` without a rule, or
      with an unusable one, keeps returning `forum.badge_rule_invalid`.
    parameters:
    - "$ref": "../components/parameters.yaml#/BadgeID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/badges.yaml#/BadgeUpdateInput"
    responses:
      '200':
        description: Badge updated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadge"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
  delete:
    summary: Delete a badge definition
    operationId: adminDeleteBadge
    description: |
      Requires `badge.manage`. Deletes the definition and cascades every
      `user_badges` row for it; `users.top_badge_id` is set to NULL by the
      foreign key, then recomputed for affected users.

      Fails with `404` reason `forum.badge_not_found` when the badge is gone.
    parameters:
    - "$ref": "../components/parameters.yaml#/BadgeID"
    responses:
      '200':
        description: Badge deleted.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeDeleteResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
adminBadgeGroups:
  get:
    summary: List badge groups for admin management
    operationId: adminListBadgeGroups
    description: Requires `badge.view`. Groups order the public profile tab by
      `position`.
    responses:
      '200':
        description: Badge groups.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeGroupList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Create a badge group
    operationId: adminCreateBadgeGroup
    description: |
      Requires `badge.manage`. A duplicate `key` returns `409` reason
      `forum.badge_slug_taken` (the group key shares the slug uniqueness rule).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/badges.yaml#/BadgeGroupCreateInput"
    responses:
      '201':
        description: Badge group created.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeGroup"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
adminBadgeGroupByID:
  patch:
    summary: Update a badge group
    operationId: adminUpdateBadgeGroup
    description: |
      Requires `badge.manage`. Partial update, matching the badge PATCH: the
      handler reads the current group and merges only the keys present in the
      body, so `{"position": 3}` alone moves the group without touching its
      name or description. Renaming a group does not touch badges already
      assigned to it.
    parameters:
    - "$ref": "../components/parameters.yaml#/BadgeGroupID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/badges.yaml#/BadgeGroupUpdateInput"
    responses:
      '200':
        description: Badge group updated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeGroup"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
  delete:
    summary: Delete a badge group
    operationId: adminDeleteBadgeGroup
    description: |
      Requires `badge.manage`. Badges in the group are kept: the foreign key is
      `ON DELETE SET NULL`, so they become ungrouped rather than disappearing.
    parameters:
    - "$ref": "../components/parameters.yaml#/BadgeGroupID"
    responses:
      '200':
        description: Badge group deleted.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeDeleteResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
adminBadgeGrants:
  get:
    summary: List grant records for a badge
    operationId: adminListBadgeGrants
    description: |
      Requires `badge.view`. Newest grants first. Records include the actor that
      granted the badge (`grantedBy`) and the free-form `grantReason`; this is
      an admin-only surface and is never exposed on the public profile.
    parameters:
    - "$ref": "../components/parameters.yaml#/BadgeID"
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Row offset; the grants list uses OFFSET pagination.
    - name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    responses:
      '200':
        description: Paginated grant records.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeGrantList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
  post:
    summary: Grant a badge to a user
    operationId: adminCreateBadgeGrant
    description: |
      Requires `badge.manage`. Only `grantMode: manual` badges can be granted by
      hand; an automatic badge returns `422` reason `forum.badge_manual_only`
      because the rule would immediately grant or withhold it again.

      **Not idempotent.** A grant for a user who already holds the badge is an
      error, not a silent no-op: `409` reason `forum.badge_already_granted`
      (the insert is `ON CONFLICT DO NOTHING`, and an empty `RETURNING` is
      reported as a conflict). Clients must treat 409 as "already granted" and
      show it as such rather than retrying.

      A successful grant writes an in-app notification and recomputes the
      recipient's `top_badge_id`; granting a badge to yourself still notifies,
      because badges are public honors rather than interaction noise.
    parameters:
    - "$ref": "../components/parameters.yaml#/BadgeID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/badges.yaml#/BadgeGrantInput"
    responses:
      '200':
        description: Badge granted.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeGrantResult"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
adminBadgeGrantByUser:
  delete:
    summary: Revoke a granted badge from a user
    operationId: adminDeleteBadgeGrant
    description: |
      Requires `badge.manage`. Revoking recomputes the user's `top_badge_id`,
      which may fall back to a lower-tier badge or to NULL.

      **Idempotent, asymmetric with grant.** Revoking a grant that does not
      exist returns `200` with `{"revoked": false}`: the request succeeded, but
      no row was deleted. `revoked` reports the deletion, not the request
      outcome — a client must not show `false` as an error, and must not show
      `true` unless a row really went away. (Contrast with grant, which returns
      `409` when the user already holds the badge.)

      Automatic badges cannot be revoked by hand: `422` reason
      `forum.badge_manual_only`. Disable the rule instead.
    parameters:
    - "$ref": "../components/parameters.yaml#/BadgeID"
    - "$ref": "../components/parameters.yaml#/BadgeGrantUserID"
    responses:
      '200':
        description: Grant revoked.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeRevokeResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
adminBadgesRecompute:
  post:
    summary: Recompute automatic badges for every user
    operationId: adminRecomputeBadges
    description: |
      Requires `badge.manage`. Full sweep in two passes:

      1. back-fill missing automatic grants by matching every user's activity
         row against all enabled automatic rules (one set-based insert, not a
         per-user loop);
      2. repair `top_badge_id` for every user whose stored value is stale.

      This is the only retroactive path. Rule edits — including lowering a
      threshold — deliberately do not grant anything by themselves, so an
      operator who changes a threshold must run this endpoint afterwards.

      Idempotent: an already-correct community returns `granted: 0` and
      `refreshed: 0`. Grants created here are tagged `grantReason: "recompute"`
      with a null `grantedBy`, which distinguishes them from rule-time grants
      and operator grants in the grant records.

      Statistics columns are not repaired by this endpoint; reconciling drifted
      counters is a documented SQL procedure in the badge module note, not an
      API.
    responses:
      '200':
        description: Recompute finished.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeRecomputeResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

publicBadgeCatalog:
  get:
    summary: List the public badge catalog with the viewer's earned marks
    operationId: publicCatalog
    description: |
      Public badge catalog: every **enabled** badge in the site, grouped, with
      `earned` marking whether the current viewer holds it. Anonymous access is
      allowed and every entry is then `earned: false`.

      This is deliberately not the profile badge tab: the profile answers "what
      does this member have", the catalog answers "what exists and which of them
      do I have". Ungranted badges are included — a catalog of only-earned
      badges is a second profile tab.

      Sorting: `badge_groups.position ASC`, then `badges.position ASC`, then
      `badges.id ASC`. The `id` tiebreaker is required: two badges with the same
      `position` must not drift between requests.

      No pagination. The server caps the catalog at **500** badges and reports
      `truncated: true` when there are more; `truncated` is top-level because it
      describes the whole response.

      Field whitelist: `slug` / `name` / `description` / `icon` / `tier` /
      `group` / `earned` (plus top-level `truncated`). `threshold` and `metric`
      are **never** exposed here: thresholds are operator tuning, and publishing
      them cannot be taken back. Operators who want them public write them into
      `description`. The plugin-facing `sforum_core_v1.forum_badges` view does
      expose `threshold`; that is a plugin data surface, not this HTTP surface.

      Cache contract: because `earned` is viewer-scoped, the response carries
      `Cache-Control: private, no-store`. A shared cache must never reuse one
      viewer's response for another.

      Fails with `403` reason `forum.badges_disabled` when `features.badges` is
      off — the same code as every other badge route.
    responses:
      '200':
        description: Badge catalog grouped by badge group.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponsePublicBadgeCatalog"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

# --- Badge tiers (/admin/badges/tiers, /badges/tiers) ---
#
# 等级表把 tier 从「写死枚举」升级为运营数据。读走 `badge.view`、写走 `badge.manage`。
#
# 静态段 `/admin/badges/tiers` 在控制器里注册于 `/:badgeID` 之前：两者形状相同，
# 注册顺序颠倒会让 `DELETE /admin/badges/tiers` 被当成 `DELETE /admin/badges/{badgeID}`
# 解析（badgeID = "tiers" → 0 → 404）。
adminBadgeTiers:
  get:
    summary: List badge tiers
    operationId: adminListBadgeTiers
    description: |
      Requires `badge.view` (not `badge.manage`): the badge editor needs the tier
      dropdown even for read-only operators.

      Returns every tier, including disabled ones, ordered by `position`
      ascending (0 = highest tier). `colorChoices` is the server-side palette
      whitelist and must be rendered as-is — a client-side copy drifts into
      "selectable in the UI, 422 on save".

      Fails with `403` reason `forum.badges_disabled` when `features.badges` is off.
    responses:
      '200':
        description: Tier table plus the accepted colour palette.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeTierList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Create a badge tier
    operationId: adminCreateBadgeTier
    description: |
      Requires `badge.manage`.

      Validation is authoritative on the server: `key` must match
      `^[a-z][a-z0-9_]{1,31}$`, both `nameZh` and `nameEn` are required, `icon`
      must start with `i-lucide-` or `i-tabler-`, and `color` must be one of the
      palette tokens or a lowercase `#rrggbb` (empty means "no colour").

      Violations return `422` reason `forum.badge_tier_invalid`; a duplicate key
      returns `409` reason `forum.badge_tier_key_taken`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/badges.yaml#/BadgeTierCreateInput"
    responses:
      '201':
        description: Tier created.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeTierDef"
      '400':
        "$ref": "../components/responses.yaml#/BadRequest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
adminBadgeTierByKey:
  patch:
    summary: Update a badge tier
    operationId: adminUpdateBadgeTier
    description: |
      Requires `badge.manage`. Partial update: omitted fields keep their current
      value. `key` is **not** accepted — a renamed key is a different tier, so
      delete and create instead.

      Disabling a tier excludes its badges from the "top badge" competition and
      triggers a full `top_badge_id` recompute, so posts stop showing badges of
      that tier.
    parameters:
    - name: tierKey
      in: path
      required: true
      schema:
        "$ref": "../schemas/badges.yaml#/BadgeTier"
      description: Tier key (immutable).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/badges.yaml#/BadgeTierUpdateInput"
    responses:
      '200':
        description: Tier updated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeTierDef"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
  delete:
    summary: Delete a badge tier
    operationId: adminDeleteBadgeTier
    description: |
      Requires `badge.manage`. Deleting a tier is only possible with an explicit
      migration target: badges referencing the tier are moved to `migrateTo` in
      the same transaction, then the tier row is removed.

      Rejected cases (`migrateTo` is required, so a bare delete never silently
      demotes badges):

      - `migrateTo` missing, equal to the deleted key, or pointing at a disabled
        tier → `422` reason `forum.badge_tier_invalid`.
      - `migrateTo` does not exist → `404` reason `forum.badge_tier_not_found`.
      - It is the last enabled tier → `409` reason `forum.badge_tier_in_use`
        (removing it would blank every `top_badge_id` on the site).

      A successful delete triggers a full `top_badge_id` recompute.
    parameters:
    - name: tierKey
      in: path
      required: true
      schema:
        "$ref": "../schemas/badges.yaml#/BadgeTier"
    - name: migrateTo
      in: query
      required: true
      schema:
        "$ref": "../schemas/badges.yaml#/BadgeTier"
      description: |
        Enabled tier that inherits the badges currently pointing at `tierKey`.
        Required — a delete without it is rejected rather than silently
        demoting badges.
    responses:
      '200':
        description: Tier deleted and referencing badges migrated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeDeleteResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
adminBadgeTierOrder:
  put:
    summary: Reorder badge tiers
    operationId: adminReorderBadgeTiers
    description: |
      Requires `badge.manage`. Rewrites `position` from the array index; tiers
      not listed keep their relative order and are appended afterwards (a client
      may submit only the tiers it currently shows).

      `position` is the first sort key of the "top badge" ordering, so a reorder
      changes which badge every post shows. The server recomputes `top_badge_id`
      for affected users and returns the refreshed table.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/badges.yaml#/BadgeTierOrderInput"
    responses:
      '200':
        description: Tiers reordered; the refreshed table is returned.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeTierList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
adminBadgeGrantCandidates:
  get:
    summary: Search users eligible for a manual badge grant
    operationId: adminSearchGrantCandidates
    description: |
      Requires `badge.view` — **not** `user.view`. This answers "who can be
      granted this badge"; it does not expose emails, roles, or ban reasons, so
      an operator role that manages badges without the user directory still
      works.

      Matching covers `username` and `displayName` only, never the email
      address: email search would turn the badge admin into a
      "does this address have an account" oracle.

      `limit` defaults to and is capped at 20. An empty `q` returns the first
      page of candidates. `alreadyGranted` is a hint for the picker, not a
      filter.
    parameters:
    - name: q
      in: query
      required: false
      schema:
        type: string
      description: Case-insensitive substring of the username or display name.
    - name: badgeId
      in: query
      required: false
      schema:
        type: integer
        format: int64
      description: Badge whose grant state is reported per candidate.
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        maximum: 20
        default: 20
    responses:
      '200':
        description: Candidate users.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseGrantCandidateList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminBadgeGrantsBatch:
  post:
    summary: Grant a manual badge to several users at once
    operationId: adminBatchGrantBadge
    description: |
      Requires `badge.manage`. Only manual badges accept a batch grant;
      automatic badges are owned by their rule and return `422` reason
      `forum.badge_manual_only`.

      Request rules: at least one user id, at most 50 **unique** ids (duplicates
      are collapsed, non-positive ids dropped); violations return `422` reason
      `forum.badge_grant_batch_invalid`.

      Partial success is a `200`, not an error:
      `granted + skipped + len(failed)` equals the number of distinct ids sent.
      `skipped` counts users who already held the badge; `failed[].reason` is a
      stable error code. Every newly granted user gets `top_badge_id` recomputed.
    parameters:
    - "$ref": "../components/parameters.yaml#/BadgeID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/badges.yaml#/BatchGrantInput"
    responses:
      '200':
        description: Batch result with per-user failures.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBatchGrantResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
publicBadgeTiers:
  get:
    summary: List badge tiers for public rendering
    operationId: publicBadgeTiers
    description: |
      Public tier catalog: enabled tiers only, ordered by `position` ascending.
      Clients need it to render the tier name and colour of every badge — the
      badge payloads only carry the tier **key**, and hard-coding a
      key→name/colour map breaks as soon as an operator adds a tier.

      Actor-agnostic (no `earned`, no `enabled`), therefore cacheable:
      `Cache-Control: public, max-age=60`.

      Fails with `403` reason `forum.badges_disabled` when `features.badges` is off.
    responses:
      '200':
        description: Enabled tiers.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponsePublicBadgeTiers"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminListBadgeConditions:
  get:
    tags: [Badges]
    summary: List badge rule conditions
    operationId: adminListBadgeConditions
    description: |
      Requires `badge.view`. Returns the **publishable** condition catalog: a
      condition whose `objectRef` parameter has no candidates is omitted (M1 has
      no extensions, so `fact.count` does not appear — an empty dropdown is a dead
      end). Validation and evaluation still accept the full catalog, otherwise a
      rule stored by a since-removed extension could never be saved again.

      Each entry carries bilingual labels plus the parameter schema the admin
      editor uses for required/enum checks.
    responses:
      '200':
        description: Condition catalog.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeConditionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminBadgeRuleText:
  post:
    tags: [Badges]
    summary: Preview the generated requirement text for a draft rule
    operationId: adminBadgeRuleText
    description: |
      Requires `badge.view` — read-only preview, same permission as reading a
      badge (it does not widen the information surface: `GET /admin/badges`
      already exposes the rule AST). Nothing is persisted, no audit entry is
      written and no backfill is queued.

      Uses the **same** renderer and the same validation chain as the public
      surface and the save path (AST validation, reference existence, badge
      dependency cycle), so "what the preview shows" and "what the public page
      shows after saving" cannot diverge. Invalid rules return the same `422`
      codes as `PATCH /admin/badges/{badgeID}`.

      A `null` rule returns the fixed manual-badge sentence instead of an error,
      letting the editor tell "no rule yet" apart from "request failed".

      Reference names are resolved in one batched lookup per kind; names that no
      longer resolve fall back to a generic noun, so this endpoint never returns
      an empty string.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/badges.yaml#/BadgeRuleTextInput"
    responses:
      '200':
        description: Generated bilingual requirement text (never empty).
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeRuleText"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminBadgeRuleHealth:
  get:
    tags: [Badges]
    summary: List broken badge rule references
    operationId: adminBadgeRuleHealth
    description: |
      Requires `badge.view`. Lists enabled automatic badges whose rule points at
      something that no longer exists, cannot be decoded, or fails validation.

      Deliberately **excludes badges that merely granted nobody**: a correct rule
      with no qualifying users is healthy, and mixing it in would bury the real
      problems. An empty `items` array is a normal `200`, not a `404`.

      `missing_provider` accepts both "linked by some user" and "declared by the
      identity registry but not linked yet", so installing a provider does not
      turn every rule referencing it red for a day.
    responses:
      '200':
        description: Health report (possibly empty).
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeRuleHealthList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminBadgeRuleImpact:
  get:
    tags: [Badges]
    summary: Estimate how many users a badge rule covers
    operationId: adminBadgeRuleImpact
    description: |
      Requires `badge.view`. Returns an **estimate** (the UI must render it with a
      "≈"): AND takes the strictest leaf, OR sums them — both are upper bounds,
      because leaves correlate.

      `estimated` is nullable: `null` means "cannot be estimated" (for example OR
      with an unsupported leaf), `0` means the estimate really is zero. Collapsing
      the two would make an operator rewrite a correct rule they believe nobody
      can reach.
    parameters:
    - name: badgeID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: Impact estimate.
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeRuleImpact"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminBadgeBackfillStatus:
  get:
    tags: [Badges]
    summary: Report progress of the badge rule backfill chain
    operationId: adminBadgeBackfillStatus
    description: |
      Requires `badge.view`. Reports the **latest** `badges.backfill_rules` run
      per badge, so an operator can tell whether the `queued` badges from
      `POST /admin/badges/recompute` actually moved, where they stopped, and why.

      State is written only by the job side (a `running` row is created at
      enqueue time, then every page advances `lastUserId`, marks `completed`, or
      records a failure with `failedCursorUserId`). It is never derived from
      `user_badges`: inferring progress from grant counts would make the progress
      go backwards whenever a rule simply matches nobody.

      `status` is one of `running` / `completed` / `failed`. `finishedAt` is only
      set for `completed`; a `failed` run leaves it `null` because the queue will
      retry the page. `failedCursorUserId` is `0` for non-failed runs, so a
      retried-and-recovered run does not keep pointing at an old failure.

      An empty `items` array is a normal `200` (nobody has triggered a backfill
      yet), not a `404`. Rows disappear with their badge (foreign key cascade):
      `slug` and `name` come from a join, so there is no orphan state.
    responses:
      '200':
        description: Latest backfill run per badge (possibly empty).
        content:
          application/json:
            schema:
              "$ref": "../schemas/badges.yaml#/ApiResponseBadgeBackfillRunList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
