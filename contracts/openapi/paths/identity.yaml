authRegistrationStatus:
  get:
    summary: Get public registration bootstrap status
    operationId: getRegistrationStatus
    responses:
      '200':
        description: Public registration state used by the registration page.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseRegistrationStatus"
authRegister:
  post:
    summary: Register a forum account
    operationId: registerAccount
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/RegisterRequest"
    responses:
      '201':
        description: Account created and session cookie issued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseCurrentUser"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        description: Registration input or human verification is invalid.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
            examples:
              invalidFields:
                summary: Registration fields need correction
                value:
                  code: 422
                  message: 注册失败：请按标出的提示修改后再提交。
                  data:
                    reason: auth.register_invalid
                    fields:
                      username:
                      - 请填写用户名。
                      email:
                      - 邮箱格式不正确，请填写可接收邮件的地址。
                      password:
                      - 密码不符合当前站点密码策略。
              humanVerificationRequired:
                summary: Human verification is required
                value:
                  code: 422
                  message: 请先完成人机验证。
                  data:
                    reason: human_verification.required
                    fields:
                      humanVerification:
                      - 请先完成人机验证。
      '429':
        "$ref": "../components/responses.yaml#/TooManyRequests"
      '503':
        description: Account was created but the server could not issue the automatic sign-in session.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
            examples:
              sessionUnavailable:
                summary: Automatic sign-in session could not be saved
                value:
                  code: 503
                  message: 账号已创建，但自动登录失败，请直接登录。
                  data:
                    reason: auth.session_unavailable
humanVerificationChallenge:
  get:
    summary: Create a human verification challenge
    operationId: createHumanVerificationChallenge
    parameters:
    - name: purpose
      in: query
      required: true
      schema:
        type: string
        enum:
        - register
        - password_reset
        - email_verification
        - login_risk
        - post_risk
      description: Verification purpose for rate limits and replay scope.
    responses:
      '200':
        description: ALTCHA challenge payload for the requested purpose.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAltchaChallenge"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '429':
        "$ref": "../components/responses.yaml#/TooManyRequests"
authLogin:
  post:
    summary: Log in with username or email
    operationId: login
    description: |
      密码登录。默认只签发浏览器会话 cookie，`data` 为 `CurrentUser`。
      携带 `issueApiToken` 时（原生 App / 机器客户端）在同一次请求内额外签发一枚
      个人访问令牌（`sft_...`），`data` 变为 `LoginIssuedToken`（`user` + `apiToken`），
      明文令牌只在该次响应出现一次。
      令牌规则与 `POST /auth/tokens` 完全一致：`name` 必填、`scopes` 必须显式声明且
      是当前账号权限的子集，签发后按 `scopes ∩ 当前权限` 收窄鉴权。
      令牌请求的形状错误在会话签发前返回 422，不会留下半成功状态。
      人机验证：当 `human_verification.scenarios.login_risk` 启用且命中「登录强化」触发条件
      （总是验证 / 新设备 / 管理员账号）或账号处于失败锁定验证期时，首次请求返回 422
      `human_verification.required`，携带 `humanVerification` 重试即可。携带 `issueApiToken`
      的请求豁免该验证；这是已知取舍，该请求仍会签发浏览器会话。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/LoginRequest"
    responses:
      '200':
        description: |
          登录成功。会话 cookie 签发；`data` 为 `CurrentUser`，
          或携带 `issueApiToken` 时为 `LoginIssuedToken`。
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseLogin"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
authLogout:
  post:
    summary: Destroy the current browser session
    operationId: logout
    responses:
      '200':
        description: Session destroyed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiResponseNull"
authSession:
  get:
    summary: Get the current browser session user
    operationId: getCurrentSession
    responses:
      '200':
        description: Current authenticated forum user.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseCurrentUser"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
authLocale:
  put:
    summary: Update the current user's default language
    operationId: updateCurrentUserLocale
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/UpdateCurrentUserLocaleRequest"
    responses:
      '200':
        description: Current user with the saved language preference.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseCurrentUser"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
authAppearance:
  put:
    summary: Save the current user's private appearance override
    operationId: updateCurrentUserAppearance
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/UpdateCurrentUserAppearanceRequest"
    responses:
      '200':
        description: Current user with the saved appearance preference.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseCurrentUser"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
  delete:
    summary: Clear the current user's appearance override
    description: The account immediately resumes following the operator-owned site appearance.
    operationId: clearCurrentUserAppearance
    responses:
      '200':
        description: Current user with a null appearance preference.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseCurrentUser"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
passwordResetRequest:
  post:
    summary: Request a password reset email
    description: |
      Always returns success regardless of whether the email exists,
      to avoid leaking account existence. Rate-limited; optionally
      protected by human verification when the password_reset purpose is enabled.
    operationId: requestPasswordReset
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/PasswordResetRequest"
    responses:
      '200':
        description: Request accepted (generic).
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponsePasswordResetSent"
      '429':
        "$ref": "../components/responses.yaml#/TooManyRequests"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
passwordResetConfirm:
  post:
    summary: Confirm a password reset with a token and new password
    operationId: confirmPasswordReset
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/PasswordResetConfirmRequest"
    responses:
      '200':
        description: Password updated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponsePasswordResetConfirmed"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
emailVerificationRequest:
  post:
    summary: Request a verification email for the current account
    operationId: requestEmailVerification
    security:
    - cookieAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/EmailVerificationRequest"
    responses:
      '200':
        description: Request accepted; sent is false when verification is not required or already complete.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseEmailVerificationSent"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '429':
        "$ref": "../components/responses.yaml#/TooManyRequests"
emailVerificationConfirm:
  get:
    summary: Confirm an email address from a one-time verification link
    operationId: confirmEmailVerificationLink
    parameters:
    - name: token
      in: query
      required: true
      schema:
        type: string
    responses:
      '303':
        description: Redirects to the login page after successful confirmation.
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
  post:
    summary: Confirm an email address with a one-time token
    operationId: confirmEmailVerification
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/EmailVerificationConfirmRequest"
    responses:
      '200':
        description: Email verified.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseEmailVerificationConfirmed"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
permissions:
  get:
    summary: List global permissions
    operationId: listPermissions
    responses:
      '200':
        description: Permission catalog visible to role or user managers.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponsePermissionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
permissionMatrix:
  get:
    summary: List role permission matrix
    operationId: listPermissionMatrix
    responses:
      '200':
        description: Permission catalog with permissions assigned to each role.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponsePermissionMatrix"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
roles:
  get:
    summary: List roles and user groups
    operationId: listRoles
    responses:
      '200':
        description: Roles visible to role managers.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseRoleList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Create a custom role
    operationId: createRole
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/RoleCreateInput"
    responses:
      '201':
        description: Role created.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseRole"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
roleSuggestions:
  get:
    summary: List extension permission role suggestions
    description: |
      Returns Host-reviewable permission recommendations, including pending
      records whose exact extension artifact later became inactive. This endpoint
      accepts only a browser session cookie from an active actor with
      `role.manage`; personal access tokens are not review authority. Installation
      and enablement never approve a suggestion.
    operationId: listExtensionRoleSuggestions
    security:
    - cookieAuth: []
    parameters:
    - name: approvalState
      in: query
      schema:
        type: string
        enum:
        - pending
        - approved
        - rejected
    - name: roleKey
      in: query
      schema:
        type: string
    - name: permissionKey
      in: query
      schema:
        type: string
    - name: ownerExtensionId
      in: query
      schema:
        type: string
    - name: cursor
      in: query
      description: Opaque keyset cursor bound to the normalized filters.
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    responses:
      '200':
        description: Stable page of permission role suggestions.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseRoleSuggestionPage"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
roleSuggestionDecision:
  post:
    summary: Approve or reject one extension permission role suggestion
    description: |
      Performs one actor-bound Host decision with optimistic concurrency.
      Approval adds only the declared permission mapping to the target role and
      records immutable grant and audit evidence in the same transaction.
      Rejection grants nothing and may close a pending recommendation after its
      exact artifact becomes inactive. The repository always rechecks the live
      actor; approval additionally rechecks the permission catalog, exact active
      extension artifact, declaration, and target role.
    operationId: decideExtensionRoleSuggestion
    security:
    - cookieAuth: []
    parameters:
    - name: suggestionID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/RoleSuggestionDecisionInput"
    responses:
      '200':
        description: Durable Host decision and grant status.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseRoleSuggestion"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: The revision changed, or an approval target, catalog entry, declaration, or exact artifact is unavailable.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
roleByKey:
  patch:
    summary: Update a role alias and description
    operationId: updateRole
    parameters:
    - "$ref": "../components/parameters.yaml#/RoleKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/RoleUpdateInput"
    responses:
      '200':
        description: Role updated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseRole"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
  delete:
    summary: Delete a custom role
    operationId: deleteRole
    parameters:
    - "$ref": "../components/parameters.yaml#/RoleKey"
    responses:
      '200':
        description: Role deleted.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiResponseNull"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
rolePermissions:
  put:
    summary: Replace permissions assigned to a role
    operationId: replaceRolePermissions
    parameters:
    - "$ref": "../components/parameters.yaml#/RoleKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - permissions
            properties:
              permissions:
                type: array
                items:
                  type: string
    responses:
      '200':
        description: Role permissions replaced.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiResponseNull"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
users:
  get:
    summary: List users for administration
    operationId: listAdminUsers
    parameters:
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
    - name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: query
      in: query
      schema:
        type: string
    - name: status
      in: query
      schema:
        type: string
        enum:
        - active
        - disabled
        - banned
    - name: roleKey
      in: query
      schema:
        type: string
    - name: sortBy
      in: query
      description: Sort field. Defaults to registration time.
      schema:
        type: string
        default: createdAt
        enum:
        - createdAt
        - updatedAt
        - username
        - displayName
        - email
        - status
    - name: sortOrder
      in: query
      description: Sort direction. Defaults to descending.
      schema:
        type: string
        default: desc
        enum:
        - asc
        - desc
    responses:
      '200':
        description: Paged admin user list.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminUserList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Create a user from the admin panel
    description: |
      Requires `user.manage`. Creates a human account with a password credential,
      optional role assignments, and an audit event in one transaction.
      The registration switch and `user.before_register` hook do not apply to this
      admin path; host username/email/password policies still do.
      `password` and `generatePassword` are mutually exclusive. When
      `generatePassword` is true the response returns the plaintext password
      exactly once; the server stores only its Argon2id hash.
    operationId: createAdminUser
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/AdminCreateUserInput"
    responses:
      '201':
        description: User created. `generatedPassword` is present only for random generation.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminCreateUserResult"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        description: |
          Validation failed and carries localized `data.fields` keyed by request
          field name. `data.reason` is `auth.register_invalid` for
          username/email/password policy, uniqueness, or `displayName` problems,
          and `role.invalid` when a requested `roleKeys` entry does not exist.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
userByID:
  get:
    summary: Get an admin user detail
    description: |
      Requires `user.view` (or parent `user.manage`). Returns account fields, public
      profile, effective permissions, permission overrides, plus admin inspection
      data for previews: activity counts, recent sessions with full client IP and
      raw User-Agent, and recent login/register audit events. Self-service device
      lists still only expose masked IP prefixes.
    operationId: getAdminUser
    parameters:
    - "$ref": "../components/parameters.yaml#/UserID"
    responses:
      '200':
        description: User detail with profile, permissions, sessions (full IP/UA), and auth events.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminUserDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
  patch:
    summary: Update an admin user account and profile
    description: |
      Requires `user.manage`. Partial update for account fields (username, email,
      displayName, locale, status, kind) and public profile (bio, signature,
      location, websiteUrl). Setting `status` to `banned` also requires `user.ban`.
      Setting `kind` to `bot` revokes the account's sessions and blocks interactive
      login until it is restored to `human`.
      Operators cannot change their own status via this endpoint. Non-super-admin
      operators cannot edit super_admin accounts. Initial super admin status
      cannot be set to disabled/banned.
    operationId: updateAdminUser
    parameters:
    - "$ref": "../components/parameters.yaml#/UserID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/AdminUpdateUserInput"
    responses:
      '200':
        description: User account/profile updated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminUserDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: |
          Username or email is already used by another account
          (`user.username_or_email_taken`, with `data.fields.username` and/or
          `data.fields.email`).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        description: |
          Field validation failed. `data.reason` is `user.invalid_update` with
          localized `data.fields` keyed by request field name (`username`,
          `email`, `displayName`, `locale`, `status`, `kind`, `bio`, `signature`,
          `location`, `websiteUrl`), or `user.update_empty` when the request
          carries no updatable field at all.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
userRoles:
  put:
    summary: Replace roles assigned to a user
    operationId: replaceUserRoles
    parameters:
    - "$ref": "../components/parameters.yaml#/UserID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/UserRolesInput"
    responses:
      '200':
        description: User roles replaced.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminUserDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        description: |
          A submitted `roleKeys` entry does not exist. `data.reason` is
          `role.invalid` with localized `data.fields.roleKeys`.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminUserEmailVerification:
  put:
    summary: Set a user's email verification state
    description: |
      Requires `user.manage`. Marks the target email as verified or resets it
      to unverified. Both operations invalidate outstanding verification links
      and write an actor/target audit event. Non-super-admin operators cannot
      change a super_admin account.
    operationId: setAdminUserEmailVerification
    parameters:
    - "$ref": "../components/parameters.yaml#/UserID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/AdminSetEmailVerificationInput"
    responses:
      '200':
        description: Email verification state updated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminUserDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
userPermissionOverrides:
  put:
    summary: Replace direct permission overrides for a user
    operationId: replaceUserPermissionOverrides
    parameters:
    - "$ref": "../components/parameters.yaml#/UserID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/UserPermissionOverridesInput"
    responses:
      '200':
        description: User direct permission overrides replaced.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminUserDetail"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
adminUserSetPassword:
  post:
    summary: Admin set a user's password
    description: |
      Requires `user.manage`. Directly sets a new password for the target user
      after validating the site password policy. Operators may reset their own
      password. Targets with the `super_admin` role can only be reset by another
      `super_admin` (same boundary as session revoke / role replacement).
      On success the host increments the user's token version and revokes every
      active session (same side effects as public password-reset confirmation).
      The request body must never be logged; the response never echoes the password.
    operationId: adminSetUserPassword
    parameters:
    - "$ref": "../components/parameters.yaml#/UserID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - password
            properties:
              password:
                type: string
                format: password
                minLength: 1
                description: New password; must meet the configured identity.password policy.
    responses:
      '200':
        description: Password updated; active sessions revoked.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminSetUserPassword"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        description: Missing user.manage, or non-super_admin targeting a super_admin.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        description: Password fails policy (reason auth.register_invalid with field messages).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
adminUserRevokeSessions:
  post:
    summary: Admin force-revoke all of a user's devices
    description: |
      Requires `user.manage`. Revokes every active session belonging to the
      target user (e.g. after a security event). An operator cannot revoke
      their own sessions through this endpoint (use logout instead) and
      receives 400 `auth.cannot_revoke_own_sessions`.
    operationId: adminRevokeUserSessions
    parameters:
    - "$ref": "../components/parameters.yaml#/UserID"
    responses:
      '200':
        description: Target user's sessions revoked.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseRevokeOthers"
      '400':
        description: Attempted to revoke own sessions (reason auth.cannot_revoke_own_sessions).
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
adminUserClearClientIPs:
  post:
    summary: Clear stored client IP addresses for a user
    description: |
      Requires `user.manage`. Clears full client IP fields on the target user's
      session directory rows and on topics/comments they authored (create + last
      edit). Used for privacy compliance; account ban/delete product flows should
      call the same service method. Super-admin targets are protected the same
      way as session revoke.
    operationId: adminClearUserClientIPs
    parameters:
    - "$ref": "../components/parameters.yaml#/UserID"
    responses:
      '200':
        description: Client IP fields cleared.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseClearUserClientIPs"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
authSessions:
  get:
    summary: List the current user's login sessions / active devices
    description: |
      Self-service: returns the caller's own sessions only. Requires an authenticated
      session (auth.required). Never exposes raw session ids or auth credentials; the
      `id` is an opaque handle used solely to target a device for revocation.
      Pass `includeHistory=true` to include revoked sessions (login history).
    operationId: listAuthSessions
    parameters:
    - name: includeHistory
      in: query
      required: false
      schema:
        type: boolean
        default: false
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    responses:
      '200':
        description: Session list for the current user.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseLoginSessionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
authSessionRevokeOthers:
  post:
    summary: Revoke all other devices except the current one
    description: |
      Self-service: revokes every active session belonging to the caller except the
      one making the request. Requires an authenticated session (auth.required).
    operationId: revokeOtherAuthSessions
    responses:
      '200':
        description: Other sessions revoked.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseRevokeOthers"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
authSessionByID:
  delete:
    summary: Revoke a single device
    description: |
      Self-service: revokes one of the caller's own sessions by opaque id. A sid that
      does not belong to the caller returns 404 (auth.session_not_found) and does not
      leak whether it belongs to someone else. Requires an authenticated session.
    operationId: revokeAuthSession
    parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: Opaque session id (not an auth credential).
    responses:
      '200':
        description: Session revoked.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiResponseNull"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '404':
        description: Session not found or does not belong to the caller (reason auth.session_not_found).
        content:
          application/json:
            schema:
              "$ref": "../components/responses.yaml#/NotFound"
              description: Not used directly; see referenced NotFound response.
authAPITokens:
  get:
    summary: List personal access tokens
    description: Cookie session only. Bearer PAT cannot list tokens.
    operationId: listAuthAPITokens
    responses:
      '200':
        description: Active tokens (no plaintext secrets).
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAPITokenList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
  post:
    summary: Create a personal access token
    description: |
      Returns the plaintext secret once (`token` field). Scopes must be permission
      keys the user already holds. Cookie session required.
    operationId: createAuthAPIToken
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/CreateAPITokenRequest"
    responses:
      '201':
        description: Token created with one-time plaintext.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseCreatedAPIToken"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
authAPITokenByID:
  delete:
    summary: Revoke a personal access token
    operationId: revokeAuthAPIToken
    parameters:
    - name: tokenID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: Token revoked.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiResponseNull"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
authAPITokenRotate:
  post:
    summary: Rotate a personal access token
    description: Revokes the old token and issues a new secret with the same name and scopes.
    operationId: rotateAuthAPIToken
    parameters:
    - name: tokenID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: New token with one-time plaintext.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseCreatedAPIToken"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"

authProviders:
  get:
    summary: List effectively available auth and recovery providers
    description: |
      Returns only Host-effective public providers. Auth providers require live
      Registry presence, exact-artifact Host activation, supported operations,
      and non-Safe-Mode runtime. Responses never include raw subjects, digests,
      tokens, Client Secrets, or callback transaction material.
    operationId: listAuthProviders
    responses:
      '200':
        description: Redacted effectively available provider catalog.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAuthProviderList"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

authProviderStart:
  post:
    summary: Start an external auth, link, or recovery provider flow
    description: |
      Host creates high-entropy callback state, PKCE material, and an absolute
      callback URL from the runtime `site.url` setting, falling back to trusted
      `APP_URL` when the setting is empty, then invokes the provider start
      operation. Request Host is never used. Link requires an active browser
      session. Login/registration/link require Host activation for that operation.
    operationId: startAuthProvider
    parameters:
    - name: providerId
      in: path
      required: true
      schema:
        type: string
    - name: operation
      in: path
      required: true
      schema:
        type: string
        enum: [registration, login, link, recovery]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/AuthProviderStartRequest"
    responses:
      '200':
        description: Provider start challenge or redirect.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAuthProviderStart"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

authProviderComplete:
  post:
    summary: Complete recovery provider flow, or reject legacy auth complete
    description: |
      Recovery complete remains available on this path. Public
      login/registration/link complete is closed (`410 auth.provider_callback_required`);
      those effects only run through the reserved Host OAuth callback route so
      callback state, activation, exact-artifact fencing, actor policy, and
      response redaction cannot be bypassed.
    operationId: completeAuthProvider
    parameters:
    - name: providerId
      in: path
      required: true
      schema:
        type: string
    - name: operation
      in: path
      required: true
      schema:
        type: string
        enum: [registration, login, link, recovery]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/AuthProviderCompleteRequest"
    responses:
      '200':
        description: Recovery complete assertion (auth operations do not succeed here).
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAuthProviderComplete"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '410':
        description: Auth login/registration/link complete requires Host OAuth callback.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
            examples:
              callbackRequired:
                value:
                  code: 410
                  message: auth.provider_callback_required
                  data:
                    reason: auth.provider_callback_required
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

authProviderCallback:
  get:
    summary: Consume Host OAuth callback state and complete one external auth attempt
    description: |
      Reserved Core route. Host atomically consumes the callback transaction,
      re-resolves the live exact artifact, re-checks activation, injects the
      Host-owned PKCE verifier and absolute callback URL into plugin complete,
      then performs login, registration-ticket, or link effects. This route is
      intentionally closed to Route Registry replacement because callback state,
      PKCE, and browser session authority must remain Host-owned. Failures
      redirect to a safe local path with a minimized `ext_auth` reason and never
      expose raw subject, digest, code, token, state, or verifier.
    operationId: externalAuthProviderCallback
    parameters:
    - name: providerId
      in: path
      required: true
      schema:
        type: string
    - name: state
      in: query
      schema:
        type: string
      description: Host-generated opaque callback state.
    - name: code
      in: query
      schema:
        type: string
      description: Provider authorization code (completion token).
    - name: error
      in: query
      schema:
        type: string
      description: Provider cancellation or error code (for example access_denied).
    responses:
      '302':
        description: Safe local redirect with minimized ext_auth reason.
        headers:
          Location:
            schema:
              type: string
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

authExternalRegistration:
  post:
    summary: Create a user, default role, and external link from an opaque registration ticket
    description: |
      Public endpoint. Validates editable fields and human verification before
      consuming the one-time Host ticket, then creates user + default role +
      external link atomically. Never accepts raw subjects or digests from the
      browser. Zero-user bootstrap remains Core password registration only.
    operationId: completeExternalRegistration
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/ExternalRegistrationRequest"
    responses:
      '201':
        description: Account created and session cookie issued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseCurrentUser"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        description: Ticket missing, invalid, or already consumed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '410':
        description: Registration ticket expired.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '429':
        "$ref": "../components/responses.yaml#/TooManyRequests"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

authExternalContinuationPrepare:
  post:
    summary: Inspect an unlinked external-login continuation
    description: |
      Public, non-consuming inspection of a browser-bound opaque ticket. Rechecks
      the exact provider artifact and independently reports whether the identity
      may be linked to an existing account or used to register a new account.
      Never returns provider subjects, digests, tokens, or artifact identity.
    operationId: prepareExternalAuthContinuation
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/ExternalAuthContinuationRequest"
    responses:
      '200':
        description: Redacted provider presentation and authorized choices.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseExternalAuthContinuationPreparation"
      '404':
        description: Ticket missing, invalid, already consumed, or presented from another browser.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '410':
        description: Continuation ticket expired.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

authExternalContinuationLink:
  post:
    summary: Link an external-login continuation to the current account
    description: |
      Cookie session and recent authentication required. Atomically consumes the
      browser-bound login continuation and persists the external identity through
      the shared Host link store. The current actor is always the target account.
    operationId: linkExternalAuthContinuation
    security:
    - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/ExternalAuthContinuationRequest"
    responses:
      '200':
        description: External identity linked to the current account.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseCurrentUser"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '404':
        description: Ticket missing, invalid, already consumed, or presented from another browser.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '410':
        description: Continuation ticket expired.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

authExternalRegistrationPrepare:
  post:
    summary: Prepare editable fields from an opaque external-registration ticket
    description: |
      Public, non-consuming ticket inspection. Rechecks registration policy,
      effective provider activation, and exact artifact binding before returning
      editable username/display-name hints and only a provider-verified email.
      Never returns provider subjects, digests, tokens, or artifact identity.
    operationId: prepareExternalRegistration
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/ExternalRegistrationPreparationRequest"
    responses:
      '200':
        description: Redacted editable registration hints.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseExternalRegistrationPreparation"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        description: Ticket missing, invalid, or already consumed.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '410':
        description: Registration ticket expired.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

authExternalIdentities:
  get:
    summary: List the current user's redacted external identity links
    description: |
      Login required. Returns provider id, link status, linked time, and owner
      extension id only. Never returns raw subject, subject digest, tokens, or
      scopes.
    operationId: listExternalIdentities
    security:
    - cookieAuth: []
    responses:
      '200':
        description: Redacted linked external identities for the current actor.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseExternalIdentityList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

authExternalIdentityByID:
  delete:
    summary: Unlink one external identity from the current account
    description: |
      Login + session-bound recent authentication required. Loads the target
      link, verifies actor ownership/active status/expected revision, and
      enforces last-login-method protection inside the same transaction as the
      unlink mutation. Idempotency keys are scoped to user/link/revision/request
      and never use client IP.
    operationId: unlinkExternalIdentity
    security:
    - cookieAuth: []
    parameters:
    - name: linkId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    requestBody:
      required: false
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/ExternalIdentityUnlinkRequest"
    responses:
      '200':
        description: Link unlinked (or already inert under idempotent replay).
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiResponseNull"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        "$ref": "../components/responses.yaml#/Conflict"
      '422':
        description: Last usable login method would be removed, or input invalid.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

authPasswordSetup:
  post:
    summary: Add or change the current user's local password
    description: |
      Login + session-bound recent authentication required. Creates a
      `user_credentials` row when the user is external-only (no credential row);
      updates password_hash when a credential already exists. Never creates a
      fake password for external-only users elsewhere.
    operationId: setupLocalPassword
    security:
    - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/SetupPasswordRequest"
    responses:
      '200':
        description: Password created or updated.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiResponseNull"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminIdentityProviders:
  get:
    summary: List Host-owned identity provider activation catalog
    description: |
      Requires `identity.provider.manage`. Aggregates Registry discovery, exact
      artifact, Host activation, probe status, Safe Mode, and reserved callback
      path metadata. Executable trust remains `super_admin` only.
    operationId: listAdminIdentityProviders
    security:
    - cookieAuth: []
    responses:
      '200':
        description: Admin provider catalog with activation and health metadata.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminIdentityProviderList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminIdentityProviderByID:
  patch:
    summary: CAS-update Host activation and ordering for one identity provider
    description: |
      Requires `identity.provider.manage`. Ownership and package digest are
      Host-derived from the live Registry; browser-supplied ownership/artifact
      claims are rejected. Uses optimistic concurrency on expected revision.
    operationId: patchAdminIdentityProvider
    security:
    - cookieAuth: []
    parameters:
    - name: providerId
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/AdminIdentityProviderPatchRequest"
    responses:
      '200':
        description: Updated activation row (or unchanged under no-mutation).
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminIdentityProvider"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Stale expected revision.
        content:
          application/json:
            schema:
              "$ref": "../schemas/common.yaml#/ApiErrorResponse"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminIdentityProviderProbe:
  post:
    summary: Record a truthful configuration/reachability probe for one provider
    description: |
      Requires `identity.provider.manage`. Until a real provider probe RPC exists,
      the Host records `probe_pending`/`probe_unavailable` with `ok=false` and
      never presents pending as a successful health check.
    operationId: probeAdminIdentityProvider
    security:
    - cookieAuth: []
    parameters:
    - name: providerId
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Probe result (ok may be false for pending/unavailable).
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminIdentityProviderProbe"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

adminIdentityProvidersReset:
  post:
    summary: Restore recommended provider activation defaults
    description: |
      Requires `identity.provider.manage`. Turns login/registration/link off and
      restores default order while preserving secrets; operators are told that
      secrets remain.
    operationId: resetAdminIdentityProviders
    security:
    - cookieAuth: []
    responses:
      '200':
        description: Defaults restored for all managed providers.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseAdminIdentityProvidersReset"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

profileSectionsList:
  get:
    summary: List composed extension profile sections for the current user
    operationId: listProfileSections
    responses:
      '200':
        description: Composed profile sections.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseProfileSectionList"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"

profileSectionByID:
  put:
    summary: Update one extension profile section for the current user
    operationId: updateProfileSection
    parameters:
    - name: sectionId
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/identity.yaml#/ProfileSectionUpdateRequest"
    responses:
      '200':
        description: Updated profile section.
        content:
          application/json:
            schema:
              "$ref": "../schemas/identity.yaml#/ApiResponseProfileSection"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
