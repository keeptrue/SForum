adminMailTest:
  post:
    summary: Send a test mail to verify delivery configuration
    operationId: adminMailTest
    security:
    - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/mail.yaml#/MailTestRequest"
    responses:
      '202':
        description: Test mail queued for delivery.
        content:
          application/json:
            schema:
              "$ref": "../schemas/mail.yaml#/ApiResponseMailTest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminMailProviders:
  get:
    summary: List enabled mail provider plugins and the resolved selection
    security: [{cookieAuth: []}]
    responses:
      '200':
        description: Provider state and the resolved default/selection
        content:
          application/json:
            schema: {$ref: "../schemas/mail.yaml#/ApiResponseMailProviders"}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
adminMailProvider:
  put:
    summary: Select an enabled mail provider plugin
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/mail.yaml#/MailProviderSelectionRequest"}}}
    responses:
      '200': {description: Provider selected}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '422': {$ref: "../components/responses.yaml#/UnprocessableEntity"}
adminMailProviderReset:
  post:
    summary: Restore the recommended mail provider default while preserving plugin secrets
    security: [{cookieAuth: []}]
    responses:
      '200':
        description: Recommended default resolved
        content:
          application/json:
            schema: {$ref: "../schemas/mail.yaml#/ApiResponseMailProviderReset"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
adminMailDeliveries:
  get:
    summary: List the 50 newest sanitized mail deliveries
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Recent delivery states}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
adminNotificationPolicy:
  get:
    summary: Read the resolved global notification channel policy
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Resolved policy, content: {application/json: {schema: {$ref: "../schemas/mail.yaml#/ApiResponseNotificationPolicy"}}}}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
  put:
    summary: Update the global notification channel policy
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/mail.yaml#/NotificationPolicy"}}}
    responses:
      '200': {description: Updated policy, content: {application/json: {schema: {$ref: "../schemas/mail.yaml#/ApiResponseNotificationPolicy"}}}}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '422': {$ref: "../components/responses.yaml#/UnprocessableEntity"}
adminNotificationPolicyRestore:
  post:
    summary: Restore the all-enabled recommended notification policy
    security: [{cookieAuth: []}]
    responses:
      '200': {description: Restored policy, content: {application/json: {schema: {$ref: "../schemas/mail.yaml#/ApiResponseNotificationPolicy"}}}}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
