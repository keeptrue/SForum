adminMailTest:
  post:
    summary: Send a test mail to verify delivery configuration
    operationId: adminMailTest
    security:
    - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/mail.yaml#/MailTestRequest"
    responses:
      '202':
        description: Test mail queued for delivery.
        content:
          application/json:
            schema:
              "$ref": "../schemas/mail.yaml#/ApiResponseMailTest"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '422':
        "$ref": "../components/responses.yaml#/UnprocessableEntity"
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminMailProviders:
  get:
    summary: List enabled mail provider plugins and the resolved selection
    security: [{cookieAuth: []}]
    responses:
      '200':
        description: Provider state and the resolved default/selection
        content:
          application/json:
            schema: {$ref: "../schemas/mail.yaml#/ApiResponseMailProviders"}
      '401': {$ref: "../components/responses.yaml#/Unauthorized"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminMailProvider:
  put:
    summary: Select an enabled mail provider plugin
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/mail.yaml#/MailProviderSelectionRequest"}}}
    responses:
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '200': {description: Provider selected}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '422': {$ref: "../components/responses.yaml#/UnprocessableEntity"}
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminMailProviderReset:
  post:
    summary: Restore the recommended mail provider default while preserving plugin secrets
    security: [{cookieAuth: []}]
    responses:
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '200':
        description: Recommended default resolved
        content:
          application/json:
            schema: {$ref: "../schemas/mail.yaml#/ApiResponseMailProviderReset"}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminMailDeliveries:
  get:
    summary: List the 50 newest sanitized mail deliveries
    security: [{cookieAuth: []}]
    responses:
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '200': {description: Recent delivery states}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminMailDeliveryReplay:
  post:
    summary: Replay a terminal failed mail delivery
    description: |
      Requires `settings.mail.manage`. Resets a `failed` delivery back to
      `queued`, clears `error_summary`/`completed_at`, and enqueues a fresh
      `mail.deliver` job. Only terminal failures are replayable — `sent` and
      `skipped` answer 409 `mail.delivery_not_replayable`, and an unknown id
      answers 404 `mail.delivery_not_found`. Concurrent replays of the same
      delivery are safe: the status reset is conditional on the status that was
      observed, so only one wins and the other gets 409.
    operationId: adminReplayMailDelivery
    security: [{cookieAuth: []}]
    parameters:
    - name: deliveryID
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    responses:
      '200':
        description: Delivery reset to queued and re-enqueued.
        content:
          application/json:
            schema:
              "$ref": "../schemas/mail.yaml#/ApiResponseMailDeliveryReplay"
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '403':
        "$ref": "../components/responses.yaml#/Forbidden"
      '404':
        "$ref": "../components/responses.yaml#/NotFound"
      '409':
        description: Delivery is not in a replayable state (reason mail.delivery_not_replayable).
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminNotificationPolicy:
  get:
    summary: Read the resolved global notification channel policy
    security: [{cookieAuth: []}]
    responses:
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '200': {description: Resolved policy, content: {application/json: {schema: {$ref: "../schemas/mail.yaml#/ApiResponseNotificationPolicy"}}}}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
  put:
    summary: Update the global notification channel policy
    security: [{cookieAuth: []}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../schemas/mail.yaml#/NotificationPolicy"}}}
    responses:
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '200': {description: Updated policy, content: {application/json: {schema: {$ref: "../schemas/mail.yaml#/ApiResponseNotificationPolicy"}}}}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '422': {$ref: "../components/responses.yaml#/UnprocessableEntity"}
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
adminNotificationPolicyRestore:
  post:
    summary: Restore the all-enabled recommended notification policy
    security: [{cookieAuth: []}]
    responses:
      '401':
        "$ref": "../components/responses.yaml#/Unauthorized"
      '200': {description: Restored policy, content: {application/json: {schema: {$ref: "../schemas/mail.yaml#/ApiResponseNotificationPolicy"}}}}
      '403': {$ref: "../components/responses.yaml#/Forbidden"}
      '503':
        "$ref": "../components/responses.yaml#/ServiceUnavailable"
