# 共享 parameter 定义（供 $ref 引用）。约定：这里只登记定义本身，header 参数在 operation 上声明
# ——不要挂到 path item 的 parameters，否则同一路径的所有方法都会背上它；使用方在 operation
# 自己的 `parameters:` 里逐条 $ref，并在相关响应（如 302）的描述里指回来。
IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: false
  schema:
    type: string
    maxLength: 128
  description: |
    Optional client-supplied key for safe retries on selected write routes.
    Scoped to actor + method + path; TTL 24h. See openapi.yaml Idempotency-Key.
RoleKey:
  name: roleKey
  in: path
  required: true
  schema:
    type: string
  description: Stable role key, such as member or moderator.
UserID:
  name: userID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric user id.
AttachmentPublicID:
  name: publicId
  in: path
  required: true
  schema:
    type: string
  description: Public attachment identifier returned by upload.
AttachmentID:
  name: attachmentID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric attachment id.
MediaDeliveryHeader:
  name: X-SForum-Media-Delivery
  in: header
  required: false
  schema:
    type: string
    enum: [redirect-v1]
  description: >-
    仅 `redirect-v1` 触发直连交付；缺省/其他值走 200 流。命中 `redirect-v1` 且存储
    provider 能给出签名地址时，附件内容 operation 返回 302 到该签名地址（见各自的 302）。
    本文件只登记定义，该 header 参数在实际使用它的 operation 上声明。
ExtensionID:
  name: id
  in: path
  required: true
  schema:
    type: string
  description: Stable extension id from sforum.extension.json.
ExecutableTrustTarget:
  name: target
  in: query
  required: false
  schema:
    type: string
    enum: [staged]
  description: >-
    Select the exact staged artifact for restart recovery. When omitted, trust
    review follows the normal enable or activation target.
PageID:
  name: pageId
  in: path
  required: true
  schema:
    type: string
  description: Stable page registry id (for example forum.home).
ExtensionPluginPath:
  name: pluginPath
  in: path
  required: true
  schema:
    type: string
  description: >-
    Slash-separated plugin route path after the extension id. The host only
    proxies paths declared by that plugin manifest. 该参数匹配多段（实现为
    Fiber `*` 通配：api.All("/extensions/:extensionId/*")，末段由 Route
    Dispatcher 按插件清单在运行时匹配），因此可以是任意层级；OpenAPI 3.1
    无法表达多段 catch-all，路径形状以本描述披露。
TopicID:
  name: topicID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric topic id.
TopicSlug:
  name: slug
  in: path
  required: true
  schema:
    type: string
  description: |
    全局唯一的主题 slug。仅当站点配置 seo.topic_url_mode = slug 时由前端
    生成此路径；其它模式下应使用 GET /topics/{topicID}。
CommentID:
  name: commentID
  in: path
  required: true
  schema:
    type: integer
    format: int64
CategoryGroupID:
  name: categoryGroupID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric category group id.
CategoryID:
  name: categoryID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric category id.
TagID:
  name: tagID
  in: path
  required: true
  schema:
    type: integer
    format: int64
    description: Numeric tag id.
ReportID:
  name: reportID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric moderation report id.
TagSlug:
  name: tagSlug
  in: query
  schema:
    type: string
  description: Active tag slug used to filter public topics.
DatabaseSchema:
  name: schema
  in: path
  required: true
  schema:
    type: string
DatabaseTable:
  name: table
  in: path
  required: true
  schema:
    type: string
  description: Database table name.
BadgeID:
  name: badgeID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric badge definition id.
BadgeGroupID:
  name: groupID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric badge group id.
BadgeGrantUserID:
  name: userID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric user id of the badge recipient.
