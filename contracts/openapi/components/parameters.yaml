IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: false
  schema:
    type: string
    maxLength: 128
  description: |
    Optional client-supplied key for safe retries on selected write routes.
    Scoped to actor + method + path; TTL 24h. See openapi.yaml Idempotency-Key.
RoleKey:
  name: roleKey
  in: path
  required: true
  schema:
    type: string
  description: Stable role key, such as member or moderator.
UserID:
  name: userID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric user id.
AttachmentPublicID:
  name: publicId
  in: path
  required: true
  schema:
    type: string
  description: Public attachment identifier returned by upload.
AttachmentID:
  name: attachmentID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric attachment id.
ExtensionID:
  name: id
  in: path
  required: true
  schema:
    type: string
  description: Stable extension id from sforum.extension.json.
ExecutableTrustTarget:
  name: target
  in: query
  required: false
  schema:
    type: string
    enum: [staged]
  description: >-
    Select the exact staged artifact for restart recovery. When omitted, trust
    review follows the normal enable or activation target.
PageID:
  name: pageId
  in: path
  required: true
  schema:
    type: string
  description: Stable page registry id (for example forum.home).
ExtensionPluginPath:
  name: pluginPath
  in: path
  required: true
  schema:
    type: string
  description: Slash-separated plugin route path after the extension id. The host only proxies paths declared by that plugin manifest.
TopicID:
  name: topicID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric topic id.
TopicSlug:
  name: slug
  in: path
  required: true
  schema:
    type: string
  description: |
    全局唯一的主题 slug。仅当站点配置 seo.topic_url_mode = slug 时由前端
    生成此路径；其它模式下应使用 GET /topics/{topicID}。
CommentID:
  name: commentID
  in: path
  required: true
  schema:
    type: integer
    format: int64
CategoryGroupID:
  name: categoryGroupID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric category group id.
CategoryID:
  name: categoryID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric category id.
TagID:
  name: tagID
  in: path
  required: true
  schema:
    type: integer
    format: int64
    description: Numeric tag id.
ReportID:
  name: reportID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric moderation report id.
TagSlug:
  name: tagSlug
  in: query
  schema:
    type: string
  description: Active tag slug used to filter public topics.
DatabaseSchema:
  name: schema
  in: path
  required: true
  schema:
    type: string
DatabaseTable:
  name: table
  in: path
  required: true
  schema:
    type: string
  description: Database table name.
BadgeID:
  name: badgeID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric badge definition id.
BadgeGroupID:
  name: groupID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric badge group id.
BadgeGrantUserID:
  name: userID
  in: path
  required: true
  schema:
    type: integer
    format: int64
  description: Numeric user id of the badge recipient.
