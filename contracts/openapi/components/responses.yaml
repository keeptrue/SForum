BadRequest:
  description: The request is malformed or a header value is invalid.
  content:
    application/json:
      schema:
        "$ref": "../schemas/common.yaml#/ApiErrorResponse"
Unauthorized:
  description: Authentication is required or credentials are invalid.
  content:
    application/json:
      schema:
        "$ref": "../schemas/common.yaml#/ApiErrorResponse"
Forbidden:
  description: The current user does not have permission.
  content:
    application/json:
      schema:
        "$ref": "../schemas/common.yaml#/ApiErrorResponse"
Conflict:
  description: The request conflicts with a system invariant.
  content:
    application/json:
      schema:
        "$ref": "../schemas/common.yaml#/ApiErrorResponse"
NotFound:
  description: The requested resource was not found.
  content:
    application/json:
      schema:
        "$ref": "../schemas/common.yaml#/ApiErrorResponse"
UnprocessableEntity:
  description: The request body is invalid.
  content:
    application/json:
      schema:
        "$ref": "../schemas/common.yaml#/ApiErrorResponse"
PayloadTooLarge:
  description: The uploaded file exceeds the effective per-file limit.
  content:
    application/json:
      schema:
        "$ref": "../schemas/common.yaml#/ApiErrorResponse"
ServiceUnavailable:
  description: |
    A required backend service, provider slot, or storage provider is
    unavailable. Responses produced by the host dependency-failure path (for
    example a session or identity store outage while resolving the caller)
    also carry `Retry-After: 1` and reason `service.not_ready`: the answer is
    "ask again shortly", never "your credentials are invalid".
  headers:
    Retry-After:
      description: |
        整秒重试间隔。依赖故障路径（app/Http/storage_failure.go 的 storageUnavailable）
        固定答 `1`；其它 503 来源可能不带该 header，客户端按「缺失即自行退避」处理。
      schema:
        type: integer
        minimum: 1
  content:
    application/json:
      schema:
        "$ref": "../schemas/common.yaml#/ApiErrorResponse"
InternalServerError:
  description: An internal consistency or encoding failure prevented the operation.
  content:
    application/json:
      schema:
        "$ref": "../schemas/common.yaml#/ApiErrorResponse"
TooManyRequests:
  description: Rate limit exceeded.
  headers:
    Retry-After:
      description: Whole seconds until the request may be retried.
      schema:
        type: integer
        minimum: 1
  content:
    application/json:
      schema:
        "$ref": "../schemas/common.yaml#/ApiErrorResponse"
