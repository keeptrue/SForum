AdminOverviewRuntime:
  type: object
  required:
  - startedAt
  - uptimeSeconds
  - build
  - memoryBytes
  - heapAllocBytes
  - heapSysBytes
  - sysBytes
  - pluginChildCount
  - goroutineCount
  - gcCount
  - lastGcPauseNs
  - database
  properties:
    startedAt:
      type: string
      format: date-time
    uptimeSeconds:
      type: integer
      format: int64
    build:
      "$ref": "#/AdminOverviewBuildInfo"
    memoryBytes:
      type: integer
      format: int64
      minimum: 0
      description: >
        Primary KPI — resident set size (RSS) of the API process in bytes.
        This is not Go runtime.MemStats.Sys.
    heapAllocBytes:
      type: integer
      format: int64
      minimum: 0
      description: Live heap objects (Go runtime.MemStats.HeapAlloc).
    heapSysBytes:
      type: integer
      format: int64
      minimum: 0
      description: Heap memory obtained from the OS (Go runtime.MemStats.HeapSys).
    sysBytes:
      type: integer
      format: int64
      minimum: 0
      description: >
        Diagnostic — total memory obtained by the Go runtime from the OS
        (runtime.MemStats.Sys). Often higher than RSS because arenas are not
        returned promptly.
    familyMemoryBytes:
      type: integer
      format: int64
      minimum: 0
      description: >
        Optional best-effort sum of API process RSS plus RSS of backend plugin
        child processes currently owned by this API (PPID match). Omits
        reparented orphans (e.g. PPID=1) and plugins owned by other processes.
        Omitted when process sampling fails.
    pluginChildCount:
      type: integer
      minimum: 0
      description: Number of owned backend plugin children included in familyMemoryBytes.
    resources:
      "$ref": "#/AdminOverviewRuntimeResources"
    disk:
      "$ref": "#/AdminOverviewDiskRuntime"
    loadAverage:
      "$ref": "#/AdminOverviewSystemLoadAverage"
    goroutineCount:
      type: integer
      minimum: 0
    gcCount:
      type: integer
      minimum: 0
    lastGcPauseNs:
      type: integer
      format: int64
      minimum: 0
    database:
      "$ref": "#/AdminOverviewDatabaseRuntime"
    worker:
      "$ref": "#/AdminOverviewWorkerRuntime"
    queueLag:
      "$ref": "#/AdminOverviewQueueLag"
AdminOverviewRuntimeResources:
  type: object
  required:
  - apiMemoryBytes
  - workerMemoryBytes
  - pluginMemoryBytes
  - totalMemoryBytes
  - apiMemoryMedianBytes
  - workerMemoryMedianBytes
  - pluginMemoryMedianBytes
  - totalMemoryMedianBytes
  - memorySampleCount
  - pssSampleCount
  - memoryWindowSeconds
  - apiCpuPercent
  - workerCpuPercent
  - pluginCpuPercent
  - totalCpuPercent
  - pluginChildCount
  - pluginOverlapCount
  - workerFound
  - workerEmbedded
  - workerConcurrency
  properties:
    sampledAt:
      type: string
      format: date-time
      description: Capture time shared by the cached process-table frame.
    apiMemoryBytes:
      type: integer
      format: int64
      minimum: 0
      description: Instant resident memory of the API process; includes an embedded Worker.
    workerMemoryBytes:
      type: integer
      format: int64
      minimum: 0
      description: Resident memory of independent SForum worker processes; embedded workers are included in API memory.
    pluginMemoryBytes:
      type: integer
      format: int64
      minimum: 0
      description: Resident memory of owned backend plugin processes.
    totalMemoryBytes:
      type: integer
      format: int64
      minimum: 0
      description: Sum of API, independent worker, and backend plugin resident memory.
    apiPssBytes:
      type: integer
      format: int64
      minimum: 0
      description: Linux-only API proportional set size; omitted unless PSS is available for every counted process.
    workerPssBytes:
      type: integer
      format: int64
      minimum: 0
      description: Linux-only proportional set size of independent Worker processes.
    pluginPssBytes:
      type: integer
      format: int64
      minimum: 0
      description: Linux-only proportional set size of counted plugin processes.
    totalPssBytes:
      type: integer
      format: int64
      minimum: 0
      description: Complete Linux PSS total; omitted when any counted process cannot be sampled.
    apiAnonHugePagesBytes:
      type: integer
      format: int64
      minimum: 0
      description: Current Linux AnonHugePages attributed to the API process.
    workerAnonHugePagesBytes:
      type: integer
      format: int64
      minimum: 0
      description: Current Linux AnonHugePages attributed to independent Worker processes.
    pluginAnonHugePagesBytes:
      type: integer
      format: int64
      minimum: 0
      description: Current Linux AnonHugePages attributed to backend plugin processes.
    totalAnonHugePagesBytes:
      type: integer
      format: int64
      minimum: 0
      description: Current Linux AnonHugePages across the counted process family.
    apiMemoryMedianBytes:
      type: integer
      format: int64
      minimum: 0
      description: Rolling-window median of API RSS.
    workerMemoryMedianBytes:
      type: integer
      format: int64
      minimum: 0
      description: Rolling-window median of independent Worker RSS.
    pluginMemoryMedianBytes:
      type: integer
      format: int64
      minimum: 0
      description: Rolling-window median of plugin RSS.
    totalMemoryMedianBytes:
      type: integer
      format: int64
      minimum: 0
      description: Rolling-window median of total backend RSS.
    apiPssMedianBytes:
      type: integer
      format: int64
      minimum: 0
      description: Rolling-window median of complete Linux API PSS samples.
    workerPssMedianBytes:
      type: integer
      format: int64
      minimum: 0
      description: Rolling-window median of complete Linux Worker PSS samples.
    pluginPssMedianBytes:
      type: integer
      format: int64
      minimum: 0
      description: Rolling-window median of complete Linux plugin PSS samples.
    totalPssMedianBytes:
      type: integer
      format: int64
      minimum: 0
      description: Rolling-window median of complete Linux process-family PSS samples.
    memorySampleCount:
      type: integer
      minimum: 0
      description: Number of unique cached process frames currently in the rolling window.
    pssSampleCount:
      type: integer
      minimum: 0
      description: Number of complete Linux PSS frames currently in the rolling window.
    memoryWindowSeconds:
      type: integer
      minimum: 0
      description: Configured rolling median window duration in seconds.
    apiCpuPercent:
      type: number
      format: double
      minimum: 0
      description: Current process CPU percentage reported by the operating system.
    workerCpuPercent:
      type: number
      format: double
      minimum: 0
    pluginCpuPercent:
      type: number
      format: double
      minimum: 0
    totalCpuPercent:
      type: number
      format: double
      minimum: 0
      description: Sum of API, independent worker, and backend plugin CPU percentages.
    pluginChildCount:
      type: integer
      minimum: 0
      description: Number of counted backend plugin processes owned by the API or an independent Worker.
    pluginOverlapCount:
      type: integer
      minimum: 0
      description: Extra same-extension processes under one owner, normally seen briefly during runtime replacement.
    plugins:
      type: array
      items:
        "$ref": "#/AdminOverviewPluginRuntimeUsage"
    workerFound:
      type: boolean
      description: Whether an independent SForum worker process was found in the process table.
    workerEmbedded:
      type: boolean
      description: Whether River runs inside the API process and therefore has no separable memory value.
    workerConcurrency:
      type: integer
      minimum: 0
      description: Total configured River execution slots for the Worker runtime.
AdminOverviewPluginRuntimeUsage:
  type: object
  required:
  - extensionId
  - memoryBytes
  - cpuPercent
  - processCount
  - apiOwnedProcessCount
  - workerOwnedProcessCount
  properties:
    extensionId:
      type: string
    memoryBytes:
      type: integer
      format: int64
      minimum: 0
      description: Current summed RSS of this extension's counted backend processes.
    pssBytes:
      type: integer
      format: int64
      minimum: 0
      description: Linux-only summed PSS; omitted when the complete process family cannot be sampled.
    pssMedianBytes:
      type: integer
      format: int64
      minimum: 0
      description: Rolling-window median of complete Linux PSS samples for this extension.
    pssSampleCount:
      type: integer
      minimum: 0
      description: Number of this extension's PSS samples in the rolling window.
    anonHugePagesBytes:
      type: integer
      format: int64
      minimum: 0
      description: Current Linux AnonHugePages attributed to this extension's processes.
    cpuPercent:
      type: number
      format: double
      minimum: 0
    processCount:
      type: integer
      minimum: 0
    apiOwnedProcessCount:
      type: integer
      minimum: 0
    workerOwnedProcessCount:
      type: integer
      minimum: 0
