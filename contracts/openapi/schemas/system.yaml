ApiResponseHealth:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Health"
Health:
  type: object
  required:
  - name
  - status
  - environment
  - locale
  - supportedLocales
  - time
  - coreVersion
  properties:
    name:
      type: string
    status:
      type: string
      enum:
      - ok
    environment:
      type: string
    locale:
      type: string
      examples:
      - zh-CN
    supportedLocales:
      type: array
      items:
        type: string
    time:
      type: string
      format: date-time
    coreVersion:
      type: string
      description: |
        Release identity used for extension compatibility; strict semantic
        version. Release builds carry no commit hash and no dev build label.
        Development builds derive it from the nearest reachable v* git tag
        (3.0.16); when the checkout is ahead of that tag the commit distance,
        short SHA, and a dirty marker go into build metadata
        (3.0.16+13.g6f94488ad, 3.0.16+13.g6f94488ad.dirty), never into a
        prerelease segment, so constraints evaluate exactly as they do for the
        tag. Without a reachable tag they fall back to 1.0.0. A development
        checkout can therefore install packages that target the release line
        it is built on.
      examples:
      - 3.0.16
      - 3.0.16+13.g6f94488ad
ApiResponseReady:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Ready"
Ready:
  type: object
  required:
  - status
  - ready
  - checkedAt
  - components
  properties:
    status:
      type: string
      enum:
      - ready
      - degraded
      - not_ready
      description: Overall readiness label; degraded means optional deps failed.
    ready:
      type: boolean
      description: Whether the process should receive traffic.
    checkedAt:
      type: string
      format: date-time
    components:
      type: array
      items:
        "$ref": "#/ReadyComponent"
ReadyComponent:
  type: object
  required:
  - name
  - status
  - required
  properties:
    name:
      type: string
      examples:
      - postgres
      - redis
    status:
      type: string
      enum:
      - ok
      - degraded
      - error
      - skipped
    required:
      type: boolean
    error:
      type: string
    latency:
      type: string
      description: Human-readable check duration, e.g. 2ms.
ApiResponseSystemUpdateStatus:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/SystemUpdateStatus"
SystemUpdateStatus:
  type: object
  required:
  - state
  - updateAvailable
  - currentVersion
  - checkedAt
  - source
  - mirrorConfigured
  properties:
    state:
      type: string
      enum:
      - current
      - update_available
      - development
      - unavailable
    updateAvailable:
      type: boolean
    currentVersion:
      type: string
    currentCommit:
      type: string
    latestVersion:
      type: string
    latestTag:
      type: string
    releaseName:
      type: string
    releaseUrl:
      type: string
      format: uri
    publishedAt:
      type: string
      format: date-time
    checkedAt:
      type: string
      format: date-time
    source:
      type: string
      enum:
      - official
      - mirror
    mirrorConfigured:
      type: boolean
    errorCode:
      type: string
      enum:
      - invalid_source
      - request_failed
      - invalid_response
      - no_release
