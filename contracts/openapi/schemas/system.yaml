AdminOverviewBuildInfo:
  type: object
  required:
  - name
  - version
  - goVersion
  - platform
  - dirty
  - sourceUrl
  properties:
    name:
      type: string
      examples:
      - SForum
    version:
      type: string
      description: Unified SForum version shared by Core, Web, and release artifacts.
      examples:
      - 2.8.0
    commit:
      type: string
      description: Full Git commit when available from release injection or Go VCS metadata.
    builtAt:
      type: string
      format: date-time
      description: Deterministic release commit time when available.
    goVersion:
      type: string
    platform:
      type: string
      description: Build target operating system and architecture (GOOS/GOARCH), such as linux/amd64.
      examples:
      - linux/amd64
    dirty:
      type: boolean
      description: Whether Go VCS metadata reports local source modifications.
    sourceUrl:
      type: string
      format: uri
