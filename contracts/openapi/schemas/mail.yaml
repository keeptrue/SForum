MailProviderSelectionRequest:
  type: object
  required: [extensionId]
  properties:
    extensionId: {type: string, description: Enabled plugin declaring mail.provider.}
MailProviderState:
  type: string
  enum: [ready, unavailable, unconfigured]
  description: ready = selected and runnable; unavailable = selected but disabled/restarting; unconfigured = no resolvable provider.
MailProviderItem:
  type: object
  required: [extensionId, label, healthy]
  properties:
    extensionId: {type: string}
    label: {type: string}
    healthy: {type: boolean}
    status: {type: string, enum: [enabled, unavailable]}
MailProviderSelection:
  type: object
  required: [extensionId, label]
  properties:
    extensionId: {type: string}
    label: {type: string}
ApiResponseMailProviders:
  type: object
  required: [items, selected, configured, state]
  properties:
    items:
      type: array
      items: {$ref: "#/MailProviderItem"}
    selected: {$ref: "#/MailProviderSelection"}
    configured: {type: boolean, description: True when a provider is selected, even if temporarily unavailable.}
    state: {$ref: "#/MailProviderState"}
ApiResponseMailProviderReset:
  type: object
  required: [selected, configured, state, secretsPreserved]
  properties:
    selected: {$ref: "#/MailProviderSelection"}
    configured: {type: boolean}
    state: {$ref: "#/MailProviderState"}
    secretsPreserved: {type: boolean}
MailTestRequest:
  type: object
  properties:
    recipient:
      type: string
      format: email
      description: Optional recipient. When omitted or empty, falls back to site.admin_email.
ApiResponseMailTest:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required:
      - queued
      - deliveryId
      properties:
        recipient:
          type: string
          format: email
          description: Resolved recipient used for the queued test mail.
        queued: {type: boolean}
        deliveryId: {type: integer, format: int64}
NotificationChannelPolicy:
  type: object
  required: [inAppEnabled, emailEnabled]
  properties:
    inAppEnabled: {type: boolean}
    emailEnabled: {type: boolean}
NotificationPolicy:
  type: object
  required: [reply, mention, moderation]
  properties:
    reply: {$ref: "#/NotificationChannelPolicy"}
    mention: {$ref: "#/NotificationChannelPolicy"}
    moderation: {$ref: "#/NotificationChannelPolicy"}
ApiResponseNotificationPolicy:
  type: object
  required: [code, message, data]
  properties:
    code: {type: integer}
    message: {type: string}
    data: {$ref: "#/NotificationPolicy"}
