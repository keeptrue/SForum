TrustLevelRequirements:
  type: object
  description: |
    达到某档所需的最小行为量（AND 语义，0 表示该项不设门槛）。字段名与
    `trust.levels` 的 JSON 完全一致（snake_case）；i18n 的 metric 键是 camelCase，
    两套命名不得混用。
  properties:
    days_visited:
      type: integer
      format: int64
    topic_count:
      type: integer
      format: int64
    comment_count:
      type: integer
      format: int64
    like_received_count:
      type: integer
      format: int64
    like_given_count:
      type: integer
      format: int64
    bookmark_count:
      type: integer
      format: int64

TrustLevelLimits:
  type: object
  description: |
    某档的发言限额覆盖。`null` 表示继承站点默认；`0` 有语义（例如免冷却），
    因此 `null` 与 `0` 绝不能混用。
  properties:
    topicCooldownSeconds:
      type: integer
      nullable: true
    commentCooldownSeconds:
      type: integer
      nullable: true
    dailyTopicLimit:
      type: integer
      nullable: true
    dailyCommentLimit:
      type: integer
      nullable: true

TrustLevelName:
  type: object
  description: |
    档位的双语显示名。两种语言都必填（缺一种会在另一个 locale 显示空档名，
    那种缺失只有切语言才发现得了），单语长度上限 32 个字符。
    这是**运营可改的文案**，不是 i18n 键：i18n 只兜底内置五档。
  required: [zh, en]
  properties:
    zh:
      type: string
    en:
      type: string

TrustLevelDefinition:
  type: object
  required: [level, levelSlug, displayName, icon, color, requirements, earnable, retired, editable]
  properties:
    level:
      type: integer
      description: |
        序号（rank）。`level = 0` 恒为 TL0（新成员，由 `trust.new_user_*` 决定），
        `level = n` 表示当前配置里的第 n 个**启用**档位（停用档位不占号）。
        只用于判定与 `TL{n}` 展示，**不是**身份。
    levelSlug:
      type: string
      description: |
        档位的**稳定身份 id**：`newcomer` / `member` / `resident` / `veteran` /
        `leader` / `tier_<seq>`。后台编辑动作以它为键；运营改名、插入档位、停用档位
        都不会改写它。内置五档的 id 与历史 `levelSlug` 逐字相同。
        刻意不叫 `slug`——TL1 的标识是 `member`，与角色 key 同字符串。
    displayName:
      "$ref": "#/TrustLevelName"
    icon:
      type: string
      description: |
        图标名：16 个默认短名之一（见管理员读面的 `iconChoices`），或
        `i-(lucide|tabler)-<name>` 形式的全名（名字段为小写字母数字与连字符）。
        未选时按 rank 取默认序列：`sprout`/`leaf`/`home`/`mountain`/`crown`/…
        （前五项就是历史五档的在用图标，所以存量站点观感不变）。
        非法取值即 422（`icon_not_whitelisted`）。
    color:
      type: string
      description: |
        **有效色**（恒非空，TL0 也有）：配置里有显式覆盖时取覆盖值，否则按位次取
        默认色序：`colorChoices[n]` 属于 rank `n`（n 从 0 起），所以 TL0 =
        `colorChoices[0]` = `slate`，TL8 = `colorChoices[8]` = `amber`。
        「跟随位次」是服务端的解析结果，不是客户端的判断分支——本字段永远不下发空值。
        写入时 `trust.levels` 的 `tiers[].color` 可以省略或写空串表示自动，
        合法取值为 `colorChoices` 中的 9 个 token，或 `#rrggbb` 六位 hex（存储前
        统一转小写）；两者之外即 422（`color_not_whitelisted`）。
      oneOf:
        - type: string
          enum:
            - slate
            - teal
            - emerald
            - sky
            - indigo
            - violet
            - fuchsia
            - rose
            - amber
        - type: string
          pattern: "^#[0-9a-f]{6}$"
    requirements:
      "$ref": "#/TrustLevelRequirements"
    earnable:
      type: array
      description: |
        该档**恰好**解锁的既有权限键（不含更低档）。
        本字段只表达**运营配置**的解锁：默认安装下 TL0 的两键扣除来自装载期基线门
        （代码常量，不进本字段），因此「本字段全为空」不等于「各档权限集合相等」。
      items:
        type: string
    retired:
      type: boolean
      description: |
        软停用标记。目录里恒为 `false`——停用档位既不进判定也不进目录，只保留在
        `trust.levels` 的 `config` 里（配置全量保留，恢复后回到原 rank）。
    editable:
      type: boolean
      description: |
        该条是否对应 `trust.levels` 里可编辑的档位。TL0 恒为 `false`：它的阈值/限额
        由 `trust.new_user_*` 七键与基线门决定，`trust.levels` 里没有它的位置。

TrustLevelAdminDefinition:
  description: |
    后台读面的档位形状 = 公开形状 + 两个只有运营才该看到的字段（`limits` / `rule`）。

    **为什么必须是两个 schema 而不是一个带可选字段的 schema**：公开面与后台面曾经
    共用同一个结构，靠「投影时记得不赋值」的运行期纪律区分；那种纪律在下一个改
    `includeLimits` 的人手里就会破。拆开之后，公开面**没有** `rule` 字段可赋值，
    规则树漏进公开响应在编译期就不可能发生（`TrustLevelDefinition` 里没有它）。
  allOf:
    - "$ref": "#/TrustLevelDefinition"
    - type: object
      properties:
        limits:
          allOf:
            - "$ref": "#/TrustLevelLimits"
          description: |
            本档的发言限额；`null` 字段表示沿用站点默认（0 有语义，不能混用）。
            只在后台读面出现：公开「某档冷却 60 秒、日限额 10 帖」等于把限流参数交给
            想绕过它的人。写入时该字段**必须显式出现**（可写 `null`），省略即 422。
            TL0 没有对应档位，因此该项不出现。
        rule:
          type: object
          nullable: true
          description: |
            本档的可选规则树（M1）。**仅后台读面下发**：公开规则树等于把「怎么刷等级」
            的判定逻辑印在公告板上，而且 AST 词汇（`children` / `cmp` / `params`）
            本就不该进公开契约。

            形状与 `trust.levels` 里 `tiers[].rule` 逐字节相同（`{"v":1,"root":…}`），
            服务端**原样透传**未编辑的规则：读一次再存一次不会改写键序。无规则的档位
            省略该键（不是 `null`）；解码期显式 `null` 与省略等价。
          additionalProperties: true

TrustLevelNamePool:
  type: object
  description: |
    命名池：**编辑辅助**，不是存储字段。运营可以完全无视它自己写名字；
    `zh` 与 `en` 一一对应、同序。增删命名池不影响任何存量配置。
  required: [zh, en]
  properties:
    zh:
      type: array
      items:
        type: string
    en:
      type: array
      items:
        type: string

TrustLevelCountBounds:
  type: object
  description: 启用档位数的合法区间（至少 1 档、最多 8 档；停用档位不计数）。
  required: [min, max]
  properties:
    min:
      type: integer
    max:
      type: integer

TrustLevelBottleneck:
  type: object
  required: [metric, current, threshold]
  properties:
    metric:
      type: string
    current:
      type: integer
      format: int64
    threshold:
      type: integer
      format: int64

TrustLevelViewer:
  type: object
  description: 只对本人返回；他人视角只有 level / levelSlug / displayName。
  required: [level, levelSlug]
  properties:
    level:
      type: integer
    levelSlug:
      type: string
    nextLevel:
      type: integer
    bottleneck:
      "$ref": "#/TrustLevelBottleneck"

TrustLevelCatalog:
  type: object
  required: [levels, newUserDays]
  properties:
    levels:
      type: array
      description: |
        档位目录：第一条恒为合成的 TL0（`level: 0`、`editable: false`），其后按 rank
        升序排列启用档位。停用档位不出现在这里。
      items:
        "$ref": "#/TrustLevelDefinition"
    newUserDays:
      type: integer
      description: "「最多当多久新成员」的上限闸，来自既有 trust.new_user_days。"
    viewer:
      "$ref": "#/TrustLevelViewer"

ApiResponseTrustLevelCatalog:
  type: object
  properties:
    data:
      "$ref": "#/TrustLevelCatalog"

TrustLevelAdmin:
  type: object
  required: [config, levels, eligiblePermissions, baselinePermissions, recommendedConfig, iconChoices, colorChoices, namePool, tierLimits, nextTierSeq]
  properties:
    config:
      type: string
      description: 当前 trust.levels 的 JSON 字符串（**v2 形状**：`schemaVersion` + `tiers[]`）。
    levels:
      type: array
      description: |
        与公开目录同形的档位列表，另带 `limits` 与 `rule`（两者都只有运营需要）。
      items:
        "$ref": "#/TrustLevelAdminDefinition"
    baselinePermissions:
      type: array
      description: |
        系统基线门的键（Z3-b″）：默认安装下 TL0 必须被扣掉、TL1 起自动生效。
        与 eligiblePermissions 同级但语义相反——后者是「允许被等级授予的白名单」，
        本字段是「TL0 会被扣掉的基线键」。运营不可编辑，只用于后台说明与
        「系统基线」标注；前端缺字段时应静默不渲染基线话术。
      items:
        type: string
    eligiblePermissions:
      type: array
      description: |
        后台可勾选的权限键正白名单（只有七个内容创建/管理自己内容的键）。
        **顺序即 UI 展示顺序**（后台勾选矩阵按此顺序渲染），七键固定：增删必须同批改
        前端矩阵、OpenAPI 与本字段的形状测试，不得在别处硬编码第二份副本。
      items:
        type: string
    recommendedConfig:
      type: string
      description: 内置推荐值的 JSON 字符串（**v2 形状**；恢复默认写回它）。
    iconChoices:
      type: array
      description: |
        默认图标序列 + 后台推荐选项（16 个 lucide 图标短名）。顺序即 UI 展示顺序，
        前五项同时是默认图标序列（芽/叶/屋/山/冠）。它**不是**服务端唯一的合法取值：
        运营还可写入 `i-(lucide|tabler)-<name>` 全名（能被 @nuxt/icon serverBundle
        解析即可）。本列表只作为推荐下拉下发；前端不得自己再抄一份：
        抄了就会在服务端升级时变成「UI 里有、保存时 422」。
      items:
        type: string
    colorChoices:
      type: array
      description: |
        默认色序 + 后台推荐选项（9 项）。**顺序即默认色序，且与 rank 一一对应**：
        `colorChoices[n]` 属于 rank `n`（n 从 0 起），因此 TL0 = `slate`、
        TL1 = `teal`、…、TL8 = `amber`。可配置档位最多 8 个（TL1..TL8），加上 TL0
        正好 9 个合法 rank，所以色板必须正好 9 项——少一项就会让满配站点的顶档
        回退到首项、与 TL0 同色。
        它**不是**服务端唯一的合法取值：运营还可写入 `#rrggbb` 六位 hex（存储前
        统一转小写）。本列表只作为推荐下拉与「跟随位次」预览下发，前端不得自己再抄
        一份。颜色是档位识别色，与站点主题的 accent 解耦；hex 自定义色的明暗适配由
        前端 CSS 从同一色值派生。
      minItems: 9
      maxItems: 9
      items:
        type: string
        enum: [slate, teal, emerald, sky, indigo, violet, fuchsia, rose, amber]
    namePool:
      "$ref": "#/TrustLevelNamePool"
    tierLimits:
      "$ref": "#/TrustLevelCountBounds"
    nextTierSeq:
      type: integer
      description: |
        下一个新档 id 的序号：新档 id = `tier_<seq>`，
        `seq = max(所有档位的数字后缀, deletedTierIds 里的数字后缀, 5) + 1`。
        前端新建档位时**不得自己编 id**，这里下发的序号只用于显示「将创建 tier_<n>」，
        最终 id 由服务端在解码期派生（软停用与删除墓碑都计入，所以 id 永不复用）。

ApiResponseTrustLevelAdmin:
  type: object
  properties:
    data:
      "$ref": "#/TrustLevelAdmin"

TrustLevelConfigInput:
  type: object
  required: [config]
  properties:
    config:
      type: string
      description: |
        `trust.levels` 的 Config 形状 JSON 字符串，当前版本是 **v2**：

        ```json
        {"schemaVersion":2,"tiers":[
          {"id":"member","name":{"zh":"正式用户","en":"Member"},"icon":"leaf","color":"teal",
           "requirements":{...},"limits":null,"earnable":[],"retired":false}],
         "deletedTierIds":["tier_9"]}
        ```

        数组顺序 = 判定与展示顺序，rank 由「启用档位在数组中的位次」派生（TL1 起），
        不落字段；TL0 不在 `tiers` 里。`id` 省略/空串表示新档（序号由服务端派生），
        已存在的档位必须原样回传，否则等于换身份。
        `limits` 与 `earnable` 必须显式出现（可写 `null` / `[]`），省略即 422。
        `tiers[].color` **可选**：省略或空串 = 跟随位次自动（不落存储），非空值必须是
        `colorChoices` 中的 9 个 token，或 `#rrggbb` 六位 hex（落库前统一转小写）。`deletedTierIds` **可选**：运营真正删除的档位 id（按提交顺序），
        会抬高 `nextTierSeq` 使 id 永不复用；与 `tiers[].id` 冲突、重复、或不合法均 422。
        两个新字段都 omitempty，所以「没用过颜色/没删过档」的配置与引入前逐字节相同。
        **v1 形状仍被接受**（`{"schemaVersion":1,"levels":[...]}`）：解码时在内存里
        升级为 v2，保存时写回 v2。旧版本二进制无法解码 v2，所以回滚需要同时回退该值。

TrustLevelConfigErrorDetail:
  type: object
  description: |
    一条字段级错误明细（D-N14）。接入方按 `rank`/`tierId` 定位到哪一档、按 `field`
    定位到哪一格输入。

    三句话说完展示口径：
    1. **展示路径是 `reasonCode` + `params`**：前端按 `reasonCode` 拼 i18n 文案，
       用 `params` 插值；`reason` 只在某个 `reasonCode` 还没有对应文案时，作为技术
       细节兜底显示。
    2. `reason` **不是**稳定的、**不是**可枚举的，服务端可随时改措辞（它随服务端语言
       变化），**不得**用作主提示文案。
    3. 明细**最多 8 条**，顺序即解码顺序（运营修前几条即可）；`details` 可缺席，
       缺席即「只有统一机器码 `trust_levels.invalid_config`」，前端需容错。
  required: [rank, tierId, field, reasonCode, reason]
  properties:
    rank:
      type: integer
      description: |
        出错的档位序号（TL1 起）。`0` 表示无法定位到具体档位：全局字段
        （`schemaVersion` / 形状混用）、JSON 语法错误，或出错的是一条停用档位
        （停用档位不占 rank，改用 `tierId` 定位）。
    tierId:
      type: string
      description: |
        出错的档位身份 id；新档（id 由服务端派生）或全局错误时为空串。
        已存在的档位一定能保持原 id，所以前端可以用它直接命中那一行。
    field:
      type: string
      description: |
        稳定的字段路径，取值域固定为：
        `schemaVersion` / `tiers` / `levels` / `id` / `levelSlug` /
        `name.zh` / `name.en` / `icon` / `color` / `requirements.<metric>` /
        `limits` / `limits.<limitKey>` / `earnable` / `rule` / `deletedTierIds`；
        空串表示无法归因到字段
        （例如整份 JSON 语法错误）。
    reasonCode:
      type: string
      description: |
        **稳定且可枚举**的机器码：前端按它拼 i18n 文案（`reasonCode → i18n`，
        取不到文案再退回 `reason`）。取值域与后端 `trustlevels.ConfigErrorReasonCodes()`
        同源，增删必须同批改这里、后端常量表与前端 locale；改名等于破坏兼容。
      enum:
        - schema_version_unsupported
        - schema_shape_invalid
        - json_syntax_invalid
        - json_type_mismatch
        - unknown_field
        - config_unparseable
        - tail_content
        - tier_count_out_of_range
        - id_invalid
        - id_reserved_for_tl0
        - id_duplicate
        - id_derivation_conflict
        - icon_not_whitelisted
        - color_not_whitelisted
        - name_missing
        - name_too_long
        - requirement_negative
        - requirement_unknown_metric
        - limits_missing
        - limits_unparseable
        - limit_negative
        - earnable_missing
        - earnable_unparseable
        - earnable_key_empty
        - earnable_not_whitelisted
        - earnable_invalid
        - earnable_not_declared
        - rule_too_complex
        - rule_unknown_condition
        - rule_shape_invalid
        - rule_reference_invalid
        - rule_condition_not_available
        - level_unknown
        - level_reserved_for_tl0
        - level_duplicate
        - level_legacy_missing
        - deleted_tier_id_invalid
        - deleted_tier_id_duplicate
        - deleted_tier_id_present
    params:
      type: object
      description: |
        i18n 插值参数，键名也是契约。按 `reasonCode` 取用：
        `icon_not_whitelisted` → `icon`；`color_not_whitelisted` → `color`；
        `name_missing` / `name_too_long` →
        `locale`（zh/en，`name_too_long` 另有 `maxLength`）；`requirement_negative` /
        `requirement_unknown_metric` → `metric`（`requirement_negative` 另有 `value`）；
        `limit_negative` → `key` + `value`；`earnable_not_whitelisted` → `permission`；
        `id_invalid` / `id_duplicate` / `id_reserved_for_tl0` / `id_derivation_conflict` /
        `deleted_tier_id_invalid` / `deleted_tier_id_duplicate` / `deleted_tier_id_present`
        → `id`；`level_unknown` / `level_reserved_for_tl0` / `level_duplicate` →
        `levelSlug`；`level_legacy_missing` → `level`；
        `tier_count_out_of_range` → `active` + `min` + `max`；
        规则类码（`rule_*`）→ `path`（规则树节点坐标，形如
        `root.children[1].cmp`，与 `ruleengine.Error.Path` 同源）；其中
        `rule_unknown_condition` / `rule_condition_not_available` 另有 `condition`
        （出问题的条件 key），`rule_reference_invalid` 另有 `ref`（已失效的引用值）。
      additionalProperties: true
    reason:
      type: string
      description: |
        人读兜底（后端散文，随服务端语言）。**不用于正式展示**：本仓口径是后端不输出
        文案、由前端按 `reasonCode` 拼。这里保留它只为服务端日志与「没有该 reasonCode
        文案的旧前端」不退化成空白。

TrustLevelConfigValidationError:
  type: object
  description: |
    `PUT /admin/trust-levels` 的 422 响应。机器可判的码**恒为**
    `trust_levels.invalid_config`（前端按它分流，不随档位变化），字段级明细放在
    `data.details.errors`。
  required: [code, message, data]
  properties:
    code:
      type: integer
      example: 422
    message:
      type: string
    data:
      type: object
      required: [reason, details]
      properties:
        reason:
          type: string
          example: trust_levels.invalid_config
        details:
          type: object
          required: [errors]
          properties:
            errors:
              type: array
              description: |
                字段级明细，按解码顺序给出；**最多 8 条**（上界避免一份全坏的配置
                把响应刷成几百条，运营修前几条即可）。明细为空时本字段不出现
                （结构化错误之外的兜底），前端需容错。
              maxItems: 8
              items:
                "$ref": "#/TrustLevelConfigErrorDetail"

# ---- 规则编辑面（M1）：条件目录与影响估算 ----
#
# 两条端点的形状与徽章侧（`/admin/badges/conditions`、`/admin/badges/:badgeID/rule-impact`）
# 逐字段对齐：前端共用同一套规则编辑器与同一套「≈ N 人」文案，另起一套字段名等于让
# 那份组件需要两份适配。

TrustLevelConditionParam:
  type: object
  description: 条件的一个参数。字段名与编辑器契约逐字一致（前端按 `kind` 选控件）。
  required: [name, kind, required]
  properties:
    name:
      type: string
    kind:
      type: string
      enum: [int, enum, window, objectRef, string, bool]
    required:
      type: boolean
    min:
      type: integer
      format: int64
      description: 只对 `int` 生效；0 或缺席都表示「不限制」。
    max:
      type: integer
      format: int64
      description: 只对 `int` 生效；0 或缺席都表示「不限制」。
    options:
      type: array
      description: |
        `enum` 的候选。**空数组与缺席语义相反**：空数组 = 关闭集（一个都不合法），
        缺席 = 开放集（值不受枚举约束，例如 `fact.count` 的 `variant`）。
      items:
        type: string
    refKind:
      type: string
      description: 只对 `objectRef` 有意义，告诉编辑器该渲染哪类候选。

TrustLevelCondition:
  type: object
  description: |
    一条**信任等级可用**的条件。这是共享条件目录的子集（排除内容质量两条
    `content.pinned` / `content.hidden`），不是共享目录本身——把子集外的条件下发，
    等于让运营拖进一条保存必被拒的条件。
  required: [key, valueKind, compare, labelZh, labelEn, params]
  properties:
    key:
      type: string
      description: 条件标识，写进规则叶子的 `type`。
    valueKind:
      type: string
      enum: [count, boolean]
      description: |
        `count` 必须带 `cmp`；`boolean` **禁止**带 `cmp`（给了就是 422
        `rule_shape_invalid`）。
    compare:
      type: array
      description: 该条件允许的比较符；`boolean` 恒为空数组。
      items:
        type: string
        enum: [gte, gt, lte, lt, eq]
    labelZh:
      type: string
    labelEn:
      type: string
    describeZh:
      type: string
    describeEn:
      type: string
    unitZh:
      type: string
    unitEn:
      type: string
    params:
      type: array
      items:
        "$ref": "#/TrustLevelConditionParam"

TrustLevelFactVariant:
  type: object
  required: [value, label]
  properties:
    value:
      type: string
    label:
      "$ref": "#/TrustLevelName"

TrustLevelFactCandidate:
  type: object
  description: |
    一个已被启用插件声明的插件事实（`fact.count` 的 `factKey` 候选）。

    插件停用后候选消失，引用它的事实叶子求值转 `unknown`（fail-closed）；**解码不失败**
    ——否则一次插件停用会让整份 `trust.levels` 解不开、全站等级退回默认策略。
  required: [key, label, unit, compare, variants]
  properties:
    key:
      type: string
    label:
      "$ref": "#/TrustLevelName"
    unit:
      allOf:
        - "$ref": "#/TrustLevelName"
      nullable: true
      description: |
        `null` 表示该事实没有计量单位（与「空字符串单位」不同）。
    compare:
      type: array
      items:
        type: string
    variants:
      type: array
      items:
        "$ref": "#/TrustLevelFactVariant"

TrustLevelRefCandidate:
  type: object
  description: 一个 objectRef 参数的下拉候选。
  required: [value, label, flags]
  properties:
    value:
      type: string
      description: 写进规则 `params` 的取值。
    label:
      type: string
      description: 展示名（库里只有单串，不做双语）。
    flags:
      type: array
      description: |
        `hidden`（当前不可公开访问）/ `disabled`（当前被停用）。**只做标记、不过滤**：
        被隐藏的分类与停用的角色仍可被规则引用（历史事实），运营需要看见后果。
      items:
        type: string
        enum: [hidden, disabled]

TrustLevelRefCandidateGroup:
  type: object
  description: |
    一类候选。五类**恒为五项、固定顺序** `badge → category → tag → role → provider`，
    由服务端保证顺序。
  required: [kind, candidates, unavailable, truncated]
  properties:
    kind:
      type: string
      enum: [badge, category, tag, role, provider]
    candidates:
      type: array
      items:
        "$ref": "#/TrustLevelRefCandidate"
    unavailable:
      type: boolean
      description: |
        `true` = **取不到候选**（读库失败），编辑器应退回文本输入；
        与「候选为空」（读到但确实没有）是两件事，不可合并。
    truncated:
      type: boolean
      description: 该类候选超过服务端上限（500）已被截断；编辑器应提示「仅显示前 N 条」。

TrustLevelConditionCatalog:
  type: object
  description: |
    `GET /admin/trust-levels/conditions` 的响应体：编辑器要的全套静态数据。
    本端点**不写库、不入队、不发事件**，权限是 `admin.access`。
  required: [conditions, factCandidates, refCandidates]
  properties:
    conditions:
      type: array
      description: |
        信任等级可用的条件子集（共享目录排除内容质量两条）。条数随共享目录增长，
        **本契约不写死数字**：前端按数组渲染，不按数量断言。
      items:
        "$ref": "#/TrustLevelCondition"
    factCandidates:
      type: array
      description: |
        已被启用插件声明的事实候选。没有插件声明时为空数组（此时 `fact.count` 不会
        出现在 `conditions` 里——空下拉对运营是死路）。
      items:
        "$ref": "#/TrustLevelFactCandidate"
    refCandidates:
      type: array
      description: 五组对象候选，固定顺序。
      minItems: 5
      maxItems: 5
      items:
        "$ref": "#/TrustLevelRefCandidateGroup"

ApiResponseTrustLevelConditionCatalog:
  type: object
  properties:
    data:
      "$ref": "#/TrustLevelConditionCatalog"

TrustLevelRuleImpactTierInput:
  type: object
  description: |
    一档的**草稿**输入。不依赖已保存的策略：新档（`tierId` 为空串）同样估算——
    运营点开弹窗时通常还没保存，只给已保存档位估算会让这个功能在最需要它时缺席。
  required: [tierId]
  properties:
    tierId:
      type: string
      description: 只用于把结果对回请求；新档为空串。
    requirements:
      allOf:
        - "$ref": "#/TrustLevelRequirements"
      description: |
        本档的数值快筛。省略或全 0 = 不设数值门槛。
        服务端会把非零指标折成 `activity.count`（累计 `gte`）叶子，与规则树 **AND**
        后一起估算——只按规则估会把「数值门槛先砍掉 99%」的档位估成全员。
    rule:
      type: object
      nullable: true
      description: 草稿规则树（形状同 `trust.levels` 的 `tiers[].rule`）。省略 = 无规则。
      additionalProperties: true

TrustLevelRuleImpactRequest:
  type: object
  required: [tiers]
  properties:
    tiers:
      type: array
      items:
        "$ref": "#/TrustLevelRuleImpactTierInput"

TrustLevelRuleImpactTierResult:
  type: object
  description: |
    一档的估算结论。`estimated: null` 与 `partial` 是**两个独立维度**：
    `null` = 算不出来；`partial` = 算出来了但只用了部分条件，所以那个数是上界。
  required: [tierId, estimated, method, partial, unsupportedConditions]
  properties:
    tierId:
      type: string
    estimated:
      type: integer
      format: int64
      nullable: true
      description: |
        估算人数（上界）。`null` 表示**无法估算**，不是「0 人」——把算不出来写成 0 会
        让运营读成「这规则没人能达标」然后去改一条本来正确的规则。
    method:
      type: string
      description: |
        估算方法，前端按它选文案（与徽章同名同义）：
        `single_leaf`（单条件）、`strictest_leaf`（AND 取最严）、
        `sum_of_leaves`（OR 求和）、`complement_of_leaf`（NOT 取补）、
        `strictest_leaf_partial`（AND 里部分条件不可估，仍给上界）、
        `unsupported_condition`（含不可估条件）、
        `unconditional`（该档没有任何条件 = 全员达标）、
        `no_rule`（刻意不估）、
        `estimate_failed`（草稿规则解不开，不报错只是不估）。
    partial:
      type: boolean
      description: 估算只用了部分条件（`true` 时前端必须补一句「这个数字是上界」）。
    unsupportedConditions:
      type: array
      description: |
        参与规则但无法估算的条件 key。`estimated: null` 时逐个列出，帮运营判断该删哪一个。
        该数组恒为数组（可能为空），不是 `null`。
      items:
        type: string

TrustLevelRuleImpactResponse:
  type: object
  required: [tiers]
  properties:
    tiers:
      type: array
      description: 与请求同序一一对应。
      items:
        "$ref": "#/TrustLevelRuleImpactTierResult"

ApiResponseTrustLevelRuleImpactResponse:
  type: object
  properties:
    data:
      "$ref": "#/TrustLevelRuleImpactResponse"
