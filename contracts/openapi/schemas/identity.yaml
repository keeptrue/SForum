    name: { type: string }
    scopes: { type: array, items: { type: string } }
    prefix: { type: string }
    lastUsedAt: { type: string, format: date-time }
    expiresAt: { type: string, format: date-time }
    revokedAt: { type: string, format: date-time }
    createdAt: { type: string, format: date-time }
CreatedAPIToken:
  allOf:
  - "$ref": "#/APIToken"
  - type: object
    required: [token]
    properties:
      token:
        type: string
