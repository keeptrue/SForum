ApiResponseCurrentUser:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/CurrentUser"

ApiResponseLogin:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      description: |
        未携带 `issueApiToken` 时为 `CurrentUser`（浏览器会话路径不变）；
        携带 `issueApiToken` 时为 `LoginIssuedToken`。
      oneOf:
      - "$ref": "#/CurrentUser"
      - "$ref": "#/LoginIssuedToken"

LoginIssuedToken:
  type: object
  required:
  - user
  - apiToken
  properties:
    user:
      "$ref": "#/CurrentUser"
    apiToken:
      "$ref": "#/CreatedAPIToken"
      description: One-time issued personal access token. The plaintext `token` field is returned only in this response.
ApiResponseRegistrationStatus:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/RegistrationStatus"
ApiResponseRole:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Role"
ApiResponseRoleList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/Role"
RoleSuggestion:
  type: object
  allOf:
  - if:
      properties:
        approvalState:
          enum:
          - pending
          - rejected
      required:
      - approvalState
    then:
      properties:
        applied:
          const: false
  required:
  - id
  - permissionKey
  - ownerExtensionId
  - extensionVersionId
  - extensionVersion
  - packageDigest
  - permissionContractVersion
  - declarationDigest
  - roleKey
  - approvalState
  - applied
  - revision
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    permissionKey:
      type: string
    ownerExtensionId:
      type: string
    extensionVersionId:
      type: integer
      format: int64
      minimum: 1
    extensionVersion:
      type: string
    packageDigest:
      type: string
      pattern: '^[a-f0-9]{64}$'
    permissionContractVersion:
      type: string
    declarationDigest:
      type: string
      pattern: '^[a-f0-9]{64}$'
    roleKey:
      type: string
    approvalState:
      type: string
      enum:
      - pending
      - approved
      - rejected
    applied:
      type: boolean
      description: True only when immutable Host grant evidence exists.
    revision:
      type: integer
      format: int64
      minimum: 1
    decidedByUserId:
      type: integer
      format: int64
      minimum: 1
    decisionAuditEventId:
      type: integer
      format: int64
      minimum: 1
    decidedAt:
      type: string
      format: date-time
    appliedByUserId:
      type: integer
      format: int64
      minimum: 1
    appliedAuditEventId:
      type: integer
      format: int64
      minimum: 1
    appliedAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
RoleSuggestionPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      maxItems: 100
      items:
        "$ref": "#/RoleSuggestion"
    nextCursor:
      type: string
RoleSuggestionDecisionInput:
  type: object
  additionalProperties: false
  required:
  - expectedRevision
  - approvalState
  properties:
    expectedRevision:
      type: integer
      format: int64
      minimum: 1
    approvalState:
      type: string
      enum:
      - approved
      - rejected
ApiResponseRoleSuggestion:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/RoleSuggestion"
ApiResponseRoleSuggestionPage:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/RoleSuggestionPage"
ApiResponsePermissionList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: array
      items:
        "$ref": "#/Permission"
ApiResponsePermissionMatrix:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/PermissionMatrix"
ApiResponseAdminUserList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AdminUserList"
ApiResponseAdminUserDetail:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AdminUserDetail"
ApiResponseAltchaChallenge:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AltchaChallenge"
CurrentUser:
  type: object
  required:
  - id
  - username
  - displayName
  - locale
  - appearance
  - status
  - emailVerified
  - isInitialSuperAdmin
  - avatar
  - roleKeys
  - permissions
  properties:
    id:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
    locale:
      type: string
    appearance:
      oneOf:
      - "$ref": "#/UserAppearancePreference"
      - type: 'null'
      description: A private account override. Null means the user follows site appearance settings.
    status:
      type: string
      enum:
      - active
      - disabled
      - banned
    emailVerified:
      type: boolean
      description: Whether the account email has been confirmed.
    isInitialSuperAdmin:
      type: boolean
    avatar:
      "$ref": "../schemas/profile.yaml#/AvatarView"
    roleKeys:
      type: array
      items:
        type: string
    permissions:
      type: array
      items:
        type: string
UpdateCurrentUserLocaleRequest:
  type: object
  additionalProperties: false
  properties:
    locale:
      type: string
      description: An enabled site locale. Omit or send an empty value to restore the site default locale.
UserAppearancePreference:
  type: object
  additionalProperties: false
  required:
  - theme
  - lightBackground
  properties:
    theme:
      type: string
      description: A Core preset name or custom:#rrggbb.
    lightBackground:
      type: string
      enum:
      - pure_white
      - porcelain
      - paper
      - parchment
      - mist_gray
      - cool_frost
      - cloud_blue
      - mint_mist
      - sage
      - sakura
      - lilac_mist
      - morning_apricot
UpdateCurrentUserAppearanceRequest:
  allOf:
  - "$ref": "#/UserAppearancePreference"
RegistrationStatus:
  type: object
  required:
  - nextUserIsInitialSuperAdmin
  - registrationEnabled
  properties:
    nextUserIsInitialSuperAdmin:
      type: boolean
      description: Always false on the public endpoint to avoid leaking the bootstrap window.
    registrationEnabled:
      type: boolean
      description: Whether the UI should offer registration. Forced true when no users exist yet (bootstrap); otherwise follows identity.registration.enabled.
RegisterRequest:
  type: object
  required:
  - username
  - email
  - password
  properties:
    username:
      type: string
      minLength: 1
      description: Trimmed username. Must not be blank.
    email:
      type: string
      format: email
      description: Trimmed email address. Must not be blank.
    password:
      type: string
      format: password
      minLength: 12
      description: Must contain at least 12 characters.
    displayName:
      type: string
      description: Optional display name. Blank values default to username.
    locale:
      type: string
    humanVerification:
      "$ref": "#/HumanVerification"
      description: Required when the deployment enables human verification for registration.
HumanVerification:
  type: object
  required:
  - provider
  - token
  properties:
    provider:
      type: string
      enum:
      - altcha
    token:
      type: string
      description: Base64-encoded ALTCHA payload emitted by the widget.
AltchaChallenge:
  type: object
  required:
  - parameters
  properties:
    parameters:
      type: object
      required:
      - algorithm
      - nonce
      - salt
      - cost
      - keyLength
      - keyPrefix
      properties:
        algorithm:
          type: string
          examples:
          - PBKDF2/SHA-256
        nonce:
          type: string
        salt:
          type: string
        cost:
          type: integer
        keyLength:
          type: integer
        keyPrefix:
          type: string
        keySignature:
          type: string
        memoryCost:
          type: integer
        parallelism:
          type: integer
        expiresAt:
          type: integer
          format: int64
        data:
          type: object
          additionalProperties: true
    signature:
      type: string
LoginRequest:
  type: object
  required:
  - login
  - password
  properties:
    login:
      type: string
      description: Username or email address.
    password:
      type: string
      format: password
    humanVerification:
      "$ref": "#/HumanVerification"
      description: Required only after the account-level risk threshold is reached and the password is correct.
    issueApiToken:
      "$ref": "#/CreateAPITokenRequest"
      description: |
        可选。原生 App / 机器客户端在登录成功的同时签发一枚个人访问令牌，
        免去「cookie 会话 + CSRF 二次换取令牌」。规则与 `POST /auth/tokens` 相同；
        为空时登录响应保持 `CurrentUser` 形状。
    stepUpEvidence:
      type: string
      description: Host-minted one-use session policy evidence, when a session policy requires it.
Role:
  type: object
  required:
  - id
  - key
  - alias
  - description
  - isSystem
  - isDefault
  - isDeletable
  - isEnabled
  - permissionKeys
  properties:
    id:
      type: integer
      format: int64
    key:
      type: string
    alias:
      type: string
    description:
      type: string
    isSystem:
      type: boolean
    isDefault:
      type: boolean
    isDeletable:
      type: boolean
    isEnabled:
      type: boolean
    permissionKeys:
      type: array
      items:
        type: string
RoleCreateInput:
  type: object
  required:
  - key
  - alias
  properties:
    key:
      type: string
      minLength: 1
      pattern: "^[a-z0-9_.-]+$"
      description: Stable role key used in URLs. Trimmed value may contain lowercase letters, numbers, dots, hyphens, or underscores.
    alias:
      type: string
      minLength: 1
      description: Display name shown to administrators and users. Trimmed value must not be blank.
    description:
      type: string
      description: Optional role description.
RoleUpdateInput:
  type: object
  required:
  - alias
  properties:
    alias:
      type: string
      minLength: 1
      description: Display name shown to administrators and users. Trimmed value must not be blank.
    description:
      type: string
      description: Optional role description.
Permission:
  type: object
  required:
  - key
  - module
  - label
  - description
  properties:
    key:
      type: string
    module:
      type: string
    label:
      type: string
      description: Locale-resolved display label supplied by an extension, or empty for Host permissions that use the built-in UI catalog.
    description:
      type: string
      description: Locale-resolved extension description or the Host permission fallback description.
RolePermissionSet:
  type: object
  required:
  - roleKey
  - permissionKeys
  properties:
    roleKey:
      type: string
    permissionKeys:
      type: array
      items:
        type: string
PermissionMatrix:
  type: object
  required:
  - permissions
  - roles
  properties:
    permissions:
      type: array
      items:
        "$ref": "#/Permission"
    roles:
      type: array
      items:
        "$ref": "#/RolePermissionSet"
PermissionOverrides:
  type: object
  required:
  - allow
  - deny
  properties:
    allow:
      type: array
      items:
        type: string
    deny:
      type: array
      items:
        type: string
AdminUserSummary:
  type: object
  required:
  - id
  - username
  - email
  - emailVerified
  - displayName
  - locale
  - status
  - isInitialSuperAdmin
  - roleKeys
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    username:
      type: string
    email:
      type: string
      format: email
    emailVerified:
      type: boolean
    displayName:
      type: string
    locale:
      type: string
    status:
      type: string
      enum:
      - active
      - disabled
      - banned
    isInitialSuperAdmin:
      type: boolean
    roleKeys:
      type: array
      items:
        type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
AdminUserProfile:
  type: object
  required:
  - bio
  - signature
  - location
  - websiteUrl
  properties:
    bio:
      type: string
    signature:
      type: string
    location:
      type: string
    websiteUrl:
      type: string
AdminUserDetail:
  allOf:
  - "$ref": "#/AdminUserSummary"
  - type: object
    required:
    - permissions
    - permissionOverrides
    - profile
    - activity
    - sessions
    - recentAuthEvents
    - kind
    properties:
      kind:
        type: string
        enum:
        - human
        - bot
        description: Account kind. Bot accounts cannot sign in and never trigger AI replies themselves.
      permissions:
        type: array
        items:
          type: string
      permissionOverrides:
        "$ref": "#/PermissionOverrides"
      profile:
        "$ref": "#/AdminUserProfile"
      activity:
        "$ref": "#/AdminUserActivity"
        description: Activity summary for admin inspection (topic/comment counts, last login IP/UA).
      sessions:
        type: array
        description: Recent login sessions with full client IP and raw User-Agent (admin-only).
        items:
          "$ref": "#/AdminSessionInspect"
      recentAuthEvents:
        type: array
        description: Recent login/register audit events with IP and User-Agent.
        items:
          "$ref": "#/AdminAuthEvent"
      passwordChangedAt:
        type: string
        format: date-time
        nullable: true
        description: Last password change time when a password credential exists.
      nicknameHistory:
        type: array
        description: Most recent nickname changes (newest first, capped). The history table itself is retained indefinitely.
        items:
          "$ref": "#/NicknameChange"
AdminCreateUserInput:
  type: object
  description: |
    Admin-only user creation. `password` and `generatePassword` are mutually
    exclusive; exactly one is required.
  required:
  - username
  - email
  properties:
    username:
      type: string
    email:
      type: string
      format: email
    displayName:
      type: string
      description: Optional. Defaults to the username when blank.
    password:
      type: string
      description: Required unless `generatePassword` is true. Must satisfy the site password policy.
    generatePassword:
      type: boolean
      default: false
      description: Generate a policy-compliant random password and return it once as `generatedPassword`.
    roleKeys:
      type: array
      description: |
        Exact role set. Empty or omitted assigns the default `member` role.
        Granting `super_admin` requires the actor to be a super admin.
      items:
        type: string
    emailVerified:
      type: boolean
      default: false
      description: Mark the email as verified at creation time.
AdminCreateUserResult:
  type: object
  required:
  - user
  properties:
    user:
      "$ref": "#/AdminUserDetail"
    generatedPassword:
      type: string
      description: |
        Plaintext initial password. Only present when `generatePassword` is true.
        Shown once; the server persists only the Argon2id hash.
ApiResponseAdminCreateUserResult:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/AdminCreateUserResult"
NicknameChange:
  type: object
  required:
  - id
  - oldName
  - newName
  - source
  - createdAt
  properties:
    id:
      type: integer
      format: int64
    oldName:
      type: string
    newName:
      type: string
    source:
      type: string
      enum: [self, admin]
      description: Who changed the nickname. Admin changes do not consume the member's cooldown.
    changedBy:
      type: integer
      format: int64
      nullable: true
      description: Actor user id; equals the member for self-service changes.
    createdAt:
      type: string
      format: date-time
AdminUserActivity:
  type: object
  required:
  - topicCount
  - commentCount
  - activeSessionCount
  - totalSessionCount
  - lastLoginIP
  - lastLoginUserAgent
  properties:
    topicCount:
      type: integer
      format: int64
    commentCount:
      type: integer
      format: int64
    activeSessionCount:
      type: integer
      format: int64
    totalSessionCount:
      type: integer
      format: int64
    lastLoginAt:
      type: string
      format: date-time
      nullable: true
    lastLoginIP:
      type: string
      description: Full client IP from the latest login audit or session (admin-only).
    lastLoginUserAgent:
      type: string
      description: Raw User-Agent from the latest login audit or session (admin-only).
    lastSeenAt:
      type: string
      format: date-time
      nullable: true
AdminSessionInspect:
  type: object
  required:
  - id
  - deviceName
  - browser
  - os
  - ipPrefix
  - ipAddress
  - userAgent
  - createdAt
  - lastSeenAt
  - isActive
  - revokeReason
  properties:
    id:
      type: string
      description: Opaque session id (not an auth credential).
    deviceName:
      type: string
    browser:
      type: string
    os:
      type: string
    ipPrefix:
      type: string
      description: Masked IP prefix used in self-service device lists.
    ipAddress:
      type: string
      description: Full client IP for admin inspection. Empty after privacy clear.
    userAgent:
      type: string
      description: Raw User-Agent string.
    createdAt:
      type: string
      format: date-time
    lastSeenAt:
      type: string
      format: date-time
    isActive:
      type: boolean
    revokedAt:
      type: string
      format: date-time
      nullable: true
    revokeReason:
      type: string
AdminAuthEvent:
  type: object
  required:
  - id
  - action
  - ipAddress
  - userAgent
  - sessionHash
  - createdAt
  properties:
    id:
      type: integer
      format: int64
    action:
      type: string
      description: Stable audit action, e.g. auth.login.success or auth.register.success.
    ipAddress:
      type: string
    userAgent:
      type: string
    sessionHash:
      type: string
      description: HMAC of the session id for audit correlation; not usable as a credential.
    createdAt:
      type: string
      format: date-time
AdminUserList:
  type: object
  required:
  - items
  - total
  - page
  - perPage
  properties:
    items:
      type: array
      items:
        "$ref": "#/AdminUserSummary"
    total:
      type: integer
      format: int64
    page:
      type: integer
    perPage:
      type: integer
AdminUpdateUserInput:
  type: object
  description: |
    Partial admin update for a user account and public profile.
    Omitted fields are left unchanged. Requires `user.manage`;
    setting status to `banned` also requires `user.ban`.
  properties:
    username:
      type: string
    email:
      type: string
      format: email
    displayName:
      type: string
    locale:
      type: string
      enum:
      - zh-CN
      - en-US
    status:
      type: string
      enum:
      - active
      - disabled
      - banned
    kind:
      type: string
      enum:
      - human
      - bot
      description: |
        Marks the account as a bot (AI assistant, automation) or restores it to a
        human account. Bot accounts cannot sign in interactively: marking one revokes
        its sessions, and the login path rejects them. They otherwise remain ordinary
        users — they occupy a seat, count as online, can be mentioned and reported.
    bio:
      type: string
      maxLength: 500
    signature:
      type: string
      maxLength: 200
    location:
      type: string
      maxLength: 100
    websiteUrl:
      type: string
      maxLength: 200
AdminSetEmailVerificationInput:
  type: object
  required:
  - verified
  properties:
    verified:
      type: boolean
      description: true marks the email verified; false resets it to unverified.
UserRolesInput:
  type: object
  required:
  - roleKeys
  properties:
    roleKeys:
      type: array
      items:
        type: string
UserPermissionOverridesInput:
  "$ref": "#/PermissionOverrides"
PasswordResetRequest:
  type: object
  required:
  - email
  properties:
    email:
      type: string
      format: email
    humanVerification:
      "$ref": "#/HumanVerification"
PasswordResetConfirmRequest:
  type: object
  required:
  - token
  - newPassword
  properties:
    token:
      type: string
    newPassword:
      type: string
      minLength: 12
ApiResponsePasswordResetSent:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required:
      - sent
      properties:
        sent:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Whole seconds until another manual password-reset email request is allowed.
        retryAt:
          type: string
          format: date-time
          description: Server-authoritative UTC time when another manual password-reset email request is allowed.
ApiResponsePasswordResetConfirmed:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required:
      - reset
      properties:
        reset:
          type: boolean

EmailVerificationRequest:
  type: object
  properties:
    humanVerification:
      "$ref": "#/HumanVerification"
      description: Required when the deployment enables human verification for email-verification delivery.
EmailVerificationConfirmRequest:
  type: object
  required:
  - token
  properties:
    token:
      type: string
      minLength: 1
ApiResponseEmailVerificationSent:
  type: object
  required: [code, message, data]
  properties:
    code: {type: integer}
    message: {type: string}
    data:
      type: object
      required: [sent]
      properties:
        sent: {type: boolean}
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Whole seconds until another manual verification email request is allowed.
        retryAt:
          type: string
          format: date-time
          description: Server-authoritative UTC time when another manual verification email request is allowed.
ApiResponseEmailVerificationConfirmed:
  type: object
  required: [code, message, data]
  properties:
    code: {type: integer}
    message: {type: string}
    data:
      type: object
      required: [verified]
      properties:
        verified: {type: boolean}

# 账号安全 / 登录设备管理。opaque 会话标识，非认证凭证，仅用于指定下线哪一条。
LoginSession:
  type: object
  required:
  - id
  - deviceName
  - browser
  - os
  - ipPrefix
  - createdAt
  - lastSeenAt
  - isCurrent
  properties:
    id:
      type: string
      description: Opaque session id (not an auth credential). Used to target a device for revocation.
    deviceName:
      type: string
      description: Display name parsed from User-Agent, e.g. "Chrome on macOS".
    browser:
      type: string
    os:
      type: string
    ipPrefix:
      type: string
      description: Masked IP prefix, e.g. "1.2.3.*".
    createdAt:
      type: string
      format: date-time
    lastSeenAt:
      type: string
      format: date-time
    isCurrent:
      type: boolean
      description: Whether this is the device making the current request.
    revokedAt:
      type: string
      format: date-time
      nullable: true
      description: Present (in history view) when the session has been revoked.
    revokeReason:
      type: string
      description: Why the session was revoked (logout / revoke_device / revoke_others / max_exceeded / password_reset / session_replaced).
