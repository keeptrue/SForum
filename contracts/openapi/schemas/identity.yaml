AuthProviderListItem:
  type: object
  required: [id, kind, contractVersion, operations, activatedOperations]
  properties:
    id: {type: string}
    kind: {type: string, enum: [auth, recovery]}
    contractVersion: {type: string}
    priority: {type: integer}
    operations:
      type: array
      items: {type: string}
    activatedOperations:
      type: array
      description: Host-activated public operations (login, registration, link). Empty when not Host-activated.
      items: {type: string, enum: [login, registration, link]}
    ownerExtensionId:
      type: string
      description: Owner extension id for display only; not an ownership claim.
    label:
      type: string
      description: |
        Localized display name declared by the owning plugin Identity provider
        contribution (labelLocales/label). Host resolves Accept-Language; Core
        does not hard-code vendor brands.
    icon:
      type: string
      description: |
        Optional Iconify/Nuxt Icon name declared by the plugin (for example
        i-tabler-brand-github). Empty means Host uses a generic key icon.

ApiResponseAuthProviderList:
  type: object
  required: [code, message, data]
