  properties:
    code: {type: integer}
    message: {type: string}
    data: {$ref: "#/AuthProviderCompleteResult"}

ExternalRegistrationRequest:
  type: object
  required: [ticket, username, email]
  properties:
    ticket:
      type: string
      description: Host-generated opaque one-time account-continuation ticket.
    username: {type: string}
    email: {type: string, format: email}
    displayName: {type: string}
    locale: {type: string}
    humanVerification:
      type: object
      properties:
        provider: {type: string}
        token: {type: string}

ExternalRegistrationPreparationRequest:
  type: object
  additionalProperties: false
  required: [ticket]
  properties:
    ticket:
      type: string
      description: Host-generated opaque one-time account-continuation ticket.

ExternalAuthContinuationRequest:
  type: object
  additionalProperties: false
  required: [ticket]
  properties:
    ticket:
      type: string
      description: Browser-bound Host opaque ticket issued after an unlinked external login.

ExternalAuthContinuationPreparation:
  type: object
  additionalProperties: false
  required:
  - providerId
  - providerLabel
  - providerIcon
  - usernameHint
  - displayName
  - emailHint
  - emailVerified
  - canLinkExisting
  - canRegister
  properties:
    providerId:
      type: string
      description: Stable Host provider id; not an ownership or artifact claim.
    providerLabel:
      type: string
      description: Locale-resolved provider label supplied through the Host catalog.
    providerIcon:
      type: string
      description: Provider Iconify name supplied through the Host catalog, or empty.
    usernameHint: {type: string}
    displayName: {type: string}
    emailHint:
      type: string
      description: Empty unless the provider explicitly proved the email verified.
    emailVerified: {type: boolean}
    canLinkExisting:
      type: boolean
      description: True only when login and link operations remain effectively active.
    canRegister:
      type: boolean
      description: True only when provider registration and site registration remain open.

ApiResponseExternalAuthContinuationPreparation:
  type: object
  required: [code, message, data]
  properties:
    code: {type: integer}
    message: {type: string}
    data:
      "$ref": "#/ExternalAuthContinuationPreparation"

ExternalRegistrationPreparation:
  type: object
  additionalProperties: false
  required: [usernameHint, emailHint, displayName, emailVerified]
  properties:
    usernameHint:
      type: string
      description: Editable provider username candidate; local policy remains authoritative.
    emailHint:
      type: string
      description: Empty unless the provider explicitly proved the email verified.
    displayName:
      type: string
      description: Editable provider display-name candidate.
    emailVerified:
      type: boolean
      description: True only when the owning provider explicitly asserted verified email ownership.

ApiResponseExternalRegistrationPreparation:
  type: object
  required: [code, message, data]
  properties:
    code: {type: integer}
    message: {type: string}
    data:
      "$ref": "#/ExternalRegistrationPreparation"

