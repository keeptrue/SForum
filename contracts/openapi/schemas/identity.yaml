  properties:
    correlationId: {type: string, maxLength: 200}
    deviceFingerprint: {type: string}
    clientClass: {type: string}
    redirectHint:
      type: string
      description: Optional safe local return path. Host validates before store/plugin.
    accountHint: {type: string}

AuthProviderStartResult:
  type: object
  required: [providerId, operation, status, correlationId]
