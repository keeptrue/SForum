    clientClass: {type: string}
    idempotencyKey: {type: string}

AuthProviderCompleteResult:
  type: object
  required: [providerId, operation]
  description: |
    Public recovery complete shape. Auth login/registration/link complete is
    closed on the public POST path; Host callback never returns raw subject or
    subject digest to the browser.
  properties:
    providerId: {type: string}
    operation: {type: string}
    providerSubjectDigest:
      type: string
      description: Recovery-only subject digest when applicable; auth callbacks never expose this.
    displayName: {type: string}
    emailHint: {type: string}
    userHintId: {type: integer, format: int64}
    linkId: {type: integer, format: int64}
    linkStatus: {type: string}

ApiResponseAuthProviderComplete:
  type: object
