AvatarView:
  type: object
  required:
  - kind
  - url
  - alt
  properties:
    kind:
      type: string
      enum:
      - uploaded
      - initials
      - gravatar
      - static
    url:
      type: string
      description: Empty when kind is initials. Uploaded avatars use the stable browser media path /media/avatars/{publicId}.
    attachmentId:
      type:
      - integer
      - 'null'
      format: int64
      description: Present for uploaded avatars.
    alt:
      type: string
Profile:
  type: object
  required:
  - userId
  - bio
  - signature
  - location
  - websiteUrl
  - avatar
  - createdAt
  - updatedAt
  properties:
    userId:
      type: integer
      format: int64
    bio:
      type: string
    signature:
      type: string
    location:
      type: string
    websiteUrl:
      type: string
    avatarAttachmentId:
      type:
      - integer
      - 'null'
      format: int64
      description: Deprecated compatibility field. Use avatar.attachmentId and the dedicated avatar endpoints for changes.
    avatar:
      "$ref": "#/AvatarView"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
PublicProfile:
  type: object
  required:
  - userId
  - username
  - displayName
  - profile
  - topicCount
  - commentCount
  - recentTopics
  - activities
  - joinedAt
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
    profile:
      "$ref": "#/Profile"
    topicCount:
      type: integer
      format: int64
    commentCount:
      type: integer
      format: int64
    recentTopics:
      type: array
      items:
        "$ref": "../schemas/forum.yaml#/TopicSummary"
    activities:
      type: array
      description: Recent public topic/comment activity. Items only include topics in public categories and active/locked topic states; comments are active only.
      items:
        "$ref": "#/ProfileActivity"
    joinedAt:
      type: string
      format: date-time
    extensionTabs:
      type: array
      description: |
        Host-rendered profile tabs from forum.profile.tabs (F4.3). Tabs gated by
        a contribution `permission` are already filtered for the requesting
        viewer, and the permission key itself is never returned. At most 8
        `widget` tabs are returned; `extensionRoute` and `hostLink` tabs are not
        capped.
      items:
        "$ref": "#/ProfileExtensionTab"
    nickname:
      "$ref": "#/NicknameState"
    previousDisplayNames:
      type: array
      description: |
        Most recent previous nickname, present only when
        `profile.nickname.history_public` is enabled. At most one item.
      items:
        type: string
ProfileActivity:
  type: object
  required:
  - kind
  - topic
  - excerpt
  - createdAt
  properties:
    kind:
      type: string
      enum:
      - topic
      - comment
    topic:
      "$ref": "#/ProfileActivityTopic"
    commentId:
      type:
      - integer
      - 'null'
      format: int64
      description: Present for comment activity and links to the topic comment anchor.
    commentPage:
      type:
      - integer
      - 'null'
      format: int32
      minimum: 1
      description: >
        Flat-view page number for the comment within its topic (1-based). Present
        for comment activity so clients can build /page/N#comment-{id} deep links
        without relying on hash-only SSR resolve (fragments are not sent to the server).
    excerpt:
      type: string
    createdAt:
      type: string
      format: date-time
ProfileActivityTopic:
  type: object
  required:
  - id
  - slug
  - title
  - status
  - categorySlug
  - categoryName
  - commentCount
  - createdAt
  - updatedAt
  - lastActivityAt
  properties:
    id:
      type: integer
      format: int64
    slug:
      type: string
    title:
      type: string
    status:
      type: string
      enum:
      - active
      - locked
    categorySlug:
      type: string
    categoryName:
      type: string
    commentCount:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    lastActivityAt:
      type: string
      format: date-time
ProfileExtensionTab:
  type: object
  description: |
    One host-rendered tab on a public profile. `extensionRoute` and `hostLink`
    tabs are right-rail links that navigate away from the profile; `widget` tabs
    are appended to the profile tab strip after the built-in tabs and mount
    their public L2 component in place.
  required:
  - extensionId
  - id
  - order
  - kind
  - url
  properties:
    extensionId:
      type: string
    id:
      type: string
    order:
      type: integer
    label:
      type: object
      additionalProperties:
        type: string
    icon:
      type: string
    kind:
      type: string
      enum:
      - extensionRoute
      - hostLink
      - widget
      description: |
        `extensionRoute` opens the extension route proxy URL, `hostLink` opens a
        site-relative path, `widget` mounts the public L2 component named by
        `componentId` without navigating.
    method:
      type: string
      enum:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      description: Present for `extensionRoute` tabs only.
    url:
      type: string
      description: |
        `extensionRoute` -> `/extensions/{extensionId}{path}`; `hostLink` ->
        site-relative path. Always present: for `widget` tabs it is the empty
        string, because the component is addressed by `componentId` instead of
        a URL.
    componentId:
      type: string
      description: |
        `widget` tabs only. Normalized (trimmed, lowercased) id of a public L2
        component declared in the same extension manifest: `action: add`, a
        built `l2Component` file, and no component-level permission gate.
        Absent for `extensionRoute` and `hostLink` tabs.
UpdateProfileRequest:
  type: object
  description: All fields optional. Omitted fields are left unchanged.
  properties:
    bio:
      type: string
      maxLength: 500
    signature:
      type: string
      maxLength: 200
    location:
      type: string
      maxLength: 100
    websiteUrl:
      type: string
      maxLength: 200
    avatarAttachmentId:
      type:
      - integer
      - 'null'
      format: int64
    displayName:
      type: string
      maxLength: 64
      description: |
        Nickname (display label). An empty string means "show my username".
        Length limits, reserved words, the cooldown, and the site-wide switch
        come from the `profile.nickname.*` runtime options; the server is
        authoritative.
NicknameState:
  type: object
  required:
  - displayName
  - canChange
  - duplicates
  description: |
    Self-service nickname state. Present only on GET/PUT /profile responses;
    the public profile endpoint does not expose account policy state.
  properties:
    displayName:
      type: string
    changedAt:
      type: string
      format: date-time
      description: Last self-service nickname change. Admin changes do not move this clock.
    nextChangeAt:
      type: string
      format: date-time
      description: Earliest moment the member may change the nickname again. Absent when no cooldown applies.
    canChange:
      type: boolean
      description: Server-computed result of the site switch and the cooldown.
    duplicates:
      type: integer
      description: Number of other active members using the same nickname. Nicknames are not unique; this is informational only.
NicknameAvailability:
  type: object
  required:
  - available
  - duplicates
  description: Read-only preflight for a nickname change.
  properties:
    available:
      type: boolean
    duplicates:
      type: integer
      description: Number of other active members using the same nickname. Duplicates never make a nickname unavailable.
    conflict:
      type: string
      description: i18n message key explaining why the value cannot be saved. Empty when available.
    normalized:
      type: string
      description: Value the server would store after whitespace normalization and the empty-to-username fallback.
ApiResponseNicknameAvailability:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/NicknameAvailability"
ApiResponseProfile:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Profile"
ApiResponsePublicProfile:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/PublicProfile"
ActivityPage:
  type: object
  required:
  - items
  - page
  - perPage
  - total
  - hasMore
  - kind
  properties:
    items:
      type: array
      items:
        "$ref": "#/ProfileActivity"
    page:
      type: integer
      minimum: 1
    perPage:
      type: integer
      minimum: 1
      maximum: 50
    total:
      type: integer
      format: int64
      description: Public total for the requested kind (topicCount or commentCount).
    hasMore:
      type: boolean
    kind:
      type: string
      enum: [topic, comment]
ApiResponseActivityPage:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/ActivityPage"
