# Badge contract schemas.
#
# These mirror the HTTP wire shapes produced by
# `apps/api/app/Http/Controllers/Badges/dto.go` and `controller.go` — NOT the
# domain structs in `app/Models/Badges/types.go`. The two differ on purpose:
# the domain nests (`UserBadge.Badge`, `UserBadge.Progress`) while the profile
# endpoint flattens each entry so the client renders one row per badge.
#
# Rule for future edits: change this file only after reading the DTO. A field
# that the DTO does not emit must not appear here, even if the domain struct has
# it (for example `groupKey` exists on `badges.Badge` but `adminBadgeResponse`
# does not emit it).
BadgeTier:
  type: string
  description: |
    Badge tier **key**, referencing `badge_tiers.key`.

    Until migration `202611120001_badge_tiers.sql` this was a closed enum of
    `bronze` / `silver` / `gold`. It is now operator-managed data: an operator
    can add a tier (for example `activity_limited`), rename it, recolour it, or
    disable it. The three built-in keys still ship with the migration, so
    existing clients keep working — but **do not** validate this value against a
    client-side enum, and do not derive a colour from it. Read `tierName` /
    `tierColor` instead (they are always present and always match the server).

    Shape (enforced by the database CHECK constraint): 2–32 characters,
    lowercase letters, digits, or underscores, starting with a letter.
  pattern: ^[a-z][a-z0-9_]{1,31}$
  example: gold
BadgeTierName:
  type: object
  description: |
    Bilingual tier name. Both languages are always sent: the server never picks
    one for the caller, because that would make the response body depend on the
    request locale and force `Vary: Accept-Language` onto every cached payload
    that embeds a badge.
  required:
  - zh
  - en
  properties:
    zh:
      type: string
      example: 金牌
    en:
      type: string
      example: Gold
BadgeGrantMode:
  type: string
  enum:
  - automatic
  - manual
BadgeMetric:
  type: string
  enum:
  - topic_count
  - comment_count
  - like_received_count
  - like_given_count
  - bookmark_count
  - days_visited
Badge:
  type: object
  description: |
    Admin-facing badge definition (`adminBadgeResponse`). Carries operator state
    (`enabled`), the rule, and the aggregate `grantedCount`; none of that is
    exposed on the public profile surface.

    `rule`, `requirementSummary` and `requirementText` are always present in this
    response — the admin editor reads them as the current value before saving, so
    a missing key is indistinguishable from "no value stored".

    `requirementText` is generated by the server from `rule` (the same renderer
    the public surface uses). `requirementSummary` is deprecated: the
    operator-written override is no longer read by any code path; the field and
    the underlying columns are kept one release for rollback.
  required:
  - id
  - slug
  - name
  - description
  - tier
  - tierName
  - tierColor
  - icon
  - grantMode
  - enabled
  - position
  - grantedCount
  - rule
  - requirementSummary
  - requirementText
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    slug:
      type: string
      description: Stable identifier, unique across badges.
    name:
      type: string
    description:
      type: string
    groupId:
      type: [integer, "null"]
      format: int64
      description: Badge group id; null when ungrouped or the group was deleted.
    groupName:
      type: [string, "null"]
      description: Badge group name; null when ungrouped.
    tier:
      "$ref": "#/BadgeTier"
    tierName:
      "$ref": "#/BadgeTierName"
    tierColor:
      type: string
      description: |
        Tier identification colour: one of the nine palette tokens
        (`slate teal emerald sky indigo violet fuchsia rose amber`) or a
        lowercase `#rrggbb`. Empty string means the tier declares no colour.
    icon:
      type: string
      description: Icon library name, `i-lucide-*` or `i-tabler-*`.
    grantMode:
      "$ref": "#/BadgeGrantMode"
    metric:
      oneOf:
      - "$ref": "#/BadgeMetric"
      - type: "null"
      description: Activity column the rule reads; null for manual badges.
    threshold:
      type: [integer, "null"]
      format: int64
      description: Rule threshold; null for manual badges. Always > 0 when set.
    rule:
      type: [object, "null"]
      description: |
        规则 AST 原样透出：`{"v":1,"root":{...}}`，与保存时提交的字节一致
        （不重新序列化已知字段，所以本次实现不认识的键也会原样带出）。
        自动徽章的唯一判定来源；手写徽章为 `null`。

        故意**不**声明 `root` 的子结构：AST 的字段集合随条件目录演进，在这里
        重抄一份会让契约成为第三份需要同步的真值表。该键始终存在，值可以是
        `null`，不存在「键缺失」这一态。
    requirementSummary:
      description: |
        已废弃（deprecated）：2026-11 起公开说明只由规则生成，本字段与数据库列
        仅为一版回滚保留，后台不再读写。
      "$ref": "#/RequirementText"
    requirementText:
      description: |
        服务端按 `rule` 生成的公开文案，与公开面**同一实现**：保存后立即生效。
        永远非空（手工徽章给固定句）；引用不到的分类/标签/角色/徽章/主题回落泛称。
      "$ref": "#/RequirementText"
    enabled:
      type: boolean
      description: Disabled badges keep their grants but stop rendering.
    position:
      type: integer
      description: Tie-breaker inside a group when tiers are equal.
    grantedCount:
      type: integer
      format: int64
      description: |
        Number of users currently holding the badge, produced by the admin list
        query. Admin surface only; never sent to the public profile endpoint.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
BadgeGroup:
  type: object
  description: Admin-facing badge group (`adminBadgeGroupResponse`).
  required:
  - id
  - key
  - name
  - description
  - position
  - badgeCount
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    key:
      type: string
      description: Stable group key, unique.
    name:
      type: string
    description:
      type: string
    position:
      type: integer
      description: Ascending order of group sections on the profile tab.
    badgeCount:
      type: integer
      format: int64
      description: Number of badges assigned to the group.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ProfileBadgeItem:
  type: object
  description: |
    One cell on the profile badge wall (`profileBadgeItem`), flattened on
    purpose: the client renders one row per badge, so there is no nested badge
    object and no progress object.

    Conditional keys, matching the DTO exactly:
    - `earned: true` → `grantedAt` present; `current` / `threshold` absent.
    - `earned: false` and the badge is automatic with a threshold → `current`
      and `threshold` present; `grantedAt` absent.
    - `earned: false` and the badge is manual → none of the three keys.
    `current: 0` is a valid value and is emitted, not omitted.
  required:
  - slug
  - name
  - description
  - tier
  - tierName
  - tierColor
  - icon
  - position
  - earned
  - requirementText
  properties:
    requirementText:
      "$ref": "#/RequirementText"
    slug:
      type: string
    name:
      type: string
    description:
      type: string
      description: |
        Badge description, shown in the badge detail modal on the profile wall and
        when the page is opened through the `?badge=<slug>` deep link. Always
        present (empty string when the operator wrote no description), matching
        `profileBadgeItem.description`.
    tier:
      "$ref": "#/BadgeTier"
    tierName:
      "$ref": "#/BadgeTierName"
    tierColor:
      type: string
      description: Tier identification colour (palette token or `#rrggbb`).
    icon:
      type: string
    position:
      type: integer
    earned:
      type: boolean
    current:
      type: integer
      format: int64
      description: Current activity value for an unearned automatic badge.
    threshold:
      type: integer
      format: int64
      description: |
        Threshold that grants the badge. `current` may briefly exceed it: evaluation
        and granting are two separate steps, so a `current` above the threshold means
        the grant is still pending rather than an impossible state.
    grantedAt:
      type: string
      format: date-time
      description: Grant timestamp; only present when `earned` is true.
ProfileBadgeGroup:
  type: object
  description: |
    Group section on the profile badge wall (`profileBadgeGroup`). The group
    name appears here once; entries do not repeat it. There is no `description`
    on the wire even though the domain section carries one.
  required:
  - key
  - name
  - position
  - badges
  properties:
    key:
      type: string
    name:
      type: string
    position:
      type: integer
    badges:
      type: array
      items:
        "$ref": "#/ProfileBadgeItem"
ProfileBadges:
  type: object
  description: |
    Whole profile badge tab (`profileBadgesResponse`). Groups are ordered by
    `position`; entries inside a group are ordered by tier weight
    (gold > silver > bronze), then badge `position`, then `grantedAt`
    descending.
  required:
  - groups
  properties:
    groups:
      type: array
      items:
        "$ref": "#/ProfileBadgeGroup"
BadgeRef:
  type: object
  description: |
    Compact badge reference embedded next to a post or comment author
    (`topBadge`, see `forum.yaml`). Actor-agnostic: the same value is served to
    every viewer and may therefore be cached with the post payload. These four
    fields are everything a 12px chip renders.
  required:
  - slug
  - name
  - tier
  - tierName
  - tierColor
  - icon
  properties:
    slug:
      type: string
    name:
      type: string
    tier:
      "$ref": "#/BadgeTier"
    tierName:
      "$ref": "#/BadgeTierName"
    tierColor:
      type: string
      description: Tier identification colour (palette token or `#rrggbb`).
    icon:
      type: string
BadgeGrantRecord:
  type: object
  description: |
    Admin-facing grant record (`badges.BadgeGrantRecord`). There is no `id`
    column on the wire; `(userId, badgeId)` identifies the row.
  required:
  - userId
  - username
  - displayName
  - badgeId
  - badgeSlug
  - grantedAt
  - grantedBy
  - grantReason
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
    badgeId:
      type: integer
      format: int64
    badgeSlug:
      type: string
    grantedAt:
      type: string
      format: date-time
    grantedBy:
      type: [integer, "null"]
      format: int64
      description: Actor user id; null when the actor was hard-deleted.
    grantReason:
      type: string
      description: Free-form operator note; admin surface only.
BadgeGrantList:
  type: object
  required:
  - items
  - total
  properties:
    items:
      type: array
      items:
        "$ref": "#/BadgeGrantRecord"
    total:
      type: integer
      format: int64
BadgeCreateInput:
  type: object
  description: |
    Create body (`badgeBody`). Every field is technically optional on the wire
    because create and update share one struct; the server fills
    `enabled: true` and `icon: i-lucide-award` when omitted. The four fields
    below are nevertheless required for a successful create — omitting one
    fails domain validation with `422 forum.badge_rule_invalid`.

    Two `422` reasons are kept apart on purpose, because the operator fixes them
    differently:

    - `forum.badge_rule_mode_conflict`: `grantMode` and `rule` contradict each
      other (`grantMode: manual` with a non-null `rule`). Change the grant mode
      or drop the rule.
    - `forum.badge_rule_invalid`: the rule itself is missing where it is
      required (`grantMode: automatic` without a rule) or unusable. Edit the
      rule.
  required:
  - slug
  - name
  - tier
  - grantMode
  properties:
    slug:
      type: string
      description: Lowercase kebab-case identifier; unique.
    name:
      type: string
    description:
      type: string
    groupId:
      type: [integer, "null"]
      format: int64
    tier:
      "$ref": "#/BadgeTier"
    icon:
      type: string
      description: Must start with `i-lucide-` or `i-tabler-`.
    grantMode:
      "$ref": "#/BadgeGrantMode"
    metric:
      oneOf:
      - "$ref": "#/BadgeMetric"
      - type: "null"
    threshold:
      type: [integer, "null"]
      format: int64
    enabled:
      type: boolean
    position:
      type: integer
BadgeUpdateInput:
  type: object
  description: |
    Partial update (`badgeBody` merged onto the stored badge). Every field is
    optional; omitted fields keep their current value, so `{"enabled": false}`
    alone is a valid request.

    `groupId`, `metric` and `threshold` are tri-state: the key being absent
    means "leave unchanged", while an explicit `null` means "clear it".
    Sending `{"metric": null}` on an automatic badge fails validation, because
    an automatic badge must keep a rule.

    Switching `grantMode` to `manual` clears `metric` and `threshold` server
    side, so a follow-up edit that switches back to `automatic` must resend the
    rule.
  properties:
    slug:
      type: string
    name:
      type: string
    description:
      type: string
    groupId:
      type: [integer, "null"]
      format: int64
      description: Absent = unchanged; `null` = ungroup.
    tier:
      "$ref": "#/BadgeTier"
    icon:
      type: string
    grantMode:
      "$ref": "#/BadgeGrantMode"
    metric:
      oneOf:
      - "$ref": "#/BadgeMetric"
      - type: "null"
      description: Absent = unchanged; `null` = clear the rule metric.
    threshold:
      type: [integer, "null"]
      format: int64
      description: Absent = unchanged; `null` = clear the rule threshold.
    enabled:
      type: boolean
    position:
      type: integer
BadgeGroupCreateInput:
  type: object
  description: |
    Group create body (`badgeGroupBody`). Fields are non-pointer: an omitted
    `description` or `position` becomes `""` / `0`, not "keep current".
  required:
  - key
  - name
  properties:
    key:
      type: string
    name:
      type: string
    description:
      type: string
    position:
      type: integer
BadgeGroupUpdateInput:
  type: object
  description: |
    Partial update, same shape as the badge PATCH: the handler reads the current
    group, then merges only the keys that are present. Omitting `description`
    keeps the stored description; it does not clear it.
  properties:
    key:
      type: string
    name:
      type: string
    description:
      type: string
    position:
      type: integer
BadgeGrantInput:
  type: object
  description: |
    Grant body (`badgeGrantBody`). Supply `userId`, or `username` to resolve the
    recipient by profile username; an unknown username returns
    `404 forum.badge_not_found`.
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
      description: Alternative to `userId`; resolved through the public profile lookup.
    reason:
      type: string
      description: Operator note stored on the grant record.
BadgeDeleteResult:
  type: object
  required:
  - deleted
  properties:
    deleted:
      type: boolean
      description: Always true on success.
BadgeGrantResult:
  type: object
  required:
  - granted
  properties:
    granted:
      type: boolean
      description: Always true on success.
BadgeRevokeResult:
  type: object
  required:
  - revoked
  properties:
    revoked:
      type: boolean
      description: |
        Whether a row was actually deleted — **not** "the request succeeded".
        `true` means a `user_badges` row was removed; `false` means the user did
        not hold the badge. Both are `200`, because DELETE stays idempotent, so
        a client must not render `false` as a failure.
BadgeRecomputeResult:
  type: object
  description: |
    Outcome of a full sweep. Two independent counters, because the sweep does
    two things: it back-fills missing automatic grants from the current rules,
    then repairs `top_badge_id`.
  required:
  - granted
  - refreshed
  - queued
  properties:
    granted:
      type: integer
      format: int64
      description: |
        `user_badges` rows inserted by the rule sweep (`GrantFromRules`).
        Those rows carry `grantedBy: null` and `grantReason: "recompute"`,
        which is how a recompute grant is distinguishable from a rule-time
        grant (null / empty reason) and an operator grant (actor + reason).
        Running the sweep again on an already-correct community returns 0.
    queued:
      type: integer
      format: int64
      description: |
        **转入异步评估的徽章数**（不是用户数、不是 job 数）。复杂规则没法在一条
        批量 SQL 里求值，会被交给 `badges.backfill_rules` job 逐页回扫；这些徽章的
        授予结果稍后由 job 生效。`0` 是正常路径（全部是快路径形状），不是异常。
    refreshed:
      type: integer
      format: int64
      description: |
        Users whose `top_badge_id` actually changed. Users already pointing at
        the correct badge are not counted, so a no-op sweep returns 0 here too.
ApiResponseBadge:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Badge"
ApiResponseBadgeList:
  type: object
  description: Admin list envelope; `data.items` is the row array.
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/Badge"
ApiResponseBadgeGroup:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeGroup"
ApiResponseBadgeGroupList:
  type: object
  description: Admin list envelope; `data.items` is the row array.
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/BadgeGroup"
ApiResponseProfileBadges:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/ProfileBadges"
ApiResponseBadgeGrantList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeGrantList"
ApiResponseBadgeGrantResult:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeGrantResult"
ApiResponseBadgeRevokeResult:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeRevokeResult"
ApiResponseBadgeDeleteResult:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeDeleteResult"
ApiResponseBadgeRecomputeResult:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeRecomputeResult"

# --- Public badge catalog (/api/v1/badges) ---
#
# 键集合是白名单，与 `publicBadgeCatalogResponse` / `publicBadgeCatalogItem`
# （app/Http/Controllers/Badges/dto.go）逐字对应。刻意不出现 `metric`，也不出现
# **定义级** `threshold`：阈值是运营调参，公开即不可撤回；想公开的运营写进
# `description`。条目上的 `current` / `threshold` 是**查看者进度**（每请求合并、
# 只对未获得 + 可测的条目出现），与定义级阈值不是一回事。
# 也不出现 `enabled` / `grantedCount` / `createdAt` / `updatedAt` / `id`。
PublicBadgeCatalog:
  type: object
  description: |
    公开徽章目录：全部启用徽章按分组排列，`earned` 标记查看者自己是否已获得。

    `truncated` 在顶层而不是分组级——截断是整份响应的属性。服务端硬上限 500 条。
  required:
  - groups
  - truncated
  properties:
    groups:
      type: array
      items:
        "$ref": "#/PublicBadgeCatalogGroup"
    truncated:
      type: boolean
PublicBadgeCatalogGroup:
  type: object
  description: |
    目录分组外壳。只输出含至少一个启用徽章的分组（空组省略）。

    `key` 为空串表示「未分组」；`name` 可能为空串，展示文案由前端 i18n 决定
    （后端不硬编码「未分组」，否则 en-US 站点会收到中文）。
  required:
  - key
  - name
  - badges
  properties:
    key:
      type: string
    name:
      type: string
    badges:
      type: array
      items:
        "$ref": "#/PublicBadgeCatalogEntry"
PublicBadgeCatalogEntry:
  type: object
  description: |
    目录里的一枚徽章。`group` 是所属分组的 key（未分组为空串），让条目自描述。

    排序（组间与组内同一套规则）：`badge_groups.position ASC, badges.position ASC,
    badges.id ASC`——`id` 是 tiebreaker，position 相同也不会漂。
  required:
  - slug
  - name
  - description
  - icon
  - tier
  - tierName
  - tierColor
  - group
  - earned
  - requirementText
  properties:
    slug:
      type: string
    name:
      type: string
    description:
      type: string
    icon:
      type: string
    tier:
      "$ref": "#/BadgeTier"
    tierName:
      "$ref": "#/BadgeTierName"
    tierColor:
      type: string
      description: Tier identification colour (palette token or `#rrggbb`).
    group:
      type: string
    requirementText:
      "$ref": "#/RequirementText"
    earned:
      type: boolean
      description: |
        查看者是否已获得。**这是查看者相关字段**，因此整个响应禁止共享缓存
        （`Cache-Control: private, no-store`）；匿名请求恒为 `false`。
    current:
      type: [integer, "null"]
      format: int64
      description: |
        查看者当前进度（例如已发主题数）。**只在「未获得 + 自动 + 可测」的条目上
        出现**：已获得、匿名、不可测（`lte`、布尔条件、多条件组）都没有这两个键。
        `current: 0` 是有效值，会照常下发，不是省略。
    threshold:
      type: [integer, "null"]
      format: int64
      description: |
        达到即授予的阈值，与 `current` 同时出现。定义级阈值仍然不下发 —— 这两个键
        只在查看者维度有意义；运营调参不进公开面。
ApiResponsePublicBadgeCatalog:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/PublicBadgeCatalog"

# --- Free-form worn badge display (/api/v1/badges/worn) ---
#
# 三条端点的请求与响应形状。`worn` / `automatic` / `upgrade` 都是「徽章引用」，
# 由 `dto.go` 的 `badgeDisplayRef` 显式投影，与上面那个 `BadgeRef`（`topBadge`）
# 逐字同形：`tier` 是等级 key，外观拆成 `tierName{zh,en}` + `tierColor`。
# 领域结构 `badges.BadgeRef` 不上线——它的 `Appearance` 没有 json tag，直接序列化
# 会把等级外观吐成 Go 字段名（`tierAppearance.NameZh` 那套），前端就要写两套解析。
# `BadgeDisplayRef` 仍然单独定义（而不是直接 `$ref: BadgeRef`）：这三条端点可以
# 独立演进（例如将来加入展示位专属字段），共用同一个节点会让改动互相牵连。
BadgeDisplayRef:
  type: object
  description: |
    展示位里的徽章引用（`badgeDisplayRef`，`GET` / `PUT` / `DELETE /badges/worn`
    共用）。

    形状与帖子旁的 `BadgeRef`（`topBadge`）、徽章目录条目一致：`tier` 是等级 key，
    外观是 `tierName{zh,en}` + `tierColor`。带外观而不是只给 key，是因为 chip 的
    配色与双语名必须与后台配置一致——前端拿 key 自己映射颜色，会在运营自定义颜色
    或新增档位时立刻失效。

    外观为空（等级引用失效）时字段**仍然全部出现**：`tierName` 是
    `{"zh":"","en":""}`、`tierColor` 是空串，而不是缺键。
  required:
  - slug
  - name
  - tier
  - tierName
  - tierColor
  - icon
  properties:
    slug:
      type: string
    name:
      type: string
    tier:
      "$ref": "#/BadgeTier"
    tierName:
      "$ref": "#/BadgeTierName"
    tierColor:
      type: string
      description: Tier identification colour (palette token or `#rrggbb`).
    icon:
      type: string
BadgeWornInput:
  type: object
  description: |
    佩戴请求体：`slug` 与 `hidden` **二选一，互斥**，同填返回
    `400 forum.badge_worn_body_invalid`——两个动作写同一展示位的不同状态
    （佩戴一枚 vs 什么都不戴），同填意味着调用方自己也不知道要哪个，服务端
    不替它挑。佩戴没有「部分更新」语义，缺字段等于空 slug，由领域层统一折成
    `422 forum.badge_not_owned`（与「不持有」同码，不额外泄露站内是否存在这个
    slug）；`{"hidden":false}` 与缺字段等价，同样走 slug 路径。
  properties:
    slug:
      type: string
      description: 要佩戴的徽章 slug；必须是调用者已获得、且徽章与等级都启用的那枚。
    hidden:
      type: boolean
      description: |-
        `true` 表示「什么都不戴」：展示位清空（`top_badge_id = NULL`）并标记
        hidden，重算不再回落写入；下次 `GET` 返回 `mode: hidden`。与 `slug`
        互斥。
BadgeDisplay:
  type: object
  description: |
    展示位状态（`GET` / `PUT` / `DELETE /badges/worn` 的同一个响应体）。

     - `mode: auto` —— 没手动戴过，或佩戴已失效被回落；`worn` 等于 `automatic`。
     - `mode: manual` —— 用户手动选了一枚；`upgrade` 在存在更优徽章时非 null。
     - `mode: hidden` —— 用户选择什么都不戴；`worn` 为 null，`automatic` 照常
       推导（前端可据此显示「你的最佳徽章是 X」），`upgrade` 恒为 null。

    三个引用都可能为 null：一枚可展示徽章都没有时三者全 null，`mode` 仍是 `auto`。
    **但三个键永远出现**（值为 null 时照常输出 `null`，不省略）：客户端按 `mode`
    分支渲染展示位，「键缺失」与「这个位子是空的」是两种状态，前者会被当成加载失败。
  required:
  - mode
  - worn
  - automatic
  - upgrade
  properties:
    mode:
      type: string
      enum: [auto, manual, hidden]
    worn:
      oneOf:
      - "$ref": "#/BadgeDisplayRef"
      - type: "null"
      description: 当前展示位指向的徽章；没有任何可展示徽章时为 null。
    automatic:
      oneOf:
      - "$ref": "#/BadgeDisplayRef"
      - type: "null"
      description: |
        按 `topBadgeOrderSQL` 推导出的最佳徽章（与帖子旁 chip 同一份排序）。
        没有任何可展示徽章时为 null。
    upgrade:
      oneOf:
      - "$ref": "#/BadgeDisplayRef"
      - type: "null"
      description: |
        仅在 `manual` 且存在更优徽章时非 null —— 它是提示，不是错误。
ApiResponseBadgeDisplay:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeDisplay"

# --- Badge tiers (/api/v1/admin/badges/tiers, /api/v1/badges/tiers) ---
#
# 等级表把 tier 从枚举变成数据：运营可新增档位、改双语名/图标/颜色、调位次、停用。
# 三个内置档位（gold/silver/bronze）由迁移种子保证存在，position 依次 0/1/2。
#
# 位次语义：position 升序 = 从高到低。它同时是「最高级徽章」排序的第一关键字，
# 所以重排等级会改变全站帖子旁的徽章展示（服务端在重排后自动全量重算）。
BadgeTierDef:
  type: object
  description: |
    One row of the admin tier table (`adminBadgeTierResponse`). `badgeCount` is
    the number of badges referencing this tier — the delete dialog needs it,
    because a non-empty tier can only be deleted with an explicit `migrateTo`.
  required:
  - key
  - name
  - icon
  - color
  - position
  - enabled
  - badgeCount
  properties:
    key:
      "$ref": "#/BadgeTier"
    name:
      "$ref": "#/BadgeTierName"
    icon:
      type: string
      description: Icon library name, `i-lucide-*` or `i-tabler-*`.
    color:
      type: string
      description: |
        Tier identification colour. Empty string means "no explicit colour";
        otherwise one of the nine palette tokens or a lowercase `#rrggbb`.
    position:
      type: integer
      description: Ascending display order; 0 is the highest tier.
    enabled:
      type: boolean
      description: |
        Disabled tiers keep their badges but are excluded from the "top badge"
        competition (the ordering JOIN requires `enabled`).
    badgeCount:
      type: integer
      format: int64
      description: Number of badges referencing this tier.
BadgeTierList:
  type: object
  description: |
    Admin tier table (`adminBadgeTiersResponse`). `colorChoices` is the server's
    palette whitelist; clients must render it instead of shipping their own copy
    (a client-side copy drifts into "selectable in the UI, 422 on save").
  required:
  - items
  - colorChoices
  properties:
    items:
      type: array
      items:
        "$ref": "#/BadgeTierDef"
    colorChoices:
      type: array
      description: Accepted colour values (nine palette tokens). `#rrggbb` is also accepted.
      items:
        type: string
      example: [slate, teal, emerald, sky, indigo, violet, fuchsia, rose, amber]
BadgeTierCreateInput:
  type: object
  description: Create a tier. `key` is immutable after creation.
  required:
  - key
  - nameZh
  - nameEn
  properties:
    key:
      "$ref": "#/BadgeTier"
    nameZh:
      type: string
      description: Chinese display name; required, must not be blank.
    nameEn:
      type: string
      description: English display name; required, must not be blank.
    icon:
      type: string
      description: Icon library name; defaults to `i-lucide-medal`.
    color:
      type: string
      description: Palette token or lowercase `#rrggbb`; empty means no colour.
    position:
      type: integer
      description: Display order; defaults to 0.
    enabled:
      type: boolean
      description: Defaults to true.
BadgeTierUpdateInput:
  type: object
  description: |
    Partial update of a tier. `key` is not accepted — changing it would be a
    different tier, so delete + create instead. Every field is optional; omitted
    fields keep their current value.
  properties:
    nameZh:
      type: string
    nameEn:
      type: string
    icon:
      type: string
    color:
      type: string
    enabled:
      type: boolean
BadgeTierOrderInput:
  type: object
  description: |
    Rewrite tier positions by array index. Tiers not listed keep their relative
    order and are appended after the listed ones.
  required:
  - keys
  properties:
    keys:
      type: array
      items:
        "$ref": "#/BadgeTier"
PublicBadgeTierItem:
  type: object
  description: |
    One row of the public tier catalog (`publicBadgeTierItem`). Only enabled
    tiers are listed; operator fields (`enabled`, `badgeCount`, timestamps) are
    never exposed.
  required:
  - key
  - name
  - icon
  - color
  - position
  properties:
    key:
      "$ref": "#/BadgeTier"
    name:
      "$ref": "#/BadgeTierName"
    icon:
      type: string
    color:
      type: string
    position:
      type: integer
PublicBadgeTiers:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/PublicBadgeTierItem"
GrantCandidate:
  type: object
  description: |
    One row of the batch-grant picker (`grantCandidateItem`).

    `status` and `alreadyGranted` are **hints, not filters**: the server does not
    decide whether granting a badge to a disabled account is legitimate, it only
    reports the facts. Matching covers `username` and `displayName` only —
    never the email address.
  required:
  - userId
  - username
  - displayName
  - status
  - alreadyGranted
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
    status:
      type: string
      enum: [active, disabled, banned]
    alreadyGranted:
      type: boolean
      description: True when the user already holds the badge being granted.
GrantCandidateList:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/GrantCandidate"
BatchGrantInput:
  type: object
  description: |
    Batch grant. At most 50 unique user ids per request; duplicate ids are
    collapsed, non-positive ids are dropped. Only manual badges accept a batch
    grant (automatic badges are owned by their rule).
  required:
  - userIds
  properties:
    userIds:
      type: array
      items:
        type: integer
        format: int64
      maxItems: 50
    reason:
      type: string
      description: Optional audit reason stored on every inserted grant row.
BatchGrantFailure:
  type: object
  description: |
    Per-user failure. `reason` is a stable error code (the same vocabulary as
    the HTTP error codes), not a log line, so the client can translate it.
  required:
  - userId
  - username
  - reason
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
    reason:
      type: string
      example: forum.badge_not_found
BatchGrantResult:
  type: object
  description: |
    Batch result. Partial success is a **200**, not an error: `granted` +
    `skipped` + `len(failed)` always equals the number of distinct user ids sent.
    `skipped` counts users who already held the badge.
  required:
  - granted
  - skipped
  - failed
  properties:
    granted:
      type: integer
    skipped:
      type: integer
    failed:
      type: array
      items:
        "$ref": "#/BatchGrantFailure"
ApiResponseBadgeTierList:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeTierList"
ApiResponseBadgeTierDef:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeTierDef"
ApiResponsePublicBadgeTiers:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/PublicBadgeTiers"
ApiResponseGrantCandidateList:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/GrantCandidateList"
ApiResponseBatchGrantResult:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BatchGrantResult"

# --- 徽章规则引擎（2026-11-12） ---
#
# 三条只读端点的响应形状。`estimated` 必须 nullable：`null` 表示「无法估算」，
# `0` 表示「估算结果确实是零人」——两者语义不同，不能混（与 factKey 的
# 「查不到数据 vs 无法判定」同一条原则）。

RequirementText:
  type: object
  description: |
    双语「获得条件」文案。公开面（`requirementText`）与后台预览
    （`POST /admin/badges/rule-text`）**共用同一个服务端渲染函数**：同一条规则、
    同一份引用名，两处逐字相同。

    语义（2026-11 起）：

    - 永远非空：手工徽章给固定句（「由管理员手动授予」），规则徽章按规则生成；
      运营手填的覆盖文本不再参与（`requirementSummary` 已废弃）。
    - 规则里的分类/标签/角色/徽章/主题/登录方式显示**真名**；解析不到回落泛称
      （「指定分类」这类），所以名称解析失败不会让公开面空白。
    - 长度有上限（单句 100、整段 160 字符）：超限降级为「满足 N 个条件，
      其中最关键的是：…」这样的概括句。

    **绝不包含 AST**：公开响应里出现 rule/cmp/params/children/op 会让规则结构变成
    事实上的公开契约；同样不出现 `topic_count` / `days_visited` 这类参数取值。
  required:
  - zh
  - en
  properties:
    zh:
      type: string
    en:
      type: string

BadgeRuleTextInput:
  type: object
  description: |
    「预览规则文案」的请求体。`rule` 与保存时提交的规则文档形状逐字一致
    （`{"v":1,"root":{...}}`），不另设一套结构；`null` 表示当前草稿还没有规则
    （手工徽章），服务端返回固定句而不是错误。
  required:
  - rule
  properties:
    rule:
      type: [object, "null"]
      description: |
        规则 AST 原样提交。服务端用严格模式解码（未知字段报错）并跑与保存相同的
        校验链；非法规则返回与保存一致的 `422` 错误码。
  additionalProperties: false

BadgeConditionParam:
  type: object
  description: |
    一个条件参数。字段名与 M2 编辑器契约逐字一致：编辑器按 `kind` 决定控件，
    按 `required`/`min`/`max`/`options` 做校验，按 `refKind` 渲染候选选择器。
  required:
  - name
  - kind
  - required
  properties:
    name:
      type: string
    kind:
      type: string
      enum: [int, enum, window, objectRef, string, bool]
    required:
      type: boolean
    min:
      type: integer
      format: int64
    max:
      type: integer
      format: int64
    options:
      type: array
      items:
        type: string
    refKind:
      type: string
      enum: [category, tag, role, provider, badge, fact]

BadgeCondition:
  type: object
  description: |
    一个可选条件。`valueKind` 决定叶子是否需要 `cmp`：`count` 必须有、`boolean` 禁止有。
  required:
  - key
  - valueKind
  - compare
  - labelZh
  - labelEn
  - params
  properties:
    key:
      type: string
    valueKind:
      type: string
      enum: [count, boolean]
    compare:
      type: array
      items:
        type: string
        enum: [gte, gt, lte, lt, eq]
    labelZh:
      type: string
    labelEn:
      type: string
    describeZh:
      type: string
    describeEn:
      type: string
    unitZh:
      type: string
    unitEn:
      type: string
    params:
      type: array
      items:
        "$ref": "#/BadgeConditionParam"

BadgeConditionList:
  type: object
  description: |
    条件目录 + 事实候选 + 对象引用候选。三个面刻意分开：`items` 描述规则的 **type**
    维（条件本身），`factCandidates` 描述 `fact.count` 的 **factKey/variant** 维，
    `refCandidates` 描述 `ParamSpec.refKind` 的**取值域**（分类/标签/角色/登录方式/徽章）。
    插件在清单里声明的双语 label 属于候选项（下拉文案），不会覆盖 Core 条件名。

    `factCandidates` 与 `refCandidates` 都是 additive 字段：早先发布的编辑器只读
    `items` 也照常工作。
  required: [items, factCandidates, refCandidates]
  properties:
    items:
      type: array
      items:
        "$ref": "#/BadgeCondition"
    factCandidates:
      type: array
      description: |
        当前**已启用**扩展声明的事实条件。扩展停用或卸载后候选消失，
        `fact.count` 在可发布目录里随之隐藏，规则求值转 unknown（fail-closed）。
      items:
        "$ref": "#/BadgeFactCandidate"
    refCandidates:
      type: array
      description: |
        编辑器里 `objectRef` 参数的可选值。**永远是五项、固定顺序**：
        `badge` → `category` → `tag` → `role` → `provider`。
        逐类独立成败：某一类取不到候选只把该组标成 `unavailable`，不影响其余类，
        也不让本端点失败。
      items:
        "$ref": "#/BadgeRefCandidateGroup"

BadgeRefCandidateGroup:
  type: object
  description: |
    一类 `objectRef` 候选。`unavailable` 与「候选为空」是两件事：前者表示**取不到**
    （查询失败 / 来源未注入），编辑器应退回文本输入；后者只是当前没有可选项。
    标记（`flags`）只做提示，**不过滤**：已隐藏/已停用的对象仍然可以被选中，
    因为规则记录的是历史事实。
  required: [kind, candidates, unavailable, truncated]
  properties:
    kind:
      type: string
      enum: [badge, category, tag, role, provider]
      description: |
        `badge.owned{slug}` / `object.authoring{targetSlug}` / `identity.role{roleKey}` /
        `identity.oauth_link{providerId}` 的取域分别对应 badge / category(或 tag) /
        role / provider。
    candidates:
      type: array
      description: 永远数组（可能为空），不会是 null；按展示名排序。
      items:
        "$ref": "#/BadgeRefCandidate"
    unavailable:
      type: boolean
      description: true = 取不到候选（不是「没有候选」）。
    truncated:
      type: boolean
      description: true = 结果被截断（每类上限 500 条），编辑器需提示只显示前 500 条。

BadgeRefCandidate:
  type: object
  description: 一个 `objectRef` 的可选值。
  required: [value, label, flags]
  properties:
    value:
      type: string
      description: |
        写进规则 `params` 的值：分类/标签/徽章的 slug、角色的 `roles.key`、
        登录方式的 provider id。
    label:
      type: string
      description: |
        展示名，直接用于下拉项。数据库里大多只有单语名（`categories.name` 等）；
        登录方式取 registry 声明的 zh-CN → en-US → id 回落。
    flags:
      type: array
      description: 提示标记，空数组表示正常。仍可被选中。
      items:
        type: string
        enum: [hidden, disabled]

BadgeFactVariant:
  type: object
  description: 某个事实条件的一个合法 variant 候选（下拉项）。
  required: [value, label]
  properties:
    value:
      type: string
      description: 写进规则 `params.variant` 的值（`^[a-z0-9][a-z0-9._-]{0,63}$`）。
    label:
      "$ref": "#/BadgeI18nText"

BadgeFactCandidate:
  type: object
  description: |
    一个已声明事实条件的候选：`factKey` 的合法取值 + 变体列表。

    `unit` 可为 `null`（该条件没有计量单位）；`compare`与`variants` 永远是数组，
    不会是 null——编辑器按数组渲染，缺失键会让下拉崩掉。
  required: [key, label, unit, compare, variants]
  properties:
    key:
      type: string
      description: |
        规则 `params.factKey` 的合法值。与 `badge_facts.fact_key` 的 CHECK
        （`^[a-z0-9][a-z0-9._-]{1,120}$`）逐字一致，且必须以 `<extensionId>.` 为前缀。
    label:
      "$ref": "#/BadgeI18nText"
    unit:
      allOf:
        - "$ref": "#/BadgeI18nText"
      nullable: true
    compare:
      type: array
      items:
        type: string
        enum: [gte, gt, lte, lt, eq]
    variants:
      type: array
      items:
        "$ref": "#/BadgeFactVariant"

BadgeI18nText:
  type: object
  description: 双语文案（服务端下发，不走前端 `t()`：条件目录是数据不是界面字符串）。
  required: [zh, en]
  properties:
    zh:
      type: string
    en:
      type: string

BadgeRuleImpact:
  type: object
  description: |
    规则影响面的**估算**（语义是「≈」）。AND 取最严叶子、OR 取和，两者对「同时满足」
    的真实人数都只是**上界**。
  required: [method, partial, unsupportedConditions]
  properties:
    estimated:
      type: integer
      format: int64
      nullable: true
      description: |
        估算人数。`null` 表示**无法估算**（不是 0 人）；`0` 表示估算结果确实是零人。
    method:
      type: string
      enum: [single_leaf, strictest_leaf, strictest_leaf_partial, sum_of_leaves, complement_of_leaf, unsupported_condition]
    partial:
      type: boolean
      description: 估算只用了部分叶子（AND 里有不可估的条件）。
    unsupportedConditions:
      type: array
      items:
        type: string

BadgeRuleIssue:
  type: object
  description: |
    规则里的一处失效。`path` 与规则引擎的错误坐标一致
    （`root.children[1].params.topicId`），前端据此定位到编辑器里的节点。
  required: [kind, path, ref, label]
  properties:
    kind:
      type: string
      enum: [missing_topic, missing_category, missing_tag, missing_role, missing_provider, missing_badge_slug, missing_fact_key, undecodable_rule, invalid_rule_shape]
    path:
      type: string
    ref:
      type: string
      description: 失效引用的值；`invalid_rule_shape` 时是错误码（前端按 `admin.badges.rule.errors.<code>` 渲染）。
    label:
      type: string

BadgeRuleHealth:
  type: object
  required: [badgeId, slug, name, issues]
  properties:
    badgeId:
      type: integer
      format: int64
    slug:
      type: string
    name:
      type: string
    issues:
      type: array
      items:
        "$ref": "#/BadgeRuleIssue"

BadgeRuleHealthList:
  type: object
  description: 只列「引用/条件失效」，**不列零授予**；空 `items` 是 200 正常结果。
  required: [items]
  properties:
    items:
      type: array
      items:
        "$ref": "#/BadgeRuleHealth"

ApiResponseBadgeConditionList:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeConditionList"

ApiResponseBadgeRuleImpact:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeRuleImpact"

ApiResponseBadgeRuleText:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/RequirementText"

ApiResponseBadgeRuleHealthList:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeRuleHealthList"

BadgeBackfillRun:
  type: object
  description: |
    One badge's latest `badges.backfill_rules` run. `slug`/`name` come from a join
    on the badge table, so a deleted badge takes its run rows with it.
  required: [badgeId, slug, name, status, lastUserId, failedCursorUserId, startedAt, updatedAt, finishedAt, error]
  properties:
    badgeId:
      type: integer
      format: int64
    slug:
      type: string
    name:
      type: string
    status:
      type: string
      enum: [running, completed, failed]
    lastUserId:
      type: integer
      format: int64
      description: Cursor (`user_id`) of the last **successfully** processed page.
    failedCursorUserId:
      type: integer
      format: int64
      description: |
        `afterUserID` of the failed page. Always `0` for non-failed runs: a retry
        that succeeds clears it, otherwise the report would keep pointing at an
        already-recovered failure.
    startedAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
      nullable: true
      description: |
        Set only when `status` is `completed`. A `failed` run leaves it `null`
        because the queue still retries that page.
    error:
      type: string
      description: Failure message, truncated to 500 characters on write.

BadgeBackfillRunList:
  type: object
  description: 只回每个徽章的**最新**一次回扫；空 `items` 是 200 正常结果。
  required: [items]
  properties:
    items:
      type: array
      items:
        "$ref": "#/BadgeBackfillRun"

ApiResponseBadgeBackfillRunList:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeBackfillRunList"
