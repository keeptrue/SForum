# Badge contract schemas.
#
# These mirror the HTTP wire shapes produced by
# `apps/api/app/Http/Controllers/Badges/dto.go` and `controller.go` — NOT the
# domain structs in `app/Models/Badges/types.go`. The two differ on purpose:
# the domain nests (`UserBadge.Badge`, `UserBadge.Progress`) while the profile
# endpoint flattens each entry so the client renders one row per badge.
#
# Rule for future edits: change this file only after reading the DTO. A field
# that the DTO does not emit must not appear here, even if the domain struct has
# it (for example `groupKey` exists on `badges.Badge` but `adminBadgeResponse`
# does not emit it).
BadgeTier:
  type: string
  description: |
    Badge tier **key**, referencing `badge_tiers.key`.

    Until migration `202611120001_badge_tiers.sql` this was a closed enum of
    `bronze` / `silver` / `gold`. It is now operator-managed data: an operator
    can add a tier (for example `activity_limited`), rename it, recolour it, or
    disable it. The three built-in keys still ship with the migration, so
    existing clients keep working — but **do not** validate this value against a
    client-side enum, and do not derive a colour from it. Read `tierName` /
    `tierColor` instead (they are always present and always match the server).

    Shape (enforced by the database CHECK constraint): 2–32 characters,
    lowercase letters, digits, or underscores, starting with a letter.
  pattern: ^[a-z][a-z0-9_]{1,31}$
  example: gold
BadgeTierName:
  type: object
  description: |
    Bilingual tier name. Both languages are always sent: the server never picks
    one for the caller, because that would make the response body depend on the
    request locale and force `Vary: Accept-Language` onto every cached payload
    that embeds a badge.
  required:
  - zh
  - en
  properties:
    zh:
      type: string
      example: 金牌
    en:
      type: string
      example: Gold
BadgeGrantMode:
  type: string
  enum:
  - automatic
  - manual
BadgeMetric:
  type: string
  enum:
  - topic_count
  - comment_count
  - like_received_count
  - like_given_count
  - bookmark_count
  - days_visited
Badge:
  type: object
  description: |
    Admin-facing badge definition (`adminBadgeResponse`). Carries operator state
    (`enabled`), the rule, and the aggregate `grantedCount`; none of that is
    exposed on the public profile surface.
  required:
  - id
  - slug
  - name
  - description
  - tier
  - tierName
  - tierColor
  - icon
  - grantMode
  - enabled
  - position
  - grantedCount
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    slug:
      type: string
      description: Stable identifier, unique across badges.
    name:
      type: string
    description:
      type: string
    groupId:
      type: [integer, "null"]
      format: int64
      description: Badge group id; null when ungrouped or the group was deleted.
    groupName:
      type: [string, "null"]
      description: Badge group name; null when ungrouped.
    tier:
      "$ref": "#/BadgeTier"
    tierName:
      "$ref": "#/BadgeTierName"
    tierColor:
      type: string
      description: |
        Tier identification colour: one of the nine palette tokens
        (`slate teal emerald sky indigo violet fuchsia rose amber`) or a
        lowercase `#rrggbb`. Empty string means the tier declares no colour.
    icon:
      type: string
      description: Icon library name, `i-lucide-*` or `i-tabler-*`.
    grantMode:
      "$ref": "#/BadgeGrantMode"
    metric:
      oneOf:
      - "$ref": "#/BadgeMetric"
      - type: "null"
      description: Activity column the rule reads; null for manual badges.
    threshold:
      type: [integer, "null"]
      format: int64
      description: Rule threshold; null for manual badges. Always > 0 when set.
    enabled:
      type: boolean
      description: Disabled badges keep their grants but stop rendering.
    position:
      type: integer
      description: Tie-breaker inside a group when tiers are equal.
    grantedCount:
      type: integer
      format: int64
      description: |
        Number of users currently holding the badge, produced by the admin list
        query. Admin surface only; never sent to the public profile endpoint.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
BadgeGroup:
  type: object
  description: Admin-facing badge group (`adminBadgeGroupResponse`).
  required:
  - id
  - key
  - name
  - description
  - position
  - badgeCount
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    key:
      type: string
      description: Stable group key, unique.
    name:
      type: string
    description:
      type: string
    position:
      type: integer
      description: Ascending order of group sections on the profile tab.
    badgeCount:
      type: integer
      format: int64
      description: Number of badges assigned to the group.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ProfileBadgeItem:
  type: object
  description: |
    One cell on the profile badge wall (`profileBadgeItem`), flattened on
    purpose: the client renders one row per badge, so there is no nested badge
    object and no progress object.

    Conditional keys, matching the DTO exactly:
    - `earned: true` → `grantedAt` present; `current` / `threshold` absent.
    - `earned: false` and the badge is automatic with a threshold → `current`
      and `threshold` present; `grantedAt` absent.
    - `earned: false` and the badge is manual → none of the three keys.
    `current: 0` is a valid value and is emitted, not omitted.
  required:
  - slug
  - name
  - tier
  - tierName
  - tierColor
  - icon
  - position
  - earned
  properties:
    slug:
      type: string
    name:
      type: string
    tier:
      "$ref": "#/BadgeTier"
    tierName:
      "$ref": "#/BadgeTierName"
    tierColor:
      type: string
      description: Tier identification colour (palette token or `#rrggbb`).
    icon:
      type: string
    position:
      type: integer
    earned:
      type: boolean
    current:
      type: integer
      format: int64
      description: Current activity value for an unearned automatic badge.
    threshold:
      type: integer
      format: int64
      description: Value that grants the badge; always greater than `current`.
    grantedAt:
      type: string
      format: date-time
      description: Grant timestamp; only present when `earned` is true.
ProfileBadgeGroup:
  type: object
  description: |
    Group section on the profile badge wall (`profileBadgeGroup`). The group
    name appears here once; entries do not repeat it. There is no `description`
    on the wire even though the domain section carries one.
  required:
  - key
  - name
  - position
  - badges
  properties:
    key:
      type: string
    name:
      type: string
    position:
      type: integer
    badges:
      type: array
      items:
        "$ref": "#/ProfileBadgeItem"
ProfileBadges:
  type: object
  description: |
    Whole profile badge tab (`profileBadgesResponse`). Groups are ordered by
    `position`; entries inside a group are ordered by tier weight
    (gold > silver > bronze), then badge `position`, then `grantedAt`
    descending.
  required:
  - groups
  properties:
    groups:
      type: array
      items:
        "$ref": "#/ProfileBadgeGroup"
BadgeRef:
  type: object
  description: |
    Compact badge reference embedded next to a post or comment author
    (`topBadge`, see `forum.yaml`). Actor-agnostic: the same value is served to
    every viewer and may therefore be cached with the post payload. These four
    fields are everything a 12px chip renders.
  required:
  - slug
  - name
  - tier
  - tierName
  - tierColor
  - icon
  properties:
    slug:
      type: string
    name:
      type: string
    tier:
      "$ref": "#/BadgeTier"
    tierName:
      "$ref": "#/BadgeTierName"
    tierColor:
      type: string
      description: Tier identification colour (palette token or `#rrggbb`).
    icon:
      type: string
BadgeGrantRecord:
  type: object
  description: |
    Admin-facing grant record (`badges.BadgeGrantRecord`). There is no `id`
    column on the wire; `(userId, badgeId)` identifies the row.
  required:
  - userId
  - username
  - displayName
  - badgeId
  - badgeSlug
  - grantedAt
  - grantedBy
  - grantReason
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
    badgeId:
      type: integer
      format: int64
    badgeSlug:
      type: string
    grantedAt:
      type: string
      format: date-time
    grantedBy:
      type: [integer, "null"]
      format: int64
      description: Actor user id; null when the actor was hard-deleted.
    grantReason:
      type: string
      description: Free-form operator note; admin surface only.
BadgeGrantList:
  type: object
  required:
  - items
  - total
  properties:
    items:
      type: array
      items:
        "$ref": "#/BadgeGrantRecord"
    total:
      type: integer
      format: int64
BadgeCreateInput:
  type: object
  description: |
    Create body (`badgeBody`). Every field is technically optional on the wire
    because create and update share one struct; the server fills
    `enabled: true` and `icon: i-lucide-award` when omitted. The four fields
    below are nevertheless required for a successful create — omitting one
    fails domain validation with `422 forum.badge_rule_invalid`.
  required:
  - slug
  - name
  - tier
  - grantMode
  properties:
    slug:
      type: string
      description: Lowercase kebab-case identifier; unique.
    name:
      type: string
    description:
      type: string
    groupId:
      type: [integer, "null"]
      format: int64
    tier:
      "$ref": "#/BadgeTier"
    icon:
      type: string
      description: Must start with `i-lucide-` or `i-tabler-`.
    grantMode:
      "$ref": "#/BadgeGrantMode"
    metric:
      oneOf:
      - "$ref": "#/BadgeMetric"
      - type: "null"
    threshold:
      type: [integer, "null"]
      format: int64
    enabled:
      type: boolean
    position:
      type: integer
BadgeUpdateInput:
  type: object
  description: |
    Partial update (`badgeBody` merged onto the stored badge). Every field is
    optional; omitted fields keep their current value, so `{"enabled": false}`
    alone is a valid request.

    `groupId`, `metric` and `threshold` are tri-state: the key being absent
    means "leave unchanged", while an explicit `null` means "clear it".
    Sending `{"metric": null}` on an automatic badge fails validation, because
    an automatic badge must keep a rule.

    Switching `grantMode` to `manual` clears `metric` and `threshold` server
    side, so a follow-up edit that switches back to `automatic` must resend the
    rule.
  properties:
    slug:
      type: string
    name:
      type: string
    description:
      type: string
    groupId:
      type: [integer, "null"]
      format: int64
      description: Absent = unchanged; `null` = ungroup.
    tier:
      "$ref": "#/BadgeTier"
    icon:
      type: string
    grantMode:
      "$ref": "#/BadgeGrantMode"
    metric:
      oneOf:
      - "$ref": "#/BadgeMetric"
      - type: "null"
      description: Absent = unchanged; `null` = clear the rule metric.
    threshold:
      type: [integer, "null"]
      format: int64
      description: Absent = unchanged; `null` = clear the rule threshold.
    enabled:
      type: boolean
    position:
      type: integer
BadgeGroupCreateInput:
  type: object
  description: |
    Group create body (`badgeGroupBody`). Fields are non-pointer: an omitted
    `description` or `position` becomes `""` / `0`, not "keep current".
  required:
  - key
  - name
  properties:
    key:
      type: string
    name:
      type: string
    description:
      type: string
    position:
      type: integer
BadgeGroupUpdateInput:
  type: object
  description: |
    Partial update, same shape as the badge PATCH: the handler reads the current
    group, then merges only the keys that are present. Omitting `description`
    keeps the stored description; it does not clear it.
  properties:
    key:
      type: string
    name:
      type: string
    description:
      type: string
    position:
      type: integer
BadgeGrantInput:
  type: object
  description: |
    Grant body (`badgeGrantBody`). Supply `userId`, or `username` to resolve the
    recipient by profile username; an unknown username returns
    `404 forum.badge_not_found`.
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
      description: Alternative to `userId`; resolved through the public profile lookup.
    reason:
      type: string
      description: Operator note stored on the grant record.
BadgeDeleteResult:
  type: object
  required:
  - deleted
  properties:
    deleted:
      type: boolean
      description: Always true on success.
BadgeGrantResult:
  type: object
  required:
  - granted
  properties:
    granted:
      type: boolean
      description: Always true on success.
BadgeRevokeResult:
  type: object
  required:
  - revoked
  properties:
    revoked:
      type: boolean
      description: |
        Whether a row was actually deleted — **not** "the request succeeded".
        `true` means a `user_badges` row was removed; `false` means the user did
        not hold the badge. Both are `200`, because DELETE stays idempotent, so
        a client must not render `false` as a failure.
BadgeRecomputeResult:
  type: object
  description: |
    Outcome of a full sweep. Two independent counters, because the sweep does
    two things: it back-fills missing automatic grants from the current rules,
    then repairs `top_badge_id`.
  required:
  - granted
  - refreshed
  properties:
    granted:
      type: integer
      format: int64
      description: |
        `user_badges` rows inserted by the rule sweep (`GrantFromRules`).
        Those rows carry `grantedBy: null` and `grantReason: "recompute"`,
        which is how a recompute grant is distinguishable from a rule-time
        grant (null / empty reason) and an operator grant (actor + reason).
        Running the sweep again on an already-correct community returns 0.
    refreshed:
      type: integer
      format: int64
      description: |
        Users whose `top_badge_id` actually changed. Users already pointing at
        the correct badge are not counted, so a no-op sweep returns 0 here too.
ApiResponseBadge:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Badge"
ApiResponseBadgeList:
  type: object
  description: Admin list envelope; `data.items` is the row array.
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/Badge"
ApiResponseBadgeGroup:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeGroup"
ApiResponseBadgeGroupList:
  type: object
  description: Admin list envelope; `data.items` is the row array.
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/BadgeGroup"
ApiResponseProfileBadges:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/ProfileBadges"
ApiResponseBadgeGrantList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeGrantList"
ApiResponseBadgeGrantResult:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeGrantResult"
ApiResponseBadgeRevokeResult:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeRevokeResult"
ApiResponseBadgeDeleteResult:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeDeleteResult"
ApiResponseBadgeRecomputeResult:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeRecomputeResult"

# --- Public badge catalog (/api/v1/badges) ---
#
# 键集合是白名单，与 `publicBadgeCatalogResponse` / `publicBadgeCatalogItem`
# （app/Http/Controllers/Badges/dto.go）逐字对应。刻意不出现 `threshold` / `metric`：
# 阈值是运营调参，公开即不可撤回；想公开的运营写进 `description`。
# 也不出现 `enabled` / `grantedCount` / `createdAt` / `updatedAt` / `id`。
PublicBadgeCatalog:
  type: object
  description: |
    公开徽章目录：全部启用徽章按分组排列，`earned` 标记查看者自己是否已获得。

    `truncated` 在顶层而不是分组级——截断是整份响应的属性。服务端硬上限 500 条。
  required:
  - groups
  - truncated
  properties:
    groups:
      type: array
      items:
        "$ref": "#/PublicBadgeCatalogGroup"
    truncated:
      type: boolean
PublicBadgeCatalogGroup:
  type: object
  description: |
    目录分组外壳。只输出含至少一个启用徽章的分组（空组省略）。

    `key` 为空串表示「未分组」；`name` 可能为空串，展示文案由前端 i18n 决定
    （后端不硬编码「未分组」，否则 en-US 站点会收到中文）。
  required:
  - key
  - name
  - badges
  properties:
    key:
      type: string
    name:
      type: string
    badges:
      type: array
      items:
        "$ref": "#/PublicBadgeCatalogEntry"
PublicBadgeCatalogEntry:
  type: object
  description: |
    目录里的一枚徽章。`group` 是所属分组的 key（未分组为空串），让条目自描述。

    排序（组间与组内同一套规则）：`badge_groups.position ASC, badges.position ASC,
    badges.id ASC`——`id` 是 tiebreaker，position 相同也不会漂。
  required:
  - slug
  - name
  - description
  - icon
  - tier
  - tierName
  - tierColor
  - group
  - earned
  properties:
    slug:
      type: string
    name:
      type: string
    description:
      type: string
    icon:
      type: string
    tier:
      "$ref": "#/BadgeTier"
    tierName:
      "$ref": "#/BadgeTierName"
    tierColor:
      type: string
      description: Tier identification colour (palette token or `#rrggbb`).
    group:
      type: string
    earned:
      type: boolean
      description: |
        查看者是否已获得。**这是查看者相关字段**，因此整个响应禁止共享缓存
        （`Cache-Control: private, no-store`）；匿名请求恒为 `false`。
ApiResponsePublicBadgeCatalog:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/PublicBadgeCatalog"

# --- Badge tiers (/api/v1/admin/badges/tiers, /api/v1/badges/tiers) ---
#
# 等级表把 tier 从枚举变成数据：运营可新增档位、改双语名/图标/颜色、调位次、停用。
# 三个内置档位（gold/silver/bronze）由迁移种子保证存在，position 依次 0/1/2。
#
# 位次语义：position 升序 = 从高到低。它同时是「最高级徽章」排序的第一关键字，
# 所以重排等级会改变全站帖子旁的徽章展示（服务端在重排后自动全量重算）。
BadgeTierDef:
  type: object
  description: |
    One row of the admin tier table (`adminBadgeTierResponse`). `badgeCount` is
    the number of badges referencing this tier — the delete dialog needs it,
    because a non-empty tier can only be deleted with an explicit `migrateTo`.
  required:
  - key
  - name
  - icon
  - color
  - position
  - enabled
  - badgeCount
  properties:
    key:
      "$ref": "#/BadgeTier"
    name:
      "$ref": "#/BadgeTierName"
    icon:
      type: string
      description: Icon library name, `i-lucide-*` or `i-tabler-*`.
    color:
      type: string
      description: |
        Tier identification colour. Empty string means "no explicit colour";
        otherwise one of the nine palette tokens or a lowercase `#rrggbb`.
    position:
      type: integer
      description: Ascending display order; 0 is the highest tier.
    enabled:
      type: boolean
      description: |
        Disabled tiers keep their badges but are excluded from the "top badge"
        competition (the ordering JOIN requires `enabled`).
    badgeCount:
      type: integer
      format: int64
      description: Number of badges referencing this tier.
BadgeTierList:
  type: object
  description: |
    Admin tier table (`adminBadgeTiersResponse`). `colorChoices` is the server's
    palette whitelist; clients must render it instead of shipping their own copy
    (a client-side copy drifts into "selectable in the UI, 422 on save").
  required:
  - items
  - colorChoices
  properties:
    items:
      type: array
      items:
        "$ref": "#/BadgeTierDef"
    colorChoices:
      type: array
      description: Accepted colour values (nine palette tokens). `#rrggbb` is also accepted.
      items:
        type: string
      example: [slate, teal, emerald, sky, indigo, violet, fuchsia, rose, amber]
BadgeTierCreateInput:
  type: object
  description: Create a tier. `key` is immutable after creation.
  required:
  - key
  - nameZh
  - nameEn
  properties:
    key:
      "$ref": "#/BadgeTier"
    nameZh:
      type: string
      description: Chinese display name; required, must not be blank.
    nameEn:
      type: string
      description: English display name; required, must not be blank.
    icon:
      type: string
      description: Icon library name; defaults to `i-lucide-medal`.
    color:
      type: string
      description: Palette token or lowercase `#rrggbb`; empty means no colour.
    position:
      type: integer
      description: Display order; defaults to 0.
    enabled:
      type: boolean
      description: Defaults to true.
BadgeTierUpdateInput:
  type: object
  description: |
    Partial update of a tier. `key` is not accepted — changing it would be a
    different tier, so delete + create instead. Every field is optional; omitted
    fields keep their current value.
  properties:
    nameZh:
      type: string
    nameEn:
      type: string
    icon:
      type: string
    color:
      type: string
    enabled:
      type: boolean
BadgeTierOrderInput:
  type: object
  description: |
    Rewrite tier positions by array index. Tiers not listed keep their relative
    order and are appended after the listed ones.
  required:
  - keys
  properties:
    keys:
      type: array
      items:
        "$ref": "#/BadgeTier"
PublicBadgeTierItem:
  type: object
  description: |
    One row of the public tier catalog (`publicBadgeTierItem`). Only enabled
    tiers are listed; operator fields (`enabled`, `badgeCount`, timestamps) are
    never exposed.
  required:
  - key
  - name
  - icon
  - color
  - position
  properties:
    key:
      "$ref": "#/BadgeTier"
    name:
      "$ref": "#/BadgeTierName"
    icon:
      type: string
    color:
      type: string
    position:
      type: integer
PublicBadgeTiers:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/PublicBadgeTierItem"
GrantCandidate:
  type: object
  description: |
    One row of the batch-grant picker (`grantCandidateItem`).

    `status` and `alreadyGranted` are **hints, not filters**: the server does not
    decide whether granting a badge to a disabled account is legitimate, it only
    reports the facts. Matching covers `username` and `displayName` only —
    never the email address.
  required:
  - userId
  - username
  - displayName
  - status
  - alreadyGranted
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
    status:
      type: string
      enum: [active, disabled, banned]
    alreadyGranted:
      type: boolean
      description: True when the user already holds the badge being granted.
GrantCandidateList:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/GrantCandidate"
BatchGrantInput:
  type: object
  description: |
    Batch grant. At most 50 unique user ids per request; duplicate ids are
    collapsed, non-positive ids are dropped. Only manual badges accept a batch
    grant (automatic badges are owned by their rule).
  required:
  - userIds
  properties:
    userIds:
      type: array
      items:
        type: integer
        format: int64
      maxItems: 50
    reason:
      type: string
      description: Optional audit reason stored on every inserted grant row.
BatchGrantFailure:
  type: object
  description: |
    Per-user failure. `reason` is a stable error code (the same vocabulary as
    the HTTP error codes), not a log line, so the client can translate it.
  required:
  - userId
  - username
  - reason
  properties:
    userId:
      type: integer
      format: int64
    username:
      type: string
    reason:
      type: string
      example: forum.badge_not_found
BatchGrantResult:
  type: object
  description: |
    Batch result. Partial success is a **200**, not an error: `granted` +
    `skipped` + `len(failed)` always equals the number of distinct user ids sent.
    `skipped` counts users who already held the badge.
  required:
  - granted
  - skipped
  - failed
  properties:
    granted:
      type: integer
    skipped:
      type: integer
    failed:
      type: array
      items:
        "$ref": "#/BatchGrantFailure"
ApiResponseBadgeTierList:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeTierList"
ApiResponseBadgeTierDef:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BadgeTierDef"
ApiResponsePublicBadgeTiers:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/PublicBadgeTiers"
ApiResponseGrantCandidateList:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/GrantCandidateList"
ApiResponseBatchGrantResult:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BatchGrantResult"
