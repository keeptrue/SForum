ApiErrorData:
  type: object
  required:
  - reason
  properties:
    reason:
      type: string
      description: |
        Stable machine-readable reason code, such as `auth.register_invalid`,
        `user.invalid_update`, or `user.username_or_email_taken`.
    fields:
      type: object
      description: |
        Localized field-level messages keyed by request field name, present only
        when the failure can be attributed to specific fields. Registration uses
        `username`, `email`, `password`, and `humanVerification`; admin user
        writes use `username`, `email`, `displayName`, `locale`, `status`,
        `kind`, `bio`, `signature`, `location`, `websiteUrl`, and `roleKeys`.
      additionalProperties:
        type: array
        items:
          type: string
    retryAfterSeconds:
      type: integer
      minimum: 1
      description: Whole seconds until a rate-limited operation may be retried.
    retryAt:
      type: string
      format: date-time
      description: Server-authoritative UTC time when a rate-limited operation may be retried.
    details:
      type: object
      additionalProperties: true
      description: >-
        Structured diagnostics for specific failure classes, populated only by
        the endpoints that declare them. The uninstall cleanup failure carries
        operationId, failedStep, and retriable (see LifecycleCleanupFailureDetails
        in extensions.yaml).
ApiErrorResponse:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/ApiErrorData"
ApiResponseNull:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
      examples:
      - 200
    message:
      type: string
      examples:
      - OK
    data:
      type: 'null'
ApiResponseHealth:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/Health"
Health:
  type: object
  required:
  - name
  - status
  - environment
  - locale
  - supportedLocales
  - time
  properties:
    name:
      type: string
    status:
      type: string
      enum:
      - ok
    environment:
      type: string
    locale:
      type: string
      examples:
      - zh-CN
    supportedLocales:
      type: array
      items:
        type: string
    time:
      type: string
      format: date-time
