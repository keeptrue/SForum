ForumSettings:
  type: object
  required:
  - defaultCategorySlug
  - tagCreationMode
  - tagPublicPages
  - tagMinPerTopic
  - tagMaxPerTopic
  - topicsPerPage
  - commentsPerPage
  - topicTitleMinRunes
  - topicTitleMaxRunes
  - topicContentMinRunes
  - topicContentMaxRunes
  - topicEditWindowMinutes
  - topicCooldownSeconds
  - dailyTopicLimit
  - commentMinRunes
  - commentMaxRunes
  - commentMaxNestingDepth
  - treeDescendantsPerRoot
  - commentEditWindowMinutes
  - commentCooldownSeconds
  - dailyCommentLimit
  - excerptRuneLimit
  - guestRead
  - listDefaultSort
  - listHotWindowDays
  - allowAuthorCloseReplies
  - allowAuthorDelete
  - autoLockIdleDays
  - showTopicEditMark
  - duplicateTitlePolicy
  - showCommentEditMark
  - softDeleteVisibility
  - mentionsEnabled
  - mentionsMaxPerPost
  - externalInterstitial
  - trustedDomains
  properties:
    defaultCategorySlug:
      type: string
    tagCreationMode:
      "$ref": "#/TagCreationMode"
    tagPublicPages:
      type: boolean
    tagMinPerTopic:
      type: integer
      minimum: 0
      maximum: 10
    tagMaxPerTopic:
      type: integer
      minimum: 0
      maximum: 10
    topicsPerPage:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
    commentsPerPage:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
    topicTitleMinRunes:
      type: integer
      minimum: 1
      maximum: 200
    topicTitleMaxRunes:
      type: integer
      minimum: 1
      maximum: 200
    topicContentMinRunes:
      type: integer
      minimum: 0
      maximum: 200000
    topicContentMaxRunes:
      type: integer
      minimum: 1
      maximum: 200000
    topicEditWindowMinutes:
      type: integer
      minimum: 0
      maximum: 10080
      description: 0 means unlimited author edit window
    topicCooldownSeconds:
      type: integer
      minimum: 0
      maximum: 86400
      description: 0 means no cooldown between topic creates
    dailyTopicLimit:
      type: integer
      minimum: 0
      maximum: 10000
      description: 0 means unlimited daily topics
    commentMinRunes:
      type: integer
      minimum: 0
      maximum: 50000
    commentMaxRunes:
      type: integer
      minimum: 1
      maximum: 50000
    commentMaxNestingDepth:
      type: integer
      minimum: 0
      maximum: 20
    treeDescendantsPerRoot:
      type: integer
      default: 50
      minimum: 1
      maximum: 100
      description: >
        Maximum number of descendant comments loaded under each root on view=tree
        (D2). Overflow sets hasMoreChildren; clients load more via listCommentReplies.
        Restore defaults sets this back to 50. Same default on all clients (no
        mobile-only lower API cap).
    commentEditWindowMinutes:
      type: integer
      minimum: 0
      maximum: 10080
    commentCooldownSeconds:
      type: integer
      minimum: 0
      maximum: 86400
    dailyCommentLimit:
      type: integer
      minimum: 0
      maximum: 10000
    excerptRuneLimit:
      type: integer
      minimum: 40
      maximum: 500
    guestRead:
      type: string
      enum: [public, login_required]
      description: Whether guests may read public forum content
    listDefaultSort:
      type: string
      enum: [latest, active, hot]
    listHotWindowDays:
      type: integer
      minimum: 1
      maximum: 90
    allowAuthorCloseReplies:
      type: boolean
    allowAuthorDelete:
      type: boolean
    autoLockIdleDays:
      type: integer
      minimum: 0
      maximum: 3650
      description: 0 disables auto-lock of idle topics
    showTopicEditMark:
      type: boolean
    duplicateTitlePolicy:
      type: string
      enum: [off, warn, block]
    showCommentEditMark:
      type: boolean
    softDeleteVisibility:
      type: string
      enum: [author_and_staff, staff_only, hidden]
    mentionsEnabled:
      type: boolean
    mentionsMaxPerPost:
      type: integer
      minimum: 0
      maximum: 50
      description: 0 means unlimited mentions when mentions are enabled
    externalInterstitial:
      type: boolean
      description: Whether off-site links in posts and comments pass through the /outbound interstitial page
    trustedDomains:
      type: string
      description: Newline-separated allowlist of external hosts (host or host:port) that skip the interstitial page
ForumUser:
  type: object
  required:
  - id
  - username
  - displayName
  - avatar
  properties:
    id:
      type: integer
      format: int64
    username:
      type: string
    displayName:
      type: string
    avatar:
      "$ref": "../schemas/profile.yaml#/AvatarView"
ForumRevisionList:
  type: object
  required:
  - items
  - perPage
  - hasMore
  properties:
    items:
      type: array
      items:
        "$ref": "#/ForumRevisionSummary"
    perPage:
      type: integer
    hasMore:
      type: boolean
    nextCursor:
      type: string
      description: Opaque keyset cursor for the next page.
ForumRevisionSummary:
  type: object
  description: Revision header. List responses use this schema and never include raw source.
  required:
  - id
  - revisionNo
  - current
  - operation
  - origin
  - changedFields
  - committedAt
  - snapshotComplete
  - restorableFields
  - redacted
  properties:
    id:
      type: integer
      format: int64
    revisionNo:
      type: integer
      format: int64
    current:
      type: boolean
    actor:
      "$ref": "#/ForumUser"
    operation:
      type: string
      enum: [create, edit, restore, migration]
    origin:
      type: string
      enum: [self, staff, migration]
    reason:
      type: string
      description: Staff/self edit reason visible only through authorized history/admin surfaces.
    changedFields:
      type: array
      items:
        type: string
        enum: [title, content, category, tags, attachments]
    committedAt:
      type: string
      format: date-time
    restoredFromRevisionNo:
      type: integer
      format: int64
    snapshotComplete:
      type: boolean
      description: False for legacy body-only rows that cannot honestly restore metadata.
    restorableFields:
      type: array
      items:
        type: string
        enum: [title, content, category, tags, attachments]
    redacted:
      type: boolean
      description: Redacted revisions keep the header but cannot return source or preview.
ForumRevisionDetail:
  allOf:
  - "$ref": "#/ForumRevisionSummary"
  - type: object
    description: Authorized revision detail. This schema is never used by list responses.
    required:
    - rawContent
    - sourceFormat
    - editorType
    - renderVersion
    - contentHash
    - attachments
    properties:
      rawContent:
        type: string
        description: Historical source returned only after the matching history permission check.
      sourceFormat:
        "$ref": "#/SourceFormat"
      editorType:
        type: string
      editorVersion:
        type: string
      renderVersion:
        type: string
      contentHash:
        type: string
      attachments:
        "$ref": "#/AttachmentAvailabilitySummary"
      preview:
        "$ref": "#/HistoricalPreview"
      topicMetadata:
        "$ref": "#/TopicRevisionMetadata"
RestoreRevisionRequest:
  type: object
  required: [expectedRevision, reason]
  properties:
    expectedRevision:
      type: integer
      format: int64
      minimum: 1
    reason:
      type: string
      minLength: 1
      maxLength: 500
      description: Mandatory restore audit reason.
RedactRevisionRequest:
  type: object
  required: [expectedRevision, reason, confirmation]
  properties:
    expectedRevision:
      type: integer
      format: int64
      minimum: 1
    reason:
      type: string
      minLength: 1
      maxLength: 500
    confirmation:
      type: string
      enum: [REDACT]
      description: Typed irreversible-redaction confirmation.
RevisionRedactionResult:
  type: object
  required: [redacted]
  properties:
    redacted:
      type: boolean
HistoricalPreview:
  type: object
  required:
  - htmlContent
  - plainText
  - excerpt
  - renderVersion
  properties:
    htmlContent:
      type: string
      description: Safe historical preview rendered on demand with the current renderer.
    plainText:
      type: string
    excerpt:
      type: string
    renderVersion:
      type: string
AttachmentAvailabilitySummary:
  type: object
  required:
  - ids
  - total
  properties:
    ids:
      type: array
      items:
        type: integer
        format: int64
    total:
      type: integer
TopicRevisionMetadata:
  type: object
  required:
  - tagSlugs
  properties:
    title:
      type: string
    categorySlug:
      type: string
    tagSlugs:
      type: array
      items:
        type: string
AdminForumContentList:
  type: object
  required:
  - items
  - perPage
  - hasMore
  properties:
    items:
      type: array
      items:
        "$ref": "#/AdminForumContentRow"
    perPage:
      type: integer
    hasMore:
      type: boolean
    nextCursor:
      type: string
AdminForumContentRow:
  type: object
  required:
  - targetType
  - id
  - authorUserId
  - status
  - excerpt
  - currentRevision
  - createdAt
  - updatedAt
  properties:
    targetType:
      type: string
      enum: [topic, comment]
    id:
      type: integer
      format: int64
    topicId:
      type: integer
      format: int64
    topicTitle:
      type: string
    categorySlug:
      type: string
    authorUserId:
      type: integer
      format: int64
    author:
      "$ref": "#/ForumUser"
    status:
      type: string
      description: Topic or comment lifecycle status.
    title:
      type: string
    excerpt:
      type: string
    currentRevision:
      type: integer
      format: int64
      minimum: 1
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    tags:
      type: array
      items:
        "$ref": "#/TopicTagSummary"
AdminForumTopicDetail:
  allOf:
  - "$ref": "#/AdminForumContentRow"
  - type: object
    required:
    - content
    - slug
    properties:
      content:
        "$ref": "#/RenderedContent"
      slug:
        type: string
AdminForumCommentDetail:
  allOf:
  - "$ref": "#/AdminForumContentRow"
  - type: object
    required:
    - content
    - rootCommentId
    - pathKey
    - depth
    - replyCount
    properties:
      content:
        "$ref": "#/RenderedContent"
      parentId:
        type:
        - integer
        - 'null'
        format: int64
      rootCommentId:
        type: integer
        format: int64
      pathKey:
        type: string
      depth:
        type: integer
      replyCount:
        type: integer
        format: int64
TopicSummary:
  type: object
  required:
  - id
  - title
  - slug
  - status
  - commentCount
  - viewCount
  - likeCount
  - excerpt
  - createdAt
  - updatedAt
  - lastActivityAt
  properties:
    id:
      type: integer
      format: int64
    categoryId:
      type: integer
      format: int64
    categorySlug:
      type: string
    categoryName:
      type: string
    authorUserId:
      type: integer
      format: int64
    author:
      "$ref": "#/ForumUser"
    lastReplyAuthor:
      allOf:
      - "$ref": "#/ForumUser"
      description: Author of the latest active comment; equals author when the topic has no comments. Used by the topic list "last activity" column.
    title:
      type: string
    slug:
      type: string
    status:
      "$ref": "#/TopicStatus"
    isPinned:
      type: boolean
    commentCount:
      type: integer
      format: int64
    viewCount:
      type: integer
      format: int64
    likeCount:
      type: integer
      format: int64
      description: Denormalized like count. Present on list rows and detail.
    tags:
      type: array
      items:
        "$ref": "#/TopicTagSummary"
    excerpt:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    lastActivityAt:
      type: string
      format: date-time
    edited:
      type: boolean
      description: True only when showTopicEditMark is enabled and the topic has a persisted content revision; clients must not infer this from timestamps.
    topBadge:
      "$ref": "./badges.yaml#/BadgeRef"
      description: |
        Highest-tier badge the author holds, denormalized from
        `users.top_badge_id`. Actor-agnostic: identical for every viewer, so it
        may be served from the topic cache (up to one TTL of staleness after a
        grant). Absent when the author holds no badge or badges are disabled.
TopicDetail:
  allOf:
  - "$ref": "#/TopicSummary"
  - type: object
    required:
    - content
    properties:
      content:
        "$ref": "#/PublicRenderedContent"
      likedByMe:
        type: boolean
        description: Request-scoped; true only when the authenticated viewer already liked this topic. Never cached.
      bookmarkedByMe:
        type: boolean
        description: |
          Request-scoped; true only when the authenticated viewer currently
          bookmarks this topic (public or private). Decorated after the cache
          layer, never cached.
      likedBy:
        type: array
        description: |
          Reaction preview for the SSR avatar stack: at most 3 likers, self first,
          then earliest. Decorated on the read path after the cache layer; never cached.
        items:
          "$ref": "#/ForumUser"
      editedAt:
        type: string
        format: date-time
        description: Commit time of the current accepted revision. Present only when the topic edit mark is enabled and the topic has been edited.
      contributors:
        type: array
        description: |
          Unique topic body contributors (author plus edit/restore actors).
          Author is first; remaining users ordered by most recent contribution.
          At most 5 entries for sidebar avatar stacks. Staff actors are fully
          exposed by default.
        items:
          "$ref": "#/ForumUser"
      contributorCount:
        type: integer
        description: Total unique contributors; may exceed the length of contributors.
      extensionActions:
        type: array
        description: Safe host-rendered extension action descriptors from enabled plugins. Executing an action still calls the extension route proxy and its policy checks.
        items:
          "$ref": "#/TopicExtensionAction"
      extensionSidebar:
        type: array
        description: Host-rendered topic sidebar cards/links from forum.topic.sidebar (E2.1). No raw HTML; hostLink or extensionRoute only.
        items:
          "$ref": "#/TopicExtensionSidebarItem"
      extensionBadges:
        type: array
        description: Host-rendered status badges under the topic title from forum.topic.badges (E2.1).
        items:
          "$ref": "#/TopicExtensionBadge"
