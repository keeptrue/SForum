    iconColor:
      type: string
      description: Hex color such as '#0f766e'. Empty string means use the admin theme accent.
    visibility:
      type: string
      enum:
      - public
      - hidden
    position:
      type: integer
    defaultSort:
      type: string
      enum:
      - latest
      - hot
    topicCount:
      type: integer
      format: int64
    commentCount:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
