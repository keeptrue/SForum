    message: {type: string}
    data: {$ref: "#/CommentPage"}
# AI 产物评论的一条依据。字段名与 Go 的 aireply.Citation / forum.Citation 一致：
# topicId 用于拼 /t/{topicId}，commentId 非零时再拼 #comment-{commentId}。
# excerpt 取自被引用楼层的正文，不是模型生成的引文。
CommentCitation:
  type: object
  properties:
    topicId:
      type: integer
      format: int64
      description: 被引用楼层所属主题。评论级引用同样带它，前端据此拼可点地址。
    commentId:
      type: integer
      format: int64
      description: 被引用的评论 id。主题级引用省略或为 0（此时链接不带锚点）。
    excerpt:
      type: string
      description: 被引用楼层的正文片段（截断）。来自数据库，不是模型输出。
CommentCitationList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      description: 依据列表，顺序即生成时标注的顺序。零引用时为空数组。
      items:
        $ref: "#/CommentCitation"
    toolCalls:
      type: array
      description: |
        这条评论作为 AI 产物时调用过的工具，顺序即调用顺序。

        只包含公开可投影的条目：四种「模型撞到配置」的结局（unknown_tool /
        not_allowed / step_exhausted / result_budget_exhausted）已被服务端过滤，
        工具返回给模型的正文片段不在此暴露（`arguments` 已按站点脱敏规则处理并
        截断）。零工具调用时该字段整体省略，与「这个能力未装配」同形。
      items:
        $ref: "#/CommentToolCall"
# 一条公开可见的 AI 工具调用。字段名与 Go 的 forum.ToolCallEntry 逐字一致。
# 刻意不含 resultDigest：那是工具返回给模型的正文片段，可能包含提问者可见而
# 读者不可见的内容（私密板块、受限附件）。
CommentToolCall:
  type: object
  properties:
    tool:
      type: string
      description: 工具名（宿主登记表里的名字，例如 web-search）。插件工具用原名，不做本地化。
    arguments:
      type: string
      description: |
        模型给出的工具入参（原始 JSON 字符串），已按站点脱敏规则处理并截断到
        1 KiB。它是模型生成的检索词/标识符，不是用户正文。
    isError:
      type: boolean
      description: 工具自己判定输入有问题（模型拿到了失败结果并据此作答）。真实尝试但失败。
    latencyMs:
      type: integer
      description: 这次调用的耗时（毫秒）。
ApiResponseCommentCitationList:
  type: object
  required: [code, message, data]
  properties:
    code: {type: integer}
    message: {type: string}
    data: {$ref: "#/CommentCitationList"}
CommentRevisionState:
  type: object
  description: |
    公开评论区的修订状态（实时信号的事实来源）。

    - `revision` 只表示「公开可见状态变了」，任何评论正文、作者、会话相关投影都不在其中，
      因此可以安全地公开成 SSE 载荷与轮询降级端点。
    - `commentCount` 与公开列表 `total` 同源（`topics.comment_count`），
      客户端用 `commentCount - 已加载 total` 得到「有新评论」的数量。
    - `lastCommentId` / `lastCommentCreatedAt` 是当前末尾评论，可直接作为 flat keyset
      （`after`）的续页锚点。
  required: [revision, commentCount]
  properties:
    revision:
      type: integer
      format: int64
      minimum: 0
      description: 单调递增修订号；仅作变更信号，不参与授权判断。
    commentCount:
      type: integer
      format: int64
      minimum: 0
      description: 公开（active）评论总数，与列表 total 同口径。
    lastCommentId:
      type: integer
      format: int64
      description: 当前末尾评论 id；主题没有 active 评论时省略。
    lastCommentCreatedAt:
      type: string
      format: date-time
      description: 当前末尾评论的发表时间；与 lastCommentId 同时省略。
ApiResponseCommentRevisionState:
  type: object
  required: [code, message, data]
  properties:
    code: {type: integer}
    message: {type: string}
    data: {$ref: "#/CommentRevisionState"}

ReactionState:
  type: object
  required:
  - targetType
  - targetId
  - reaction
  - liked
  - likeCount
  properties:
    targetType:
      type: string
      enum: [topic, comment]
    targetId:
      type: integer
      format: int64
    reaction:
      type: string
      enum: [like]
    liked:
      type: boolean
      description: True when the authenticated member currently holds this reaction.
    likeCount:
      type: integer
      format: int64
      description: Authoritative count after the toggle.

ReactionRoster:
  type: object
  required:
  - items
  - total
  - hasMore
  properties:
    items:
      type: array
      description: Recent likers, newest first; bounded by limit (max 50).
      items:
        "$ref": "#/ForumUser"
    total:
      type: integer
      format: int64
      description: >
        Total likers for this target as computed by the current page's window
        function (COUNT(*) OVER ()). It is therefore page-derived: when offset
        runs past the last page the query returns no rows and this value is 0.
        Clients must not use it to shrink a total they already displayed.
    hasMore:
      type: boolean

ApiResponseReactionState:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/ReactionState"

ApiResponseReactionRoster:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/ReactionRoster"

BookmarkState:
  type: object
  required:
  - targetType
  - targetId
  - visibility
  - bookmarked
  - publicBookmarkCount
  properties:
    targetType:
      type: string
      enum: [topic, comment]
    targetId:
      type: integer
      format: int64
    visibility:
      type: string
      enum: [private, public]
      description: Effective visibility of the bookmark after the toggle.
    bookmarked:
      type: boolean
      description: True when the authenticated member currently holds this bookmark.
    publicBookmarkCount:
      type: integer
      format: int64
      description: >
        Authoritative public bookmark count for the target after the toggle.
        Private bookmarks never contribute; the count only moves on
        private→public, public→private and public-delete transitions.
    remindAt:
      type: string
      format: date-time
      description: Reminder time currently stored on the bookmark, when one is set.
    remindedAt:
      type: string
      format: date-time
      description: |
        When the reminder was actually delivered. `remindAt` without
        `remindedAt` means "scheduled"; both present means "already sent".

UpsertBookmarkRequest:
  type: object
  properties:
    visibility:
      type: string
      enum: [private, public]
      description: >
        Target visibility. Omitted means "keep the current value" (a new
        bookmark defaults to `private`).
    remindAt:
      type: string
      format: date-time
      description: >
        Optional reminder time (RFC3339). Must be later than now (60s clock
        skew tolerated) and at most 2 years ahead. Setting it also clears any
        previous delivery mark. Removal ignores it.
    clearReminder:
      type: boolean
      description: |
        Reminder clearing is a three-state field:
        `clearReminder: true` clears both `remindAt` and the delivery mark;
        `remindAt` sets (or replaces) the reminder; omitting both keeps the
        stored value unchanged. Sending both is a `422
        forum.bookmark_reminder_conflict` — the API never guesses which one
        wins, because silently dropping either makes the client show a saved
        value that did not change.

BookmarkListItem:
  type: object
  required:
  - targetType
  - targetId
  - visibility
  - createdAt
  properties:
    targetType:
      type: string
      enum: [topic, comment]
    targetId:
      type: integer
      format: int64
    visibility:
      type: string
      enum: [private, public]
      description: >
        `private` rows appear only in the owner's own list. Other viewers and
        the stable core view never see them.
    createdAt:
      type: string
      format: date-time
    remindAt:
      type: string
      format: date-time
      description: Reminder time; owner-only (never present in another viewer's list).
    remindedAt:
      type: string
      format: date-time
      description: Delivery time of the reminder; owner-only.
    topic:
      "$ref": "#/TopicSummary"
      description: Present when the target topic still exists and is readable.
    comment:
      "$ref": "#/BookmarkCommentRef"
      description: Present when the target comment still exists and is readable.

BookmarkCommentRef:
  type: object
  required:
  - id
  - topicId
  - authorUserId
  - status
  - createdAt
  properties:
    id:
      type: integer
      format: int64
    topicId:
      type: integer
      format: int64
    authorUserId:
      type: integer
      format: int64
    depth:
      type: integer
      description: Reply depth in the comment tree.
    status:
      type: string
      description: Comment lifecycle status (`active` for readable comments).
    currentRevision:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time

BookmarkList:
  type: object
  required:
  - items
  - total
  - hasMore
  properties:
    items:
      type: array
      items:
        "$ref": "#/BookmarkListItem"
    total:
      type: integer
      format: int64
    hasMore:
      type: boolean

ApiResponseBookmarkState:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BookmarkState"

ApiResponseBookmarkList:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/BookmarkList"
