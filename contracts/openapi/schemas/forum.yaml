  type: object
  required:
  - id
  - topicId
  - authorUserId
  - rootCommentId
  - pathKey
  - depth
  - replyCount
  - likeCount
  - status
  - content
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    topicId:
      type: integer
      format: int64
    authorUserId:
      type: integer
      format: int64
    author:
      "$ref": "#/ForumUser"
    parentId:
      type:
      - integer
      - 'null'
      format: int64
    rootCommentId:
      type: integer
      format: int64
    pathKey:
      type: string
      description: >
        Hierarchy path key. It defines tree-view parent/child structure and tree ordering;
        the flat list is a time stream ordered by createdAt + id, not by this key.
    depth:
      type: integer
    replyCount:
      type: integer
      format: int64
    likeCount:
      type: integer
      format: int64
      description: Denormalized like count for this comment.
    likedByMe:
      type: boolean
      description: Request-scoped; true only when the authenticated viewer already liked this comment. Never cached.
    bookmarkedByMe:
      type: boolean
      description: |
        Request-scoped; true only when the authenticated viewer currently
        bookmarks this comment (public or private). Decorated after the cache
        layer, never cached.
    likedBy:
      type: array
      description: |
        Reaction preview for the SSR avatar stack: at most 3 likers, self first,
        then earliest. Decorated on the read path after the cache layer; never cached.
      items:
        "$ref": "#/ForumUser"
    status:
      "$ref": "#/CommentStatus"
    content:
      "$ref": "#/PublicRenderedContent"
    replyTo:
      "$ref": "#/ReplyReference"
    children:
      type: array
      items:
        "$ref": "#/Comment"
    hasMoreChildren:
      type: boolean
      description: >
        When true on a tree root (or node), descendant payload was truncated by
        treeDescendantsPerRoot. Clients should offer "load more replies" via
        GET /comments/{commentID}/replies and merge results.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    edited:
      type: boolean
      description: True only when showCommentEditMark is enabled and the comment has a persisted content revision; clients must not infer this from timestamps.
    editedAt:
      type: string
      format: date-time
      description: Commit time of the current accepted revision. Present only when the comment edit mark is enabled and the comment has been edited.
    topBadge:
      "$ref": "./badges.yaml#/BadgeRef"
      description: |
        Highest-tier badge the comment author holds, denormalized from
        `users.top_badge_id`. Actor-agnostic, so it may be served from the
        comment cache (up to one TTL of staleness after a grant). Absent when
        the author holds no badge or badges are disabled.
