      description: True when another page is available (flat keyset or tree root page).
    nextCursor:
      type: string
      description: |
        Opaque forward cursor for view=flat (created_at + id of the last row). Pass as query `after`.
        Omitted/empty when hasMore is false. Tree view may omit nextCursor (use page).
