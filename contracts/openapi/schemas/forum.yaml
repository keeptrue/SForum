TopicList:
  type: object
  required:
  - items
  - total
  - page
  - perPage
  - hasMore
  properties:
    items:
      type: array
      items:
        "$ref": "#/TopicSummary"
    total:
      type: integer
      format: int64
      description: |
        Public list total follows D1 semantics (million-scale read path):
        - single categorySlug → denormalized categories.topic_count (may lag writes briefly; not a request-time COUNT(*))
        - single tagSlug → denormalized tags.topic_count (same)
        - unfiltered home → sum of public category counters (approximate; may be stale)
        - category+tag together → approximate (min of the two counters; not intersection-exact)
        Clients must tolerate stale or approximate totals. Infinite scroll / keyset should prefer hasMore + nextCursor;
        total is secondary and may be approximate on public home.
        Admin/moderation lists may still use exact counts on separate endpoints.
    totalApproximate:
      type: boolean
      description: |
        When true, `total` is an estimate or multi-filter approximation (home / hard-to-count combos).
        When false or omitted, `total` is a denormalized taxonomy counter (category or tag) and may still be briefly stale after writes.
        UI may show an “about N” phrasing only when this flag is true.
    page:
      type: integer
      description: Echo of offset-mode page (1–200). When request used `after`, value is 1 (cursor mode; do not use page for continuation).
    perPage:
      type: integer
    hasMore:
      type: boolean
      description: |
        True when another page of results is available. Required for public list feeds (M5).
        Prefer this over computing from total for infinite scroll.
    nextCursor:
      type: string
      description: |
        Opaque keyset cursor for the next page. Present when hasMore is true; pass as query `after`.
        Bound to the sort used for this response; do not reuse across different sort values.
        Empty or omitted when hasMore is false.
    extensionListBadges:
      type: array
      description: Host-rendered list-row badges from forum.topic.list.badges (E2.4). Returned once per list; clients attach to each row. No per-row plugin RPC.
      items:
        "$ref": "#/TopicExtensionBadge"
