        "$ref": "#/LifecycleOperationSummary"
ApiResponseLifecycleOperationDetail:
  type: object
  required: [code, message, data]
  additionalProperties: false
  properties:
    code: { type: integer }
    message: { type: string }
    data:
      "$ref": "#/LifecycleOperationDetail"
LifecycleCleanupFinalization:
  type: object
  required: [operationId, status, physicalPurgeComplete]
  additionalProperties: false
  properties:
    operationId:
      type: integer
      format: int64
      minimum: 1
    status:
      type: string
      enum: [finalized]
    physicalPurgeComplete:
      type: boolean
      const: true
LifecycleCleanupFailureDetails:
  type: object
  required: [operationId, failedStep, retriable]
  additionalProperties: false
  description: >-
    Structured diagnostics for a failed uninstall physical cleanup. failedStep
    names the finalize step that did not complete; every step is idempotent, so
    a retriable failure can be replayed with the original idempotency key or
    through the keyless finalize-cleanup endpoint.
  properties:
    operationId:
      type: integer
      format: int64
      minimum: 0
      description: Ledger operation the cleanup belongs to; 0 when the operation itself was rejected.
    failedStep:
      type: string
      enum: [quarantine_asset_publication, release_attachment_references, clear_provider_selections, physical_purge, not_finalized]
    retriable:
      type: boolean
      description: Whether replaying the cleanup can make progress.
ApiResponseUninstallCleanupFailed:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [extension.lifecycle_cleanup_failed]
        details:
          "$ref": "#/LifecycleCleanupFailureDetails"
ExtensionUninstallResult:
  type: object
  required: [uninstalled, extensionId]
  additionalProperties: false
  properties:
    uninstalled:
      type: boolean
    extensionId:
      type: string
    operationId:
      type: integer
      format: int64
      minimum: 1
    removalMode:
      type: string
      enum: [preserve, export_then_remove, complete_removal]
    replayed:
      type: boolean
    cleanup:
      "$ref": "#/LifecycleCleanupFinalization"
MissingArtifactCleanupInput:
  type: object
  required: [extensionIds]
  additionalProperties: false
  properties:
    extensionIds:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 128
    dataMode:
      type: string
      enum: [preserve, discard_settings]
      default: preserve
      description: >-
        Preserve keeps Host settings. discard_settings deletes only settings
        stored by SForum. Lifecycle history and plugin-owned business data are
        retained in both modes because missing code cannot run trusted export
        or cleanup hooks.
MissingArtifactCleanupResult:
  type: object
  required: [removed]
  additionalProperties: false
  properties:
    removed:
      type: array
      items:
        "$ref": "#/MissingArtifactCleanupItem"
MissingArtifactCleanupItem:
  type: object
  required:
  - extensionId
  - name
  - type
  - version
  - packageDigest
  - dataMode
  - retainSettings
  - businessDataKept
  additionalProperties: false
  properties:
    extensionId:
      type: string
    name:
      type: string
    type:
      type: string
      enum: [plugin, theme]
    version:
      type: string
    packageDigest:
      type: string
    dataMode:
      type: string
      enum: [preserve, discard_settings]
    retainSettings:
      type: boolean
    businessDataKept:
      type: boolean
      const: true
VersionGCOptions:
  type: object
  additionalProperties: false
  properties:
    retain:
      type: integer
      minimum: 0
      default: 1
      description: Historical versions retained per extension besides the active one; values below 1 normalize to 1.
    retainDays:
      type: integer
      minimum: 0
      default: 0
      description: Also retain versions installed within the last N days; 0 disables the time window.
    extensionId:
      type: string
      maxLength: 128
      description: Limit the plan to one exact extension id.
VersionGCCandidate:
  type: object
  required:
  - extensionId
  - extensionType
  - extensionName
  - versionId
  - version
  - packageDigest
  - packagePath
  - installedAt
  - historyRank
  - reclaimable
  additionalProperties: false
  properties:
    extensionId:
      type: string
    extensionType:
      type: string
      enum: [plugin, theme]
    extensionName:
      type: string
    versionId:
      type: integer
      format: int64
    version:
      type: string
    packageDigest:
      type: string
    packagePath:
      type: string
    installedAt:
      type: string
      format: date-time
    historyRank:
      type: integer
      description: Recency rank among the extension's historical (non-active, non-staged) versions; 1 is the newest.
    reclaimable:
      type: boolean
    blockedReason:
      type: string
      enum: [publication_history, open_operation, within_retention, disk_missing]
      description: Present only when reclaimable is false. disk_missing rows belong to missing-artifact cleanup, not version GC.
VersionGCConfirmation:
  type: object
  required: [token, planDigest, candidateCount, expiresAt]
  additionalProperties: false
  properties:
    token:
      type: string
      minLength: 64
      maxLength: 64
      description: One-time confirmation token bound to the exact plan digest; the Host stores only its SHA-256 hash.
    planDigest:
      type: string
      minLength: 64
      maxLength: 64
    candidateCount:
      type: integer
      minimum: 0
    expiresAt:
      type: string
      format: date-time
VersionGCSkip:
  type: object
  required: [candidate, reason]
  additionalProperties: false
  properties:
    candidate:
      "$ref": "#/VersionGCCandidate"
    reason:
      type: string
VersionGCItemError:
  type: object
  required: [candidate, error]
  additionalProperties: false
  properties:
    candidate:
      "$ref": "#/VersionGCCandidate"
    error:
      type: string
VersionGCSweepResult:
  type: object
  required: [removed, skipped, failed, bytesFreed, candidateCount]
  additionalProperties: false
  properties:
    removed:
      type: array
      items:
        "$ref": "#/VersionGCCandidate"
    skipped:
      type: array
      items:
        "$ref": "#/VersionGCSkip"
    failed:
      type: array
      items:
        "$ref": "#/VersionGCItemError"
    warnings:
      type: array
      description: Non-fatal residue notices (for example staging bytes that could not be removed after a committed ledger deletion).
      items:
        type: string
    bytesFreed:
      type: integer
      format: int64
      minimum: 0
    candidateCount:
      type: integer
      minimum: 0
VersionGCConfirmationInput:
  type: object
  additionalProperties: false
  properties:
    retain:
      type: integer
      minimum: 0
    retainDays:
      type: integer
      minimum: 0
    extensionId:
      type: string
      maxLength: 128
VersionGCExecuteInput:
  type: object
  required: [token]
  additionalProperties: false
  properties:
    retain:
      type: integer
      minimum: 0
    retainDays:
      type: integer
      minimum: 0
    extensionId:
      type: string
      maxLength: 128
    token:
      type: string
      minLength: 64
      maxLength: 64
ApiResponseVersionGCCandidates:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      type: object
      required: [candidates]
      additionalProperties: false
      properties:
        candidates:
          type: array
          items:
            "$ref": "#/VersionGCCandidate"
ApiResponseVersionGCConfirmation:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/VersionGCConfirmation"
ApiResponseVersionGCSweepResult:
  type: object
  required: [code, message, data]
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/VersionGCSweepResult"
LifecycleRecoveryInput:
  type: object
  required: [decision]
  additionalProperties: false
  properties:
    decision:
      type: string
      enum: [retry, skip_step]
    reason:
      type: string
      maxLength: 4096
      description: Required for skip-step and every forced uninstall escalation.
    escalateForced:
      type: boolean
      default: false
      description: Super-admin-only uninstall escalation acknowledging residual external resources.
LifecyclePublicError:
  type: object
  description: Stable operator-facing lifecycle error. Trusted runtime metadata and opaque failure payloads are never returned.
  required: [retryable]
  additionalProperties: false
  properties:
    code:
      type: string
      enum: [lifecycle.action_failed, lifecycle.cancelled, lifecycle.coordinator_interrupted, lifecycle.deadline_exceeded, lifecycle.execution_failed]
    reason:
      type: string
      enum: [lifecycle.action_failed, lifecycle.cancelled, lifecycle.coordinator_interrupted, lifecycle.deadline_exceeded, lifecycle.execution_failed]
    message:
      type: string
    retryable:
      type: boolean
    retryAfter:
      type: string
      format: date-time
LifecycleOperationSummary:
  type: object
  description: Allowlisted durable lifecycle operation status. Authority snapshots, idempotency data, checkpoints, progress documents, and result documents are excluded.
  required:
  - id
  - extensionId
  - extensionVersion
  - packageDigest
  - operation
  - state
  - planVersion
  - forced
  - attemptCount
  - revision
  - error
  - createdAt
  - updatedAt
  additionalProperties: false
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    extensionId:
      type: string
    extensionVersion:
      type: string
    packageDigest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    operation:
      type: string
      enum: [install, enable, disable, upgrade, rollback, uninstall]
    state:
      type: string
      enum: [planned, migrating, starting, healthy, registering, enabled, draining, uninstalling, failed, recovery]
    planVersion:
      type: string
    removalMode:
      type: string
      enum: [preserve, export_then_remove, complete_removal]
    forced:
      type: boolean
    attemptCount:
      type: integer
      minimum: 0
    revision:
      type: integer
      format: int64
      minimum: 0
    currentStepId:
      type: string
    terminalResult:
      type: string
      enum: [succeeded, failed, cancelled, skipped]
    closed:
      type: boolean
      description: True once the operation reached a durable terminal result. This mirrors completed_at and is the same predicate the runtime fence and `sforum extension recovery lifecycle-close` use; state is only the last phase the operation reached.
    requestedByUserId:
      type: integer
      format: int64
      minimum: 1
    auditEventId:
      type: integer
      format: int64
      minimum: 1
    recoveryActorUserId:
      type: integer
      format: int64
      minimum: 1
    recoveryAuditEventId:
      type: integer
      format: int64
      minimum: 1
    error:
      "$ref": "#/LifecyclePublicError"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
LifecycleStepSummary:
  type: object
  description: Allowlisted lifecycle step progress. Checkpoints, inputs, results, lease credentials, and error metadata are excluded.
  required:
  - id
  - stepId
  - lifecycleAction
  - planVersion
  - attempt
  - status
  - completedUnits
  - totalUnits
  - forced
  - error
  - createdAt
  - updatedAt
  additionalProperties: false
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    stepId:
      type: string
    lifecycleAction:
      type: string
      enum: [install.plan, install, enable, disable, upgrade.plan, upgrade.before, upgrade.after, rollback, uninstall.plan, uninstall, uninstall.after, host.gate]
    planVersion:
      type: string
    attempt:
      type: integer
      minimum: 1
    status:
      type: string
      enum: [planned, running, waiting, succeeded, failed, cancelled, skipped]
    completedUnits:
      type: integer
      format: int64
      minimum: 0
    totalUnits:
      type: integer
      format: int64
      minimum: 0
    skipReason:
      type: string
    forced:
      type: boolean
    actorUserId:
      type: integer
      format: int64
      minimum: 1
    auditEventId:
      type: integer
      format: int64
      minimum: 1
    error:
      "$ref": "#/LifecyclePublicError"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
LifecycleRecoverySummary:
  type: object
  required:
  - id
  - operationAttempt
  - decision
  - escalateForced
  - actorUserId
  - auditEventId
  - createdAt
  additionalProperties: false
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    operationAttempt:
      type: integer
      minimum: 2
    decision:
      type: string
      enum: [retry, skip_step]
    escalateForced:
      type: boolean
    reason:
      type: string
    actorUserId:
      type: integer
      format: int64
      minimum: 1
    auditEventId:
      type: integer
      format: int64
      minimum: 1
    createdAt:
      type: string
      format: date-time
LifecycleOperationDetail:
  type: object
  description: One lifecycle operation plus allowlisted step-attempt and operator recovery-decision history.
  required:
  - id
  - extensionId
  - extensionVersion
  - packageDigest
  - operation
  - state
  - planVersion
  - forced
  - attemptCount
  - revision
  - error
  - createdAt
  - updatedAt
  - steps
  - recoveries
  additionalProperties: false
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    extensionId:
      type: string
    extensionVersion:
      type: string
    packageDigest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    operation:
      type: string
      enum: [install, enable, disable, upgrade, rollback, uninstall]
    state:
      type: string
      enum: [planned, migrating, starting, healthy, registering, enabled, draining, uninstalling, failed, recovery]
    planVersion:
      type: string
    removalMode:
      type: string
      enum: [preserve, export_then_remove, complete_removal]
    forced:
      type: boolean
    attemptCount:
      type: integer
      minimum: 0
    revision:
      type: integer
      format: int64
      minimum: 0
    currentStepId:
      type: string
    terminalResult:
      type: string
      enum: [succeeded, failed, cancelled, skipped]
    closed:
      type: boolean
      description: True once the operation reached a durable terminal result. This mirrors completed_at and is the same predicate the runtime fence and `sforum extension recovery lifecycle-close` use; state is only the last phase the operation reached.
    requestedByUserId:
      type: integer
      format: int64
      minimum: 1
    auditEventId:
      type: integer
      format: int64
      minimum: 1
    recoveryActorUserId:
      type: integer
      format: int64
      minimum: 1
    recoveryAuditEventId:
      type: integer
      format: int64
      minimum: 1
    error:
      "$ref": "#/LifecyclePublicError"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
    steps:
      type: array
      items:
        "$ref": "#/LifecycleStepSummary"
    recoveries:
      type: array
      items:
        "$ref": "#/LifecycleRecoverySummary"
ExtensionType:
  type: string
  enum:
  - plugin
  - theme
ExtensionStatus:
  type: string
  enum:
  - installed
  - enabled
  - disabled
ExtensionSource:
  type: string
  enum:
  - builtin
  - uploaded
ExtensionManifest:
  type: object
  description: SForum extension manifest. Plugins may declare runtime, route, provider, settings, event, and admin capabilities. Themes are buildless theme.json/static-asset packages; they may declare settings and admin pages but must not declare plugin runtime capabilities.
  required:
  - id
  - name
  - description
  - url
  - author
  - version
  - type
  - sforumVersion
  properties:
    manifestVersion:
      type: integer
      enum: [1, 2, 3]
      description: Omitted manifests use the V1 compatibility contract. V3 packages must set 3 explicitly.
    id:
      type: string
    name:
      type: string
    description:
      type: string
    url:
      type: string
      format: uri
    author:
      "$ref": "#/ExtensionManifestAuthor"
    version:
      type: string
    type:
      "$ref": "#/ExtensionType"
    sforumVersion:
      type: string
    langs:
      type: object
      description: Optional localized display overrides. Top-level name, description, url, and author are the default English copy. When langs is omitted, hosts use the top-level fields as-is. Locale keys may be short codes such as zh or full tags such as zh-CN; UI locales like zh-CN also match zh.
      additionalProperties:
        "$ref": "#/ExtensionManifestLocale"
    permissions:
      type: array
      description: Plugin-only permission keys. Theme manifests must omit permissions in v1.
      items:
        type: string
    capabilities:
      type: array
      description: >-
        Plugin-only host capability keys (F2.1). Must be entries from the host
        capability catalog (e.g. net.outbound, jobs.enqueue, host.api). Themes
        must omit capabilities. When omitted, the host may still imply a
        minimal set from backend/jobs/settings/providers.
      items:
        type: string
    settings:
      description: Versioned Settings Document, or the legacy array shorthand normalized to Schema/form.
      oneOf:
      - type: array
        items:
          "$ref": "#/ExtensionManifestSetting"
      - "$ref": "#/ExtensionManifestSettingsDocument"
    migrations:
      type: array
      description: Plugin-only SQL migration declarations. V3 binds stable ids, contract versions, transaction policy, and exact file digests.
      items:
        "$ref": "#/ExtensionManifestMigration"
    backend:
      type: object
      description: Plugin-only backend runtime declaration. Theme manifests must omit backend runtime fields in v1.
      properties:
        entry:
          type: string
        rpc:
          type: string
        protocolVersion:
          type: integer
          minimum: 0
          maximum: 2
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        hostApiVersion:
          type: string
    admin:
      "$ref": "#/ExtensionManifestAdmin"
    adminPages:
      type: array
      description: Legacy core-container admin page declarations. Prefer admin.pages for new manifests; legacy pages remain compatibility-mapped.
      items:
        "$ref": "#/ExtensionManifestAdminPage"
    routes:
      type: array
      description: Plugin-only proxied route declarations. Theme manifests must omit routes in v1.
      items:
        "$ref": "#/ExtensionManifestRoute"
    hooks:
      type: array
      description: Plugin-only lifecycle or domain hook declarations. Theme manifests must omit hooks in v1.
      items:
        "$ref": "#/ExtensionManifestHook"
    events:
      type: array
      description: Plugin-only event listener declarations. Theme manifests must omit events in v1. Legacy hooks are treated as observe/filter listeners according to the host event catalog.
      items:
        "$ref": "#/ExtensionManifestEvent"
    jobs:
      type: array
      description: Plugin-only background job declarations. Theme manifests must omit jobs in v1.
      items:
        "$ref": "#/ExtensionManifestJob"
    providers:
      type: array
      description: Plugin-only provider slot declarations. Theme manifests must omit providers in v1.
      items:
        "$ref": "#/ExtensionManifestProvider"
    contributions:
      type: array
      description: Plugin-only declarative contributions to host-owned typed points. Theme manifests must omit contributions in v1.
      items:
        "$ref": "#/ExtensionManifestContribution"
    guards:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestGuard"
    schedules:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestSchedule"
    components:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestComponent"
    templates:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestTemplate"
    assets:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestAsset"
    content:
      type: array
      maxItems: 512
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestContent"
    database:
      "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestDatabase"
    cache:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestCache"
    seo:
      type: array
      maxItems: 512
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestSEO"
    services:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestService"
    commands:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestCommand"
    adminSurfaces:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestAdminSurface"
    queries:
      type: array
      maxItems: 512
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestQuery"
    queryResultFilters:
      type: array
      maxItems: 64
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestQueryResultFilter"
    identity:
      "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestIdentity"
    permissionDefinitions:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestPermissionDefinition"
    media:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestMediaPipeline"
    navigation:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestNavigation"
    regions:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestRegion"
    dependencies:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestDependency"
    lifecycle:
      "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestLifecycle"
    openapi:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestOpenAPIFragment"
    packageFiles:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestPackageFile"
    includes:
      "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestIncludes"
  allOf:
  - if:
      required: [identity]
      properties:
        identity:
          type: object
          required: [providers]
          properties:
            providers:
              type: array
              contains:
                required: [operations]
                properties:
                  operations: { type: array, minItems: 1 }
    then:
      required: [backend]
      properties:
        type: { const: plugin }
        backend:
          type: object
          required: [entry, protocolVersion]
          properties:
            entry: { type: string, minLength: 1 }
            protocolVersion: { const: 2 }
ExtensionManifestAuthor:
  type: object
  required:
  - name
  properties:
    name:
      type: string
    url:
      type: string
      format: uri
    email:
      type: string
      format: email
ExtensionManifestLocale:
  type: object
  description: Localized display fields for one locale. All properties are optional; present non-empty values override the matching top-level default English field.
  properties:
    name:
      type: string
    description:
      type: string
    url:
      type: string
      format: uri
    author:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        email:
          type: string
          format: email
# 设置展示文案：纯字符串，或 locale → 文案 map（如 zh-CN / en-US）。
LocalizedText:
  oneOf:
  - type: string
  - type: object
    additionalProperties:
      type: string
    minProperties: 1
    description: Locale map. Keys are BCP 47 codes such as zh-CN or en-US.
ExtensionManifestSetting:
  type: object
  required:
  - key
  - label
  - type
  properties:
    key:
      type: string
    label:
      "$ref": "#/LocalizedText"
    description:
      "$ref": "#/LocalizedText"
    type:
      type: string
      description: Host-rendered control type. Supported values are text, string, number, boolean, select, secret, and textarea.
      enum: [text, string, number, boolean, select, secret, textarea]
    default:
      type: string
    placeholder:
      "$ref": "#/LocalizedText"
      description: Optional example or input hint rendered by the host after locale resolution.
    recommendedValue:
      type: string
      description: Provider-declared value used by the generic restore-recommended action. Secrets are never restored or cleared through this field.
    required:
      type: boolean
      description: Marks a field that must be non-empty in provider configuration flows.
    width:
      type: string
      description: Schema UI control width. default caps the control (max-w-xl); full fills the available column width. Omitted values are treated as default.
      enum: [default, full]
    group:
      "$ref": "#/LocalizedText"
      description: Optional section title used to group related controls in declaration order.
    groupId:
      type: string
      description: Optional Settings Document group id. When omitted, the host may match group label text to a declared group.
    column:
      type: integer
      minimum: 1
      maximum: 2
      description: Optional column hint inside a two-column group.
    options:
      type: array
      description: Ordered choices. Settings with options render as a select instead of free text.
      items:
        type: object
        required: [value, label]
        properties:
          value:
            type: string
          label:
            "$ref": "#/LocalizedText"
          description:
            "$ref": "#/LocalizedText"
ExtensionManifestSettingsDocument:
  type: object
  required: [schemaVersion, ui, fields]
  properties:
    schemaVersion:
      type: integer
      enum: [1]
    ui:
      "$ref": "#/ExtensionManifestSettingsUI"
    fields:
      type: array
      items:
        "$ref": "#/ExtensionManifestSetting"
    actions:
      type: array
      items:
        "$ref": "#/ExtensionManifestSettingsAction"
ExtensionManifestSettingsUI:
  type: object
  required: [mode, layout]
  properties:
    mode:
      type: string
      enum: [schema, component]
    layout:
      type: string
      enum: [form, tabs]
    tabs:
      type: array
      items:
        "$ref": "#/ExtensionManifestSettingsTab"
    groups:
      type: array
      items:
        "$ref": "#/ExtensionManifestSettingsGroup"
    callouts:
      type: array
      items:
        "$ref": "#/ExtensionManifestSettingsCallout"
    component:
      "$ref": "#/ExtensionManifestSettingsComponent"
ExtensionManifestSettingsTab:
  type: object
  required: [id, label]
  properties:
    id: { type: string }
    label: { "$ref": "#/LocalizedText" }
    description: { "$ref": "#/LocalizedText" }
    groups:
      type: array
      items: { type: string }
ExtensionManifestSettingsGroup:
  type: object
  required: [id, label]
  properties:
    id: { type: string }
    label: { "$ref": "#/LocalizedText" }
    description: { "$ref": "#/LocalizedText" }
    columns: { type: integer, minimum: 1, maximum: 2 }
ExtensionManifestSettingsCallout:
  type: object
  required: [id, title]
  properties:
    id: { type: string }
    tone: { type: string }
    title: { "$ref": "#/LocalizedText" }
    body: { "$ref": "#/LocalizedText" }
    linkLabel: { "$ref": "#/LocalizedText" }
    linkUrl: { type: string, format: uri }
    tab: { type: string }
    group: { type: string }
ExtensionManifestSettingsComponent:
  type: object
  description: Author-prebuilt browser module. The host never compiles source files.
  required: [id, apiVersion, entry]
  properties:
    id: { type: string }
    apiVersion: { type: integer, enum: [1] }
    entry: { type: string, pattern: '^frontend/admin/dist/.+\.mjs$' }
    css: { type: string, pattern: '^frontend/admin/dist/.+\.css$' }
ExtensionManifestSettingsAction:
  type: object
  required: [id, kind, label]
  properties:
    id: { type: string }
    kind: { type: string, enum: [provider_probe, ai_tool_probe] }
    label: { "$ref": "#/LocalizedText" }
    description: { "$ref": "#/LocalizedText" }
    placement: { type: string, enum: [header, footer], default: footer }
    useDraftValues: { type: boolean, default: false }
    fields:
      type: array
      items: { type: string }
    tool:
      type: string
      description: AI tool declaration id (aiTools[].id) an ai_tool_probe dispatches to. Required for that kind; absent for provider_probe.
ExtensionManifestAdmin:
  type: object
  description: Extension admin entry and page declarations. Manage resolves to entry, then settings, then first declared page, then the generated about page.
  properties:
    entry:
      type: string
      description: In-admin extension page path such as /settings. Must point to /about or a declared page.
    pages:
      type: array
      items:
        "$ref": "#/ExtensionManifestAdminPage"
ExtensionManifestAdminPage:
  type: object
  required:
  - path
  - label
  properties:
    path:
      type: string
    label:
      type: string
    description:
      type: string
    icon:
      type: string
    view:
      type: string
      enum:
      - about
      - settings
    menu:
      type: boolean
      default: false
      description: Whether this page appears in admin sidebar navigation. Defaults to false.
    order:
      type: integer
      minimum: 0
    permission:
      type: string
    hostActions:
      type: array
      maxItems: 8
      uniqueItems: true
      description: >-
        Host-provided actions this page may call. Only valid with
        view=component. The first version accepts extension.install only, which
        exposes bridge.installExtension after a Host confirmation dialog and
        stages the package without enabling or trusting it.
      items:
        type: string
        enum: [extension.install]
ExtensionManifestMigration:
  type: object
  required: [path]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    transaction: { type: string, enum: [required, forbidden, auto] }
ExtensionManifestJob:
  type: object
  required: [name]
  properties:
    id: { type: string }
    contractVersion: { type: string }
    name: { type: string }
    handler: { type: string }
    payloadSchema: { type: string }
    retryPolicy: { type: string, enum: [none, bounded, exponential] }
    maxAttempts: { type: integer, minimum: 1, maximum: 25, default: 5 }
    retryDelaySeconds:
      type: integer
      minimum: 0
      maximum: 3600
      description: Fixed retry delay for bounded policy; must be zero for none or exponential.
    concurrencyLimit: { type: integer, minimum: 1, maximum: 16, default: 4 }
ExtensionManifestRoute:
  type: object
  required:
  - path
  - methods
  properties:
    id:
      type: string
    contractVersion:
      type: string
    action:
      type: string
      enum: [add, alias, redirect, rewrite, before, after, filter, wrap, replace, global_middleware]
    targetId:
      type: string
    path:
      type: string
    methods:
      type: array
      items:
        type: string
      description: V3 accepts any normalized RFC HTTP method token. V1 compatibility remains limited by the Host validator.
    access:
      type: string
      enum:
      - public
      - login
      - permission
    permission:
      type: string
    guard:
      type: string
    priority:
      type: integer
    fallback:
      type: string
      enum: [closed, not_found, readonly_core]
    mode:
      type: string
      enum: [http, sse, websocket, stream, multipart]
    destination:
      type: string
    statusCode:
      type: integer
      enum: [301, 308]
      default: 308
      description: Redirect status. Omitted redirect declarations normalize to 308; non-redirect actions must not set this field.
    handler:
      type: string
    requestSchema:
      type: string
      description: Required for structured HTTP request documents; optional documentation metadata for opaque non-HTTP payloads.
    responseSchema:
      type: string
      description: Required for structured HTTP responses; optional documentation metadata for opaque non-HTTP payloads.
    mutableRequestFields:
      type: array
      description: Exact RFC 6901 allowlist into query string arrays, string params, lowercase allowed headers, or typed JSON body. Credential headers require raw_request authority.
      maxItems: 64
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^/([^~/]|~[01])*(/([^~/]|~[01])*){0,31}$'
    mutableResponseFields:
      type: array
      description: Exact RFC 6901 allowlist into status, lowercase allowed headers, or typed JSON body. Host-owned Location and Link are never mutable.
      maxItems: 64
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^/([^~/]|~[01])*(/([^~/]|~[01])*){0,31}$'
    timeoutMs:
      type: integer
      minimum: 0
ExtensionManifestHook:
  type: object
  required:
  - name
  properties:
    id: { type: string }
    contractVersion: { type: string }
    name:
      type: string
    kind: { type: string, enum: [action, filter, observe] }
    targetId: { type: string }
    handler: { type: string }
    inputSchema: { type: string }
    resultSchema: { type: string }
    priority: { type: integer }
ExtensionManifestEvent:
  type: object
  required:
  - name
  properties:
    id: { type: string }
    contractVersion: { type: string }
    name:
      type: string
    kind:
      type: string
      enum:
      - observe
      - validate
      - filter
    handler: { type: string }
    inputSchema: { type: string }
    resultSchema: { type: string }
    priority: { type: integer }
    timeoutMs:
      type: integer
      minimum: 0
ExtensionManifestProvider:
  type: object
  required:
  - slot
  - label
  properties:
    id: { type: string }
    contractVersion: { type: string }
    slot:
      type: string
    label:
      type: string
    handler: { type: string }
    priority: { type: integer }
    timeoutMs:
      type: integer
      minimum: 0
ExtensionManifestContribution:
  type: object
  required:
  - point
  - id
  - label
  - payload
  properties:
    point:
      type: string
      enum:
      - forum.topic.actions
      - forum.topic.sidebar
      - forum.topic.badges
      - forum.comment.actions
      - forum.nav.items
      - forum.topic.list.badges
      - forum.composer.toolbar
      - forum.profile.tabs
      - admin.dashboard.widgets
      - system.health.checks
    id:
      type: string
      description: Unique contribution id within this extension and point.
    order:
      type: integer
      minimum: 0
      default: 0
    label:
      type: object
      additionalProperties:
        type: string
      description: Localized user-facing labels, typically zh-CN and en-US.
    icon:
      type: string
      description: Nuxt Icon name with approved i-lucide- or i-tabler- prefix.
    enabledBySetting:
      type: string
      description: >
        Optional boolean setting key on the same extension. When set, the
        contribution is only effective when that setting resolves truthy
        (stored value, otherwise the setting schema default). Use for
        optional public UI such as topic badges that should stay off by default.
    payload:
      "$ref": "#/ExtensionContributionPayload"
ExtensionContributionPayload:
  type: object
  description: >
    Host-owned contribution payloads (F4.3). Never executable JSON.
    Shape depends on the contribution point payloadType:
    extensionRoute, profileSection, topicSidebarCard, topicBadge, navItem,
    dashboardLink, or healthDescriptor.
  required:
  - type
  properties:
    type:
      type: string
      enum:
      - extensionRoute
      - hostLink
      - adminLink
      - extensionRuntime
      - static
    method:
      type: string
      enum:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    path:
      type: string
      description: Safe plugin route path under /api/v1/extensions/{extensionId}; must start with / and must not target /api or external URLs.
    href:
      type: string
      description: In-app relative path for profile hostLink contributions.
    route:
      type: string
      description: Admin-shell relative route for dashboard widgets.
    severity:
      type: string
      enum:
      - info
      - success
      - warning
      - danger
    component:
      type: string
      description: Health component name for system.health.checks descriptors.
    confirm:
      type: boolean
    required:
      type: boolean
      description: For system.health.checks only; when true a failed component marks not_ready.
ExtensionRuntimeStatus:
  type: object
  required:
  - state
  - routeCount
  - hookCount
  - eventCount
  - providerCount
  properties:
    state:
      type: string
      enum:
      - stopped
      - starting
      - running
      - degraded
      - failed
      description: >-
        degraded means the plugin process is up but the host resilience gate
        has consecutive failures or an open circuit (F2.3).
    lastError:
      type: string
    startedAt:
      type: string
      format: date-time
    routeCount:
      type: integer
    hookCount:
      type: integer
    eventCount:
      type: integer
    providerCount:
      type: integer
    circuitOpen:
      type: boolean
      description: True when the host circuit breaker is open for this extension.
    circuitOpenUntil:
      type: string
      format: date-time
    consecutiveFailures:
      type: integer
    lastFailureReason:
      type: string
    lastFailureAt:
      type: string
      format: date-time
    activeRpcCalls:
      type: integer
    maxConcurrentRpc:
      type: integer
    protocolVersion:
      type: integer
      enum:
      - 1
      - 2
      description: Exact HashiCorp go-plugin protocol selected from the trusted Manifest.
    protocolTransport:
      type: string
      enum:
      - net/rpc
      - grpc
    protocolDeprecated:
      type: boolean
      description: True for the operational protocol-v1 compatibility adapter.
    protocolStartCount:
      type: integer
      format: int64
    protocolCallCount:
      type: integer
      format: int64
    protocolLastCallAt:
      type: string
      format: date-time
    memoryBytes:
      type: integer
      format: int64
      minimum: 0
      description: >-
        OS RSS (bytes) of the owned backend plugin subprocess for this
        extension, sampled from the host process table. Omitted when no
        process is visible (stopped, theme, host-managed, or sample failed).
        Not a full account of host-side caches attributed to the plugin.
ExtensionVersion:
  type: object
  description: >-
    Immutable package snapshot staged for a future trusted activation. Internal
    database identity is never exposed through the management API.
  required:
  - version
  - manifest
  - packageDigest
  - adminFrontendDigest
  - packagePath
  - installedAt
  properties:
    version:
      type: string
    manifest:
      "$ref": "#/ExtensionManifest"
    artifactState:
      type: string
      enum: [available, missing]
      description: Current presence of the server-local immutable package path.
    packageDigest:
      type: string
      description: Canonical immutable package tree SHA-256 digest.
    adminFrontendDigest:
      type: string
      description: >-
        SHA-256 identity of the prebuilt admin component contract and bytes.
        Empty when the package has no prebuilt admin UI.
    packagePath:
      type: string
      description: Server-local immutable package path, visible only to extension managers.
    installedAt:
      type: string
      format: date-time
Extension:
  type: object
  required:
  - id
  - name
  - version
  - type
  - status
  - source
  - isSystem
  - isDeletable
  - manifest
  - packageDigest
  - adminFrontendDigest
  - packagePath
  - installedAt
  - updatedAt
  properties:
    id:
      type: string
    name:
      type: string
    version:
      type: string
    type:
      "$ref": "#/ExtensionType"
    status:
      "$ref": "#/ExtensionStatus"
    source:
      "$ref": "#/ExtensionSource"
    isSystem:
      type: boolean
    isDeletable:
      type: boolean
    manifest:
      "$ref": "#/ExtensionManifest"
    capabilityGrants:
      type: array
      description: >-
        Effective host capabilities for plugins (explicit manifest.capabilities
        plus host-implied grants). Used by the enable-time review UI (F2.1).
      items:
        "$ref": "#/ExtensionCapabilityGrant"
    runtime:
      "$ref": "#/ExtensionRuntimeStatus"
    artifactState:
      type: string
      enum: [available, missing]
      description: >-
        Current presence of the active server-local immutable package path.
        Management list/detail responses always include this field.
    packageDigest:
      type: string
      description: Canonical immutable package tree SHA-256 digest.
    adminFrontendDigest:
      type: string
      description: >-
        SHA-256 identity of the prebuilt admin component contract and bytes.
        Empty when the extension has no prebuilt admin UI.
    packagePath:
      type: string
      description: Server-local package path, visible only to extension managers.
    stagedVersion:
      "$ref": "#/ExtensionVersion"
    installedAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ExtensionRemoteInstallInput:
  type: object
  additionalProperties: false
  required:
  - url
  properties:
    url:
      type: string
      format: uri
      maxLength: 2048
      description: >-
        Direct public HTTPS URL to a ZIP archive. Private, loopback, link-local,
        and cloud-metadata addresses are rejected before the request.
    sha256:
      type: string
      pattern: '^[A-Fa-f0-9]{64}$'
      description: >-
        Optional SHA-256 of the downloaded ZIP bytes (not the extracted package
        tree digest). A mismatch aborts before installation.
    expectedExtensionId:
      type: string
      maxLength: 81
      description: >-
        Optional declared extension ID. When present the parsed manifest must
        have the same ID or the install aborts with
        extension.expected_mismatch.
    expectedVersion:
      type: string
      maxLength: 64
      description: >-
        Optional declared package version, compared with the parsed manifest
        version after download.
    expectedType:
      type: string
      enum: [plugin, theme]
      description: >-
        Optional declared package type. A mismatch is reported as
        extension.expected_mismatch rather than a permission error.
    source:
      type: string
      maxLength: 64
      description: >-
        Optional canonical audit label for the caller (for example
        admin-page:sforum.store). Only [a-z0-9._:-] is accepted; the label is
        recorded in the install/upgrade audit metadata and never affects
        install behavior.
ExtensionInstallResult:
  type: object
  required:
  - extension
  - upgraded
  properties:
    extension:
      "$ref": "#/Extension"
    upgraded:
      type: boolean
      description: True when the same extension id was already installed (F2.4 upgrade path).
    previousVersion:
      type: string
    previousDigest:
      type: string
    trustRevoked:
      type: boolean
      description: >-
        True only when an active artifact grant was revoked. Static package
        upload and staging preserve grants for the currently active artifact.
    requiredReEnable:
      type: boolean
      description: >-
        True only when the active extension status was reset and the plugin must
        be enabled again. Static package upload and staging preserve active status.
    activationPending:
      type: boolean
      description: >-
        True when an immutable candidate is saved while the current version,
        status, runtime, and trust grants remain active until a trusted upgrade
        transaction confirms and activates the candidate.
ExtensionMigrationRecord:
  type: object
  required:
  - path
  - checksum
  - status
  - appliedAt
  properties:
    path:
      type: string
      description: Path relative to package root (manifest.migrations[].path).
    checksum:
      type: string
      description: SHA-256 of the migration file when readable.
    status:
      type: string
      enum:
      - recorded
      - applied
      - failed
      description: >-
        v1 host only records checksums (recorded); applied is reserved for a
        future executor; failed means the file was missing or unsafe.
    appliedAt:
      type: string
      format: date-time
    message:
      type: string
ExtensionAdminNavigationItem:
  type: object
  required:
  - extensionId
  - extensionName
  - extensionType
  - extensionStatus
  - path
  - label
  - description
  - icon
  - view
  - order
  properties:
    extensionId:
      type: string
    extensionName:
      type: string
    extensionType:
      "$ref": "#/ExtensionType"
    extensionStatus:
      "$ref": "#/ExtensionStatus"
    path:
      type: string
    label:
      type: string
    description:
      type: string
    icon:
      type: string
    view:
      type: string
      enum:
      - about
      - settings
    order:
      type: integer
ContributionPointDefinition:
  type: object
  required:
  - id
  - owner
  - kind
  - description
  - payloadType
  properties:
    id:
      type: string
    owner:
      type: string
    kind:
      type: string
    description:
      type: string
    payloadType:
      type: string
      enum:
      - extensionRoute
      - profileSection
      - topicSidebarCard
      - topicBadge
      - navItem
      - dashboardLink
      - healthDescriptor
EffectiveContribution:
  type: object
  required:
  - extensionId
  - extensionName
  - extensionType
  - point
  - id
  - order
  properties:
    extensionId:
      type: string
    extensionName:
      type: string
    extensionType:
      "$ref": "#/ExtensionType"
    point:
      type: string
    id:
      type: string
    order:
      type: integer
    label:
      type: object
      additionalProperties:
        type: string
    icon:
      type: string
    payload:
      "$ref": "#/ExtensionContributionPayload"
PublicActiveThemeSettings:
  type: object
  required:
  - themeId
  - settings
  properties:
    themeId:
      type: string
      description: Active theme extension id; empty when no theme is active.
    version:
      type: string
      description: Active theme version; omitted when no theme is active.
    packageDigest:
      type: string
      description: Active exact package digest; clients must not reuse settings across different digests.
    nodeRevision:
      type: integer
      format: int64
      minimum: 0
      description: Optional process-local theme runtime revision when available.
    settings:
      type: object
      additionalProperties:
        type: string
      description: Non-secret setting key/value map (defaults applied when unset).
ApiResponsePublicActiveThemeSettings:
  type: object
  required:
  - data
  properties:
    data:
      "$ref": "#/PublicActiveThemeSettings"
ExtensionSettings:
  type: object
  required:
  - extensionId
  - extensionType
  - extensionVersion
  - extensionStatus
  - renderer
  - items
  properties:
    extensionId:
      type: string
    extensionType:
      "$ref": "#/ExtensionType"
    extensionVersion:
      type: string
    extensionStatus:
      "$ref": "#/ExtensionStatus"
    renderer:
      "$ref": "#/ExtensionSettingsRenderer"
    tabs:
      type: array
      items:
        "$ref": "#/ExtensionSettingsTab"
    groups:
      type: array
      items:
        "$ref": "#/ExtensionSettingsGroup"
    callouts:
      type: array
      items:
        "$ref": "#/ExtensionSettingsCallout"
    items:
      type: array
      items:
        "$ref": "#/ExtensionSettingValue"
    actions:
      type: array
      items:
        "$ref": "#/ExtensionSettingsAction"
ExtensionPageBootstrap:
  type: object
  required:
  - extension
  - page
  - settings
  - frontend
  properties:
    extension:
      "$ref": "#/Extension"
    page:
      description: Exact normalized manifest page, or null when the path is undeclared.
      nullable: true
      allOf:
      - "$ref": "#/ExtensionManifestAdminPage"
    settings:
      description: Localized masked settings only for a declared settings view; otherwise null.
      nullable: true
      allOf:
      - "$ref": "#/ExtensionSettings"
    frontend:
      description: >-
        Exact-artifact trust status for a declared component or settings view, so the
        SSR admin shell can render the correct first frame instead of showing an
        unresolved trust state as "trust not granted". Null for about/undeclared pages,
        when no trusted frontend runtime is wired, or when the trust lookup fails; the
        Host frontend then falls back to its own /frontend request.
      nullable: true
      allOf:
      - "$ref": "#/FrontendStatus"
ExtensionSettingsRenderer:
  type: object
  required: [mode, layout, source, fallback]
  properties:
    mode:
      type: string
      enum: [schema, component]
    layout:
      type: string
      enum: [form, tabs]
    source:
      type: string
      enum: [document, legacy_array]
    fallback:
      type: string
      enum: [schema]
    component:
      "$ref": "#/ExtensionSettingsComponent"
ExtensionSettingsComponent:
  type: object
  required: [id, kind, apiVersion]
  properties:
    id: { type: string }
    kind:
      type: string
      enum: [prebuilt]
    apiVersion: { type: integer, minimum: 1 }
    entry: { type: string }
    css: { type: string }
ExtensionSettingsTab:
  type: object
  required: [id, label]
  properties:
    id: { type: string }
    label: { type: string }
    description: { type: string }
    groups:
      type: array
      items: { type: string }
ExtensionSettingsGroup:
  type: object
  required: [id, label]
  properties:
    id: { type: string }
    label: { type: string }
    description: { type: string }
    columns: { type: integer, minimum: 1, maximum: 2 }
ExtensionSettingsCallout:
  type: object
  required: [id, tone, title]
  properties:
    id: { type: string }
    tone: { type: string }
    title: { type: string }
    body: { type: string }
    linkLabel: { type: string }
    linkUrl: { type: string, format: uri }
    tab: { type: string }
    group: { type: string }
ExtensionSettingsAction:
  type: object
  required: [id, kind, label, placement, useDraftValues, available]
  properties:
    id: { type: string }
    kind:
      type: string
      enum: [provider_probe, ai_tool_probe]
    label: { type: string }
    description: { type: string }
    placement: { type: string, enum: [header, footer] }
    useDraftValues: { type: boolean }
    fields:
      type: array
      items: { type: string }
    tool:
      type: string
      description: AI tool declaration id an ai_tool_probe dispatches to; omitted for provider_probe.
    available: { type: boolean }
    unavailableReason: { type: string }
ExtensionSettingOption:
  type: object
  required:
  - value
  - label
  properties:
    value:
      type: string
    label:
      type: string
    description:
      type: string
ExtensionSettingValue:
  type: object
  description: Resolved presentation for one manifest setting. Label, description, placeholder, group, and option labels are strings already resolved for the request Accept-Language locale. Manifest may declare those fields as a plain string or a locale map; the API never returns the raw map here.
  required:
  - key
  - label
  - description
  - type
  - default
  - value
  properties:
    key:
      type: string
    label:
      type: string
    description:
      type: string
    type:
      type: string
      description: Host-rendered control type. Supported values are text, string, number, boolean, select, secret, and textarea.
      enum: [text, string, number, boolean, select, secret, textarea]
    default:
      type: string
    value:
      type: string
    placeholder:
      type: string
    recommendedValue:
      type: string
    required:
      type: boolean
    width:
      type: string
      description: Schema UI control width resolved from the manifest. default caps the control; full fills the available column width.
      enum: [default, full]
    group:
      type: string
    groupId:
      type: string
    column:
      type: integer
      minimum: 1
      maximum: 2
    options:
      type: array
      items:
        "$ref": "#/ExtensionSettingOption"
    secretSet:
      type: boolean
ExtensionSettingsInput:
  type: object
  required:
  - values
  properties:
    values:
      type: object
      additionalProperties:
        type: string
ExtensionSettingsActionInput:
  type: object
  properties:
    values:
      type: object
      additionalProperties:
        type: string
      description: Draft values for non-secret declared fields only.
    secrets:
      type: object
      additionalProperties:
        "$ref": "#/ExtensionSettingsActionSecretInput"
ExtensionSettingsActionSecretInput:
  type: object
  required:
  - mode
  properties:
    mode:
      type: string
      enum:
      - preserve
      - replace
    value:
      type: string
      description: Required by host policy when mode=replace; never echoed or audited.
ExtensionSettingsActionResult:
  type: object
  required:
  - success
  - reason
  - message
  - durationMs
  properties:
    success:
      type: boolean
    reason:
      type: string
    message:
      type: string
    details:
      type: object
      additionalProperties:
        type: string
    suggestions:
      type: array
      items:
        type: string
    durationMs:
      type: integer
      format: int64
ExtensionEvent:
  type: object
  required:
  - id
  - extensionId
  - actorUserId
  - action
  - message
  - createdAt
  properties:
    id:
      type: integer
      format: int64
    extensionId:
      type: string
    actorUserId:
      type: integer
      format: int64
    action:
      type: string
      enum:
      - installed
      - builtin_synced
      - verified
      - enabled
      - enable_failed
      - disabled
      - theme_activated
      - theme_activation_queued
    message:
      type: string
    createdAt:
      type: string
      format: date-time
ExtensionEventDefinition:
  # Host event catalog entry. F1.3 documents timeoutMs + failurePolicy.
  # Sync filters enforce timeout via host context; heavy work must enqueue jobs.
  type: object
  required:
  - name
  - kind
  - description
  - timeoutMs
  - failurePolicy
  properties:
    name:
      type: string
    kind:
      type: string
      enum:
      - observe
      - validate
      - filter
    description:
      type: string
    payloadFields:
      type: array
      items:
        type: string
    patchFields:
      type: array
      items:
        type: string
    timeoutMs:
      type: integer
      description: Per-listener invoke limit in milliseconds.
    failurePolicy:
      type: string
      enum:
      - fail_closed
      - fail_open
      description: |
        For filter/validate: fail_closed rejects the host operation when a
        listener fails or times out (default). fail_open records the failure
        and continues. Observe events are non-blocking (fail_open semantics).
ExtensionEventDelivery:
  type: object
  required:
  - id
  - extensionId
  - eventName
  - eventKind
  - status
  - reason
  - message
  - correlationId
  - attemptCount
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    extensionId:
      type: string
    eventName:
      type: string
    eventKind:
      type: string
      enum:
      - observe
      - validate
      - filter
    status:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - skipped
    reason:
      type: string
    message:
      type: string
    correlationId:
      type: string
    attemptCount:
      type: integer
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
GrantFrontendTrustInput:
  type: object
  required:
  - digest
  properties:
    digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: >-
        Current adminFrontendDigest. The host binds the grant to extension id,
        version, API version, component identity, and these exact bytes.
    confirmation:
      "$ref": "#/FrontendTrustConfirmation"
FrontendTrustConfirmation:
  type: object
  required: [challengeId, code, extensionId, version, digest, apiVersion, componentId, phrase, acknowledged]
  properties:
    challengeId: { type: string, pattern: '^[0-9a-f]{32}$' }
    code: { type: string, pattern: '^[0-9]{6}$' }
    extensionId: { type: string }
    version: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    apiVersion: { type: integer, minimum: 1 }
    componentId: { type: string }
    phrase:
      type: string
      description: Must exactly equal extensionId to prove intentional approval.
    acknowledged:
      type: boolean
      description: Administrator acknowledges that component code is fully trusted, not sandboxed.
FrontendTrustChallenge:
  type: object
  required: [challengeId, code, extensionId, version, digest, apiVersion, componentId, expiresAt]
  properties:
    challengeId: { type: string, pattern: '^[0-9a-f]{32}$' }
    code: { type: string, pattern: '^[0-9]{6}$' }
    extensionId: { type: string }
    version: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    apiVersion: { type: integer, minimum: 1 }
    componentId: { type: string }
    expiresAt: { type: string, format: date-time }
ExecutableTrustStatus:
  type: object
  required: [impact, trustRequired, trusted]
  properties:
    impact:
      "$ref": "#/ExecutableTrustImpact"
    trustRequired:
      type: boolean
    trusted:
      type: boolean
ExecutableTrustChallenge:
  type: object
  required: [token, impact, expiresAt]
  properties:
    token:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Returned once. The server persists only its SHA-256 digest.
    impact:
      "$ref": "#/ExecutableTrustImpact"
    expiresAt:
      type: string
      format: date-time
ExecutableTrustImpact:
  type: object
  required:
  - schemaVersion
  - action
  - extensionId
  - extensionVersion
  - extensionType
  - source
  - packageDigest
  - manifestContract
  - artifactDigests
  - binaries
  - backend
  - routes
  - guards
  - guardDeclarations
  - hooks
  - events
  - migrations
  - migrationDeclarations
  - providers
  - jobs
  - schedules
  - components
  - registryComponents
  - templates
  - assets
  - content
  - database
  - cache
  - services
  - commands
  - adminSurfaces
  - queries
  - identity
  - permissionDefinitions
  - media
  - navigation
  - regions
  - contributions
  - capabilities
  - permissions
  - requiredFeatures
  - dependencies
  - lifecycle
  - openapi
  - packageFiles
  - requestedAuthority
  - contracts
  - digest
  properties:
    schemaVersion:
      type: string
      const: sforum.trust-impact@2
    action:
      type: string
      enum: [enable]
    extensionId: { type: string }
    extensionVersion: { type: string }
    extensionType:
      "$ref": "#/ExtensionType"
    source:
      "$ref": "#/ExtensionSource"
    packageDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    manifestContract:
      type: string
      pattern: '^sforum\.manifest@[1-3]$'
    artifactDigests:
      type: object
      additionalProperties:
        type: string
        pattern: '^[0-9a-f]{64}$'
    binaries:
      type: array
      items:
        "$ref": "#/ExecutableTrustArtifact"
    backend:
      "$ref": "#/ExecutableTrustBackend"
    routes:
      type: array
      items:
        "$ref": "#/ExtensionManifestRoute"
    guards:
      type: array
      items:
        "$ref": "#/ExecutableTrustGuard"
    guardDeclarations:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestGuard"
    hooks:
      type: array
      items:
        "$ref": "#/ExtensionManifestHook"
    events:
      type: array
      items:
        "$ref": "#/ExtensionManifestEvent"
    migrations:
      type: array
      items:
        "$ref": "#/ExecutableTrustMigration"
    migrationDeclarations:
      type: array
      items:
        "$ref": "#/ExtensionManifestMigration"
    providers:
      type: array
      items:
        "$ref": "#/ExtensionManifestProvider"
    jobs:
      type: array
      items:
        "$ref": "#/ExecutableTrustJob"
    schedules:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestSchedule"
    components:
      type: array
      items:
        "$ref": "#/PrebuiltSettingsComponent"
    registryComponents:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestComponent"
    templates:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestTemplate"
    assets:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestAsset"
    content:
      type: array
      maxItems: 512
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestContent"
    database:
      oneOf:
      - "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestDatabase"
      - type: 'null'
    cache:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestCache"
    seo:
      type: array
      maxItems: 512
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestSEO"
    services:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestService"
    commands:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestCommand"
    adminSurfaces:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestAdminSurface"
    queries:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestQuery"
    queryResultFilters:
      type: array
      maxItems: 64
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestQueryResultFilter"
    identity:
      oneOf:
      - "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestIdentity"
      - type: 'null'
    permissionDefinitions:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestPermissionDefinition"
    media:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestMediaPipeline"
    navigation:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestNavigation"
    regions:
      type: array
      items:
        "$ref": "./extensions-v3-platform.yaml#/ExtensionManifestRegion"
    contributions:
      type: array
      items:
        type: object
        additionalProperties: true
    capabilities:
      type: array
      items:
        "$ref": "#/ExtensionCapabilityGrant"
    permissions:
      type: array
      items: { type: string }
    requiredFeatures:
      type: array
      items: { type: string }
    dependencies:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestDependency"
    lifecycle:
      oneOf:
      - "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestLifecycle"
      - type: 'null'
    openapi:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestOpenAPIFragment"
    packageFiles:
      type: array
      items:
        "$ref": "./extensions-v3-registry.yaml#/ExtensionManifestPackageFile"
    requestedAuthority:
      "$ref": "#/ExecutableTrustAuthority"
    contracts:
      "$ref": "#/ExecutableTrustContracts"
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
ExecutableTrustArtifact:
  type: object
  required: [kind, path, digest]
  properties:
    kind: { type: string }
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
ExecutableTrustBackend:
  type: object
  required: [entry, rpc]
  properties:
    entry: { type: string }
    rpc: { type: string }
    protocolVersion: { type: integer, minimum: 0, maximum: 2 }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    hostApiVersion: { type: string }
ExecutableTrustMigration:
  type: object
  required: [path, digest]
  properties:
    path: { type: string }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
ExecutableTrustGuard:
  type: object
  required: [path, methods, access]
  properties:
    path: { type: string }
    methods:
      type: array
      items: { type: string }
    access: { type: string, enum: [public, login, permission] }
    permission: { type: string }
ExecutableTrustJob:
  type: object
  required: [name]
  properties:
    name: { type: string }
ExecutableTrustAuthority:
  type: object
  required:
  - backendExecution
  - adminFrontendExecution
  - rawRequest
  - rawCoreDatabase
  - outboundNetwork
  - packageFiles
  - secrets
  properties:
    backendExecution: { type: boolean }
    adminFrontendExecution: { type: boolean }
    rawRequest: { type: boolean }
    rawCoreDatabase: { type: boolean }
    outboundNetwork: { type: boolean }
    packageFiles:
      type: array
      items: { type: string }
    secrets:
      type: array
      items: { type: string }
ExecutableTrustContracts:
  type: object
  required: [hostApi]
  properties:
    hostApi: { type: string }
    frontendApi: { type: string }
FrontendTrustState:
  type: string
  enum:
  - none
  - required
  - trusted
  - source_trusted
  - revoked
  - invalidated
FrontendStatus:
  type: object
  required:
  - extensionId
  - kind
  - trustState
  properties:
    extensionId:
      type: string
    kind:
      type: string
      enum: [none, prebuilt_component]
    component:
      "$ref": "#/PrebuiltSettingsComponent"
    components:
      type: array
      items:
        "$ref": "#/PrebuiltSettingsComponent"
    trustState:
      "$ref": "#/FrontendTrustState"
    digest:
      type: string
      description: Current adminFrontendDigest presented for explicit trust.
PublicFrontendAssetReference:
  type: object
  additionalProperties: false
  required:
  - handle
  - contractVersion
  - extensionId
  - packageDigest
  - impactDigest
  - type
  - digest
  - integrity
  - module
  - loading
  - assetPath
  properties:
    handle: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,120}$' }
    contractVersion: { type: string }
    extensionId: { type: string }
    packageDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    impactDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    type: { type: string, enum: [script, style] }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    integrity: { type: string, pattern: '^sha256-[A-Za-z0-9+/]{43}=$' }
    dependencies:
      type: array
      uniqueItems: true
      items: { type: string }
    scope:
      type: array
      uniqueItems: true
      items: { type: string }
    module: { type: boolean }
    loading: { type: string, enum: ['', blocking, defer, async, preload, lazy] }
    csp:
      type: array
      uniqueItems: true
      items: { type: string, maxLength: 512 }
    assetPath:
      type: string
      description: Same-origin immutable package asset URL in the Host-reserved resource namespace.
      pattern: '^/_sforum/assets/extensions/[a-z0-9][a-z0-9._-]{1,120}/[0-9a-f]{64}/.+'
PublicFrontendComponent:
  type: object
  additionalProperties: false
  required:
  - schemaVersion
  - apiVersion
  - trustNotice
  - extensionId
  - extensionVersion
  - coreVersion
  - packageDigest
  - impactDigest
  - componentId
  - contractVersion
  - action
  - entry
  - assets
  properties:
    schemaVersion: { type: string, const: sforum.public-frontend-component@1 }
    apiVersion: { type: integer, const: 1 }
    trustNotice: { type: string, const: fully_trusted_browser_code }
    extensionId: { type: string }
    extensionVersion: { type: string }
    coreVersion:
      type: string
      description: |
        Host release identity (strict semver) read by the public component.
        Only coreVersion is exposed here; buildVersion and the full commit hash
        never are. Release builds carry no commit hash and no dev build label.
        Development builds derive it from the nearest reachable v* git tag and
        keep the commit distance, short SHA, and a dirty marker in build
        metadata (3.0.16+13.g6f94488ad, 3.0.16+13.g6f94488ad.dirty); without a
        reachable tag they fall back to 1.0.0.
    packageDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    impactDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    componentId: { type: string }
    contractVersion: { type: string }
    action: { type: string, enum: [add, before, after, wrap, replace, filter_props, filter_result] }
    targetId: { type: string }
    targetContractVersion: { type: string }
    propsSchema: { type: string }
    resultSchema: { type: string }
    entry:
      "$ref": "#/PublicFrontendAssetReference"
    assets:
      type: array
      maxItems: 255
      items:
        "$ref": "#/PublicFrontendAssetReference"
    csp:
      type: array
      uniqueItems: true
      items: { type: string, maxLength: 512 }
ApiResponsePublicFrontendComponent:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data:
      "$ref": "#/PublicFrontendComponent"
PublicContentStyleCatalog:
  type: object
  additionalProperties: false
  required: [schemaVersion, graphDigest, styles]
  properties:
    schemaVersion: { type: string, const: sforum.public-content-styles@1 }
    graphDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    styles:
      type: array
      maxItems: 64
      items:
        allOf:
        - "$ref": "#/PublicFrontendAssetReference"
        - type: object
          properties:
            type: { type: string, const: style }
            module: { type: boolean, const: false }
            loading: { type: string, const: blocking }
            scope:
              type: array
              contains: { type: string, const: core.surface.forum-content }
ApiResponsePublicContentStyleCatalog:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data:
      "$ref": "#/PublicContentStyleCatalog"
PublicFrontendPolicyDirective:
  type: object
  additionalProperties: false
  required: [name, sources]
  properties:
    name:
      type: string
      enum: [base-uri, connect-src, default-src, font-src, form-action, frame-ancestors, img-src, media-src, object-src, script-src, style-src, worker-src]
    sources:
      type: array
      minItems: 1
      maxItems: 128
      items: { type: string, maxLength: 512 }
PublicFrontendPolicyComponent:
  type: object
  additionalProperties: false
  required: [extensionId, extensionVersion, packageDigest, impactDigest, componentId, contractVersion]
  properties:
    extensionId: { type: string }
    extensionVersion: { type: string }
    packageDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    impactDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    componentId: { type: string }
    contractVersion: { type: string }
PublicFrontendDocumentPolicy:
  type: object
  additionalProperties: false
  required: [schemaVersion, digest, directives, headerValue]
  properties:
    schemaVersion: { type: string, const: sforum.public-frontend-document-policy@1 }
    digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    directives:
      type: array
      items:
        "$ref": "#/PublicFrontendPolicyDirective"
    headerValue:
      type: string
      minLength: 1
      maxLength: 8192
      description: Exact Content-Security-Policy header value without the header name.
PublicFrontendPolicy:
  type: object
  additionalProperties: false
  required: [schemaVersion, graphDigest, extensionPolicyDigest, directives, admittedComponents, documentPolicy]
  properties:
    schemaVersion: { type: string, const: sforum.public-frontend-policy@1 }
    graphDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    extensionPolicyDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    directives:
      type: array
      items:
        "$ref": "#/PublicFrontendPolicyDirective"
    admittedComponents:
      type: array
      maxItems: 256
      items:
        "$ref": "#/PublicFrontendPolicyComponent"
    documentPolicy:
      "$ref": "#/PublicFrontendDocumentPolicy"
ApiResponsePublicFrontendPolicy:
  type: object
  required: [code, message, data]
  properties:
    code: { type: integer }
    message: { type: string }
    data:
      "$ref": "#/PublicFrontendPolicy"
PrebuiltSettingsComponent:
  type: object
  required: [id, apiVersion, entry]
  properties:
    id: { type: string }
    apiVersion: { type: integer, minimum: 1 }
    entry: { type: string, pattern: '^frontend/admin/dist/.+\.mjs$' }
    css: { type: string, pattern: '^frontend/admin/dist/.+\.css$' }
ExtensionCapabilityGrant:
  type: object
  required:
  - key
  - risk
  - labelZh
  - labelEn
  - description
  properties:
    key:
      type: string
    risk:
      type: string
      enum: [low, medium, high]
    labelZh:
      type: string
    labelEn:
      type: string
    description:
      type: string
    implied:
      type: boolean
      description: True when the host inferred this grant (not explicitly listed in manifest.capabilities).
ApiResponseFrontendStatus:
  type: object
  required:
  - code
  - message
  - data
  properties:
    code:
      type: integer
    message:
      type: string
    data:
      "$ref": "#/FrontendStatus"
ThemeActivationRequest:
  type: object
  additionalProperties: false
  required: [version, packageDigest, currentThemeId, currentThemeVersion, currentThemeDigest, approveCoreReplacements]
  properties:
    version:
      type: string
      minLength: 1
    packageDigest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    currentThemeId:
      type: string
    currentThemeVersion:
      type: string
    currentThemeDigest:
      type: string
    confirmationToken:
      type: string
      minLength: 1
      description: One-use actor-bound exact-artifact token required when the uploaded theme declares executable L2 or another trusted power.
    approveCoreReplacements:
      type: boolean
      description: Exact visible-preview approval. Effective only for a super_admin actor; false preserves Core providers.
