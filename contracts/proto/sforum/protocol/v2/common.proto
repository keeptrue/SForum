syntax = "proto3";

package sforum.protocol.v2;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/keeptrue/sforum/apps/api/sdk/plugin/v2/gen/sforum/protocol/v2;protocolv2";

// RiskTier mirrors the operator-visible authority disclosure tier.
enum RiskTier {
  RISK_TIER_UNSPECIFIED = 0;
  RISK_TIER_LOW = 1;
  RISK_TIER_MEDIUM = 2;
  RISK_TIER_HIGH = 3;
  RISK_TIER_CRITICAL = 4;
}

// Actor is the authenticated principal on whose behalf a call runs.
message Actor {
  int64 user_id = 1;
  string session_id = 2;
  string authentication_method = 3;
  repeated string role_ids = 4;
  repeated string permission_keys = 5;
  string client_ip = 6;
  string user_agent = 7;
}

// ExtensionIdentity binds the runtime call to one installed artifact.
message ExtensionIdentity {
  string extension_id = 1;
  string extension_version = 2;
  string artifact_digest = 3;
  string trust_grant_id = 4;
  uint64 runtime_epoch = 5;
  string instance_id = 6;
}

// AuthorityGrant discloses one host-validated power available to this call.
// Receiving this value never grants authority; the host re-checks its runtime
// grant set before executing every operation.
message AuthorityGrant {
  string key = 1;
  string contract_version = 2;
  RiskTier risk_tier = 3;
  string source = 4;
  repeated string resource_patterns = 5;
}

// TraceContext carries W3C-compatible correlation without replacing native
// gRPC metadata propagation.
message TraceContext {
  string trace_id = 1;
  string span_id = 2;
  string traceparent = 3;
  string tracestate = 4;
}

// RequestContext is required on every v2 request and streaming open frame.
message RequestContext {
  string request_id = 1;
  TraceContext trace = 2;
  Actor actor = 3;
  string locale = 4;
  google.protobuf.Timestamp deadline = 5;
  ExtensionIdentity extension = 6;
  repeated AuthorityGrant granted_authority = 7;
  string idempotency_key = 8;
  // Present only on an authenticated Host route/admin invocation. Each token
  // is bound to this exact actor, runtime, artifact, command, and key.
  repeated HostCommandDelegation host_command_delegations = 9;
  // Present only on an authenticated Host route/admin invocation. Query tokens
  // are one-use and bound to the exact actor, runtime, artifact, and contract.
  repeated HostQueryDelegation host_query_delegations = 10;
  // Present only on a plugin invocation the Host initiated inside an HTTP
  // request, and only when the Host itself knows the Core session. The plugin
  // echoes the same value back on the Host session-state RPCs; the Host derives
  // the session scope from its own mint record, never from this message.
  HostSessionDelegation host_session_delegation = 11;
}

// HostCommandDelegation is a short-lived Host-signed capability delivered to
// one exact plugin invocation. It never replaces Execute-time policy checks.
message HostCommandDelegation {
  string command_id = 1;
  string command_version = 2;
  string idempotency_key = 3;
  string token = 4;
}

// HostQueryDelegation carries one Host-derived actor capability to an exact
// Query Registry contract. Plugins cannot construct or substitute this token.
message HostQueryDelegation {
  string query_id = 1;
  string contract_version = 2;
  string plan_version = 3;
  string result_schema_id = 4;
  string result_schema_version = 5;
  string scope = 6;
  string token = 7;
}

// HostSessionDelegation is a Host-signed, single-invocation capability that
// scopes Host-owned plugin session state to the Core session the Host resolved
// for one HTTP request. The Host mints it only where it initiated a plugin
// invocation itself and knows the session, and retires it when that invocation
// settles, so a plugin cannot hoard it for a later request.
//
// The token is opaque: it carries no session identifier, no session
// fingerprint, and no user-supplied authority. Plugins can neither construct
// nor substitute it, and `Actor.session_id` stays unpopulated.
message HostSessionDelegation {
  string token = 1;
}

// ResponseContext correlates a response with the authoritative runtime.
message ResponseContext {
  string request_id = 1;
  TraceContext trace = 2;
  google.protobuf.Timestamp server_time = 3;
  ExtensionIdentity extension = 4;
}

// ErrorCode is stable across supported v2 minor versions.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_FAILED_PRECONDITION = 6;
  ERROR_CODE_RATE_LIMITED = 7;
  ERROR_CODE_DEADLINE_EXCEEDED = 8;
  ERROR_CODE_CANCELLED = 9;
  ERROR_CODE_MESSAGE_TOO_LARGE = 10;
  ERROR_CODE_PROTOCOL_MISMATCH = 11;
  ERROR_CODE_STALE_RUNTIME = 12;
  ERROR_CODE_UNAVAILABLE = 13;
  ERROR_CODE_INTERNAL = 14;
}

// ErrorDetail is safe for cross-process and non-Go clients.
message ErrorDetail {
  ErrorCode code = 1;
  string reason = 2;
  string message = 3;
  bool retryable = 4;
  google.protobuf.Timestamp retry_after = 5;
  map<string, string> metadata = 6;
}

// TypedDocument binds otherwise dynamic extension data to a declared schema.
message TypedDocument {
  string schema_id = 1;
  string schema_version = 2;
  google.protobuf.Struct value = 3;
}

// PageRequest is shared by query, audit, service, and discovery listings.
message PageRequest {
  uint32 limit = 1;
  string cursor = 2;
}

// PageInfo describes cursor-based pagination.
message PageInfo {
  string next_cursor = 1;
  bool has_more = 2;
}

// DataChunk is the bounded opaque binary unit for route streams, file transfer,
// and Host HTTP stream APIs. data is application-owned framing (SSE text, binary
// blobs, multipart wire, etc.); Host does not JSON-Schema-validate chunk bytes.
message DataChunk {
  uint64 sequence = 1;
  bytes data = 2;
  bytes checksum = 3;
  bool final = 4;
}

// Header is a repeated HTTP-style header without map value ambiguity.
message Header {
  string name = 1;
  repeated string values = 2;
}
