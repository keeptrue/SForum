syntax = "proto3";

package sforum.plugin.v2;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "sforum/protocol/v2/common.proto";
import "sforum/protocol/v2/control.proto";

option go_package = "github.com/keeptrue/sforum/apps/api/sdk/plugin/v2/gen/sforum/plugin/v2;pluginv2";

// PluginRuntimeService is the host-to-plugin protocol-v2 surface.
service PluginRuntimeService {
  rpc Handshake(sforum.protocol.v2.HandshakeRequest) returns (sforum.protocol.v2.HandshakeResponse);
  rpc Health(sforum.protocol.v2.HealthRequest) returns (sforum.protocol.v2.HealthResponse);
  rpc Readiness(sforum.protocol.v2.ReadinessRequest) returns (sforum.protocol.v2.ReadinessResponse);
  rpc RunLifecycle(sforum.protocol.v2.LifecycleRequest) returns (stream sforum.protocol.v2.ProgressUpdate);
  rpc InvokeRoute(RouteRequest) returns (RouteResponse);
  rpc StreamRoute(stream RouteStreamFrame) returns (stream RouteStreamFrame);
  rpc InvokeHook(HookRequest) returns (HookResponse);
  rpc ExecuteJob(JobRequest) returns (stream sforum.protocol.v2.ProgressUpdate);
  rpc InvokeCommand(CommandInvocationRequest) returns (CommandInvocationResponse);
  rpc InvokeQuery(QueryInvocationRequest) returns (QueryInvocationResponse);
  rpc FilterQueryResult(QueryResultFilterRequest) returns (QueryResultFilterResponse);
  rpc ProviderCall(ProviderCallRequest) returns (ProviderCallResponse);
  rpc TransferFile(stream FileFrame) returns (stream FileFrame);
  rpc InvokeService(ServiceRequest) returns (ServiceResponse);
  rpc StreamService(stream ServiceStreamFrame) returns (stream ServiceStreamFrame);
}

// RouteRequestAuthorityMode records the Host-issued request authority carried
// by one exact Route Registry step. Unspecified is never valid for dispatch.
enum RouteRequestAuthorityMode {
  ROUTE_REQUEST_AUTHORITY_MODE_UNSPECIFIED = 0;
  ROUTE_REQUEST_AUTHORITY_MODE_FILTERED = 1;
  ROUTE_REQUEST_AUTHORITY_MODE_RAW = 2;
}

// RouteGuardKind binds the authority mode to the Host-frozen route and guard
// declaration. Core raw_request uses RAW_REQUEST rather than HOST.
enum RouteGuardKind {
  ROUTE_GUARD_KIND_UNSPECIFIED = 0;
  ROUTE_GUARD_KIND_HOST = 1;
  ROUTE_GUARD_KIND_CUSTOM = 2;
  ROUTE_GUARD_KIND_RAW_REQUEST = 3;
}

// RouteRequest invokes one immutable Route Registry binding.
message RouteRequest {
  sforum.protocol.v2.RequestContext context = 1;
  string route_id = 2;
  string contract_version = 3;
  string method = 4;
  string path = 5;
  repeated sforum.protocol.v2.Header headers = 6;
  map<string, string> path_parameters = 7;
  map<string, string> query_parameters = 8;
  sforum.protocol.v2.TypedDocument body = 9;
  RouteRequestAuthorityMode request_authority_mode = 10;
  RouteGuardKind guard_kind = 11;
  string route_action = 12;
  RouteInvocationStage invocation_stage = 13;
  repeated string mutable_request_fields = 14;
  repeated string mutable_response_fields = 15;
  RouteResponseDocument prior_response = 16;
  // Additive lossless query representation. The Host orders entries by key and
  // preserves each key's value order. Legacy query_parameters remains field 8
  // and carries the first value for peers that do not understand this field.
  repeated RouteQueryParameter query_parameter_values = 17;
}

// RouteResponse is contract-bound and may opt into a separate stream.
message RouteResponse {
  sforum.protocol.v2.ResponseContext context = 1;
  uint32 status_code = 2;
  repeated sforum.protocol.v2.Header headers = 3;
  sforum.protocol.v2.TypedDocument body = 4;
  bool stream_follows = 5;
  sforum.protocol.v2.ErrorDetail error = 6;
  // Ordered RFC 6902 add/replace/remove subsets. Every path must exactly match
  // the corresponding Host-frozen RFC 6901 allowlist; the Host validates and
  // applies each operation authoritatively.
  repeated RoutePatchOperation request_patch = 7;
  repeated RoutePatchOperation response_patch = 8;
}

// RouteStreamOpen must be the first frame in a route stream.
message RouteStreamOpen {
  sforum.protocol.v2.RequestContext context = 1;
  string route_id = 2;
  string contract_version = 3;
  string method = 4;
  string path = 5;
  repeated sforum.protocol.v2.Header headers = 6;
  RouteRequestAuthorityMode request_authority_mode = 7;
  RouteGuardKind guard_kind = 8;
}

// RouteStreamClose terminates one direction of a route stream.
message RouteStreamClose {
  uint32 status_code = 1;
  repeated sforum.protocol.v2.Header headers = 2;
  sforum.protocol.v2.ErrorDetail error = 3;
}

// RouteStreamFrame carries open/chunk/close for HTTP stream, SSE, WebSocket, and
// multipart transports. Chunk payloads are opaque application bytes (DataChunk);
// Host validates size, sequence, optional checksum, and mode preflight only.
// Plugins own SSE text, WebSocket payload meaning, and multipart wire layout.
// Host preserves WebSocket message boundaries, discards the inbound text/binary
// opcode distinction, and emits plugin response chunks as binary messages.
// There is no mode-specific JSON envelope on this frame today.
message RouteStreamFrame {
  oneof frame {
    RouteStreamOpen open = 1;
    sforum.protocol.v2.DataChunk chunk = 2;
    RouteStreamClose close = 3;
  }
}

// HookRequest invokes one versioned hook declaration.
message HookRequest {
  sforum.protocol.v2.RequestContext context = 1;
  string hook_id = 2;
  string hook_name = 3;
  string hook_kind = 4;
  string contract_version = 5;
  string delivery_id = 6;
  sforum.protocol.v2.TypedDocument payload = 7;
  repeated string mutable_fields = 8;
}

// HookResponse returns a contract-bound result or validated patch.
message HookResponse {
  sforum.protocol.v2.ResponseContext context = 1;
  bool accepted = 2;
  sforum.protocol.v2.TypedDocument result = 3;
  sforum.protocol.v2.TypedDocument patch = 4;
  sforum.protocol.v2.ErrorDetail error = 5;
}

// JobRequest runs one declared job payload version.
message JobRequest {
  sforum.protocol.v2.RequestContext context = 1;
  string job_id = 2;
  string job_kind = 3;
  string payload_version = 4;
  uint32 attempt = 5;
  string checkpoint = 6;
  sforum.protocol.v2.TypedDocument payload = 7;
}

// CommandInvocationRequest runs one exact Manifest CLI command.
message CommandInvocationRequest {
  sforum.protocol.v2.RequestContext context = 1;
  string command_id = 2;
  string contract_version = 3;
  string handler = 4;
  sforum.protocol.v2.TypedDocument input = 5;
}

message CommandInvocationResponse {
  sforum.protocol.v2.ResponseContext context = 1;
  sforum.protocol.v2.TypedDocument result = 2;
  sforum.protocol.v2.ErrorDetail error = 3;
}

// ProviderCallRequest invokes an implementation selected by a provider slot.
message ProviderCallRequest {
  sforum.protocol.v2.RequestContext context = 1;
  string slot_id = 2;
  string operation = 3;
  string contract_version = 4;
  sforum.protocol.v2.TypedDocument input = 5;
  string declaration_id = 6;
}

// ProviderCallResponse contains the declared provider result.
message ProviderCallResponse {
  sforum.protocol.v2.ResponseContext context = 1;
  sforum.protocol.v2.TypedDocument output = 2;
  repeated string suggestions = 3;
  sforum.protocol.v2.ErrorDetail error = 4;
}

// FileOpen identifies one declared package or mediated host file operation.
message FileOpen {
  sforum.protocol.v2.RequestContext context = 1;
  string operation = 2;
  string file_id = 3;
  string path = 4;
  uint64 offset = 5;
  uint64 expected_size = 6;
  string media_type = 7;
}

// FileClose provides final integrity data for a transfer.
message FileClose {
  uint64 size = 1;
  bytes digest = 2;
  sforum.protocol.v2.ErrorDetail error = 3;
}

// FileFrame is a bounded bidirectional file transfer frame.
message FileFrame {
  oneof frame {
    FileOpen open = 1;
    sforum.protocol.v2.DataChunk chunk = 2;
    FileClose close = 3;
  }
}

// ServiceRequest invokes another versioned plugin service through the host.
message ServiceRequest {
  sforum.protocol.v2.RequestContext context = 1;
  string service_id = 2;
  string service_version = 3;
  string operation = 4;
  sforum.protocol.v2.TypedDocument input = 5;
}

// ServiceResponse contains one plugin service result.
message ServiceResponse {
  sforum.protocol.v2.ResponseContext context = 1;
  sforum.protocol.v2.TypedDocument output = 2;
  sforum.protocol.v2.ErrorDetail error = 3;
}

// ServiceStreamOpen must be the first plugin service stream frame.
message ServiceStreamOpen {
  sforum.protocol.v2.RequestContext context = 1;
  string service_id = 2;
  string service_version = 3;
  string operation = 4;
  google.protobuf.Duration idle_timeout = 5;
}

// ServiceStreamFrame carries typed documents over a bounded stream.
message ServiceStreamFrame {
  oneof frame {
    ServiceStreamOpen open = 1;
    sforum.protocol.v2.TypedDocument message = 2;
    sforum.protocol.v2.ErrorDetail error = 3;
  }
}

// RouteInvocationStage identifies which Host-owned route execution stage is
// invoking the plugin. Unspecified is never valid for dispatch.
enum RouteInvocationStage {
  ROUTE_INVOCATION_STAGE_UNSPECIFIED = 0;
  ROUTE_INVOCATION_STAGE_HANDLER = 1;
  ROUTE_INVOCATION_STAGE_REQUEST = 2;
  ROUTE_INVOCATION_STAGE_RESPONSE = 3;
}

// RoutePatchOperationKind is the supported RFC 6902 operation subset.
enum RoutePatchOperationKind {
  ROUTE_PATCH_OPERATION_KIND_UNSPECIFIED = 0;
  ROUTE_PATCH_OPERATION_KIND_ADD = 1;
  ROUTE_PATCH_OPERATION_KIND_REPLACE = 2;
  ROUTE_PATCH_OPERATION_KIND_REMOVE = 3;
}

// RoutePatchOperation is one operation in an ordered RFC 6902
// add/replace/remove patch. Path must exactly match a Host-frozen RFC 6901
// allowlist entry; the Host remains authoritative for validation and apply.
message RoutePatchOperation {
  RoutePatchOperationKind kind = 1;
  string path = 2;
  // Deprecated because google.protobuf.Value stores numbers as IEEE-754
  // doubles and cannot preserve arbitrary JSON integer lexemes.
  google.protobuf.Value value = 3 [deprecated = true];
  // Lossless canonical JSON. Add/replace require one complete JSON value;
  // remove requires this field to be empty. The Host validates before apply.
  bytes value_json = 4;
}

// RouteResponseDocument is the response visible at a response-stage route
// invocation. It remains subject to the Host-frozen response contract.
message RouteResponseDocument {
  uint32 status_code = 1;
  repeated sforum.protocol.v2.Header headers = 2;
  sforum.protocol.v2.TypedDocument body = 3;
}

// RouteQueryParameter preserves all decoded values for one query key.
message RouteQueryParameter {
  string key = 1;
  repeated string values = 2;
}

// QueryRuntimeBinding is one exact executable query declaration. Exact runtime
// artifact identity remains in RequestContext.extension.
message QueryRuntimeBinding {
  string query_id = 1;
  string contract_version = 2;
  string plan_version = 3;
  string result_schema = 4;
  string handler = 5;
}

// QueryResultFilterRuntimeBinding is one exact result-filter declaration plus
// the exact query-owner contract whose rows it may transform.
message QueryResultFilterRuntimeBinding {
  string filter_id = 1;
  string filter_contract_version = 2;
  string query_id = 3;
  string query_contract_version = 4;
  string query_plan_version = 5;
  string result_schema = 6;
  string handler = 7;
}

// QueryRuntimeFilter is one Host-normalized filter value.
message QueryRuntimeFilter {
  string field = 1;
  string value = 2;
}

// QueryRuntimeSort is one Host-normalized ordered sort entry.
message QueryRuntimeSort {
  string field = 1;
  bool descending = 2;
}

// QueryRuntimePagination carries the resolved offset and limit only. Cursor
// tokens remain Host-owned and are never disclosed to plugin runtimes.
message QueryRuntimePagination {
  string mode = 1;
  uint64 offset = 2;
  uint32 limit = 3;
}

// QueryRuntimePlan is the bounded execution projection visible to a plugin.
// It deliberately excludes permissions, actor/policy fingerprints, cost,
// registry revisions, cache keys/tags, cursor tokens, and database authority.
message QueryRuntimePlan {
  string shape_digest = 1;
  repeated string fields = 2;
  repeated string relations = 3;
  repeated QueryRuntimeFilter filters = 4;
  repeated QueryRuntimeSort sorts = 5;
  QueryRuntimePagination pagination = 6;
  string locale = 7;
  string scope = 8;
  uint32 fetch_limit = 9;
}

// QueryRuntimeRow carries one lossless canonical JSON object. bytes are used
// instead of google.protobuf.Struct so integer lexemes never become doubles.
message QueryRuntimeRow {
  bytes canonical_json = 1;
}

message QueryRuntimeRows {
  repeated QueryRuntimeRow rows = 1;
}

message QueryInvocationRequest {
  // Only request_id, trace, locale, deadline, and extension may be populated.
  // Actor, authority, delegation, idempotency, cookie, and credential material
  // are outside the query.runtime@1 projection.
  sforum.protocol.v2.RequestContext context = 1;
  QueryRuntimeBinding binding = 2;
  QueryRuntimePlan plan = 3;
}

message QueryInvocationResponse {
  sforum.protocol.v2.ResponseContext context = 1;
  QueryRuntimeBinding binding = 2;
  string shape_digest = 3;
  oneof outcome {
    QueryRuntimeRows success = 4;
    sforum.protocol.v2.ErrorDetail error = 5;
  }
}

message QueryResultFilterRequest {
  // The same reduced RequestContext projection as QueryInvocationRequest.
  sforum.protocol.v2.RequestContext context = 1;
  QueryResultFilterRuntimeBinding binding = 2;
  QueryRuntimePlan plan = 3;
  QueryRuntimeRows input = 4;
}

message QueryResultFilterResponse {
  sforum.protocol.v2.ResponseContext context = 1;
  QueryResultFilterRuntimeBinding binding = 2;
  string shape_digest = 3;
  oneof outcome {
    QueryRuntimeRows success = 4;
    sforum.protocol.v2.ErrorDetail error = 5;
  }
}
