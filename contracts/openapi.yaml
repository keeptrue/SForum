openapi: 3.1.0
info:
  title: SForum API
  version: 0.1.0
  description: |
    Initial API contract for the SForum foundation.

    ## CSRF Protection

    All unsafe methods (POST/PUT/PATCH/DELETE) under `/api/v1` are protected by
    a double-submit CSRF token. The server sets a readable `csrf_` cookie on any
    safe (GET/HEAD/OPTIONS) request; clients must echo its value in an
    `X-Csrf-Token` header on every unsafe request. Missing or mismatched tokens
    are rejected with `403` and reason `csrf.invalid`; untrusted `Origin`/
    `Referer` are rejected with reason `csrf.origin_invalid`. Trusted origins
    are configured via `CSRF_TRUSTED_ORIGINS` (defaults to the `APP_URL` origin).

    ## Idempotency-Key

    Selected Core mutations (currently `POST /topics` and
    `POST /topics/{topicID}/comments`) accept an optional `Idempotency-Key` and
    retain their compatibility fail-open storage behavior.

    A plugin OpenAPI operation may instead require the standard header on a
    buffered unsafe route. The Host then scopes its 24-hour replay to the actor,
    cookie-or-bearer credential source, exact artifact route contract, and HTTP
    method. It fingerprints the canonical path/query/content type and raw body,
    replays only a stored 2xx response after rerunning current guards, and sets
    `Idempotency-Replayed: true`. Missing or invalid keys return `400`; an
    in-flight request or changed fingerprint returns `409`; replay storage
    failure returns `503` before plugin execution. Non-buffered routes cannot
    declare required replay.

    ## Personal Access Tokens (PAT)

    Users can create tokens under `POST /auth/tokens` (cookie session only).
    Call APIs with `Authorization: Bearer sft_<publicId>.<secret>`. Scopes are
    permission keys the user already holds; super_admin bypass is stripped so a
    PAT cannot act as an unlimited session. Token management routes reject Bearer
    auth (`api_token.cookie_required`). Unsafe methods with a valid PAT skip CSRF.
