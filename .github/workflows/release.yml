name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      sha: ${{ steps.version.outputs.sha }}
      commit: ${{ steps.version.outputs.commit }}
      build_time: ${{ steps.version.outputs.build_time }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate release version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must look like v2.8.0 or v2.8.0-beta.1" >&2
            exit 1
          fi
          if [[ "$REQUESTED_TAG" == *-* ]]; then
            stable=false
          else
            stable=true
          fi
          commit="$(git rev-parse HEAD)"
          build_time="$(git show -s --format=%cI HEAD)"
          {
            echo "tag=$REQUESTED_TAG"
            echo "version=${REQUESTED_TAG#v}"
            echo "stable=$stable"
            echo "commit=$commit"
            echo "build_time=$build_time"
            echo "sha=sha-$commit"
          } >> "$GITHUB_OUTPUT"

  verify-ci:
    name: Verify main CI
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Verify release commit belongs to main
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main; then
            echo "Release commit $RELEASE_COMMIT is not reachable from origin/main" >&2
            exit 1
          fi

      - name: Wait for exact main CI result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: ./scripts/ci/verify-main-ci.sh "$RELEASE_COMMIT"

  publish-candidate-platform:
    name: Publish candidate / ${{ matrix.image }} / ${{ matrix.arch }}
    needs:
      - prepare
      - verify-ci
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sforum-api
            dockerfile: apps/api/Dockerfile
            target: api
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            ci_cache: ci-backend
            release_cache: release-backend-amd64
            cache_writer: true
          - image: sforum-api
            dockerfile: apps/api/Dockerfile
            target: api
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            ci_cache: ci-backend
            release_cache: release-backend-arm64
            cache_writer: true
          - image: sforum-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            ci_cache: ci-backend
            release_cache: release-backend-amd64
            cache_writer: false
          - image: sforum-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            ci_cache: ci-backend
            release_cache: release-backend-arm64
            cache_writer: false
          - image: sforum-web
            dockerfile: apps/web/Dockerfile
            target: prod
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            ci_cache: ci-web
            release_cache: release-web-amd64
            cache_writer: true
          - image: sforum-web
            dockerfile: apps/web/Dockerfile
            target: prod
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            ci_cache: ci-web
            release_cache: release-web-arm64
            cache_writer: true
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}

      - name: Build and push platform candidate by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SFORUM_VERSION=${{ needs.prepare.outputs.version }}
            SFORUM_COMMIT=${{ needs.prepare.outputs.commit }}
            SFORUM_BUILD_TIME=${{ needs.prepare.outputs.build_time }}
          cache-from: |
            type=gha,scope=${{ matrix.ci_cache }}
            type=gha,scope=${{ matrix.release_cache }}
          cache-to: ${{ matrix.cache_writer && format('type=gha,mode=max,scope={0}', matrix.release_cache) || '' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Scan published platform image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Attest platform image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export verified platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected candidate digest: $DIGEST" >&2
            exit 1
          fi
          mkdir -p "$DIGEST_DIR"
          touch "$DIGEST_DIR/${DIGEST#sha256:}"

      - name: Upload verified platform digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-candidate:
    name: Merge candidate / ${{ matrix.image }}
    needs:
      - prepare
      - publish-candidate-platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - sforum-api
          - sforum-migrate
          - sforum-web
    steps:
      - name: Download verified platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge verified platform images
        id: manifest
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.sha }}
          DIGEST_DIR: ${{ runner.temp }}/digests
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          shopt -s nullglob
          digest_files=("$DIGEST_DIR"/*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "Expected exactly two verified platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          references=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file##*/}"
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Unexpected digest artifact: $digest" >&2
              exit 1
            fi
            references+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create \
            --tag "$IMAGE:$CANDIDATE_TAG" \
            "${references[@]}"

          # GHCR 的读路径偶尔慢于刚返回的 push：imagetools create 成功后立刻
          # inspect 仍可能 404（v3.0.20-beta.2 的 migrate 合并就这么红过一次）。
          # 注册表抖动不该让整条发布卡死，这里按 5s 递增重试约 60s。
          inspect_with_retry() {
            local attempt output
            for attempt in 1 2 3 4 5 6; do
              if output="$(docker buildx imagetools inspect "$@" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              echo "imagetools inspect failed (attempt ${attempt}): ${output}" >&2
              sleep $((attempt * 5))
            done
            return 1
          }

          raw_manifest="$(inspect_with_retry "$IMAGE:$CANDIDATE_TAG" --raw)"
          if ! jq -e '
            [.manifests[]?.platform
              | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))
              | .architecture]
            | unique
            | sort == ["amd64", "arm64"]
          ' <<< "$raw_manifest" >/dev/null; then
            echo "Merged candidate does not contain both linux/amd64 and linux/arm64" >&2
            exit 1
          fi

          manifest_json="$(inspect_with_retry "$IMAGE:$CANDIDATE_TAG" --format '{{json .Manifest}}')"
          manifest_digest="$(jq -r '.digest // empty' <<< "$manifest_json")"
          if [[ ! "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected merged manifest digest: $manifest_digest" >&2
            exit 1
          fi
          echo "digest=$manifest_digest" >> "$GITHUB_OUTPUT"

      - name: Attest merged candidate provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  smoke:
    name: Published image smoke test
    needs:
      - prepare
      - merge-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start exact published images
        env:
          SFORUM_REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        run: >-
          ./scripts/ci/release-smoke.sh
          "${{ needs.prepare.outputs.sha }}"
          "${{ needs.prepare.outputs.version }}"
          "${{ needs.prepare.outputs.commit }}"

  release-assets:
    name: Release asset / ${{ matrix.goos }} / ${{ matrix.goarch }}
    needs:
      - prepare
      - merge-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Log in to GHCR for Linux bundle extraction
        if: matrix.goos == 'linux'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release assets
        env:
          SFORUM_REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        run: >-
          ./scripts/ci/build-release-assets.sh
          "${{ needs.prepare.outputs.version }}"
          "${{ needs.prepare.outputs.commit }}"
          "${{ needs.prepare.outputs.build_time }}"
          "${{ needs.prepare.outputs.sha }}"
          "${{ matrix.goos }}"
          "${{ matrix.goarch }}"
          "$GITHUB_WORKSPACE/dist"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy-asset:
    name: Build fixed-name deploy asset
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Build deploy asset and standalone entrypoints
        run: >-
          ./scripts/ci/build-deploy-asset.sh
          "${{ needs.prepare.outputs.version }}"
          "$GITHUB_WORKSPACE/dist"

      - name: Upload deploy asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-deploy
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify-release-assets:
    name: Verify release assets
    needs:
      - prepare
      - release-assets
      - deploy-asset
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download release asset matrix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-asset-*
          path: dist
          merge-multiple: true

      - name: Verify release assets and generate checksums
        run: ./scripts/ci/finalize-release-assets.sh "${{ needs.prepare.outputs.version }}" dist

      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-web-sdks:
    name: Publish versioned Web SDKs
    needs:
      - prepare
      - smoke
      - verify-release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node for npm Trusted Publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish exact SDK packages with provenance
        run: node ./scripts/ci/publish-web-sdks.mjs

  promote:
    name: Promote / ${{ matrix.image }}
    needs:
      - prepare
      - smoke
      - verify-release-assets
      - publish-web-sdks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - sforum-api
          - sforum-migrate
          - sforum-web
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          tags=(--tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:$VERSION")
          if [[ "$STABLE" == "true" ]]; then
            major_minor="${VERSION%.*}"
            tags+=(--tag "$IMAGE:$major_minor" --tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$CANDIDATE_TAG"

  verify-public-images:
    name: Verify anonymous image pulls
    needs:
      - prepare
      - promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Pull versioned images without registry credentials
        env:
          SFORUM_REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        run: >-
          ./scripts/ci/verify-public-images.sh
          "$SFORUM_REGISTRY"
          "${{ needs.prepare.outputs.tag }}"

  github-release:
    name: Create GitHub release
    needs:
      - prepare
      - promote
      - verify-public-images
      - verify-release-assets
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-assets
          path: dist

      - name: Create release after image promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No verified release assets are available" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if [[ -z "$existing_assets" ]]; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
              echo "Added verified assets to existing GitHub Release $RELEASE_TAG"
              exit 0
            fi
            local_names="$(printf '%s\n' "${assets[@]##*/}" | sort)"
            remote_names="$(sort <<< "$existing_assets")"
            if [[ "$local_names" != "$remote_names" ]]; then
              echo "GitHub Release $RELEASE_TAG has a partial or conflicting asset set; refusing to overwrite it" >&2
              exit 1
            fi
            remote_dir="$(mktemp -d)"
            trap 'rm -rf "$remote_dir"' EXIT
            gh release download "$RELEASE_TAG" --dir "$remote_dir" --repo "$GITHUB_REPOSITORY"
            for asset in "${assets[@]}"; do
              asset_name="$(basename "$asset")"
              if ! cmp -s "$asset" "$remote_dir/$asset_name"; then
                echo "GitHub Release $RELEASE_TAG asset $asset_name differs from the verified artifact; refusing to overwrite it" >&2
                exit 1
              fi
            done
            echo "GitHub Release $RELEASE_TAG already contains the exact verified asset set"
            exit 0
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          ./scripts/ci/generate-release-notes.sh "$RELEASE_TAG" "$notes_file"
          args=(--verify-tag --notes-file "$notes_file" --title "SForum $RELEASE_TAG")
          if [[ "$STABLE" != "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${args[@]}" --repo "$GITHUB_REPOSITORY"
