name: Release tooling

on:
  pull_request:
    paths:
      - .github/workflows/release-tooling.yml
      - scripts/release_test.sh
      - scripts/ci/**
      - deploy/**
      - tests/validate-docs_test.sh
      - tests/validate-builtin-plugin-versions.mjs
      # validate-builtin-plugin-versions.mjs 的输入面：sourceContractFiles()（该文件
      # 107-113 行）+ digestSharedRuntime()。缺了这些，插件 source digest 或共享运行时
      # 漂移时本工作流根本不触发，门禁只在本地 test.sh 里红（v3.1.0 发版前踩过一次）。
      - extensions/builtin/plugins/*/sforum.extension.json
      - extensions/builtin/plugins/*/backend/**
      - extensions/builtin/plugins/*/manifest/**
      - extensions/builtin/plugins/*/schemas/**
      - apps/api/go.mod
      - apps/api/sdk/plugin/**
      - apps/api/app/Support/PluginBootstrap/contract.go
      - contracts/proto/**
      - tests/builtin-plugin-release-baseline.json
      - tests/validate-sforum-latest.sh
      - sforum-latest.sh
      - sforum-latest.sh.sha256
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-tooling.yml
      - scripts/release_test.sh
      - scripts/ci/**
      - deploy/**
      - tests/validate-docs_test.sh
      - tests/validate-builtin-plugin-versions.mjs
      # validate-builtin-plugin-versions.mjs 的输入面：sourceContractFiles()（该文件
      # 107-113 行）+ digestSharedRuntime()。缺了这些，插件 source digest 或共享运行时
      # 漂移时本工作流根本不触发，门禁只在本地 test.sh 里红（v3.1.0 发版前踩过一次）。
      - extensions/builtin/plugins/*/sforum.extension.json
      - extensions/builtin/plugins/*/backend/**
      - extensions/builtin/plugins/*/manifest/**
      - extensions/builtin/plugins/*/schemas/**
      - apps/api/go.mod
      - apps/api/sdk/plugin/**
      - apps/api/app/Support/PluginBootstrap/contract.go
      - contracts/proto/**
      - tests/builtin-plugin-release-baseline.json
      - tests/validate-sforum-latest.sh
      - sforum-latest.sh
      - sforum-latest.sh.sha256

permissions:
  contents: read

concurrency:
  group: release-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Release and deploy tooling gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 这一段是必需的，不是可选优化：gate 的最后一步 verify-web-sdks.mjs 会真的
      # 起一个离线 consumer 构建来验证打出来的 SDK 包（vite + @vitejs/plugin-vue +
      # vue 运行时都从 apps/web/node_modules 取）。没有这些依赖，那一步只能失败。
      # 它此前「看起来不需要」，是因为 gate 更早的断言一直在失败，脚本从没跑到那里。
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run release tooling gates
        run: ./scripts/ci/release-tooling-gate.sh
