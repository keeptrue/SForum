name: Release tooling

on:
  pull_request:
    paths:
      - .github/workflows/release-tooling.yml
      # security.yml 里的 govulncheck 工具链是本 gate 断言的一部分
      # （go.mod == Dockerfile == 扫描工具链），改它必须重跑。
      - .github/workflows/security.yml
      # gate 里 ruby scripts/ci/release_workflow_test.rb 直接 YAML.load_file 这两个
      # 文件（release_workflow_test.rb:7-8），与 RV-14 同一形状：gate 跑得到、paths
      # 覆盖不到。release.yml 还在被改动，属于活风险。
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - scripts/release_test.sh
      - scripts/ci/**
      # shellcheck 版本 pin：lint-shell.sh 会读它做版本断言，改它必须重跑门。
      - scripts/shellcheck-version.txt
      - deploy/**
      # 根级发布/部署脚本：gate 里跑着 deploy_test.sh、upgrade-health-probe_test.sh、
      # install-loader_test.sh、bootstrap_test.sh，scripts/ci/lint-shell.sh 也会
      # shellcheck 这些文件。此前根目录 5 个 .sh 只有 sforum-latest.sh 在列，改
      # deploy.sh / upgrade.sh / sforum-bootstrap.sh / sforum-install.sh 不触发任何
      # CI（RV-14）。「仓库根 *.sh ⊆ 本列表」由 release-tooling-gate.sh 逐条断言，
      # 下次新增根脚本忘了登记会直接红。
      - deploy.sh
      - upgrade.sh
      - sforum-bootstrap.sh
      - sforum-install.sh
      - tests/validate-docs_test.sh
      - tests/validate-builtin-plugin-versions.mjs
      # validate-builtin-plugin-versions.mjs 的输入面：sourceContractFiles()（该文件
      # 107-113 行）+ digestSharedRuntime()。缺了这些，插件 source digest 或共享运行时
      # 漂移时本工作流根本不触发，门禁只在本地 test.sh 里红（v3.1.0 发版前踩过一次）。
      - extensions/builtin/plugins/*/sforum.extension.json
      - extensions/builtin/plugins/*/backend/**
      - extensions/builtin/plugins/*/manifest/**
      - extensions/builtin/plugins/*/schemas/**
      - apps/api/go.mod
      # gate 断言 Dockerfile 的 golang 基础镜像 == go.mod 的 go 指令，
      # 所以 Dockerfile 也必须是触发面，否则抬工具链会漏跑这条断言。
      - apps/api/Dockerfile
      - apps/api/sdk/plugin/**
      - apps/api/app/Support/PluginBootstrap/contract.go
      # web-sdk-packages.mjs（publish-web-sdks_test.mjs / verify-web-sdks.mjs 的
      # 输入面）真的读这些：apps/web/packages/{admin-sdk,plugin-ui} 的 package.json
      # 与 src，以及生成器模板 generator_vue_admin.go。此前它们不在 paths 里，
      # 改 SDK 包不会触发打包门禁。
      - apps/web/packages/**
      - apps/api/cmd/sforum/generator_vue_admin.go
      - contracts/proto/**
      - tests/builtin-plugin-release-baseline.json
      - tests/validate-sforum-latest.sh
      # 配色层门：读 deploy/scripts/term-ui.sh 与三份内联副本，并实际执行 5 个入口。
      - tests/validate-term-ui.sh
      - sforum-latest.sh
      - sforum-latest.sh.sha256
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-tooling.yml
      # security.yml 里的 govulncheck 工具链是本 gate 断言的一部分
      # （go.mod == Dockerfile == 扫描工具链），改它必须重跑。
      - .github/workflows/security.yml
      # gate 里 ruby scripts/ci/release_workflow_test.rb 直接 YAML.load_file 这两个
      # 文件（release_workflow_test.rb:7-8），与 RV-14 同一形状：gate 跑得到、paths
      # 覆盖不到。release.yml 还在被改动，属于活风险。
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - scripts/release_test.sh
      - scripts/ci/**
      # shellcheck 版本 pin：lint-shell.sh 会读它做版本断言，改它必须重跑门。
      - scripts/shellcheck-version.txt
      - deploy/**
      # 根级发布/部署脚本：gate 里跑着 deploy_test.sh、upgrade-health-probe_test.sh、
      # install-loader_test.sh、bootstrap_test.sh，scripts/ci/lint-shell.sh 也会
      # shellcheck 这些文件。此前根目录 5 个 .sh 只有 sforum-latest.sh 在列，改
      # deploy.sh / upgrade.sh / sforum-bootstrap.sh / sforum-install.sh 不触发任何
      # CI（RV-14）。「仓库根 *.sh ⊆ 本列表」由 release-tooling-gate.sh 逐条断言，
      # 下次新增根脚本忘了登记会直接红。
      - deploy.sh
      - upgrade.sh
      - sforum-bootstrap.sh
      - sforum-install.sh
      - tests/validate-docs_test.sh
      - tests/validate-builtin-plugin-versions.mjs
      # validate-builtin-plugin-versions.mjs 的输入面：sourceContractFiles()（该文件
      # 107-113 行）+ digestSharedRuntime()。缺了这些，插件 source digest 或共享运行时
      # 漂移时本工作流根本不触发，门禁只在本地 test.sh 里红（v3.1.0 发版前踩过一次）。
      - extensions/builtin/plugins/*/sforum.extension.json
      - extensions/builtin/plugins/*/backend/**
      - extensions/builtin/plugins/*/manifest/**
      - extensions/builtin/plugins/*/schemas/**
      - apps/api/go.mod
      # gate 断言 Dockerfile 的 golang 基础镜像 == go.mod 的 go 指令，
      # 所以 Dockerfile 也必须是触发面，否则抬工具链会漏跑这条断言。
      - apps/api/Dockerfile
      - apps/api/sdk/plugin/**
      - apps/api/app/Support/PluginBootstrap/contract.go
      # web-sdk-packages.mjs（publish-web-sdks_test.mjs / verify-web-sdks.mjs 的
      # 输入面）真的读这些：apps/web/packages/{admin-sdk,plugin-ui} 的 package.json
      # 与 src，以及生成器模板 generator_vue_admin.go。此前它们不在 paths 里，
      # 改 SDK 包不会触发打包门禁。
      - apps/web/packages/**
      - apps/api/cmd/sforum/generator_vue_admin.go
      - contracts/proto/**
      - tests/builtin-plugin-release-baseline.json
      - tests/validate-sforum-latest.sh
      # 配色层门：读 deploy/scripts/term-ui.sh 与三份内联副本，并实际执行 5 个入口。
      - tests/validate-term-ui.sh
      - sforum-latest.sh
      - sforum-latest.sh.sha256

permissions:
  contents: read

concurrency:
  group: release-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Release and deploy tooling gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本钉死：runner 自带的 shellcheck 版本漂移会让「没人改代码，门突然红」
      # （scripts/ci/shellcheck-baseline.txt 对诊断集合敏感）。这里在跑门之前先比对
      # pin，不一致就红，并要求在评审过的提交里抬 scripts/shellcheck-version.txt。
      # lint-shell.sh 自己也会断言同一条 —— 这里多一层是为了让失败出现在「装工具链」
      # 这一步，而不是混在 shell 语法诊断里。
      - name: Assert the pinned shellcheck version
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^version=//p' scripts/shellcheck-version.txt | tail -n 1)"
          if [ -z "$pinned" ]; then
            echo "::error::scripts/shellcheck-version.txt has no version= line"
            exit 1
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::the runner image has no shellcheck; the lint gate would fail closed anyway"
            exit 1
          fi
          actual="$(shellcheck --version | sed -n 's/^version:[[:space:]]*//p' | head -n 1)"
          if [ "$actual" != "$pinned" ]; then
            echo "::error::shellcheck pin=$pinned but the runner has ${actual:-unknown}. Bump scripts/shellcheck-version.txt in a reviewed change (and re-baseline if the new version reports different diagnostics)."
            exit 1
          fi
          echo "shellcheck $actual matches the pin"

      # 与 deploy.sh / upgrade.sh / sforum-*.sh 的 shellcheck 门禁同一入口
      # （scripts/ci/lint-shell.sh，仓库根执行，退出码 0=通过）。放在最前面，
      # shell 语法错误先于十几分钟的发布工具链测试暴露。
      - name: Lint shell scripts
        run: bash scripts/ci/lint-shell.sh

      # 这一段是必需的，不是可选优化：gate 的最后一步 verify-web-sdks.mjs 会真的
      # 起一个离线 consumer 构建来验证打出来的 SDK 包（vite + @vitejs/plugin-vue +
      # vue 运行时都从 apps/web/node_modules 取）。没有这些依赖，那一步只能失败。
      # 它此前「看起来不需要」，是因为 gate 更早的断言一直在失败，脚本从没跑到那里。
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run release tooling gates
        run: ./scripts/ci/release-tooling-gate.sh
