name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate when called by another workflow
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.detect.outputs.go }}
      web: ${{ steps.detect.outputs.web }}
      contracts: ${{ steps.detect.outputs.contracts }}
      container_api: ${{ steps.detect.outputs.container_api }}
      container_web: ${{ steps.detect.outputs.container_web }}
      container_images: ${{ steps.detect.outputs.container_images }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ inputs.ref || github.sha }}

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - 'apps/api/**'
              - 'extensions/builtin/**'
              - 'tests/compat/**'
              - 'scripts/ci/go-gate.sh'
              - 'scripts/test-api-isolated.sh'
              - 'scripts/test.sh'
            web:
              - 'apps/web/**'
              - 'extensions/builtin/**'
              - 'scripts/ci/web-gate.sh'
              - 'scripts/test.sh'
            contracts:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'extensions/**'
              - 'contracts/**'
              - 'tools/proto/**'
              - 'scripts/**'
              - 'tests/**'
              - '.github/**'
              - 'docs/**'
              - 'knowledge/**'
              - 'deploy/**'
              - 'compose*.yaml'
              - 'AGENTS.md'
              - '*.md'
            container_api:
              - 'apps/api/**'
              - 'extensions/builtin/**'
            container_web:
              - 'apps/web/**'
              - 'extensions/builtin/**'

      - name: Publish change outputs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_GO: ${{ steps.filter.outputs.go }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_CONTRACTS: ${{ steps.filter.outputs.contracts }}
          FILTER_CONTAINER_API: ${{ steps.filter.outputs.container_api }}
          FILTER_CONTAINER_WEB: ${{ steps.filter.outputs.container_web }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_call" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            go=true
            web=true
            contracts=true
            container_api=true
            container_web=true
          else
            go="${FILTER_GO:-true}"
            web="${FILTER_WEB:-true}"
            contracts="${FILTER_CONTRACTS:-true}"
            container_api="${FILTER_CONTAINER_API:-true}"
            container_web="${FILTER_CONTAINER_WEB:-true}"
          fi

          container_images='[]'
          if [[ "$container_api" == "true" && "$container_web" == "true" ]]; then
            container_images='[{"image":"api","dockerfile":"apps/api/Dockerfile","target":"api","cache_scope":"ci-backend","cache_writer":true},{"image":"web","dockerfile":"apps/web/Dockerfile","target":"prod","cache_scope":"ci-web","cache_writer":true}]'
          elif [[ "$container_api" == "true" ]]; then
            container_images='[{"image":"api","dockerfile":"apps/api/Dockerfile","target":"api","cache_scope":"ci-backend","cache_writer":true}]'
          elif [[ "$container_web" == "true" ]]; then
            container_images='[{"image":"web","dockerfile":"apps/web/Dockerfile","target":"prod","cache_scope":"ci-web","cache_writer":true}]'
          fi

          {
            echo "go=$go"
            echo "web=$web"
            echo "contracts=$contracts"
            echo "container_api=$container_api"
            echo "container_web=$container_web"
            echo "container_images=$container_images"
          } >> "$GITHUB_OUTPUT"

  go:
    name: Go gate
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Go 测试统一走 ./scripts/test-api-isolated.sh：脚本用 runner 上的 docker 自建
    # 一次性 PostgreSQL + Redis 容器（同一 com.sforum.test-owner label、同一 trap
    # 清理），并 export DATABASE_URL / SFORUM_TEST_DATABASE_URL /
    # SFORUM_COMPAT_DATABASE_URL / SFORUM_TEST_REDIS_ADDR。因此这里不声明任何
    # database service；GitHub 提供的 service 容器不参与测试，只会增加启动等待。
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ inputs.ref || github.sha }}

      - name: Fetch built-in plugin version baseline
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            tests/compat/go.sum

      - name: Run Go gate
        env:
          SFORUM_BUILTIN_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/ci/go-gate.sh

      # 这条交叉编译原本只存在于 release.yml 的 darwin 资产 job 里，而且只在发 tag
      # 之后才跑。v3.1.1 发布时它红在主线之外：pluginprocess/hardening_unix.go 的
      # `//go:build unix` 覆盖 darwin，却用了只有 Linux 才定义的 unix.Prlimit，
      # 两个 darwin 资产 job 都编译失败，而 main CI 全绿（它从不交叉编译）。
      # 发布链路里的校验必须在主线上也跑一遍，否则等于没有校验。
      #
      # build 守发版资产：两个 darwin 资产 job 打包的就是这两个架构的二进制。
      # vet 守测试编译：`go build ./...` 根本不编译 _test.go，所以同一场事故里
      # plugin_process_unix_test.go 也用了只有 Linux 才定义的 unix.Prlimit，
      # 却只在 `go vet`（会编译测试包）下才炸。只留 build 就等于只守住一半：
      # 测试拆分（plugin_process_linux_test.go）回退时，发版仍会在 tag 之后崩。
      #
      # CGO_ENABLED=0 与发版构建同参（scripts/ci/build-release-assets.sh:125 就是
      # `CGO_ENABLED=0 GOOS=… go build`）。不能靠「交叉编译默认关 cgo」这个隐式默认：
      # runner 上任何一步把 CGO_ENABLED=1 导出进这个环境，darwin 构建就会因为找不到
      # 交叉 libc 而红 —— 那是查不出真问题的红，也会逼人给这条门加豁免。
      - name: Cross-compile and vet Go API for darwin (release asset gate)
        run: |
          cd apps/api
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go vet ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go vet ./...

      - name: Reject generated module drift
        run: git diff --exit-code -- apps/api/sqlc apps/api/database extensions fixtures

  web:
    name: Web gate
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore Nuxt incremental caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/web/.nuxt-typecheck.tsbuildinfo
            apps/web/.nuxt-build
            apps/web/node_modules/.cache
          key: ${{ runner.os }}-nuxt-${{ hashFiles('apps/web/bun.lock', 'apps/web/package.json', 'apps/web/nuxt.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nuxt-${{ hashFiles('apps/web/bun.lock', 'apps/web/package.json', 'apps/web/nuxt.config.ts') }}-
            ${{ runner.os }}-nuxt-

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run web gate
        run: ./scripts/ci/web-gate.sh

      - name: Reject web generated drift
        run: git diff --exit-code -- apps/web

  contracts:
    name: Contracts and static gates
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/proto/go.mod
          cache-dependency-path: tools/proto/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore Protobuf tool cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tools/proto/.bin
          key: ${{ runner.os }}-proto-${{ hashFiles('tools/proto/go.mod', 'tools/proto/go.sum', 'scripts/proto.sh') }}
          restore-keys: |
            ${{ runner.os }}-proto-

      - name: Restore actionlint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/sforum/actionlint/v1.7.12
          key: ${{ runner.os }}-actionlint-v1.7.12

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          actionlint_bin="$HOME/.cache/sforum/actionlint/v1.7.12/actionlint"
          if [[ ! -x "$actionlint_bin" ]]; then
            mkdir -p "$(dirname "$actionlint_bin")"
            GOBIN="$(dirname "$actionlint_bin")" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          fi
          "$actionlint_bin"

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run contracts and static gates
        env:
          SFORUM_CONTRACTS_SKIP_WEB_UNIT: ${{ needs.changes.outputs.web == 'true' && '1' || '0' }}
        run: ./scripts/ci/contracts-gate.sh

      - name: Reject generated SDK drift
        run: git diff --exit-code -- apps/api/sdk/plugin/v2/gen contracts

      # 这条断言原本只在 release.yml 的 publish-web-sdks 里，导致「SDK 版本抬了但
      # Vue 脚手架模板没跟上」这类问题要等到发版最后一步才暴露（v3.0.17 就是这么红的）。
      - name: Validate Web SDK packages
        run: node ./scripts/ci/validate-web-sdks.mjs

      # 同一形状的第二个缺口：compose 的 `${VAR:?}` 硬闸过去只由 release workflow 的
      # smoke job 撞到。v3.1.1 发布时 MEILI_MASTER_KEY 没有出现在 release-smoke.sh 的
      # export 里，docker compose 在插值阶段（连 `compose pull` 之前）就失败，而 main CI
      # 全绿。静态线在这里也跑一遍：改 compose 硬闸或 smoke 环境时当场红。
      - name: Validate release smoke compose environment
        run: ./tests/validate-release-smoke-compose-env.sh

  containers:
    name: Container / ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.container_api == 'true' || needs.changes.outputs.container_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.container_images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: ${{ matrix.image == 'web' }}
          tags: ${{ matrix.image == 'web' && 'sforum-web:ci' || '' }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: ${{ matrix.cache_writer && github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.cache_scope) || '' }}

      # 统一只报告不阻断：第三方基础镜像 CVE 不属于 PR 作者改动范围，
      # 不应阻塞无关 PR；Security workflow 的 dependency-review 已覆盖
      # PR 引入的新增依赖漏洞。
      - name: Scan Web runtime image (report only)
        if: matrix.image == 'web'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sforum-web:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  ci-summary:
    name: CI summary
    if: always()
    needs:
      - changes
      - go
      - web
      - contracts
      - containers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify downstream job outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GO_RESULT: ${{ needs.go.result }}
          WEB_RESULT: ${{ needs.web.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "changes:$CHANGES_RESULT" \
            "go:$GO_RESULT" \
            "web:$WEB_RESULT" \
            "contracts:$CONTRACTS_RESULT" \
            "containers:$CONTAINERS_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::$name job ended with $result"
              failed=1
            fi
          done
          exit "$failed"
