name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate when called by another workflow
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sforum
          POSTGRES_USER: sforum
          POSTGRES_PASSWORD: sforum
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U sforum -d sforum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            tests/compat/go.sum

      - name: Run Go gate
        env:
          SFORUM_COMPAT_DATABASE_URL: postgres://sforum:sforum@127.0.0.1:15432/sforum?sslmode=disable
          SFORUM_BUILTIN_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/ci/go-gate.sh

      - name: Reject generated module drift
        run: git diff --exit-code -- apps/api/sqlc apps/api/database extensions fixtures

  web:
    name: Web gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run web gate
        run: ./scripts/ci/web-gate.sh

      - name: Reject web generated drift
        run: git diff --exit-code -- apps/web

  contracts:
    name: Contracts and static gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/proto/go.mod
          cache-dependency-path: tools/proto/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run contracts and static gates
        run: ./scripts/ci/contracts-gate.sh

      - name: Reject generated SDK drift
        run: git diff --exit-code -- apps/api/sdk/plugin/v2/gen contracts

      # 这条断言原本只在 release.yml 的 publish-web-sdks 里，导致「SDK 版本抬了但
      # Vue 脚手架模板没跟上」这类问题要等到发版最后一步才暴露（v3.0.17 就是这么红的）。
      - name: Validate Web SDK packages
        run: node ./scripts/ci/validate-web-sdks.mjs

  containers:
    name: Container / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            target: api
            cache_scope: ci-backend
            cache_writer: true
          - image: web
            dockerfile: apps/web/Dockerfile
            target: prod
            cache_scope: ci-web
            cache_writer: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: ${{ matrix.image == 'web' }}
          tags: ${{ matrix.image == 'web' && 'sforum-web:ci' || '' }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: ${{ matrix.cache_writer && github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.cache_scope) || '' }}

      # 统一只报告不阻断：第三方基础镜像 CVE 不属于 PR 作者改动范围，
      # 不应阻塞无关 PR；Security workflow 的 dependency-review 已覆盖
      # PR 引入的新增依赖漏洞。
      - name: Scan Web runtime image (report only)
        if: matrix.image == 'web'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sforum-web:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
