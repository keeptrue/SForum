name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect security changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.detect.outputs.go }}
      web: ${{ steps.detect.outputs.web }}
      web_audit: ${{ steps.detect.outputs.web_audit }}
      codeql_languages: ${{ steps.detect.outputs.codeql_languages }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
              - 'extensions/**'
              - 'contracts/**'
              - 'scripts/**'
              - 'tests/**'
            web_audit:
              - 'apps/web/package.json'
              - 'apps/web/bun.lock'
              - 'apps/web/packages/**'
              - 'scripts/bun-audit-gate.mjs'
              - 'scripts/bun-audit-baseline.json'

      - name: Publish security outputs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_GO: ${{ steps.filter.outputs.go }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_WEB_AUDIT: ${{ steps.filter.outputs.web_audit }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            go=true
            web=true
            web_audit=true
          else
            go="${FILTER_GO:-true}"
            web="${FILTER_WEB:-true}"
            web_audit="${FILTER_WEB_AUDIT:-true}"
          fi

          codeql_languages='[]'
          if [[ "$go" == "true" && "$web" == "true" ]]; then
            codeql_languages='[{"language":"go","build-mode":"manual"},{"language":"javascript-typescript","build-mode":"none"}]'
          elif [[ "$go" == "true" ]]; then
            codeql_languages='[{"language":"go","build-mode":"manual"}]'
          elif [[ "$web" == "true" ]]; then
            codeql_languages='[{"language":"javascript-typescript","build-mode":"none"}]'
          fi

          {
            echo "go=$go"
            echo "web=$web"
            echo "web_audit=$web_audit"
            echo "codeql_languages=$codeql_languages"
          } >> "$GITHUB_OUTPUT"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL / ${{ matrix.language }}
    needs: changes
    if: needs.changes.outputs.codeql_languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.codeql_languages) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@776237d428f23fefc3d9e0fe1962921cbcd53e17 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go code
        if: matrix.language == 'go'
        working-directory: apps/api
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@776237d428f23fefc3d9e0fe1962921cbcd53e17 # v4
        with:
          category: /language:${{ matrix.language }}

  govulncheck:
    name: Govulncheck / core-api
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 只扫 core-api：内建插件与 apps/api 共享同一依赖树（replace 回主模块），
      # core 绿即代表可达漏洞面已覆盖，避免 8 路矩阵重复安装同一工具链。
      - name: Scan reachable Go vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          repo-checkout: false
          # RV-18：扫描工具链必须**等于**发布工具链，不能是 `stable`。
          #
          # 旧口径是「stable 始终解析到最新 Go，避免硬编码漂移」。它保证了扫描器
          # 自身不落后，却把我们**实际发布**的那个 toolchain 的补丁状态变成了结构
          # 性盲区：go.mod / Dockerfile 钉 go1.26.10 时，govulncheck 用 1.26.10 扫出
          # 1 条 called stdlib 漏洞（GO-2026-6859，修于 1.26.11），而 stable（1.27.4）
          # 扫出 0 条——CI 全绿，发布物却带着可达漏洞。
          #
          # 现在三处同源：apps/api/go.mod 的 go 指令 == apps/api/Dockerfile 的
          # golang 基础镜像 tag == 这里的 go-version-input。三处相等由
          # scripts/ci/release-tooling-gate.sh 逐条断言，任一处单独漂移直接红。
          go-version-input: '1.26.11'
          cache-dependency-path: apps/api/go.sum
          work-dir: apps/api
          go-package: ./...

  web-audit:
    name: Dependency audit / web
    needs: changes
    if: needs.changes.outputs.web_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      # OPS2-09：前端依赖此前没有任何运行期扫描。bun audit 开箱跑不了，因为项目
      # registry（registry.npmmirror.com）不实现 `/-/npm/v1/security/advisories/bulk`
      # ——只会得到 `error: POST ... - 404`。审计端点只有 npm 官方 registry 提供，
      # 所以这里用 `--registry` 只把**审计请求**指向官方 registry，不改项目 registry。
      #
      # 范围取 `--prod`：CI 关心的是会进发布物的生产依赖，devDependencies 的 advisory
      # 不该用同一个信号去噪。
      #
      # 判据是**棘轮**，不是严重度开关：scripts/bun-audit-gate.mjs 拿本次报告与
      # scripts/bun-audit-baseline.json 比，只有「新增 advisory / 基线失效 / 严重度变化」
      # 才红。按严重度卡门禁等于从第一天起恒红（既存债），然后所有人学会忽略这个 job。
      # 基线必须由一次联网扫描播种（`--refresh`），不许凭计数伪造。
      - name: Audit production dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          status=0
          bun audit --prod --registry https://registry.npmjs.org --json > audit.json 2> audit.err || status=$?
          # bun audit 的退出码 1 同时表示「扫到了 advisory」和「扫描失败（404 等）」，
          # 所以不能只看退出码。扫描失败时 stdout 是空的，这是可判定的分界。
          # 「无 advisory」时 bun 也不输出字节，这里补成 {} —— 门禁因此只见到合法
          # 空报告，而真正的扫描失败仍在下面被非零退出拦住。
          if [ ! -s audit.json ]; then
            if [ "$status" -eq 0 ]; then
              printf '{}' > audit.json
            else
              echo "::error::bun audit 无法完成扫描（退出码 $status）：$(head -3 audit.err)"
              exit 1
            fi
          fi

      # 未播种在 CI 里是硬失败（--unseeded-policy=fail）：本地默认 notice 便于先跑
      # 起来，但流水线不能「因为没基线所以永远绿」。
      - name: Check the audit report against the ratchet baseline
        run: |
          node scripts/bun-audit-gate.mjs \
            --report apps/web/audit.json \
            --baseline scripts/bun-audit-baseline.json \
            --unseeded-policy=fail \
            --annotate \
            --summary "${GITHUB_STEP_SUMMARY}"

