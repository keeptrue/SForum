name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3ea37a44b6e4e6847c46edae209410d258d548d1 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go code
        if: matrix.language == 'go'
        working-directory: apps/api
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@3ea37a44b6e4e6847c46edae209410d258d548d1 # v4
        with:
          category: /language:${{ matrix.language }}

  govulncheck:
    name: Govulncheck / core-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 只扫 core-api：内建插件与 apps/api 共享同一依赖树（replace 回主模块），
      # core 绿即代表可达漏洞面已覆盖，避免 8 路矩阵重复安装同一工具链。
      - name: Scan reachable Go vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          repo-checkout: false
          # RV-18：扫描工具链必须**等于**发布工具链，不能是 `stable`。
          #
          # 旧口径是「stable 始终解析到最新 Go，避免硬编码漂移」。它保证了扫描器
          # 自身不落后，却把我们**实际发布**的那个 toolchain 的补丁状态变成了结构
          # 性盲区：go.mod / Dockerfile 钉 go1.26.10 时，govulncheck 用 1.26.10 扫出
          # 1 条 called stdlib 漏洞（GO-2026-6859，修于 1.26.11），而 stable（1.27.4）
          # 扫出 0 条——CI 全绿，发布物却带着可达漏洞。
          #
          # 现在三处同源：apps/api/go.mod 的 go 指令 == apps/api/Dockerfile 的
          # golang 基础镜像 tag == 这里的 go-version-input。三处相等由
          # scripts/ci/release-tooling-gate.sh 逐条断言，任一处单独漂移直接红。
          go-version-input: '1.26.11'
          cache-dependency-path: apps/api/go.sum
          work-dir: apps/api
          go-package: ./...

  web-audit:
    name: Dependency audit / web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      # OPS2-09：前端依赖此前没有任何运行期扫描。bun audit 开箱跑不了，因为项目
      # registry（registry.npmmirror.com）不实现 `/-/npm/v1/security/advisories/bulk`
      # ——只会得到 `error: POST ... - 404`。审计端点只有 npm 官方 registry 提供，
      # 所以这里用 `--registry` 只把**审计请求**指向官方 registry，不改项目 registry。
      #
      # 范围取 `--prod`：CI 关心的是会进发布物的生产依赖，devDependencies 的 advisory
      # 不该用同一个信号去噪。
      #
      # 本步先只证明「扫描能跑通并产出 advisory 数据」（这正是 OPS2-09 缺的能力）。
      # 严重度不设门禁：当前 lockfile 的基线是 31 个包 / 90 行 advisory（78 条按
      # url 去重；critical 5 / high 44 / moderate 27 / low 14 是**行**计数）。
      # 测量口径：2026-11-15 本机 bun 1.4.2；本 workflow 钉的是 1.4.4。advisory
      # 集合来自 bun.lock，与 bun 版本无关，但行/去重的计数口径以测量版本为准。
      # 落地当天就按 severity 卡门禁 = 从第一天起恒红，和 validate-v3-p0-catalogs.mjs
      # 里被删掉的 `=== 370` 是同一类债。等 apps/web 清完基线，把 SEVERITY_GATE 改成
      # fail 即可（门禁逻辑已经写好，只差一个开关）。
      - name: Audit production dependencies
        working-directory: apps/web
        env:
          SEVERITY_GATE: report
        run: |
          set -euo pipefail
          status=0
          bun audit --prod --registry https://registry.npmjs.org --json > audit.json 2> audit.err || status=$?
          # bun audit 的退出码 1 同时表示「扫到了 advisory」和「扫描失败（404 等）」，
          # 所以不能只看退出码。扫描失败时 stdout 是空的，这是可判定的分界。
          if [ ! -s audit.json ]; then
            if [ "$status" -eq 0 ]; then
              echo "bun audit: 生产依赖无 advisory"
              exit 0
            fi
            echo "::error::bun audit 无法完成扫描（退出码 $status）：$(head -3 audit.err)"
            exit 1
          fi
          node - <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs')
          const report = JSON.parse(readFileSync('audit.json', 'utf8'))
          const counts = { critical: 0, high: 0, moderate: 0, low: 0 }
          // 同一条 advisory 会按每个受影响版本各出现一次（brace-expansion 之类），
          // 这里按 url 去重，否则 PR 上会被同一条 GHSA 刷屏几十行。
          const unique = new Map()
          for (const [name, entries] of Object.entries(report)) {
            for (const advisory of entries) {
              counts[advisory.severity] = (counts[advisory.severity] ?? 0) + 1
              const existing = unique.get(advisory.url)
              if (existing) existing.packages.add(name)
              else unique.set(advisory.url, { severity: advisory.severity, url: advisory.url, title: advisory.title, packages: new Set([name]) })
            }
          }
          const total = Object.values(counts).reduce((sum, value) => sum + value, 0)
          const summary = `critical ${counts.critical} / high ${counts.high} / moderate ${counts.moderate} / low ${counts.low}`
          console.log(`bun audit: 生产依赖 ${unique.size} 条去重 advisory / ${total} 行（${summary}，行计数）`)
          const lines = [
            `## bun audit (production dependencies)`,
            '',
            `Total: **${unique.size} unique advisories** across ${total} package-version rows — ${summary} (per row)`,
            ''
          ]
          const ordered = [...unique.values()].sort((a, b) => a.severity.localeCompare(b.severity))
          for (const advisory of ordered) {
            lines.push(`- \`${advisory.severity}\` ${[...advisory.packages].sort().join(', ')} — [${advisory.title}](${advisory.url})`)
          }
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`)
          // 注解只发 critical/high 的前 10 条：GitHub 的注解展示本来就有上限，
          // 全量在 job summary 里。
          const actionable = ordered.filter(advisory => advisory.severity === 'critical' || advisory.severity === 'high')
          for (const advisory of actionable.slice(0, 10)) {
            console.log(`::warning::${advisory.severity} ${[...advisory.packages].sort().join(', ')}: ${advisory.title} (${advisory.url})`)
          }
          if (actionable.length > 10) console.log(`::notice::另有 ${actionable.length - 10} 条 critical/high advisory，完整清单见 job summary`)
          if (process.env.SEVERITY_GATE === 'fail' && counts.critical + counts.high > 0) {
            console.log(`::error::bun audit 门禁：critical+high = ${counts.critical + counts.high}，基线未清`)
            process.exit(1)
          }
          NODE
