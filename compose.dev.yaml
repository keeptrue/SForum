services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"

  # 仅在 --profile search 时启动；见 compose.yaml meilisearch.profiles。
  meilisearch:
    ports:
      - "127.0.0.1:${MEILI_PORT:-17700}:7700"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ["go", "run", "./cmd/migrate"]
    environment:
      APP_NAME: ${APP_NAME:-SForum}
      APP_ENV: ${APP_ENV:-development}
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-zh-CN,en-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-sforum}:${POSTGRES_PASSWORD:-sforum}@postgres:5432/${POSTGRES_DB:-sforum}?sslmode=disable
      GOMODCACHE: /go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - go_build_cache:/root/.cache/go-build
      - go_module_cache:/go/pkg/mod
    restart: "no"

  # migrate 由 scripts/dev.sh 以 run --rm 显式执行，不能作为长期容器依赖；
  # 否则 Docker Desktop 重启项目时会因一次性容器已被清理而拒绝 compose start。

  api:
    build:
      target: dev
    command: ["air", "-c", ".air.toml"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sforum}:${POSTGRES_PASSWORD:-sforum}@postgres:5432/${POSTGRES_DB:-sforum}?sslmode=disable
      REDIS_ADDR: redis:6379
      EXTENSION_ROOT: /var/lib/sforum/extensions
      BUILTIN_EXTENSION_ROOT: /app/extensions/builtin
      GOMODCACHE: /go/pkg/mod
    volumes:
      - ./apps/api:/app/apps/api
      - ./extensions/builtin:/app/extensions/builtin:ro
      - go_build_cache:/root/.cache/go-build
      - go_module_cache:/go/pkg/mod
      - api_air_tmp:/app/apps/api/tmp
      - attachment_uploads:/app/apps/api/storage/app/attachments
      - extension_packages:/var/lib/sforum/extensions
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
          ignore:
            - tmp/
            - bin/
            - coverage/
            - coverage.out
            - "*.test"
            - "*.out"
            - "*.prof"
            - "*.coverprofile"
        - action: rebuild
          path: ./apps/api/go.mod
        - action: rebuild
          path: ./apps/api/go.sum

  web:
    build:
      target: dev
    command: ["bun", "run", "dev"]
    environment:
      NUXT_API_INTERNAL_BASE_URL: http://api:8080/api/v1
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./extensions/builtin:/app/extensions/builtin:ro
      - web_node_modules:/app/apps/web/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
          ignore:
            - .nuxt/
            - .output/
            - .nitro/
            - .vite/
            - .cache/
            - dist/
            - coverage/
            - node_modules/
            - playwright-report/
            - test-results/
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/bun.lock
        - action: rebuild
          path: ./apps/web/nuxt.config.ts

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"

volumes:
  go_build_cache:
  go_module_cache:
  api_air_tmp:
  web_node_modules:
  attachment_uploads:
  extension_packages:
